    <style>
  html.fiveg88-hard-reload,
  html.fiveg88-hard-reload body {
    background: #ffffff !important;
  }

  html.fiveg88-hard-reload body {
    visibility: hidden !important;
  }

  html.fiveg88-hard-reload::after {
    content: "";
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 2147483647;
    pointer-events: auto;
  }
</style>

<script>
(function () {
  const KEY = "5g88.hardReloadIntent";

  // Detect Ctrl + Shift + R atau Ctrl + F5
  window.addEventListener("keydown", function (event) {
    const hardReload =
      (event.ctrlKey &&
       event.shiftKey &&
       event.key.toLowerCase() === "r") ||
      (event.ctrlKey && event.key === "F5");

    if (hardReload) {
      sessionStorage.setItem(KEY, String(Date.now()));
    }
  }, true);

  // Semak sama ada reload datang daripada shortcut tadi
  const saved = Number(sessionStorage.getItem(KEY));
  sessionStorage.removeItem(KEY);

  const navigation =
    performance.getEntriesByType("navigation")[0];

  const recentHardReload =
    navigation?.type === "reload" &&
    Number.isFinite(saved) &&
    saved > 0 &&
    Date.now() - saved < 10000;

  if (recentHardReload) {
    document.documentElement.classList.add(
      "fiveg88-hard-reload"
    );
  }
})();
</script>

function resetAllFreeGameMarks() {

    }

// kira semula BeginMoney & EndMoney lepas set Free game
function recalcBalancesAfterFreeGame() {
  const tbody = document.querySelector("#gameLog tbody");
  if (!tbody) return;

  const rows = Array.from(tbody.querySelectorAll("tr.log-row"));
  if (!rows.length) return;

  // jalan dari bawah ke atas
  for (let i = rows.length - 1; i >= 0; i--) {
    const row = rows[i];

    const win = parseFloat(row.children[3].textContent) || 0; // kolom Win
    const betCell = row.querySelector(".bet-cell");

    let bet = 0;
    if (betCell) {
      // kalau tulisan "Free game" → bet = 0
      if (betCell.textContent.trim().toLowerCase() === "free game") {
        bet = 0;
      } else {
        bet = parseFloat(betCell.dataset.bet || betCell.textContent) || 0;
      }
    }

    let begin;
    if (i === rows.length - 1) {
      // row paling bawah: pakai BeginMoney sedia ada
      begin = parseFloat(row.children[4].textContent) || 0;
    } else {
      // row atas: BeginMoney = EndMoney row di bawah
      const below = rows[i + 1];
      begin = parseFloat(below.children[5].textContent) || 0;
      row.children[4].textContent = begin.toFixed(2);
    }

    // normal: End = Begin - bet + win
    // Free game: bet = 0 → End = Begin + win
    const end = begin - bet + win;
    row.children[5].textContent = end.toFixed(2);
  }

  // update Set score ikut EndMoney paling atas
  const setScoreRowTop = tbody.querySelector("tr.set-score-row:not(.jackpot)");
  if (setScoreRowTop && rows.length > 0) {
    const topEndMoney = parseFloat(rows[0].children[5].textContent) || 0;
    const scoreCell = setScoreRowTop.children[1];

    scoreCell.innerHTML = `<span class="badge">Set Score: ${(-Math.abs(topEndMoney)).toFixed(2)}</span>`;

    // kalau mahu, boleh juga isi BeginMoney & EndMoney di baris setscore:
    // setScoreRowTop.children[4].textContent = Math.abs(topEndMoney).toFixed(2);
    // setScoreRowTop.children[5].textContent = "0.00";
  }
}

   EVO888 - FREE GAME RANDOM POSITION
   ========================================== */

let evoFreeGameBlockStart = null;

function applyFreeGame({ randomizePosition = false } = {}) {
  const input = document.getElementById("freeGameInput");
  if (!input) return;

  let count = parseInt(input.value, 10);
  if (!Number.isFinite(count) || count < 0) count = 0;

  count = Math.min(count, MAX_FREE_GAME_ROWS);

  // Pulihkan semua Bet asal dahulu
  resetAllFreeGameMarks();

  const rows = Array.from(
    document.querySelectorAll("#gameLog tbody tr.log-row")
  );

  count = Math.min(count, rows.length);

  if (count === 0) {
    evoFreeGameBlockStart = null;
    recalcBalancesAfterFreeGame();
    return;
  }

  const maxStart = rows.length - count;

  // Pilih posisi rawak, bukan bermula dari bawah
  if (
    randomizePosition ||
    evoFreeGameBlockStart === null ||
    evoFreeGameBlockStart > maxStart
  ) {
    evoFreeGameBlockStart =
      Math.floor(Math.random() * (maxStart + 1));
  }

  // Tandakan Free Game secara berturutan
  for (
    let i = evoFreeGameBlockStart;
    i < evoFreeGameBlockStart + count;
    i++
  ) {
    const betCell = rows[i].querySelector("td.bet-cell");
    if (!betCell) continue;

    betCell.textContent = "Free game";
    betCell.style.fontWeight = "700";
    betCell.style.color = "#dd4b39";
    betCell.dataset.bet = "0";
  }

  // Kekalkan calculation asal EVO888
  recalcBalancesAfterFreeGame();
}

 function generateLog() {

 const manualInput = manualTimeInput.trim();

} else {

    const prevRow = rows[i - 1];

    const betCell = row.querySelector(".bet-cell");
    const prevBetCell = prevRow.querySelector(".bet-cell");

    // Hanya ambil kalau DUA-DUA bukan free game

function recalcBalancesForLogRowsOnly(){
  const tbody = document.querySelector("#gameLog tbody");
  if (!tbody) return;

  const rows = Array.from(tbody.querySelectorAll("tr.log-row"));
  if (!rows.length) return;

  // jalan dari bawah -> atas
  for (let i = rows.length - 1; i >= 0; i--) {
    const row = rows[i];

    const winCell = row.querySelector(".win-cell");
    const betCell = row.querySelector(".bet-cell");

    const win = parseFloat(winCell?.textContent || "0") || 0;

    // bet ambil dari dataset.bet, kalau Free game bet=0
    let bet = 0;
    if (betCell) {
      if (betCell.textContent.trim().toLowerCase() === "free game") bet = 0;
      else bet = parseFloat(betCell.dataset.bet || betCell.textContent || "0") || 0;
    }

    // BeginMoney
    let begin = 0;
    if (i === rows.length - 1) {
      // row paling bawah: guna begin sedia ada
      begin = parseFloat(row.children[4].textContent || "0") || 0;
    } else {
      // row atas: begin = end row bawah
      const belowEnd = parseFloat(rows[i + 1].children[5].textContent || "0") || 0;
      begin = belowEnd;
      row.children[4].textContent = begin.toFixed(2);
    }

    // EndMoney
    const end = begin - bet + win;
    row.children[5].textContent = end.toFixed(2);
  }

  // update Set Score ikut EndMoney paling atas
  const setScoreRowTop = tbody.querySelector("tr.set-score-row:not(.jackpot)");
  if (setScoreRowTop && rows.length) {
    const topEndMoney = parseFloat(rows[0].children[5].textContent || "0") || 0;
    setScoreRowTop.children[1].innerHTML =
      `<span class="badge">Set Score: ${(-Math.abs(topEndMoney)).toFixed(2)}</span>`;
  }
}

function applyManualScoreAsTopEndMoneyIfOff() {
  if (autoAddScoreOn) return; // AUTO ON = guna cara biasa

  const desired = parseFloat(document.getElementById("manualScore")?.value || "0");
  if (!isFinite(desired)) return;

  const tbody = document.querySelector("#gameLog tbody");
  if (!tbody) return;

  const rows = Array.from(tbody.querySelectorAll("tr.log-row"));
  if (!rows.length) return;

  const topEnd = parseFloat(rows[0].children[5].textContent) || 0;
  const delta = desired - topEnd;

  // shift semua begin/end (randomness masih sama, cuma shift balance)
  for (const r of rows) {
    const b = parseFloat(r.children[4].textContent) || 0;
    const e = parseFloat(r.children[5].textContent) || 0;
    r.children[4].textContent = (b + delta).toFixed(2);
    r.children[5].textContent = (e + delta).toFixed(2);
  }

  // update Set score row ikut top end
  const setScoreRowTop = tbody.querySelector("tr.set-score-row:not(.jackpot)");
  if (setScoreRowTop) {
    const newTopEnd = parseFloat(rows[0].children[5].textContent) || 0;
    setScoreRowTop.children[1].innerHTML =
      `<span class="badge">Set Score: ${(-Math.abs(newTopEnd)).toFixed(2)}</span>`;
    setScoreRowTop.children[4].textContent = "-";
    setScoreRowTop.children[5].textContent = "-";
  }
}
function setRandomWin() {
  const amount = parseFloat(document.getElementById("manualWinInput").value);
  if (isNaN(amount) || amount <= 0) {
    showToast("Please input amount!", "info");
    return;
  }

  const tbody = document.querySelector("#gameLog tbody");
  if (!tbody) return;

  const rows = Array.from(tbody.querySelectorAll("tr.log-row"));
  if (rows.length !== 10) {
    showToast("Pleass remove the Jackpot!", "info");
    return;
  }

  // ✅ restore win lama balik ke asal (200.00)
  if (lastWinRowIndex >= 0 && rows[lastWinRowIndex]) {
    const oldCell = rows[lastWinRowIndex].querySelector(".win-cell");
    if (oldCell && oldCell.dataset.originalWin !== undefined) {
      oldCell.textContent = parseFloat(oldCell.dataset.originalWin).toFixed(2);
    }
  }

  // ✅ pick row baru (elak pick sama)
  let pick;
  do {
    pick = Math.floor(Math.random() * rows.length);
  } while (pick === lastWinRowIndex && rows.length > 1);

  const winCell = rows[pick].querySelector(".win-cell");
  if (!winCell) return;

  // ✅ simpan originalWin SEKALI sahaja (jangan overwrite!)
  if (winCell.dataset.originalWin === undefined) {
    winCell.dataset.originalWin = winCell.textContent.trim();
  }

  // ✅ set win baru
  winCell.textContent = amount.toFixed(2);
  lastWinRowIndex = pick;

  // ✅ recalc balance
  recalcBalancesForLogRowsOnly();

  // ✅ SAVE supaya refresh tak hilang (KEY MEGA888!)
  setTimeout(() => {
    const saved = localStorage.getItem("gameLogDataEvo888");
    if (!saved) return;

    try {
      const data = JSON.parse(saved);
      data.logs = tbody.innerHTML;
      data.lastWinRowIndex = lastWinRowIndex;
      data.manualWinAmount = amount;
      localStorage.setItem("gameLogDataEvo888", JSON.stringify(data));
    } catch (e) {}
  }, 50);

  showToast(
  `Winner ${amount.toFixed(2)} set successfully!`,
  "success"
);
}

async function copyGameLogImage() {
  const gameLogTable = document.getElementById("gameLog");

  if (!gameLogTable) {
    showToast("Table #gameLog tidak ditemui", "error");
    return;
  }

  try {
    // Pastikan font sudah siap sebelum capture
    if (document.fonts?.ready) {
      await document.fonts.ready;
    }

    const canvas = await html2canvas(gameLogTable, {
      scale: 2,
      useCORS: true,
      backgroundColor: "#ffffff",

      // Ubah hanya salinan screenshot, bukan table asal
      onclone: (clonedDocument) => {
        const table = clonedDocument.getElementById("gameLog");
        if (!table) return;

        table.classList.add("screenshot-mode");

        const style = clonedDocument.createElement("style");

        style.textContent = `
          #gameLog.screenshot-mode th {
            border: 1px solid #ddd !important;
          }

          #gameLog.screenshot-mode
          .set-score-row td.setscore .badge {
            display: inline-block !important;
            box-sizing: content-box !important;
            padding: 7px 13px !important;
            font-family: 'Source Sans 3', Arial, sans-serif !important;
            font-size: 21px !important;
            font-weight: 750 !important;
            line-height: normal !important;
            vertical-align: middle !important;
            text-align: center !important;
            white-space: nowrap !important;
            transform: none !important;
          }
        `;

        clonedDocument.head.appendChild(style);
      }
    });

    try {
      if (!navigator.clipboard || !window.ClipboardItem) {
        throw new Error("Clipboard API tidak tersedia");
      }

      const blob = await new Promise((resolve, reject) => {
        canvas.toBlob((result) => {
          if (result) resolve(result);
          else reject(new Error("Gagal buat blob"));
        }, "image/png");
      });

      await navigator.clipboard.write([
        new ClipboardItem({ "image/png": blob })
      ]);

      showToast("Image copied to clipboard", "success");

    } catch (err) {
      const dataURL = canvas.toDataURL("image/png");

      window.parent.postMessage(
        {
          action: "copy-image-base64",
          base64: dataURL
        },
        "https://5g88-main.vercel.app/"
      );

      showToast("Image sent to parent (fallback)", "info");
    }

  } catch (err) {
    console.error("Copy Image Error:", err);
    showToast("Failed to copy Game Log image", "error");
  }
}

      : JSON.stringify(options.body)
  });

  const result = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw Error(result.message || result.error || "Request failed");
  }

  return result;
}

function mgSyncPermission() {
  const create = document.getElementById("mgCreate");
  const manage = document.getElementById("mgManage");

async function mgReload() {
  const result = await mgApi("/games");
  const catalog = {};

  for (const game of result.games || []) {
    catalog[game.id] = game;
  }

  mgApplyCatalog(catalog);
}
function mgToast(msg, type = "success") {
  return showToast(msg, type);
}
function mgNumberList(raw){return [...new Set(String(raw).split(/[,\s\n]+/).map(Number).filter(n=>Number.isFinite(n)&&n>=0))];}

function mgOptions(raw) {
  const text = String(raw).trim();
  if (!text) return [];

  const numbers = text
    .split(/[,\s]+/)
    .map(Number);

  if (numbers.some(n =>
    !Number.isSafeInteger(n) || n < 1
  )) {
    return null;
  }

  return [...new Set(numbers)].sort((a, b) => a - b);
}

function mgElement(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;}
function mgField(label,value='',type='text',hint=''){
 const host=mgElement('div','mg-field'),lbl=mgElement('label','',label),input=mgElement('input');input.type=type;input.value=value;input.setAttribute('data-new-ui-input','');host.append(lbl,input);if(hint)host.append(mgElement('small','',hint));return {host,input};
}

function mgApplyCatalog(snapshot) {
  const gameSelect = document.getElementById("gameSelect");
  const betSelect = document.getElementById("betSelect");
  const winSelect = document.getElementById("pecahanSelect");

  const previous = mgCatalogLoaded ? {
    game: gameSelect.value,
    bet: betSelect.value,
    pecahan: winSelect.value
  } : null;

  let saved = {};

  try {
    saved = JSON.parse(
      localStorage.getItem("gameLogDataEvo888") || "{}"
    );
  } catch (error) {
    console.warn("[EVO888] Restore failed:", error);
  }

  mgCatalogLoaded = false;
  isRestoringSelection = true;

  try {
    for (const key of Object.keys(gameData)) {
      delete gameData[key];
    }

    mgGameIds = {};
    mgRecords = {};

    Object.entries(snapshot || {}).forEach(([id, game]) => {
      if (
        !game ||
        typeof game.name !== "string" ||
        !Array.isArray(game.bets) ||
        !game.pecahan
      ) return;

      gameData[game.name] = {
        bets: game.bets,
        pecahan: game.pecahan,
        freeGameOptions: Array.isArray(game.freeGameOptions)
          ? game.freeGameOptions
          : []
      };

      mgGameIds[game.name] = id;
      mgRecords[game.name] = game;
    });

    gameSelect.replaceChildren(
      new Option("Select Game", "")
    );

    Object.keys(gameData)
      .sort((a, b) => a.localeCompare(b))
      .forEach(name => {
        gameSelect.add(new Option(name, name));
      });

    const selectedGame =
      previous?.game && gameData[previous.game]
        ? previous.game
        : saved.game && gameData[saved.game]
          ? saved.game
          : "";

    if (selectedGame) {
      gameSelect.value = selectedGame;
      gameSelect.dispatchEvent(
        new Event("change", { bubbles: true })
      );

      const selectedBet =
        previous?.game === selectedGame && previous.bet
          ? previous.bet
          : saved.game === selectedGame
            ? saved.bet
            : "";

      if (
        selectedBet !== "" &&
        selectedBet !== undefined
      ) {
        betSelect.value = String(selectedBet);

        if (betSelect.value !== "") {
          betSelect.dispatchEvent(
            new Event("change", { bubbles: true })
          );

          const selectedWin =
            previous?.game === selectedGame &&
            previous.bet === selectedBet
              ? previous.pecahan
              : saved.pecahan;

          if (
            selectedWin !== "" &&
            selectedWin !== undefined
          ) {
            winSelect.value = String(selectedWin);
          }
        }
      }
    }

  } finally {
    isRestoringSelection = false;
    mgCatalogLoaded = true;

    gameCS?.refresh?.();
    betCS?.refresh?.();
    winCS?.refresh?.();
  }
}


function mgStart() {
  const create = document.getElementById("mgCreate");
  const manage = document.getElementById("mgManage");

  create.hidden = true;
  manage.hidden = true;

  create.addEventListener("click", () => mgEditor());
  manage.addEventListener("click", mgManager);

  if (!window.firebase?.apps?.length) {
    mgToast("Firebase not initialized", "error");
    return;
  }

  let loadVersion = 0;

  firebase.auth().onAuthStateChanged(async user => {
    const version = ++loadVersion;

    mgAccess = { role: "", actions: [] };
    mgSites = [];
    mgSyncPermission();

    if (!user || user.isAnonymous) {
      mgCatalogLoaded = false;
      mgApplyCatalog({});
      return;
    }

    // SVG refresh tab menggunakan Reset Log asal.
    applyEvoWorkspaceReset(user);

    // Muat senarai Game tanpa menunggu Access/Sites.
    const gamesPromise = (async () => {
      try {
        const startedAt = performance.now();
        const result = await mgApi("/games");

        if (
          version !== loadVersion ||
          firebase.auth().currentUser?.uid !== user.uid
        ) return;

        if (!Array.isArray(result.games)) {
          throw new Error("Invalid Game Catalog response");
        }

        const catalog = {};

        for (const game of result.games) {
          if (game && game.id != null) {
            catalog[game.id] = game;
          }
        }

        mgApplyCatalog(catalog);

        console.log(
          "[EVO888] Games loaded:",
          result.games.length,
          "in",
          Math.round(performance.now() - startedAt) + "ms"
        );

      } catch (error) {
        if (version !== loadVersion) return;

        console.error("[EVO888] Games:", error);

        mgToast(
          "Game loading failed: " + error.message,
          "error"
        );
      }
    })();

    // Permission masih disemak seperti asal.
    const permissionsPromise = (async () => {
      const [accessResult, sitesResult] =
        await Promise.allSettled([
          mgApi("/access"),
          mgApi("/sites")
        ]);

      if (
        version !== loadVersion ||
        firebase.auth().currentUser?.uid !== user.uid
      ) return;

      if (accessResult.status === "fulfilled") {
        const access = accessResult.value || {};

        mgAccess = {
          role: access.role || "",
          actions: Array.isArray(access.actions)
            ? access.actions
            : []
        };
      } else {
        console.error(
          "[EVO888] Access error:",
          accessResult.reason
        );
      }

      if (sitesResult.status === "fulfilled") {
        mgSites = Array.isArray(sitesResult.value?.sites)
          ? sitesResult.value.sites
          : [];
      } else {
        console.error(
          "[EVO888] Sites error:",
          sitesResult.reason
        );
      }

      mgSyncPermission();
    })();

    await Promise.allSettled([
      gamesPromise,
      permissionsPromise
    ]);
  });
}

function mgEditor(oldName=''){
if (!mgCan(oldName ? "edit" : "create")) {

if (

 const form=mgElement('form','mg-modal-form');
 const name=mgField('Game Name',oldName,'text');name.input.required=true;name.input.placeholder='Example: ICELAND';form.append(name.host);

const free = mgField(

);

const globalSwitch = mgElement("label", "shared-active-switch");

const globalInput = mgElement("input");
globalInput.type = "checkbox";
globalInput.id = "mgGlobalActive";
globalInput.checked = mgAccess.role === "superadmin"
  ? (oldName ? old.visibleToAllSites !== false : true)
  : false;

const globalTrack = mgElement("span", "shared-active-track");
const globalText = mgElement("span", "shared-active-text", "Inactive");
const globalKnob = mgElement("span", "shared-active-knob");

globalKnob.setAttribute("aria-hidden", "true");
globalTrack.append(globalText, globalKnob);
globalSwitch.append(globalInput, globalTrack);

globalField.append(
  globalLabel,
  globalSwitch,
  mgElement(
    "small",
    "",
    "ON: Semua site. OFF: Ikut Site Visibility."

);

form.append(globalField);

/* ===== SITE VISIBILITY ===== */

const siteField = mgElement("div", "mg-scope-field");
const siteLabel = mgElement("label", "", "Site Visibility");
const siteHost = mgElement("div");

siteHost.id = "mgModalSites";

siteField.append(
  siteLabel,
  siteHost,
  mgElement("small", "", "Pilih site untuk game ini.")
);

form.append(siteField);
 const hint=mgElement('div','mg-notice','Bet & Win: add one row for each Bet amount. Every Bet has its own Win options.');form.append(hint);
 const rows=mgElement('div','mg-modal-form');form.append(rows);
 function addBet(bet='',wins=''){
   const row=mgElement('div','mg-betrow');const a=mgField('Bet',String(bet),'number');a.input.step='any';a.input.min='0';const b=mgField('Win Options',String(wins),'text');b.input.placeholder='30, 60, 100';const del=mgElement('button','btn-delete-new','Remove');del.type='button';del.onclick=()=>row.remove();row.append(a.host,b.host,del);rows.append(row);
   row._get=()=>({bet:Number(a.input.value),betText:a.input.value.trim(),wins:mgNumberList(b.input.value)});
   window.NewUI?.input?.(a.input);window.NewUI?.input?.(b.input);
 }
 (old.bets||[]).forEach(b=>addBet(b,(old.pecahan?.[String(b)]||[]).join(', ')));
 if(!old.bets?.length)addBet();
 const add=mgElement('button','btn-edit-new','+ Add Bet');add.type='button';add.onclick=()=>addBet();form.append(add);
/* ===== ACTIVE / INACTIVE ===== */

const statusField = mgElement("div", "mg-scope-field");
const statusLabel = mgElement("label", "", "Active / Inactive");
const statusSwitch = mgElement("label", "shared-active-switch");

const statusInput = mgElement("input");
statusInput.type = "checkbox";
statusInput.id = "mgGameActive";
statusInput.checked = old.active !== false;

const statusTrack = mgElement("span", "shared-active-track");
const statusText = mgElement("span", "shared-active-text", "Inactive");
const statusKnob = mgElement("span", "shared-active-knob");

statusKnob.setAttribute("aria-hidden", "true");
statusTrack.append(statusText, statusKnob);
statusSwitch.append(statusInput, statusTrack);
statusField.append(statusLabel, statusSwitch);

/* ===== MODAL ACTIONS ===== */

const actions = mgElement("div", "mg-form-actions");
const right = mgElement("div", "mg-form-right");

const cancel = mgElement("button", "btn-cancel-new", "Cancel");
const save = mgElement("button", "btn-primary-new", "Save Game");

cancel.type = "button";
save.type = "submit";

right.append(cancel, save);
actions.append(statusField, right);
form.append(actions);
 const modal=NewUI.modal.open({title:oldName?'Edit Game':'Create Game',content:form,width:720});cancel.onclick=()=>modal.close();
 form.querySelectorAll('input[data-new-ui-input]').forEach(input=>NewUI.input(input));
globalInput.disabled = mgAccess.role !== "superadmin";

window.SharedActiveSwitch?.sync?.(globalInput);
window.SharedActiveSwitch?.sync?.(statusInput);

const selectedSites = Object.entries(
  old.siteVisibility || {}
)
  .filter(([, enabled]) => enabled === true)
  .map(([id]) => id);

const siteChips = NewUI.chips(siteHost, {
  options: mgSites.map(site => ({
    value: site.id,
    label: site.name
  })),
  value: selectedSites,
  multiple: true,
  placeholder: "Select Sites"
});
 form.addEventListener('submit',async e=>{
 e.preventDefault();const gameName=name.input.value.trim(),freeOptions=mgOptions(free.input.value);
 if(!gameName){mgToast('Enter game name','error');return;}

if (freeOptions === null) {
  mgToast(
    "Free Game Options must contain positive whole numbers only!",
    "error"
  );
  return;
}
 if(gameData[gameName]&&gameName!==oldName){mgToast('Game name already exists','error');return;}
 const bets=[],pecahan={};for(const row of rows.children){const {bet,betText,wins}=row._get();if(!betText||!Number.isFinite(bet)||bet<=0||!wins.length){mgToast('Enter valid Bet and Win values for every row','error');return;}if(bets.includes(bet)){mgToast('Duplicate Bet: '+bet,'error');return;}bets.push(bet);pecahan[String(bet)]=wins;}
 if(!bets.length){mgToast('Add at least one Bet','error');return;}
// Custom NewUI loading spinner
await NewUI.setButtonLoading(save, true, {
  text: "Saving..."
});

try {
  const id = oldName ? mgGameIds[oldName] : null;

  if (oldName && !id) {
    throw Error("Game ID not found");
  }

  const sites = siteChips.getValue() || [];

  const payload = {
    name: gameName,
    bets,

    freeGameOptions: freeOptions,
    active: statusInput.checked,

    siteVisibility: Object.fromEntries(
      sites.map(siteId => [siteId, true])
    )
  };

  ) {
    throw Error("Please select at least one site");
  }

  await mgApi(
    id
      ? "/games/" + encodeURIComponent(id)
      : "/games",
    {
      method: id ? "PATCH" : "POST",
      body: payload
    }
  );

  await mgReload();

  // Pastikan spinner sempat kelihatan
  await NewUI.setButtonLoading(save, false, {
    minDuration: 700
  });

  modal.close();
  mgToast("Game saved", "success");

} catch (err) {
  mgToast("Save failed: " + err.message, "error");

} finally {

}
 });
}



function mgManager() {
  if (!mgCan("edit") && !mgCan("delete")) {
    mgToast("Permission denied", "error");
    return;
  }

  const host = mgElement("div", "mg-manager");

  const names = Object.keys(gameData).sort((a, b) =>
    a.localeCompare(b)
  );

  if (!names.length) {
    window.showEmptyState?.(
      host,
      "No games yet",
      "large",
      "center"
    );
  }

  names.forEach(name => {
    const item = mgElement("div", "mg-item");
    const title = mgElement("div");

    title.append(
      mgElement("strong", "", name),
      mgElement(
        "small",
        "",
        ` • ${gameData[name].bets.length} bets • Free: ${
          (gameData[name].freeGameOptions || []).join(", ") || "None"
        }`
      )
    );

    const acts = mgElement("div", "mg-item-actions");

    const edit = mgElement("button", "btn-edit-new", "Edit");
    const del = mgElement("button", "btn-delete-new", "Delete");

    edit.type = "button";
    del.type = "button";

    edit.hidden = !mgCan("edit");
    del.hidden = !mgCan("delete");

    edit.onclick = () => {
      modal.close();
      mgEditor(name);
    };

    del.onclick = async () => {
      if (!mgGameIds[name]) return;

      const confirmed = await NewUI.confirm({
        target: del,
        title: "Delete Game",
        message: `Delete game ${name}?`,
        confirmText: "Delete"
      });

      if (!confirmed) return;

      try {
        await mgApi(
          "/games/" + encodeURIComponent(mgGameIds[name]),
          { method: "DELETE" }
        );

        await mgReload();

        modal.close();
        mgManager();

        mgToast("Game deleted", "success");

      } catch (err) {
        mgToast(err.message, "error");
      }
    };

    acts.append(edit, del);
    item.append(title, acts);
    host.append(item);
  });

  const modal = NewUI.modal.open({
    title: "Manage EVO888 Games",
    content: host,
    width: 650
  });
}
