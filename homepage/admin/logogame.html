    :root{
  --page-bg: #000;
  --page-text: rgba(255,255,255,0.85);
  --page-input: #141414;
  --border-input:#424242;
  --page-bg2:#1f1f1f;
  --name:#1668dc;
  --blur:rgba(255,255,255,0.25);

  --blue: #1668dc;
  --blue-hover: #3c89e8;
  --blue-active: #1554ad;
}

body.light-theme{
  --page-bg: #ffffff;
  --page-text: rgba(0,0,0,0.88);
  --page-input: #ffffff;
  --border-input:#d9d9d9;
  --page-bg2:#ffffff;
  --name:#1668dc;
  --blur:#00000063;

  --blue: #1668dc;
  --blue-hover: #3c89e8;
  --blue-active: #1554ad;
}

*{
  box-sizing: border-box;
}

html{
  scrollbar-width: thin;
  scrollbar-color: #555 transparent;
}

body{
  background: var(--page-bg);
  color: var(--page-text);
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

/* sticky filter area */
.filter-bar{
  position: static;
  background: var(--page-bg);
  padding: 16px 12px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

/* title */
.search-title{
  font-size: 30px;
  font-weight: bold;
  color: gold;
  animation: blinkColor 0.3s infinite;
  margin-top: 30px;
  text-align: center;
  letter-spacing: 1px;
}

/* search */
.search-container{
  width: 100%;
  text-align: center;
  padding-bottom: 18px;
}

.search-container input{
  display: block;
  width: min(100%, 520px);
  margin: 0 auto;
  padding: 4px 11px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid var(--border-input);
  background-color: var(--page-input);
  color: var(--page-text);
  outline: none;
  transition: all 0.3s ease;
  height:32px;
}

.search-container input:hover{
  border:1px solid var(--blue-hover);
}

.search-container input:focus{
  border:1px solid var(--blue);
  box-shadow: 0 0 0 2px rgba(22,104,220,0.12);
}

/* buttons area */
.filter-tabs,
.platform-filters{
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  text-align: center;
}

.filter-tabs{
  margin-bottom: 10px;
}

.platform-filters{
  padding-bottom: 10px;
}

.filter-tabs button{
  background-color: var(--page-input);
  color: var(--page-text);
  border: 1px solid var(--border-input);
  padding: 0 15px;
  margin: 0;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.3s ease;
  min-height: 32px;
  height: 32px;
  white-space: nowrap;
}

.filter-tabs button.active{
  border: 1px solid var(--blue);
  color: var(--blue);
}

.filter-tabs button:hover{
  border: 1px solid var(--blue-hover);
  color: var(--blue-hover);
}

/* main grid */
.logo-grid{
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 22px;
  padding: 14px 22px 30px;
  max-width: 1500px;
  margin: 0 auto;
  align-items: stretch;
}

/* card */
.game-logo{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: var(--page-input);
  border: 1px solid var(--border-input);
  border-radius: 8px;
  padding: 14px 12px 16px;
  transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
  position: relative;
  top: 0;
  width: 100%;
  min-width: 0;
  min-height: 255px;
  overflow: hidden;
}

.game-logo:hover{
  transform: translateY(-4px);
  border-color: var(--blue-hover);
  box-shadow: 0 8px 22px rgba(0,0,0,0.25);
}

.game-alias{
  font-weight: bold;
  color: var(--page-text);
  margin-bottom: 10px !important;
  font-size: 12px !important;
  text-align: center;
  line-height: 1.35;
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.game-logo img{
  width: 100%;
  max-width: 170px;
  height: 130px;
  object-fit: contain;
  margin-bottom: 10px;
  display: block;
}

.game-logo span{
  color: var(--blue);
  font-size: 14px;
  text-align: center;
  line-height: 1.4;
  word-break: break-word;
}

.game-logo span,
.game-logo:hover{
  color: var(--blue);
}

.copy-notice{
  position: absolute;
  bottom: 0;
  background-color: #141414;
  color: rgba(255,255,255,0.85);
  font-size: 12px;
  font-weight: bold;
  padding: 3px 6px;
  border-radius: 6px;
  animation: fadeNotice 0.3s ease;
  z-index: 1;
}

@keyframes fadeNotice{
  from{ opacity: 0; transform: translateY(-5px); }
  to{ opacity: 1; transform: translateY(0); }
}

/* back to top */
#backToTop{
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background-color: var(--blue);
  color: white;
  padding: 10px 15px;
  font-size: 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  display: none;
  z-index: 1000;
  transition: all 0.3s ease;
}

#backToTop:hover{
  background-color: var(--blue-hover);
}

#backToTop:active{
  background: var(--blue-active);
}

/* scrollbar */
::-webkit-scrollbar{
  width: 8px;
}

::-webkit-scrollbar-track{
  background: transparent;
}

::-webkit-scrollbar-thumb{
  background: #555;
  border-radius: 10px;
  transition: all 0.3s ease;
}

::-webkit-scrollbar-thumb:hover{
  background: #777;
}

async function copyImageToClipboard(imageUrl, parentElement) {
const gameName =
    parentElement?.querySelector(".game-name")?.innerText ||
    parentElement?.querySelector(".game-alias")?.innerText ||
    "Image";

  sendUserAction("COPY IMAGE", {
    method: "logo-game-click",
    image: String(gameName).replace(/\s+/g, " ").trim().slice(0, 60),
    url: imageUrl
  });
  function showNotice(text, type = "info") {
    const existing = parentElement.querySelector('.copy-notice');
    if (existing) existing.remove();

    const notice = document.createElement('div');
    notice.textContent = text;
    notice.className = 'copy-notice';

    if (type === "success") {
      notice.style.background = '#1668dc';
      notice.style.color = '#ffffff';
    } else if (type === "error") {
      notice.style.background = '#ff4d4f';
      notice.style.color = '#fff';
    } else {
      notice.style.background = '#1668dc';
      notice.style.color = '#ffffff';
    }

    parentElement.appendChild(notice);

    setTimeout(() => {
      if (notice && notice.parentNode) notice.remove();
    }, 2200);
  }

  // 1) Cuba copy terus dalam child
  try {
    const response = await fetch(imageUrl);
    if (!response.ok) throw new Error("Fetch failed: " + response.status);

    const blob = await response.blob();

    if (!window.ClipboardItem || !navigator.clipboard?.write) {
      throw new Error("Clipboard API not supported");
    }

    const item = new ClipboardItem({ [blob.type]: blob });
    await navigator.clipboard.write([item]);

    showNotice("Image Copied!", "success");
    return;
  } catch (err) {
    console.warn("Direct child copy failed:", err);
  }

  // 2) Fallback ke parent
  if (window.parent !== window) {
    try {
      window.parent.postMessage(
        { action: "copy-image", url: imageUrl },
        "https://5g88-main.vercel.app"
      );
      showNotice("Sending copy request...", "info");
      return;
    } catch (err) {
      console.error("PostMessage fallback failed:", err);
    }
  }

  showNotice("❌ Failed to copy image", "error");
}
(function () {
  const THEME_KEY = "siteTheme";

  function applyChildTheme(theme) {
    document.body.classList.remove("light-theme", "dark-theme");
    document.body.classList.add(theme === "light" ? "light-theme" : "dark-theme");
  }

  applyChildTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");

  window.addEventListener("message", function (e) {
    const allowedOrigins = [
      "https://5g88-main.vercel.app"
    ];
    if (!allowedOrigins.includes(e.origin)) return;

    const data = e.data || {};
    if (data.type === "theme-change") {
      const theme = data.theme === "dark" ? "dark" : "light";
      localStorage.setItem(THEME_KEY, theme);
      applyChildTheme(theme);
    }
  });
})();

document.addEventListener("click", function(e) {
  let el = e.target.closest("button, [onclick], a, .btn, [data-action]");

  // ✅ Detect klik image / logo game
  if (!el) {
    const img = e.target.closest("img");

    if (img) {
      const card = img.closest(".game-card, .card, .game-item, .logo-card, [data-game], [data-name]");

      const imageName =
        img.getAttribute("alt") ||
        img.getAttribute("title") ||
        card?.getAttribute("data-game") ||
        card?.getAttribute("data-name") ||
        card?.innerText ||
        "Image";

      sendUserAction("COPY IMAGE", {
        method: "image-click",
        image: String(imageName).replace(/\s+/g, " ").trim().slice(0, 60)
      });

      return;
    }
  }

  if (!el) return;
  if (el.disabled || el.getAttribute("aria-disabled") === "true") return;

  let name =
    el.getAttribute("data-action") ||
    el.getAttribute("title") ||
    el.getAttribute("aria-label") ||
    el.innerText ||
    el.textContent ||
    el.id ||
    "";

  name = String(name).replace(/\s+/g, " ").trim();
  if (!name || name.length < 2) return;

  sendUserAction(name.slice(0, 40));
}, true);

document.addEventListener("keydown", function(e) {
  const key = String(e.key || "").toLowerCase();

  if (key !== "enter") return;
  if (e.shiftKey) return;

  const el = e.target;
  if (!el) return;

  const isMessageInput =
    el.matches("textarea, input[type='text'], [contenteditable='true']") ||
    el.closest("[contenteditable='true']");

  if (!isMessageInput) return;

  const value = (el.value || el.innerText || el.textContent || "").trim();
  if (!value) return;

  sendUserAction("Send Message", {
    method: "enter-key"
  });
}, true);

}
document.getElementById('createGameBtn').addEventListener('click',()=>openLogoEditor());
document.getElementById('logoCancel').addEventListener('click',()=>logoDialog.close());
logoDialog.addEventListener('close',()=>{if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl=null;}});
document.getElementById('logoUrl').addEventListener('input',e=>{if(!document.getElementById('logoFile').files.length)showLogoPreview(validImageUrl(e.target.value)?e.target.value:'');});
document.getElementById('logoFile').addEventListener('change',e=>{if(previewObjectUrl)URL.revokeObjectURL(previewObjectUrl);const file=e.target.files[0];previewObjectUrl=file?URL.createObjectURL(file):null;showLogoPreview(previewObjectUrl||document.getElementById('logoUrl').value);});
logoForm.addEventListener('submit',async e=>{
 e.preventDefault();const btn=document.getElementById('logoSave');btn.disabled=true;
 try {
  const platforms=[...document.querySelectorAll('[name="logoPlatform"]:checked')].map(x=>x.value);
  if(!platforms.length)throw new Error('Pilih sekurang-kurangnya satu platform');
  let image=document.getElementById('logoUrl').value.trim();const file=document.getElementById('logoFile').files[0];
  if(file){
   if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>5*1024*1024)throw new Error('PNG/JPG/WEBP/GIF maksimum 5MB');
   logoStatus.textContent='Uploading image...';const fd=new FormData();fd.append('file',file);fd.append('upload_preset',UPLOAD_PRESET);
   const response=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:'POST',body:fd});const result=await response.json();
   if(!response.ok||!validImageUrl(result.secure_url))throw new Error(result.error?.message||'Cloudinary upload failed');image=result.secure_url;
  }
  if(!validImageUrl(image))throw new Error('Upload image atau masukkan HTTPS image URL');
  const data={name:document.getElementById('logoName').value.trim(),alias:document.getElementById('logoAlias').value.trim(),type:document.getElementById('logoType').value,platform:platforms,image,updatedAt:firebase.database.ServerValue.TIMESTAMP};
  if(!data.name||!data.alias)throw new Error('Nama dan alias diperlukan');
  logoStatus.textContent='Saving to Firebase...';const db=logoDb();
  if(editingLogoId)await db.ref(`${LOGO_PATH}/${editingLogoId}`).update(data);
  else await db.ref(LOGO_PATH).push({...data,createdAt:firebase.database.ServerValue.TIMESTAMP});
  logoDialog.close();
 }catch(err){console.error(err);logoStatus.textContent=err.message;}finally{btn.disabled=false;}
});
async function deleteLogo(game){if(!confirm(`Delete ${game.alias||game.name}?`))return;try{await logoDb().ref(`${LOGO_PATH}/${game.id}`).remove();}catch(err){alert('Delete failed: '+err.message);}}
document.getElementById('importLogosBtn').addEventListener('click',async()=>{
 if(!confirm(`Import ${legacyGames.length} old logos ke Firebase?`))return;
 try{const db=logoDb(),r=db.ref(LOGO_PATH),snap=await r.once('value');if(snap.exists())throw new Error('Database sudah ada logo. Import dibatalkan untuk elak duplicate.');
 const updates={};for(const game of legacyGames){updates[r.push().key]={...game,createdAt:firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP};}
 await r.update(updates);alert('Import completed!');}catch(err){alert('Import failed: '+err.message);}
});
function startLogoRealtime(){
 try{logoDbRef=logoDb().ref(LOGO_PATH);logoDbRef.on('value',snap=>{
  if(snap.exists()){games=Object.entries(snap.val()).map(([id,game])=>({...game,id}));document.getElementById('importLogosBtn').hidden=true;}
  else{games=[...legacyGames];document.getElementById('importLogosBtn').hidden=false;}
  renderGames();
 },err=>{console.error('Logo read failed:',err);document.getElementById('logoStatus').textContent=err.message;});}
 catch(err){console.warn('Logo Firebase unavailable:',err.message);}
}
startLogoRealtime();
</script>
</body>
</html>
