<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
   <link rel="icon" type="image/svg+xml" href="./logo.svg" />
   <title>Auth Users · 5G88</title>
   <link rel="stylesheet" href="./shared-ui.css">
  <link rel="stylesheet" href="./admin.css">
   <style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color-scheme:dark;--bg:#0e1118;--panel:#171c27;--border:#303747;--text:#eef2fa;--muted:#a1abc0;--blue:#317be8;--bad:#e86d73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}a{color:#91baff;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 26px;border-bottom:1px solid var(--border);background:#141925}main{max-width:1180px;margin:30px auto;padding:0 20px}.brand{font-weight:800;font-size:18px}.toplinks{display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:25px;margin:0 0 8px}p{color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:24px 0 14px}.toolbar .group{display:flex;gap:10px;flex-wrap:wrap}.panel{border:1px solid var(--border);background:var(--panel);border-radius:12px;overflow:hidden}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px}th{color:var(--muted);font-weight:600}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}button,input,select,textarea{font:inherit}button{border:1px solid var(--border);background:#262e3f;color:var(--text);border-radius:8px;padding:10px 14px;cursor:pointer}button.primary{background:var(--blue);border-color:var(--blue);color:white}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{background:#101520;color:var(--text);border:1px solid #3b4458;border-radius:8px;padding:10px 12px;width:100%}input[type=checkbox]{width:auto}input.search{width:260px;max-width:100%}.notice{border:1px solid #5b5036;background:#292417;padding:12px 16px;border-radius:9px;color:#e7d3a5;margin-top:18px}.status{min-height:24px;margin:14px 0;color:#c9d7ef}.status.error{color:#ff999f}.pill{display:inline-block;border-radius:999px;padding:3px 9px;background:#263e32;color:#a7e9c2}.pill.off{background:#4a292f;color:#ffadb4}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.dialog{background:#1b2130;border:1px solid var(--border);border-radius:14px;width:min(560px,100%);padding:24px;max-height:90vh;overflow:auto}.dialog h2{margin-top:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;color:#cbd3e2}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.empty{padding:36px;text-align:center;color:var(--muted)}.hide{display:none!important}@media(max-width:640px){header{padding:14px}main{padding:0 12px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><main><div class="notice">Only Superadmin can access this page. Data changes require server-side authorization; hiding a button does not grant security.</div><div id="status" class="status">Checking admin session…</div><div class="toolbar"><div class="group"><input id="search" class="search" placeholder="Search username or email"><button id="refresh">Refresh</button></div><button id="create" class="primary" disabled>Create User</button></div><div class="panel tablewrap"><table><thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Assigned sites</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody></table></div></main><div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Create</h2><form id="userForm"><div class="formgrid"><div class="field"><label for="username">Username</label><input id="username" required maxlength="60" autocomplete="off"></div><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="off"></div><div class="field"><label for="password">Temporary password</label><input id="password" type="password" required minlength="12" autocomplete="new-password"></div><div class="field"><label for="role">Role</label>
 <div class="field">
  <label for="secondPassword">2nd Password (6-digit PIN)</label>
  <input
    id="secondPassword"
    type="password"
    inputmode="numeric"
    pattern="[0-9]{6}"
    minlength="6"
    maxlength="6"
    autocomplete="new-password"
    required
    placeholder="Enter 6-digit PIN"
  >
</div>
 <select id="role"><option value="siteadmin">Site Admin</option></select></div><div class="field full"><label for="sites">Site IDs (comma-separated; backend must validate assignments)</label><input id="sites" placeholder="5g88, spm888"></div></div><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit" id="save">Create User</button></div></form></div></div><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script><script src="../firebase.js"></script>
 <script defer src="./shared-ui.js"></script>
 <script>
"use strict";
const BACKEND = "https://fiveg88-admin-backend-v2.onrender.com";
const auth = firebase.auth();
const db = firebase.database();
const $ = id => document.getElementById(id);
let currentAdmin = null;
function status(message, error=false){const e=$("status");e.textContent=message;e.classList.toggle("error",error);}
function openModal(){ $("modal").classList.add("open"); }
function closeModal(){ $("modal").classList.remove("open"); }
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal();});
$("logoutBtn").onclick=async()=>{await auth.signOut();location.replace("./login.html");};
async function verifySuperadmin(){
 const user=await new Promise(resolve=>{const unsub=auth.onAuthStateChanged(u=>{unsub();resolve(u);},()=>resolve(null));});
 if(!user||user.isAnonymous){location.replace("./login.html");return false;}
 const token=await user.getIdTokenResult(true);
 if(token.claims.secondVerified!==true||!Number.isSafeInteger(token.claims.pinVersion)){await auth.signOut();location.replace("./login.html");return false;}
 const snap=await db.ref("adminUsers/"+user.uid).once("value");
 const profile=snap.val();
 if(!profile||profile.active!==true||profile.secondPasswordEnabled!==true||profile.role!=="superadmin"||profile.pinVersion!==token.claims.pinVersion){status("Access denied: Superadmin only.",true);return false;}
 currentAdmin={uid:user.uid,role:profile.role,username:profile.username};return true;
}
async function api(path,options={}){
 const user=auth.currentUser;if(!user)throw Error("Session expired. Please log in again.");
 const idToken=await user.getIdToken(true);
 const response=await fetch(BACKEND+path,{...options,headers:{Authorization:"Bearer "+idToken,...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})}});
 const raw=await response.text();let data;try{data=raw?JSON.parse(raw):{};}catch{data={message:raw.slice(0,160)};}
 if(!response.ok)throw Error(data.error||data.message||("Backend error HTTP "+response.status));
 return data;
}
function td(tr,value){const cell=document.createElement("td");cell.textContent=String(value??"—");tr.appendChild(cell);return cell;}
function badge(tr,enabled){const cell=document.createElement("td");const span=document.createElement("span");span.className="pill"+(enabled?"":" off");span.textContent=enabled?"Active":"Inactive";cell.appendChild(span);tr.appendChild(cell);}

let users=[];
function render(){const q=$("search").value.trim().toLowerCase();const body=$("rows");body.replaceChildren();const rows=users.filter(u=>[u.username,u.email,u.role,JSON.stringify(u.siteIds||u.sites||[])].some(v=>String(v||"").toLowerCase().includes(q)));if(!rows.length){const tr=document.createElement("tr");const cell=td(tr,"No matching users");cell.colSpan=5;cell.className="empty";body.appendChild(tr);return;}for(const u of rows){const tr=document.createElement("tr");td(tr,u.username);td(tr,u.email);td(tr,u.role);td(tr,Array.isArray(u.siteIds)?u.siteIds.join(", "):Array.isArray(u.sites)?u.sites.join(", "):Object.keys(u.sites||{}).join(", "));badge(tr,u.enabled===true);body.appendChild(tr);}}
async function load(){status("Loading users…");try{const data=await api("/api/admin-users");users=Array.isArray(data)?data:Array.isArray(data.users)?data.users:Array.isArray(data.items)?data.items:[];render();status("Loaded "+users.length+" users.");}catch(e){users=[];render();status("Cannot load users: "+e.message+". Confirm GET /api/admin-users is implemented and authorizes Superadmin.",true);}}
$("search").oninput=render;$("refresh").onclick=load;$("create").onclick=()=>{$("userForm").reset();openModal();};$("cancel").onclick=closeModal;
$("userForm").onsubmit=async e=>{e.preventDefault();const btn=$("save");btn.disabled=true;try{const payload={username:$("username").value.trim(),email:$("email").value.trim(),password:$("password").value,
                                                                                                             secondPassword: $("secondPassword").value,
                                                                                                             role:"siteadmin",siteIds:$("sites").value.split(",").map(x=>x.trim()).filter(Boolean)};if (
  !payload.username ||
  !payload.email ||
  payload.password.length < 12 ||
  !/^\d{6}$/.test(payload.secondPassword)
)throw Error("Please complete required fields.");await api("/api/admin-users",{method:"POST",body:JSON.stringify(payload)});$("password").value="";closeModal();await load();status("User created. Set up their second password/PIN using the approved backend workflow.");}catch(err){status("Create failed: "+err.message,true);}finally{btn.disabled=false;}};
(async()=>{try{if(!await verifySuperadmin())return;$("create").disabled=false;await load();}catch(e){status("Authorization failed: "+e.message,true);}})();
</script></body></html>
