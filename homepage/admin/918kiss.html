  height:32px;display:flex;align-items:center;justify-content:space-between;

}

.cs-list{position:absolute; top:calc(100% + 3px); left:0; right:0;
background:var(--list-bg); 
color:var(--page-text);border-radius:8px;overflow:hidden;
padding:4px;
cursor:pointer; 
display:none;

box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
}
.cs-wrap.open .cs-list{display:block}
.cs-item{
padding:5px 12px;

white-space:nowrap;
overflow: hidden;
white-space: nowrap;

/* ===== BODY ===== */
html, body{
  max-width:100%;
  overflow-x:hidden;
}

body{
  overflow-y:auto;
}

/* ===== TABLE WRAP ===== */
.table-wrap{
  width:100%;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  margin:10px 12px 10px;
  padding-bottom:4px;
}

/* bagi table boleh scroll kiri kanan */
.table-wrap table{
  min-width:1300px; /* boleh adjust 1100 / 1200 / 1300 */
  width:max-content;
  margin-top:0;
}

/* optional: bagi nampak smooth */
.table-wrap{
  scroll-behavior:smooth;
}
input::placeholder{
  color:rgba(255,255,255,0.4);
}

select{
  color:rgba(255,255,255,0.85);
}

select option[value=""]{
  color:rgba(255,255,255,0.4);
}
/* ===== REMOVE NUMBER INPUT SPINNER ===== */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield;
}


/* ===== MIDDLE CONTROL ROW FINAL ===== */
.form-row-middle{
  display: grid;
  grid-template-columns:
    minmax(0, 1fr) 100px
    minmax(0, 1fr) 110px
    minmax(0, 1fr) 110px
    minmax(0, 1fr) 110px;
  gap: 8px;
  align-items: center;
  margin: 10px 12px 10px;
} 
.form-row-middle .inline-group{
  display: contents;
}

.form-row-middle > *{
  min-width: 0;
}

.form-row-middle input{
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  text-align: left;
}

.form-row-middle button{
  width: 100%;
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
  white-space: nowrap;
  overflow: hidden;
  height: 32px;
  min-height: 32px;
  line-height: 1;
  padding: 0px 15px;
  text-align: center;
}

/* phone / layar kecil sahaja */
@media (max-width: 768px){
  .form-row-middle{
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-areas:
      "score auto"
      "jackpot setjackpot"
      "support setsupport"
      "win setwinner";
  }

  .form-row-middle .score-group{ grid-area: score; }
  .form-row-middle .shared-active-switch {
  grid-area: auto;
}

  .form-row-middle .jackpot-group{ grid-area: jackpot; }
  .form-row-middle .btn-jackpot{ grid-area: setjackpot; }

  .form-row-middle .support-group{ grid-area: support; }
  .form-row-middle .btn-support{ grid-area: setsupport; }

  .form-row-middle .win-group{ grid-area: win; }
  .form-row-middle .btn-winner{ grid-area: setwinner; }
}

@media (max-width: 640px){
  .form-row-middle{
    gap: 8px;
  }

  .form-row-middle input,
  .form-row-middle button{

  if (native.dataset.csReady === "1") {

  const wrap = document.createElement("div");

  const display = document.createElement("div");

    const items = Array.from(itemsBox.querySelectorAll(".cs-item"));

      item.style.display = show ? "" : "none";

    if (searchInput) {

    }
  }

  function close() {

  function toggle() {

  }

    e.stopPropagation();

    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggle();
    } else if (e.key === "Escape") {

    searchInput.addEventListener("keydown", (e) => {

  const observer = new MutationObserver(() => refresh());
  observer.observe(native, {

    }

// 👉 TAMBAHKAN FUNGSI BARU INI
function recalcBalancesAfterFreeGame() {
  const tbody = document.querySelector("#gameLog tbody");
  if (!tbody) return;

  const rows = Array.from(tbody.querySelectorAll("tr.log-row"));
  if (!rows.length) return;

  // jalan dari bawah (row paling bawah) ke atas (row paling atas)
  for (let i = rows.length - 1; i >= 0; i--) {
    const row = rows[i];

    const win = parseFloat(row.children[3].textContent) || 0;
    const betCell = row.querySelector(".bet-cell");

    let bet = 0;
    if (betCell) {
      // kalau tulisan "Free game" → bet = 0
      if (betCell.textContent.trim().toLowerCase() === "free game") {
        bet = 0;
      } else {
        bet = parseFloat(betCell.dataset.bet || betCell.textContent) || 0;
      }
    }

    let begin;
    if (i === rows.length - 1) {
      // row paling bawah: BeginMoney pakai nilai sedia ada
      begin = parseFloat(row.children[4].textContent) || 0;
    } else {
      // row atas: BeginMoney = EndMoney row di bawahnya
      const below = rows[i + 1];
      begin = parseFloat(below.children[5].textContent) || 0;
      row.children[4].textContent = begin.toFixed(2);
    }

    // Formula umum:
    // - normal     : End = Begin - bet + win
    // - Free game  : bet = 0 → End = Begin + win
    const end = begin - bet + win;
    row.children[5].textContent = end.toFixed(2);
  }

  // Update Set score ikut EndMoney paling atas
  const setScoreRowTop = tbody.querySelector("tr.set-score-row:not(.jackpot)");
  if (setScoreRowTop && rows.length > 0) {
    const topEndMoney = parseFloat(rows[0].children[5].textContent) || 0;
    const scoreCell = setScoreRowTop.children[1];

    scoreCell.textContent = `Set score：${(-Math.abs(topEndMoney)).toFixed(2)}`;
    setScoreRowTop.children[4].textContent = Math.abs(topEndMoney).toFixed(2);
    setScoreRowTop.children[5].textContent = "0.00";
  }
}

function applyFreeGame() {
  const input = document.getElementById("freeGameInput");
  if (!input) return;

  let count = parseInt(input.value, 10);
  if (isNaN(count) || count < 0) count = 0;

  if (count > MAX_FREE_GAME_ROWS) {
    count = MAX_FREE_GAME_ROWS;
  }

  // Pulihkan semua Bet kepada nilai asal
  resetAllFreeGameMarks();

  const rows = Array.from(
    document.querySelectorAll("#gameLog tbody tr.log-row")
  );

  if (!rows.length) return;

  // Jangan melebihi jumlah row tersedia
  count = Math.min(count, rows.length);

  if (count > 0) {
    // Pilih kedudukan mula secara RANDOM
    const maxStart = rows.length - count;
    const startIndex = Math.floor(
      Math.random() * (maxStart + 1)
    );

    // Ambil satu kumpulan row berturutan
    const selectedRows = rows.slice(
      startIndex,
      startIndex + count
    );

    selectedRows.forEach(row => {
      const betCell = row.querySelector("td.bet-cell");
      if (!betCell) return;

      betCell.textContent = "Free game";
      betCell.style.fontWeight = "700";
      betCell.style.color = "#dd4b39";

      // Free Game tidak menolak Bet
      betCell.dataset.bet = "0";
    });
  }

  // Kira semula BeginMoney dan EndMoney
  recalcBalancesForLogRowsOnly();
}

function addJackpot() {
  const currentGame = document.getElementById("gameSelect").value;
  const jackpotAmount = parseFloat(document.getElementById("manualJackpot").value);

  if (isNaN(jackpotAmount) || jackpotAmount < 0) {
    return;
  }

  const tbody = document.querySelector("#gameLog tbody");
  if (!tbody) return;

  // ---- 1. Buang jackpot lama kalau ada (macam dulu) ----
  let rows = Array.from(tbody.querySelectorAll("tr.log-row"));
  let jackpotRow = tbody.querySelector("tr.set-score-row.jackpot");

  if (jackpotRow) {
    const prevJackpotText = jackpotRow.children[1].textContent;
    const match = prevJackpotText.match(/JackPot：([\d.]+)/);
    if (match) {
      const oldJackpotValue = parseFloat(match[1]);

      const index = Array.from(tbody.children).indexOf(jackpotRow);
      const prevRow = tbody.children[index - 1];
      const oldWin = parseFloat(prevRow.children[3].textContent);

      const newWin = oldWin - oldJackpotValue;
      prevRow.children[3].textContent = newWin.toFixed(2);

      const betCellPrev = prevRow.children[2];
      const betPrev = parseFloat(betCellPrev.dataset.bet || betCellPrev.textContent);
      const beginMoneyPrev = parseFloat(prevRow.children[4].textContent);
      const newEndPrev = beginMoneyPrev - betPrev + newWin;
      prevRow.children[5].textContent = newEndPrev.toFixed(2);
    }

    jackpotRow.remove();
  }

  if (hiddenRow) {
    tbody.appendChild(hiddenRow);
    hiddenRow = null;
  }

  // ---- 2. Cari pasangan 2 baris NORMAL (bukan Free game) ----
  rows = Array.from(tbody.querySelectorAll("tr.log-row"));

  // Kalau betul-betul tak cukup 2 baris log
  if (rows.length < 2) {
    showToast("Jackpot minimal perlukan 2 baris log.", "error");
    return;
  }

  // Senarai index yang valid untuk jackpot:
  // index i akan guna rows[i-1] (prev) & rows[i] (target)
  const candidateIndices = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const prevRow = rows[i - 1];

    const betCell = row.querySelector(".bet-cell");
    const prevBetCell = prevRow.querySelector(".bet-cell");

    const isFree = betCell && betCell.textContent.trim().toLowerCase() === "free game";
    const isPrevFree = prevBetCell && prevBetCell.textContent.trim().toLowerCase() === "free game";

    // Hanya ambil kalau DUA-DUA bukan free game
    if (!isFree && !isPrevFree) {
      candidateIndices.push(i);
    }
  }

  // Kalau tak ada sepasang baris normal → tak boleh buat jackpot
  if (candidateIndices.length === 0) {
    showToast("Jackpot hanya boleh dibuat di luar Free game.\nSila pastikan ada sekurang-kurangnya 2 baris normal untuk jackpot.", "info");
    return;
  }

  // Pilih salah satu index dari calon di atas
  const randomIndex = candidateIndices[Math.floor(Math.random() * candidateIndices.length)];
  const targetRow = rows[randomIndex];
  const prevRow = rows[randomIndex - 1];

  // ---- 3. Update win & endMoney untuk prevRow (jackpot kena di sini) ----
  const oldWin = parseFloat(prevRow.children[3].textContent);
  const newWin = oldWin + jackpotAmount;
  prevRow.children[3].textContent = newWin.toFixed(2);

  const beginMoney = parseFloat(prevRow.children[4].textContent);
  const betCell = prevRow.children[2];
  const bet = parseFloat(betCell.dataset.bet || betCell.textContent);
  const newEnd = beginMoney - bet + newWin;
  prevRow.children[5].textContent = newEnd.toFixed(2);

  const dateTime = prevRow.children[6].textContent;
  const gameName = prevRow.children[0].textContent;

  // ---- 4. Sisipkan baris Jackpot di antara prevRow & targetRow ----
  const newJackpotRow = document.createElement("tr");
  newJackpotRow.classList.add("set-score-row", "jackpot");
  newJackpotRow.innerHTML = `
    <td>${gameName}</td>
    <td class="setscore">JackPot：${jackpotAmount.toFixed(2)}</td>
    <td class="negatif">-</td>
    <td class="negatif">-</td>
    <td class="negatif">-</td>
    <td class="negatif">-</td>
    <td>${dateTime}</td>
  `;
  targetRow.insertAdjacentElement("beforebegin", newJackpotRow);

  // ---- 5. Trim maksimum 11 baris (1 setscore + 10 log) macam biasa ----
  const allRows = Array.from(tbody.querySelectorAll("tr.log-row"));
  const specialRows = tbody.querySelectorAll("tr.set-score-row");

  while (allRows.length + specialRows.length > 11) {
    const lastRow = allRows.pop();
    if (lastRow) lastRow.remove();
  }

  const updatedRows = Array.from(tbody.querySelectorAll("tr.log-row"));
  for (let i = updatedRows.length - 1; i > 0; i--) {
    const current = updatedRows[i];
    const prev = updatedRows[i - 1];

    const curEnd = parseFloat(current.children[5].textContent);
    const prevBetCell = prev.children[2];
    const prevBet = parseFloat(prevBetCell.dataset.bet || prevBetCell.textContent);
    const prevWin = parseFloat(prev.children[3].textContent);

    prev.children[4].textContent = curEnd.toFixed(2);
    prev.children[5].textContent = (curEnd - prevBet + prevWin).toFixed(2);
  }

  if (updatedRows.length > 0) {
    const topEndMoney = parseFloat(updatedRows[0].children[5].textContent);
    const setScoreRowTop = tbody.querySelector("tr.set-score-row:not(.jackpot)");
    if (setScoreRowTop) {
      const scoreCell = setScoreRowTop.children[1];
      scoreCell.textContent = `Set score：${(-Math.abs(topEndMoney)).toFixed(2)}`;
    }
  }

  jackpotInsertedMap[currentGame] = true;
  localStorage.setItem("jackpotInsertedMap918kiss", JSON.stringify(jackpotInsertedMap));

  // Re-apply Free game selepas struktur row berubah
  applyFreeGame();
}
function addManualSetScore() {
  const inputScore = parseFloat(document.getElementById("manualScoreInput").value);
  if (isNaN(inputScore)) return showToast("Nilai tidak sah", "error");

  const tbody = document.querySelector("#gameLog tbody");

  const setScoreNegatifRow = Array.from(tbody.querySelectorAll("tr.set-score-row:not(.jackpot)"))
    .find(row => row.children[1].textContent.includes("-"));
  if (!setScoreNegatifRow) return showToast("Baris set score negatif tidak ditemukan!", "error");

  const existingSupportRow = Array.from(tbody.querySelectorAll("tr.set-score-row"))
    .find(row =>
      !row.classList.contains("jackpot") &&
      !row.children[1].textContent.includes("-") &&
      row !== setScoreNegatifRow
    );

  const endMoneyNegatif = parseFloat(setScoreNegatifRow.children[5].textContent);
  const beginMoney = endMoneyNegatif;
  const endMoneyBaru = (beginMoney + inputScore).toFixed(2);
  const setScoreDisplay = inputScore.toFixed(2); // Hanya nilai support, tidak tambah pecahan

  // Waktu baru
  const belowTimeText = setScoreNegatifRow.children[6].textContent.trim();
  const belowDate = new Date(belowTimeText.replace(" ", "T"));
  const randomSeconds = Math.floor(Math.random() * 4) + 4;
  const newTime = new Date(belowDate.getTime() + randomSeconds * 1000);
  const formatted = formatDateTimeLocal(newTime);

  if (existingSupportRow) {
    existingSupportRow.children[1].textContent = `Set score：${setScoreDisplay}`;
    existingSupportRow.children[4].textContent = beginMoney.toFixed(2);
    existingSupportRow.children[5].textContent = endMoneyBaru;
    existingSupportRow.children[6].textContent = formatted;
  } else {
    const newRow = document.createElement("tr");
    newRow.classList.add("set-score-row");
    newRow.innerHTML = `
      <td>-</td>
      <td class="setscore">Set score：${setScoreDisplay}</td>
      <td class="negatif">-</td>
      <td class="negatif">-</td>
      <td>${beginMoney.toFixed(2)}</td>
      <td>${endMoneyBaru}</td>
      <td>${formatted}</td>
    `;
    tbody.insertBefore(newRow, setScoreNegatifRow);
  }

  const allRows = Array.from(tbody.querySelectorAll("tr"));
  if (allRows.length > 11) {
    allRows[allRows.length - 1].remove();
  }

  document.getElementById("manualScoreInput").value = "";

function showToast(message, type = "success", duration = 3500) {
  if (typeof window.NewUI?.showToast === "function") {
    return window.NewUI.showToast(message, type, duration);
  }
  console.warn("[918KISS Toast]", type, message);
}

function recalcBalancesForLogRowsOnly() {
  const tbody = document.querySelector("#gameLog tbody");
  if (!tbody) return;

  const rows = Array.from(tbody.querySelectorAll("tr.log-row"));
  if (!rows.length) return;

  // dari bawah ke atas: Begin row atas ikut End row bawah
  for (let i = rows.length - 1; i >= 0; i--) {
    const row = rows[i];

    const betCell = row.querySelector(".bet-cell");
    const isFree = betCell && betCell.textContent.trim().toLowerCase() === "free game";

    const bet = isFree ? 0 : (parseFloat(betCell?.dataset.bet || betCell?.textContent) || 0);
    const win = parseFloat(row.children[3].textContent) || 0;

    let begin;
    if (i === rows.length - 1) {
      begin = parseFloat(row.children[4].textContent) || 0;
    } else {
      begin = parseFloat(rows[i + 1].children[5].textContent) || 0;
      row.children[4].textContent = begin.toFixed(2);
    }

    const end = begin - bet + win;
    row.children[5].textContent = end.toFixed(2);
  }

  // update Set score negatif ikut EndMoney baris log paling atas
  const setScoreRowTop = tbody.querySelector("tr.set-score-row:not(.jackpot)");
  if (setScoreRowTop && rows.length > 0) {
    const topEndMoney = parseFloat(rows[0].children[5].textContent) || 0;
    setScoreRowTop.children[1].textContent = `Set score：${(-Math.abs(topEndMoney)).toFixed(2)}`;
    setScoreRowTop.children[4].textContent = Math.abs(topEndMoney).toFixed(2);
    setScoreRowTop.children[5].textContent = "0.00";
  }
}

function applyManualScoreAsTopEndMoneyIfOff() {
  if (autoAddScoreOn) return; // AUTO ON = guna cara biasa

  const desired = parseFloat(document.getElementById("manualScore")?.value || "0");
  if (!isFinite(desired)) return;

  const tbody = document.querySelector("#gameLog tbody");
  if (!tbody) return;

  const rows = Array.from(tbody.querySelectorAll("tr.log-row"));
  if (!rows.length) return;

  const topEnd = parseFloat(rows[0].children[5].textContent) || 0;
  const delta = desired - topEnd;

  // shift semua begin/end (randomness masih sama, cuma shift balance)
  for (const r of rows) {
    const b = parseFloat(r.children[4].textContent) || 0;
    const e = parseFloat(r.children[5].textContent) || 0;
    r.children[4].textContent = (b + delta).toFixed(2);
    r.children[5].textContent = (e + delta).toFixed(2);
  }

  // update Set score row ikut top end
  const setScoreRowTop = tbody.querySelector("tr.set-score-row:not(.jackpot)");
if (setScoreRowTop) {
  const newTopEnd = parseFloat(rows[0].children[5].textContent) || 0;
  setScoreRowTop.children[1].textContent =
    `Set score：${(-Math.abs(newTopEnd)).toFixed(2)}`;
  const desired2 = parseFloat(document.getElementById("manualScore")?.value || "0");
  setScoreRowTop.children[4].textContent = (isFinite(desired2) ? desired2 : 0).toFixed(2);
  setScoreRowTop.children[5].textContent = "0.00";
 }
}
function setRandomWin() {
  const amount = parseFloat(document.getElementById("manualWinInput").value);
  if (isNaN(amount) || amount < 0) {
    showToast("This amount not valid!", "error");
    return;
  }

  const tbody = document.querySelector("#gameLog tbody");
  if (!tbody) return;

  const rows = Array.from(tbody.querySelectorAll("tr.log-row"));
  if (rows.length !== 10) {
    showToast("Please click change make new!", "info");
    return;
  }

  // ✅ candidates: semua row (kalau kau nak exclude free game, boleh tambah check kat sini)
  const candidates = rows.map((_, idx) => idx);
  if (!candidates.length) {
    showToast("Rows not availabe!", "info");
    return;
  }

  // ✅ 1) Restore win row lama balik ke asal (contoh 200.00)
  if (lastWinRowIndex >= 0 && rows[lastWinRowIndex]) {
    const prevRow = rows[lastWinRowIndex];
    const prevWinCell = prevRow.querySelector(".win-cell");
    if (prevWinCell) {
      const original = parseFloat(prevWinCell.dataset.originalWin || "0") || 0;
      prevWinCell.textContent = original.toFixed(2);
    } else {
      // fallback kalau win-cell tak jumpa
      prevRow.children[3].textContent = "0.00";
    }
  }

  // ✅ 2) Pick row baru (elak pick sama kalau boleh)
  let pick = candidates[Math.floor(Math.random() * candidates.length)];
  if (candidates.length > 1 && pick === lastWinRowIndex) {
    pick = candidates[(candidates.indexOf(pick) + 1) % candidates.length];
  }

  // ✅ 3) Set win amount di row baru (contoh 1000.00)
  const winCell = rows[pick].querySelector(".win-cell");
  if (winCell) {
    winCell.textContent = amount.toFixed(2);
  } else {
    rows[pick].children[3].textContent = amount.toFixed(2);
  }

  lastWinRowIndex = pick;

  // ✅ 4) Recalc balance
  recalcBalancesForLogRowsOnly();

  // ✅ 5) Save ke localStorage
  setTimeout(() => {
    const saved = localStorage.getItem("gameLogData918kiss");
    if (!saved) return;
    try {
      const data = JSON.parse(saved);
      data.logs = tbody.innerHTML;
      data.lastWinRowIndex = lastWinRowIndex;
      data.manualWinAmount = amount;
      localStorage.setItem("gameLogData918kiss", JSON.stringify(data));
    } catch (e) {}
  }, 50);

  showToast(`Win ${amount.toFixed(2)} Has change other rows`, "success");
}
function copyGameLogImage() {
  const gameLogTable = document.getElementById("gameLog");
  if (!gameLogTable) {
    showToast("Table #gameLog tidak ditemui", "error");
    return;
  }

  gameLogTable.classList.add("screenshot-mode");

  html2canvas(gameLogTable, { scale: 2, useCORS: true }).then(async (canvas) => {
    gameLogTable.classList.remove("screenshot-mode");

    try {
      // Cuba copy PNG terus ke clipboard
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error("Clipboard API tidak tersedia");

      await new Promise((resolve, reject) => {
        canvas.toBlob(async (blob) => {
          if (!blob) return reject(new Error("Gagal buat blob"));
          try {
            await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
            resolve();
          } catch (err) { reject(err); }
        }, "image/png");
      });

      showToast("Image copied to clipboard", "success");
      return;

    } catch (err) {
      // Fallback: hantar base64 ke parent
      const dataURL = canvas.toDataURL("image/png");
      window.parent.postMessage(
        { action: "copy-image-base64", base64: dataURL },
        "https://5g88-main.vercel.app/"
      );
      showToast("Image sent to parent (fallback)", "info");
      // (Opsional) console.error(err);
    }
  });
}

(function () {
  const THEME_KEY = "siteTheme";

  function applyChildTheme(theme) {
    document.body.classList.remove("light-theme", "dark-theme");
    document.body.classList.add(theme === "light" ? "light-theme" : "dark-theme");
  }

  applyChildTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");

  window.addEventListener("message", function (e) {
    const allowedOrigins = [
      "https://5g88-main.vercel.app"
    ];
    if (!allowedOrigins.includes(e.origin)) return;

    const data = e.data || {};
    if (data.type === "theme-change") {
      const theme = data.theme === "dark" ? "dark" : "light";
      localStorage.setItem(THEME_KEY, theme);
      applyChildTheme(theme);
    }
  });
})();

  if (!el) return;

  if (el.disabled || el.getAttribute("aria-disabled") === "true") return;

    el.getAttribute("data-action") ||
    el.getAttribute("title") ||
    el.getAttribute("aria-label") ||

    el.id ||

  name = String(name)
    .replace(/\s+/g, " ")
    .trim();

  if (!name || name.length < 2) return;

  name = name.slice(0, 40);

  sendUserAction(name);
}, true);

/* ================= 918KISS FIREBASE GAME CATALOG ================= */
const MG_PATH='918kiss/games';
let mgRef=null, mgCatalogLoaded=false, mgGameIds={};
function mgToast(msg, type = "success") {
  return showToast(msg, type);
}
function mgNumberList(raw){return [...new Set(String(raw).split(/[,\s\n]+/).map(Number).filter(n=>Number.isFinite(n)&&n>=0))];}

function mgOptions(raw) {
  const text = String(raw).trim();
  if (!text) return [];

  const numbers = text
    .split(/[,\s]+/)
    .map(Number);

  if (numbers.some(n =>
    !Number.isSafeInteger(n) || n < 1
  )) {
    return null;
  }

  return [...new Set(numbers)].sort((a, b) => a - b);
}

function mgElement(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;}
function mgField(label,value='',type='text',hint=''){
 const host=mgElement('div','mg-field'),lbl=mgElement('label','',label),input=mgElement('input');input.type=type;input.value=value;input.setAttribute('data-new-ui-input','');host.append(lbl,input);if(hint)host.append(mgElement('small','',hint));return {host,input};
}
function mgApplyCatalog(snapshot){
 const previous=document.getElementById('gameSelect').value;
 const data=snapshot||{};

for (const key of Object.keys(gameData)) {
  delete gameData[key];
}

mgGameIds = {};

 Object.entries(data).forEach(([id,v])=>{
   if(!v||typeof v.name!=='string'||!Array.isArray(v.bets)||!v.pecahan)return;
   gameData[v.name]={bets:v.bets,pecahan:v.pecahan,freeGameOptions:Array.isArray(v.freeGameOptions)?v.freeGameOptions:[]};
   mgGameIds[v.name]=id;
 });
 const select=document.getElementById('gameSelect');select.replaceChildren(new Option('Select Game',''));
 Object.keys(gameData).sort((a,b)=>a.localeCompare(b)).forEach(name=>select.add(new Option(name,name)));
 const saved=(()=>{try{return JSON.parse(localStorage.getItem('gameLogData918kiss')||'{}')}catch{return {}}})();
 const selected=gameData[previous]?previous:gameData[saved.game]?saved.game:'';
 if(selected){select.value=selected;isRestoringSelection=true;select.dispatchEvent(new Event('change',{bubbles:true}));
 if(saved.game===selected&&saved.bet!==undefined){document.getElementById('betSelect').value=String(saved.bet);document.getElementById('betSelect').dispatchEvent(new Event('change',{bubbles:true}));if(saved.pecahan!==undefined)document.getElementById('pecahanSelect').value=String(saved.pecahan);}
 isRestoringSelection=false;}
 gameCS?.refresh?.();betCS?.refresh?.();winCS?.refresh?.();
 mgCatalogLoaded=true;
}
function mgStart(){
 const create=document.getElementById('mgCreate'),manage=document.getElementById('mgManage');
 create.addEventListener('click',()=>mgEditor());manage.addEventListener('click',mgManager);
 if(!window.firebase?.apps?.length){mgToast('Firebase is not initialized. Check firebase.js','error');return;}
 try{mgRef=firebase.database().ref(MG_PATH);mgRef.on('value',s=>mgApplyCatalog(s.val()),e=>mgToast('Game loading failed: '+e.message,'error'));}
 catch(e){mgToast('Firebase connection error: '+e.message,'error');}
}
function mgEditor(oldName=''){
 if(!mgRef){mgToast('Firebase not ready','error');return;}
 const old=gameData[oldName]||{};
 const form=mgElement('form','mg-modal-form');
 const name=mgField('Game Name',oldName,'text');name.input.required=true;name.input.placeholder='Example: ICELAND';form.append(name.host);
 const free=mgField('Free Game Options',(old.freeGameOptions||[]).join(', '),'text','Example: 5, 10, 20, 50, 100 — maximum 10 Free Game rows.');free.input.placeholder='5, 10';form.append(free.host);
 const hint=mgElement('div','mg-notice','Bet & Win: add one row for each Bet amount. Every Bet has its own Win options.');form.append(hint);
 const rows=mgElement('div','mg-modal-form');form.append(rows);
 function addBet(bet='',wins=''){
   const row=mgElement('div','mg-betrow');const a=mgField('Bet',String(bet),'number');a.input.step='any';a.input.min='0';const b=mgField('Win Options',String(wins),'text');b.input.placeholder='30, 60, 100';const del=mgElement('button','btn-delete-new','Remove');del.type='button';del.onclick=()=>row.remove();row.append(a.host,b.host,del);rows.append(row);
   row._get=()=>({bet:Number(a.input.value),betText:a.input.value.trim(),wins:mgNumberList(b.input.value)});
   window.NewUI?.input?.(a.input);window.NewUI?.input?.(b.input);
 }
 (old.bets||[]).forEach(b=>addBet(b,(old.pecahan?.[String(b)]||[]).join(', ')));
 if(!old.bets?.length)addBet();
 const add=mgElement('button','btn-edit-new','+ Add Bet');add.type='button';add.onclick=()=>addBet();form.append(add);
 const actions=mgElement('div','mg-form-actions'),cancel=mgElement('button','btn-cancel-new','Cancel'),save=mgElement('button','btn-primary-new','Save Game');cancel.type='button';save.type='submit';actions.append(cancel,save);form.append(actions);
 const modal=NewUI.modal.open({title:oldName?'Edit Game':'Create Game',content:form,width:720});cancel.onclick=()=>modal.close();
 form.querySelectorAll('input[data-new-ui-input]').forEach(input=>NewUI.input(input));
 form.addEventListener('submit',async e=>{
 e.preventDefault();const gameName=name.input.value.trim(),freeOptions=mgOptions(free.input.value);
 if(!gameName){mgToast('Enter game name','error');return;}
 
if (freeOptions === null) {
  mgToast(
    "Free Game Options must contain positive whole numbers only!",
    "error"
  );
  return;
}

 if(gameData[gameName]&&gameName!==oldName){mgToast('Game name already exists','error');return;}
 const bets=[],pecahan={};for(const row of rows.children){const {bet,betText,wins}=row._get();if(!betText||!Number.isFinite(bet)||bet<0||!wins.length){mgToast('Enter valid Bet and Win values for every row','error');return;}if(bets.includes(bet)){mgToast('Duplicate Bet: '+bet,'error');return;}bets.push(bet);pecahan[String(bet)]=wins;}
 if(!bets.length){mgToast('Add at least one Bet','error');return;}
// Custom NewUI loading spinner
await NewUI.setButtonLoading(save, true, {
  text: "Saving..."
});

try {
  const id = (oldName && mgGameIds[oldName])
    ? mgGameIds[oldName]
    : mgRef.push().key;

  await mgRef.child(id).set({
    name: gameName,
    bets,
    pecahan,
    freeGameOptions: freeOptions,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });

  // Pastikan spinner sempat kelihatan
  await NewUI.setButtonLoading(save, false, {
    minDuration: 700
  });

  modal.close();
  mgToast("Game saved", "success");

} catch (err) {
  mgToast("Save failed: " + err.message, "error");

} finally {
  await NewUI.setButtonLoading(save, false);
}
 });
}



function mgManager(){
const host = mgElement('div', 'mg-manager');

const names = Object.keys(gameData).sort((a, b) =>

); if(!names.length)window.showEmptyState?.(host,'No games yet','large','center');
 names.forEach(name=>{const item=mgElement('div','mg-item'),title=mgElement('div');title.append(mgElement('strong','',name),mgElement('small','',` • ${gameData[name].bets.length} bets • Free: ${(gameData[name].freeGameOptions||[]).join(', ')||'None'}`));
 const acts=mgElement('div','mg-item-actions'),edit=mgElement('button','btn-edit-new','Edit'),del=mgElement('button','btn-delete-new','Delete');edit.type=del.type='button';edit.onclick=()=>{modal.close();mgEditor(name)};
 
del.disabled = !mgGameIds[name];
del.title = "Delete Game";

 del.onclick=async()=>{if(!mgGameIds[name])return;if(!await NewUI.confirm({target:del,title:'Delete Game',message:`Delete game ${name}?`,confirmText:'Delete'}))return;try{await mgRef.child(mgGameIds[name]).remove();modal.close();mgManager();mgToast('Game deleted')}catch(e){mgToast(e.message,'error')}};
 acts.append(edit,del);item.append(title,acts);host.append(item);});
 const modal=NewUI.modal.open({title:'Manage 918KISS Games',content:host,width:650});
}

/* 918KISS Game Log — show separate No data card when empty */
(function () {
  function refreshEmptyCard() {
    const tableCard = document.getElementById('gameLogCard');
    const emptyCard = document.getElementById('gameLogEmptyCard');
    const emptyHost = document.getElementById('gameLogEmpty');
    const body = document.querySelector('#gameLog tbody');
    if (!tableCard || !emptyCard || !emptyHost || !body) return;
    const hasRows = !!body.querySelector('tr.log-row');
    tableCard.style.display = hasRows ? '' : 'none';
    emptyCard.style.display = hasRows ? 'none' : '';
    if (!hasRows && !emptyHost.dataset.rendered) {
      if (window.showEmptyState) window.showEmptyState(emptyHost, 'No data', 'large', 'center');
      else emptyHost.textContent = 'No data';
      emptyHost.dataset.rendered = '1';
    }
  }
  window.addEventListener('DOMContentLoaded', () => {
    const tbody = document.querySelector('#gameLog tbody');
    if (!tbody) return;
    new MutationObserver(refreshEmptyCard).observe(tbody, { childList:true, subtree:true, characterData:true });
    refreshEmptyCard();
  });
})();
