<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="icon" type="image/svg+xml" href="./logo.svg" />
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RHB BANK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared-ui.css">
  <link rel="stylesheet" href="./admin.css">
<link rel="stylesheet" href="./new-ui.css">
<style>
  :root{
    --bg:#000000;
    --card:#edf1f6;
    --line:#e8edf4;
    --label:rgb(139,148,160);
    --text-rhb:rgb(66,75,87);
    --radius:10px;
    --chip:#e74c5e;           /* warna chip Auto */
    --chip-on:#5bc2e7;

    --page-bg: #000;
    --page-text: rgba(255,255,255,0.85);
    --page-input: #141414;
    --border-input:#424242;
    --page-bg2:#1f1f1f;
    --name:#1668dc;
    --blur:rgba(255,255,255,0.25);

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;

  --bg-color: #111111;
  --text-color: #ffffff;
  --primary-color: #facc15;
  }

  body.light-theme{
    --page-bg: #ffffff;
    --page-text: rgba(0,0,0,0.88);
    --page-input: #ffffff;
    --border-input:#d9d9d9;
    --page-bg2:#ffffff;
    --name:#1668dc;
    --blur:#00000063;

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
  }
  *{box-sizing:border-box}
html,
body {
  margin: 0;
}

body {
  font-family:'Lato',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--page-bg);
  color:var(--page-text);
  padding: 0;
}
/* RHB BANK - FORCE LATO FONT ON PREVIEW ONLY */
#preview,
#preview * {
  font-family: 'Lato', system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif !important;
}
  .wrap{max-width:820px;margin:0 auto;display:grid;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.02)}

  /* ----------- FORM ----------- */
  .form{padding:16px;display:grid;grid-template-columns:repeat(12,1fr);gap:12px 14px;background:#5bc2e7}
  .form h2{grid-column:1/-1;font-size:16px;font-weight:700;color:#0050a1;letter-spacing:.02em;margin:2px 0 6px;text-transform:uppercase}
  .fld{grid-column:span 6;min-width:0}
  .fld.w12{grid-column:1/-1}
  .lbl{display:block;font-size:14px;color:#fff;margin:2px 0 6px}

  .input-row{display:flex;gap:8px;align-items:center}
  .inp,.sel,.btn{height:40px;width: 100%;border:1px solid var(--line);background:#f9fbff;color:#0050a1;border-radius:8px;padding:0 12px;font-size:14px;outline:none}
  .inp{width:100%}
  .mini{height:40px;border-radius:10px;border:1px solid #fff;background:#fff;min-width:54px;padding:0 8px}
  .chip{
    border:none;min-width:58px;height:40px;border-radius:999px;
    color:#0050a1;background:#fff;padding:0 12px;font-weight:700;cursor:pointer
  }
  .chip.on{background:var(--chip-on);border:1px solid #fff;}
  .btn{background:#eef3fb;border-color:#dfe6f2;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(.98)}
  .btn:active{transform:translateY(1px)}
  .btn-reset{background:#eef3fb;border-color:#dfe6f2;font-weight:600;cursor:pointer}
  .btn-reset:hover{filter:brightness(.98)}.btn-reset:active{transform:translateY(1px)}
  .btn-reset{height:40px;border:1px solid var(--line);width: 100%;background:#f9fbff;color:red;border-radius:8px;padding:0 12px;font-size:14px;outline:none}

  /* ----------- PREVIEW ----------- */
  .preview{padding:0;overflow:hidden;  max-width: 648px !important;
  min-width: 0 !important;}
  .row{display:flex;align-items:center;padding:18px;gap:10px;border-bottom:1.5px solid #fff;margin-bottom:15px}
  .preview .row:nth-child(2){border-bottom:none}
  .row:last-child{border-bottom:none}
  .to-label{font-size:12px;color:var(--label);margin-bottom:2px}
  .to-line{font-size:15px;color:var(--text-rhb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{padding:0 8px;color:#253041}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;width:100%}
  .kv .k{font-size:14px;color:var(--label);margin-bottom:3px}
  .kv .v{font-size:16px;color:var(--text-rhb)}

  .blur{filter:blur(5px);opacity:.85;border-radius:6px;padding:0 .15em;display:inline-block}

  @media (max-width:640px){
    .fld{grid-column:1/-1}
    .cols{grid-template-columns:1fr}
    .row{padding:16px 14px}
    .mini{min-width:48px}
  }
  .zoom-wrap{
  transform: scale(1);        /* 120% */
  transform-origin: top center;  /* supaya membesar ke tengah, bukan ke bawah */
  margin-top: 20px;              /* beri ruang sedikit */
}
/* ================= SCROLLBAR GLOBAL ================= */

/* Chrome, Edge, Safari */
::-webkit-scrollbar {
  width: 6px; /* nipis */
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #555;
  border-radius: 10px;
  transition: all 0.25s ease;
}

::-webkit-scrollbar-thumb:hover {
  background: #777;
}

/* Firefox */
html {
  scrollbar-width: thin;
  scrollbar-color: #555 transparent;
}

/* RHB SETTINGS UI ONLY — do not style #preview or receipt children */
html,body{min-height:100%;overflow-y:auto !important;}
body > .wrap{
  width:calc(100% - 24px) !important;max-width:none !important;
  margin:12px !important;padding:0 !important;
  display:flex !important;flex-direction:column !important;
  align-items:flex-start !important;gap:12px !important;
}
#form.card.form{
  width:100% !important;max-width:none !important;
  display:grid !important;
  grid-template-columns:repeat(12,minmax(0,1fr)) !important;
  gap:8px !important;padding:12px !important;
  background:var(--page-input) !important;
  border:1px solid var(--border-input) !important;
  border-radius:12px !important;box-shadow:none !important;
  overflow:visible !important;
}
#form > h2{display:none !important;}
#form > .fld {
  grid-column: span 6 !important;
  min-width: 0 !important;
}
#form > .fld.w12{grid-column:1/-1 !important;}
#form .lbl{color:var(--page-text) !important;font-size:12px !important;}
#form .input-row{display:flex;align-items:center;gap:8px;min-width:0;}
#form .input-row > .new-ui-input-wrap,
#form .input-row > .shared-dropdown{flex:1 1 0;min-width:0;}
#form .input-row > .shared-dropdown:has(#letterSel),
#form .input-row > .shared-dropdown:has(#binSel) {
  flex: 0 0 155px !important;
  width: 100%;
  min-width: 155px !important;
}
#form .shared-dropdown-trigger {
  height: 32px !important;
  box-sizing: border-box !important;
}
#form .shared-dropdown-input {
  height: 100% !important;
  min-height: 0 !important;
  background: transparent !important;
  border: 0 !important;
  color: var(--page-text) !important;
  box-shadow: none !important;
}
#form input[data-new-ui-input]{height:32px;padding: 4px 11px;border-radius:6px;width:100%;color:var(--page-text) !important;background:var(--page-input) !important;border-color:var(--border-input) !important;}
#form .new-ui-input-wrap{min-width:0;}
#form .chip {
  flex: 0 0 auto;
  min-width: 72px;
  height: 32px !important;
  min-height: 32px !important;
  border-radius: 6px;
  background: #444;
  color: #fff;
  border: 1px solid var(--border-input);
  font-weight: 400;
}
#form .chip.on{background:var(--blue);color:white;border-color:var(--blue);}
#form .btn,#form .btn-reset{height:40px;width:auto !important;min-width:140px;flex:0 1 190px;border-radius:6px;font-weight:500;}
#form .btn{background:var(--blue);border:1px solid var(--blue);color:#fff;}
#form .btn-reset{background:transparent;border:1px solid var(--border-input);color:var(--page-text);}
#form > .fld.w12{display:flex !important;gap:10px !important;flex-wrap:wrap;}
@media (max-width: 1150px) {
  #form > .fld {
    grid-column: span 6 !important;
  }
}
  @media(max-width:700px){
  body > .wrap{width:calc(100% - 16px) !important;}
  #form.card.form{padding:12px !important;}
  #form > .fld{grid-column:1/-1 !important;}
  #form .btn,#form .btn-reset{flex:1 1 130px;}
}

/* =========================================
   RHB PREVIEW - RESPONSIVE WIDTH ONLY
   ========================================= */

/* Desktop - maksimum 800px */
body > .wrap > #preview {
  width: 100% !important;
  max-width: 648px !important;
  min-width: 0 !important;
  box-sizing: border-box;
  flex: 0 1 auto !important;
  align-self: flex-start !important;
}

/* Mobile - ikut lebar parent */
@media (max-width: 650px) {
  body > .wrap > #preview {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
  }
}
/* CARD LUAR UNTUK PREVIEW DEMO */
.preview-outer-card {
  width: 100%;
  min-width: 0;
  padding: 12px;
  background: var(--page-input);
  border: 1px solid var(--border-input);
  border-radius: 12px;
  box-sizing: border-box;
  overflow-x: auto;
}
/* ==========================================
   RHB BANK - NO DATA CARD
   ========================================== */

.rhb-empty-card {
  width: 100%;
  min-height: 160px;
  padding: 12px;
  background: var(--page-input);
  border: 1px solid var(--border-input);
  border-radius: 12px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
}

.rhb-empty-card .shared-empty {
  width: 100%;
  min-height: 160px;
}

.rhb-empty-card[hidden] {
  display: none !important;
}

/* ==========================================
   RHB BANK - FINAL 3 COLUMN RESPONSIVE GRID
   ========================================== */

/* Form desktop: 3 kolum */
#form.card.form {
  display: grid !important;
  grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
  gap: 8px !important;
  width: 100% !important;
  overflow: visible !important;
}

/* Baris pertama: Bank, Account, Name */
#form > .rhb-bank-field {
  grid-column: 1 !important;
  grid-row: 2 !important;
}

#form > .rhb-account-field {
  grid-column: 2 !important;
  grid-row: 2 !important;
}

#form > .rhb-name-field {
  grid-column: 3 !important;
  grid-row: 2 !important;
}
/* Baris kedua: Amount, Payment Type, Reference */
#form > .rhb-amount-field {
  grid-column: 1 !important;
  grid-row: 3 !important;
}

#form > .rhb-payment-field {
  grid-column: 2 !important;
  grid-row: 3 !important;
}

#form > .rhb-reference-field {
  grid-column: 3 !important;
  grid-row: 3 !important;
}

/* Semua field full width */
#form > .fld {
  width: 100% !important;
  min-width: 0 !important;
  max-width: 100% !important;
}

/* Baris tombol */
#form > .fld.w12 {
  grid-column: 1 / -1 !important;
  grid-row: 4 !important;
  display: flex !important;
  flex-wrap: wrap !important;
  gap: 10px !important;
}

/* Input bersama toggle */
#form .input-row {
  display: flex !important;
  flex-wrap: nowrap !important;
  align-items: center !important;
  gap: 8px !important;
  width: 100% !important;
  min-width: 0 !important;
}

/* Wrapper input custom */
#form .new-ui-input-wrap {
  min-width: 0 !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
}

/* Input biasa penuh kolum */
#form .rhb-amount-field > .new-ui-input-wrap,
#form .rhb-payment-field > .new-ui-input-wrap,
#form .rhb-reference-field > .new-ui-input-wrap {
  display: flex !important;
  width: 100% !important;
}

/* Input yang bersama toggle */
#form .input-row > .new-ui-input-wrap,
#form .input-row > .shared-dropdown {
  flex: 1 1 0 !important;
  width: auto !important;
  min-width: 0 !important;
  max-width: 100% !important;
}

/* Input sebenar */
#form .new-ui-input-wrap input,
#form input[data-new-ui-input] {
  width: 100% !important;
  min-width: 0 !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
}


/* NAME INPUT - FILL REMAINING SPACE */
#form .rhb-name-field .input-row > .new-ui-input-wrap {
  flex: 1 1 0 !important;
  width: 100% !important;
  min-width: 0 !important;
  max-width: none !important;
}

#form .rhb-name-field #toName {
  display: block !important;
  width: 100% !important;
  min-width: 0 !important;
  max-width: 100% !important;
}

/* Toggle kekalkan saiz */
#form .input-row > .shared-active-switch {
  flex: 0 0 auto !important;
  min-width: 75px !important;
  height: 32px !important;
  display: inline-flex !important;
  align-items: center !important;
}

/* Semua input dan dropdown tinggi 32px */
#form input[data-new-ui-input],
#form .shared-dropdown-trigger {
  height: 32px !important;
  min-height: 32px !important;
  max-height: 32px !important;
}

/* Dropdown trigger */
#form .shared-dropdown-trigger,
#form .shared-dropdown-input {
  width: 100% !important;
  min-width: 0 !important;
  box-sizing: border-box !important;
}

/* Dropdown panel */
#form .shared-dropdown-panel {
  width: 100% !important;
  min-width: 0 !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
}

#form > .fld:has(.shared-dropdown.open) {
  position: relative !important;
  z-index: 100 !important;
}

/* ==========================================
   LAPTOP / ZOOM: 2 KOLOM
   ========================================== */

@media (max-width: 1150px) {
  #form.card.form {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  }

  #form > .rhb-bank-field,
  #form > .rhb-account-field,
  #form > .rhb-name-field,
  #form > .rhb-amount-field,
  #form > .rhb-payment-field,
  #form > .rhb-reference-field {
    grid-column: auto !important;
    grid-row: auto !important;
  }

  #form > .rhb-name-field {
    grid-column: 1 / -1 !important;
  }

  #form > .fld.w12 {
    grid-column: 1 / -1 !important;
    grid-row: auto !important;
  }
}

/* ==========================================
   PHONE: 1 KOLOM
   ========================================== */

@media (max-width: 700px) {
  #form.card.form {
    grid-template-columns: minmax(0, 1fr) !important;
    padding: 12px !important;
  }

  #form > .rhb-bank-field,
  #form > .rhb-account-field,
  #form > .rhb-name-field,
  #form > .rhb-amount-field,
  #form > .rhb-payment-field,
  #form > .rhb-reference-field {
    grid-column: 1 / -1 !important;
    grid-row: auto !important;
  }

  #form .rhb-name-field .input-row {
    flex-wrap: wrap !important;
  }

  #form .rhb-name-field .input-row > .new-ui-input-wrap {
    flex: 1 1 100% !important;
  }

  #form > .fld.w12 {
    grid-column: 1 / -1 !important;
    grid-row: auto !important;
  }
}

/* Phone sangat kecil */
@media (max-width: 380px) {
  #form .rhb-name-field .shared-dropdown:has(#letterSel),
  #form .rhb-name-field .shared-dropdown:has(#binSel) {
    flex: 1 1 80px !important;
    width: auto !important;
    max-width: none !important;
  }
}
/* NAME ROW - FULL WIDTH */
#form .rhb-name-field {
  width: 100% !important;
  min-width: 0 !important;
}

#form .rhb-name-field .input-row {
  display: flex !important;
  width: 100% !important;
  min-width: 0 !important;
  gap: 8px !important;
}


#form .rhb-name-field .shared-active-switch {
  flex: 0 0 auto !important;
}

/* ==========================================
   RHB BANK - NAME DROPDOWN FULL WIDTH FIX
   ========================================== */

/* Besarkan ruang Name pada desktop */
@media (min-width: 1151px) {
  #form.card.form {
    grid-template-columns:
      minmax(0, 1fr)
      minmax(0, 1fr)
      minmax(0, 1.35fr) !important;
  }
}

/* Name row */
#form .rhb-name-field .input-row {
  display: flex !important;
  flex-wrap: nowrap !important;
  align-items: center !important;
  width: 100% !important;
  min-width: 0 !important;
  gap: 8px !important;
}

/* Dua dropdown: cukup ruang untuk Select option */
#form .rhb-name-field .shared-dropdown:has(#letterSel),
#form .rhb-name-field .shared-dropdown:has(#binSel) {
  flex: 0 0 135px !important;
  width: 135px !important;
  min-width: 135px !important;
  max-width: 135px !important;
}

/* Text dan arrow dalam dropdown */
#form .rhb-name-field .shared-dropdown-trigger {
  display: flex !important;
  width: 100% !important;
  min-width: 0 !important;
  height: 32px !important;
}

#form .rhb-name-field .shared-dropdown-input {
  flex: 1 1 auto !important;
  width: 100% !important;
  min-width: 0 !important;
}

/* Toggle kekalkan saiz asal */
#form .rhb-name-field .shared-active-switch {
  flex: 0 0 auto !important;
}

/* Input Name ambil baki ruang */
#form .rhb-name-field .input-row > .new-ui-input-wrap {
  flex: 1 1 0 !important;
  width: auto !important;
  min-width: 0 !important;
  max-width: none !important;
}

#form .rhb-name-field #toName {
  width: 100% !important;
  min-width: 0 !important;
}

/* Dropdown option panel ikut lebar dropdown */
#form .rhb-name-field .shared-dropdown-panel {
  width: 100% !important;
  min-width: 100% !important;
  max-width: 100% !important;
  box-sizing: border-box !important;
}

/* Tablet dan zoom tinggi */
@media (min-width: 701px) and (max-width: 1150px) {
  #form .rhb-name-field .shared-dropdown:has(#letterSel),
  #form .rhb-name-field .shared-dropdown:has(#binSel) {
    flex: 0 0 135px !important;
    width: 135px !important;
    min-width: 135px !important;
    max-width: 135px !important;
  }
}

/* Phone: susun kemas tanpa potong input */
@media (max-width: 700px) {
  #form .rhb-name-field .input-row {
    flex-wrap: wrap !important;
  }

  #form .rhb-name-field .shared-dropdown:has(#letterSel),
  #form .rhb-name-field .shared-dropdown:has(#binSel) {
    flex: 1 1 135px !important;
    width: auto !important;
    min-width: 135px !important;
    max-width: none !important;
  }

  #form .rhb-name-field .input-row > .new-ui-input-wrap {
    flex: 1 1 100% !important;
    width: 100% !important;
  }
}

/* RHB - BANK CATALOG */
#form > .rhb-bank-toolbar {
  grid-column: 1 / -1 !important;
  grid-row: 1 !important;
  display: flex !important;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
  min-width: 0;
}

.rhb-bank-toolbar button {
  width: auto;
  min-height: 32px;
  padding: 0 15px;
}

.rhb-catalog-form {
  display: grid;
  gap: 14px;
  width: 100%;
}

.rhb-catalog-form label {
  display: grid;
  gap: 6px;
  font-size: 12px;
  color: var(--page-text);
  min-width: 0;
}

.rhb-catalog-form input {
  width: 100%;
  min-width: 0;
}

.rhb-catalog-actions {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.rhb-catalog-list {
  display: grid;
  gap: 8px;
  width: 100%;
}

.rhb-catalog-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--border-input);
  border-radius: 8px;
}

.rhb-catalog-info {
  display: grid;
  gap: 5px;
  min-width: 0;
  overflow-wrap: anywhere;
}

.rhb-catalog-info small {
  opacity: .7;
}

.rhb-catalog-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

@media (max-width: 700px) {
  .rhb-catalog-actions button,
  .rhb-catalog-buttons button {
    flex: 1 1 auto;
  }
}

</style>
</head>
<body>

  <div class="wrap">
  <!-- Form -->
  <div class="card form" id="form">
    <h2>RHB BANK</h2>
<div class="rhb-bank-toolbar">
  <button type="button"
    class="btn-primary-new"
    id="rhbCreateBank">
    + Create Bank
  </button>

  <button type="button"
    class="btn-cancel-new"
    id="rhbManageBank">
    Manage Banks
  </button>
</div>

<!-- RHB BANK - RESPONSIVE CUSTOM FORM -->

<!-- BANK -->
<div class="fld rhb-bank-field">
  <label class="lbl">Bank</label>
  <div class="input-row">

<select class="sel"
  id="bankSel"
  data-shared-dropdown
  data-placeholder="Select bank">
  <option value="">Select bank</option>
</select>


    <label class="shared-active-switch">
      <input type="checkbox" id="autoBank"
        data-active-label="Auto ON"
        data-inactive-label="Auto OFF">
      <span class="shared-active-track">
        <span class="shared-active-text"></span>
        <span class="shared-active-knob" aria-hidden="true"></span>
      </span>
    </label>
  </div>
</div>

<!-- ACCOUNT -->
<div class="fld rhb-account-field">
  <label class="lbl">Recipient Account / ID</label>
  <div class="input-row">

<script type="module">
const $ = s => document.querySelector(s);
const el = {
  toName: $('#toName'), toId: $('#toId'), bankSel: $('#bankSel'),
  payType: $('#payType'), amount: $('#amount'), ref: $('#reference'),
  toLine: $('#toLine'), vBank: $('#vBank'), vType: $('#vType'),
  vAmount: $('#vAmount'), vRef: $('#vRef'),
  createBtn: $('#createBtn'), resetBtn: $('#resetBtn'),
  autoName: $('#autoName'), autoBank: $('#autoBank'), autoAcct: $('#autoAcct'),
  letterSel: $('#letterSel'), binSel: $('#binSel')
};

/* ---------- Persist ke localStorage ---------- */
const STORAGE_KEY = 'blurMask.payment.v1';

function readState(){
  return {
    toName: el.toName.value,
    toId: el.toId.value,
    bankSel: el.bankSel.value,
    payType: el.payType.value,
    amount: el.amount.value,
    ref: el.ref.value,
    letterSel: el.letterSel.value,
    binSel: el.binSel.value,
    autoName: el.autoName.checked,
    autoBank: el.autoBank.checked,
    autoAcct: el.autoAcct.checked
  };
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(readState())); }catch{} }
function applyState(s){
  if(!s) return;
  el.toName.value = s.toName ?? el.toName.value;
  el.toId.value   = s.toId ?? el.toId.value;
  el.bankSel.value= s.bankSel ?? el.bankSel.value;
  el.payType.value= s.payType ?? el.payType.value;
  el.amount.value = s.amount ?? el.amount.value;
  el.ref.value    = s.ref ?? el.ref.value;
  el.letterSel.value = s.letterSel ?? el.letterSel.value;
  el.binSel.value    = s.binSel ?? el.binSel.value;

  [['autoName',s.autoName],['autoBank',s.autoBank],['autoAcct',s.autoAcct]].forEach(([k,on])=>{
  el[k].checked = !!on;
  window.SharedActiveSwitch?.sync(el[k]);
});
}
function loadState(){
  try{ applyState(JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null')); }catch{}
}
function resetAll(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(RHB_RECEIPT_VISIBLE_KEY);
  el.toName.value = '';
  el.toId.value   = '0';
  el.bankSel.value = el.bankSel.options[1]?.value || "";
  el.bankSel._sharedDropdown?.refresh();
  el.payType.value= 'Fund Transfer';
  el.amount.value = '0.00';
  el.ref.value    = 'Payment';
  el.letterSel.value = '';
  el.binSel.value    = '';
el.autoName.checked = false;
el.autoBank.checked = false;
el.autoAcct.checked = false;

[el.autoName, el.autoBank, el.autoAcct].forEach(input => {
  window.SharedActiveSwitch?.sync(input);
});
  render();

  updateRhbEmptyState();
}

/* ---------- Helpers ---------- */
function fmtMYR(val){
  let num = Number(String(val).replace(/[^\d.]/g,'')); if(!isFinite(num)) num = 0;
  return 'MYR ' + num.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function maskAccountKeepDashes(str){
  if (!str) return '';
  const raw = String(str), digits = raw.replace(/\D/g,'');
  let seen = 0, out = '';
  for (const ch of raw){
    if (/\d/.test(ch)){
      seen++;
      const isLastTwo = seen > (digits.length - 1);
      out += isLastTwo ? ch : `<span class="blur">${ch}</span>`;
    } else if (ch === '-') {
      out += `<span class="blur">-</span>`;  // blur tanda '-'
    } else {
      out += ch;
    }
  }
  return out;
}
function maskNameFirst2(name){
  if (!name) return '';
  const s = String(name).trim().toUpperCase();
  let shown = s.slice(0,1), masked = '';
  for (const ch of s.slice(1)) masked += (ch===' ')? ' ' : `<span class="blur">${ch}</span>`;
  return shown + masked;
}
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function randWord(min=2,max=7,startLetter=''){
  const len = randomInt(min,max);
  let s = '';
  if (startLetter){ s += startLetter.toUpperCase(); for (let i=1;i<len;i++) s += ABC[randomInt(0,25)];
  } else { for (let i=0;i<len;i++) s += ABC[randomInt(0,25)]; }
  return s;
}
function makeRandomName(){
  const start = el.letterSel.value || '';
  const middle = Math.random()<0.5 ? randWord(2,4) : '';
  const connector = el.binSel.value || (Math.random()<0.5 ? 'BIN' : 'BINTI');
  const first = randWord(3,7,start);
  const last  = randWord(4,7);
  return (first + (middle? ' '+middle:'') + (connector? ' '+connector:'') + ' ' + last).trim();
}

/* Pola akaun per bank – PASTIKAN nilai <option> sama persis dengan key di sini */

function genDigits(n){return Array.from({length:n},()=>String(randomInt(0,9))).join('')}

let RHB_BANK_RECORDS = {};
const RHB_BANK_PATH = "bank_catalog/rhb";

function makeAccountFor(bank) {
  const record = Object.values(RHB_BANK_RECORDS)
    .find(item => item.name === bank && item.active);

  if (!record) return "";

  const groups = record.pattern
    .split("-")
    .map(Number);

  return groups.map(n => genDigits(n)).join("-");
}



/* ---------- Render ---------- */
function render() {

  // Auto pilih bank
  if (el.autoBank.checked) {
    const options = Array.from(el.bankSel.options)
      .map(option => option.value)
      .filter(Boolean);

    if (options.length) {
      el.bankSel.value = pick(options);
      el.bankSel._sharedDropdown?.refresh();
    }
  }

  // Auto generate account
  if (el.autoAcct.checked) {
    el.toId.value = makeAccountFor(el.bankSel.value);
  }

  // Auto generate recipient name
  if (el.autoName.checked) {
    el.toName.value = makeRandomName();
  }

  // Update receipt preview
  const nameFrag = maskNameFirst2(el.toName.value);
  const idFrag = maskAccountKeepDashes(el.toId.value);

  el.toLine.innerHTML =
    `${nameFrag}<span class="dot">•</span>${idFrag}`;

  el.vBank.textContent = el.bankSel.value || "";
  el.vType.textContent = el.payType.value || "";
  el.vAmount.textContent = fmtMYR(el.amount.value);
  el.vRef.textContent = el.ref.value || "";
}

const RHB_RECEIPT_VISIBLE_KEY = "rhb.receipt.visible.v1";

function updateRhbEmptyState() {
  const receiptCard = document.querySelector(
    ".preview-outer-card"
  );

  const emptyCard = document.getElementById(
    "rhbEmptyCard"
  );

  const emptyContent = document.getElementById(
    "rhbEmptyContent"
  );

  if (!receiptCard || !emptyCard || !emptyContent) {
    return;
  }

  const hasReceipt =
    localStorage.getItem(RHB_RECEIPT_VISIBLE_KEY) === "true";

  receiptCard.style.display = hasReceipt ? "" : "none";
  emptyCard.hidden = hasReceipt;

  if (!hasReceipt) {
    if (typeof window.showEmptyState === "function") {
      window.showEmptyState(
        emptyContent,
        "No data",
        "large",
        "center"
      );
    } else {
      emptyContent.textContent = "No data";
    }

}
/* ---------- Listeners ---------- */
// angka -> bersihkan saat blur
el.amount.addEventListener('blur', e=>{
  e.target.value = String(Number(String(e.target.value).replace(/[^\d.]/g,''))||0);
});
// simpan + render saat ada perubahan
['input','change'].forEach(evt=>{
  [el.toName, el.toId, el.payType, el.amount, el.ref, el.bankSel, el.letterSel, el.binSel]
    .forEach(n => n.addEventListener(evt, ()=>{ saveState(); render(); }));
});
// klik chip auto
/* ==========================================
   RHB - CUSTOM AUTO TOGGLE SWITCH
   ========================================== */

[el.autoName, el.autoBank, el.autoAcct].forEach(input => {
  input.addEventListener('change', () => {
    saveState();
    render();
  });
});
// ganti bank → buat no akaun sesuai pola
el.bankSel.addEventListener('change', ()=>{
  el.toId.value = makeAccountFor(el.bankSel.value);
  saveState(); render();
});
// tombol
el.createBtn.addEventListener("click", () => {
  render();
  saveState();

  localStorage.setItem(RHB_RECEIPT_VISIBLE_KEY, "true");

  updateRhbEmptyState();
});
el.resetBtn.addEventListener('click', resetAll);

/* ==========================================
   RHB BANK - CREATE & MANAGE FIREBASE CATALOG
   ========================================== */

const rhbToast = (message, type = "success") => {
  if (typeof window.showToast === "function") {
    window.showToast(message, type);
  } else {
    console.log(message);
  }
};

function rhbBankRef() {
  try {
    if (!window.firebase || !firebase.apps.length) {
      return null;
    }
    return firebase.database().ref(RHB_BANK_PATH);
  } catch (error) {
    console.error(error);
    return null;
  }
}

function rhbEscape(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function rhbNormalizeBank(value) {
  if (!value || typeof value !== "object") return null;

  const name = String(value.name || "").trim();
  const pattern = String(value.pattern || "").trim();

  if (!name || name.length > 100) return null;
  if (!/^\d{1,2}(-\d{1,2})*$/.test(pattern)) return null;

  const groups = pattern.split("-").map(Number);
  const total = groups.reduce((sum, n) => sum + n, 0);

  if (groups.some(n => n < 1 || n > 30) || total > 30) {
    return null;
  }

  return {
    name,
    pattern,
    active: value.active !== false
  };
}

function rhbRefreshBankDropdown() {
  const selected = el.bankSel.value;

  const banks = Object.values(RHB_BANK_RECORDS)
    .filter(bank => bank.active)
    .sort((a, b) => a.name.localeCompare(b.name));

  el.bankSel.replaceChildren(new Option("Select bank", ""));

  for (const bank of banks) {
    el.bankSel.add(new Option(bank.name, bank.name));
  }

  el.bankSel.value = banks.some(b => b.name === selected)
    ? selected
    : (banks[0]?.name || "");

  el.bankSel._sharedDropdown?.refresh();

  saveState();
  render();
}

function rhbLoadBanks() {
  const ref = rhbBankRef();

  if (!ref) {
    rhbToast("Firebase belum tersedia.", "error");
    return;
  }

  ref.on("value", snapshot => {
    const records = {};

    snapshot.forEach(child => {
      const bank = rhbNormalizeBank(child.val());
      if (bank) records[child.key] = bank;
    });

    RHB_BANK_RECORDS = records;
    rhbRefreshBankDropdown();
  }, error => {
    rhbToast("Gagal load banks: " + error.message, "error");
  });
}

function rhbBankFormModal(id = null) {
  if (!window.NewUI?.modal?.open) {
    return rhbToast("Custom modal belum tersedia.", "error");
  }

  const current = id ? RHB_BANK_RECORDS[id] : null;
  const form = document.createElement("form");
  form.className = "rhb-catalog-form";

  form.innerHTML = `
    <label>
      Bank Name
      <input
        name="name"
        data-new-ui-input
        required
        maxlength="100"
        placeholder="Enter bank name"
        value="${rhbEscape(current?.name || "")}">
    </label>

    <label>
      Account Number Pattern
      <input
        name="pattern"
        data-new-ui-input
        required
        placeholder="Example: 4-4-4 or 10"
        value="${rhbEscape(current?.pattern || "")}">
    </label>

    <label>
      Status
      <span class="shared-active-switch">
        <input
          type="checkbox"
          name="active"
          data-active-label="Active"
          data-inactive-label="Inactive"
          ${current?.active === false ? "" : "checked"}>
        <span class="shared-active-track">
          <span class="shared-active-text"></span>
          <span class="shared-active-knob"
            aria-hidden="true"></span>
        </span>
      </span>
    </label>

    <div class="rhb-catalog-actions">
      <button type="button"
        class="btn-cancel-new"
        data-cancel>
        Cancel
      </button>
      <button type="submit"
        class="btn-primary-new"
        data-save>
        ${id ? "Save Changes" : "Create Bank"}
      </button>
    </div>
  `;

  const modal = NewUI.modal.open({
    title: id ? "Edit Bank" : "Create Bank",
    content: form,
    width: 720
  });

  NewUI.init(form);
  NewUI.activeSwitch?.init?.(form);

  form.querySelector("[data-cancel]")
    .addEventListener("click", () => modal.close());

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const value = rhbNormalizeBank({
      name: form.elements.name.value,
      pattern: form.elements.pattern.value,
      active: form.elements.active.checked
    });

    if (!value) {
      return rhbToast(
        "Semak Bank Name dan Account Pattern. Contoh: 4-4-4",
        "warning"
      );
    }

    const duplicate = Object.entries(RHB_BANK_RECORDS)
      .some(([key, bank]) =>
        key !== id &&
        bank.name.toLowerCase() === value.name.toLowerCase()
      );

    if (duplicate) {
      return rhbToast("Bank name sudah wujud.", "warning");
    }

    const ref = rhbBankRef();
    if (!ref) return rhbToast("Firebase belum tersedia.", "error");

    const saveButton = form.querySelector("[data-save]");

    await NewUI.setButtonLoading(saveButton, true, {
      text: id ? "Saving..." : "Creating..."
    });

    let success = false;

    try {
      const target = id ? ref.child(id) : ref.push();

      await target.set({
        ...value,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });

      success = true;
    } catch (error) {
      rhbToast("Gagal save: " + error.message, "error");
    } finally {
      await NewUI.setButtonLoading(saveButton, false, {
        minDuration: 700
      });
    }

    if (success) {
      modal.close();
      rhbToast(
        id ? "Bank updated successfully" : "Bank created successfully"
      );
    }
  });
}

function rhbManageBanksModal() {
  if (!window.NewUI?.modal?.open) {
    return rhbToast("Custom modal belum tersedia.", "error");
  }

  const content = document.createElement("div");

  const list = document.createElement("div");
  list.className = "rhb-catalog-list";

  content.append(list);

  const modal = NewUI.modal.open({
    title: "Manage Banks",
    content,
    width: 720
  });

  function renderList() {
    list.replaceChildren();

    const records = Object.entries(RHB_BANK_RECORDS)
      .sort((a, b) => a[1].name.localeCompare(b[1].name));

    if (!records.length) {
      if (window.showEmptyState) {
        window.showEmptyState(list, "No data", "large", "center");
      } else {
        list.textContent = "No data";
      }
      return;
    }

    for (const [id, bank] of records) {
      const row = document.createElement("div");
      row.className = "rhb-catalog-item";

      const info = document.createElement("div");
      info.className = "rhb-catalog-info";

      const name = document.createElement("strong");
      name.textContent = bank.name;

      const details = document.createElement("small");
      details.textContent =
        `Pattern: ${bank.pattern} · ` +
        (bank.active ? "Active" : "Inactive");

      info.append(name, details);

      const actions = document.createElement("div");
      actions.className = "rhb-catalog-buttons";

      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "btn-edit-new";
      edit.textContent = "Edit";

      edit.addEventListener("click", () => {
        modal.close();
        rhbBankFormModal(id);
      });

      const del = document.createElement("button");
      del.type = "button";
      del.className = "btn-delete-new";
      del.textContent = "Delete";

      del.addEventListener("click", async () => {
        if (!window.NewUI?.confirm) {
          return rhbToast("Custom confirm belum tersedia.", "error");
        }

        const confirmed = await NewUI.confirm({
          target: del,
          title: "Delete Bank",
          message: `Delete ${bank.name}?`,
          confirmText: "Delete",
          danger: true
        });

        if (!confirmed) return;

        const ref = rhbBankRef();
        if (!ref) return rhbToast("Firebase belum tersedia.", "error");

        del.disabled = true;

        try {
          await ref.child(id).remove();
          delete RHB_BANK_RECORDS[id];
          renderList();
          rhbToast("Bank deleted successfully");
        } catch (error) {
          rhbToast("Gagal delete: " + error.message, "error");
          del.disabled = false;
        }
      });

      actions.append(edit, del);
      row.append(info, actions);
      list.append(row);
    }
  }

  const ref = rhbBankRef();

  if (ref) {
    ref.once("value").then(snapshot => {
      const records = {};

      snapshot.forEach(child => {
        const bank = rhbNormalizeBank(child.val());
        if (bank) records[child.key] = bank;
      });

      RHB_BANK_RECORDS = records;
      renderList();
    }).catch(error => {
      rhbToast(error.message, "error");
    });
  } else {
    renderList();
  }
}

/* =========================
   AUTO TRACK CLICK - COUNT SEMUA CLICK
========================= */
document.addEventListener("click", function(e) {
  const el = e.target.closest("button, [onclick], a, .btn, [data-action]");
  if (!el) return;

  if (el.disabled || el.getAttribute("aria-disabled") === "true") return;

  let name =
    el.getAttribute("data-action") ||
    el.getAttribute("title") ||
    el.getAttribute("aria-label") ||
    el.innerText ||
    el.textContent ||
    el.id ||
    "";

  name = String(name)
    .replace(/\s+/g, " ")
    .trim();

  if (!name || name.length < 2) return;

  name = name.slice(0, 40);

  sendUserAction(name);
}, true);
/* =========================
   AUTO TRACK CTRL + C / COPY IMAGE
========================= */
document.addEventListener("keydown", function(e) {
  const key = String(e.key || "").toLowerCase();

  if ((e.ctrlKey || e.metaKey) && key === "c") {
    sendUserAction("COPY IMAGE", {
      method: "keyboard",
      shortcut: "Ctrl+C"
    });
  }
}, true);
/* =========================
   AUTO TRACK BROWSER COPY EVENT
========================= */
document.addEventListener("copy", function() {
  sendUserAction("COPY IMAGE", {
    method: "copy-event"
  });
}, true);
</script>
</body>
