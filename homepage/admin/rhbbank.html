<!DOCTYPE html>
<html lang="en">
<head>
    <style>
  html.fiveg88-hard-reload,
  html.fiveg88-hard-reload body {
    background: #ffffff !important;
  }

  html.fiveg88-hard-reload body {
    visibility: hidden !important;
  }

  html.fiveg88-hard-reload::after {
    content: "";
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 2147483647;
    pointer-events: auto;
  }
</style>

<script>
(function () {
  const KEY = "5g88.hardReloadIntent";

  // Detect Ctrl + Shift + R atau Ctrl + F5
  window.addEventListener("keydown", function (event) {
    const hardReload =
      (event.ctrlKey &&
       event.shiftKey &&
       event.key.toLowerCase() === "r") ||
      (event.ctrlKey && event.key === "F5");

    if (hardReload) {
      sessionStorage.setItem(KEY, String(Date.now()));
    }
  }, true);

  // Semak sama ada reload datang daripada shortcut tadi
  const saved = Number(sessionStorage.getItem(KEY));
  sessionStorage.removeItem(KEY);

  const navigation =
    performance.getEntriesByType("navigation")[0];

  const recentHardReload =
    navigation?.type === "reload" &&
    Number.isFinite(saved) &&
    saved > 0 &&
    Date.now() - saved < 10000;

  if (recentHardReload) {
    document.documentElement.classList.add(
      "fiveg88-hard-reload"
    );
  }
})();
</script>

<script type="module">
const $ = s => document.querySelector(s);
const el = {
  toName: $('#toName'), toId: $('#toId'), bankSel: $('#bankSel'),
  payType: $('#payType'), amount: $('#amount'), ref: $('#reference'),
  toLine: $('#toLine'), vBank: $('#vBank'), vType: $('#vType'),
  vAmount: $('#vAmount'), vRef: $('#vRef'),
  createBtn: $('#createBtn'), resetBtn: $('#resetBtn'),
  autoName: $('#autoName'), autoBank: $('#autoBank'), autoAcct: $('#autoAcct'),
  letterSel: $('#letterSel'), binSel: $('#binSel')
};

/* ---------- Persist ke localStorage ---------- */
const STORAGE_KEY = 'blurMask.payment.v1';

function readState(){
  return {
    toName: el.toName.value,
    toId: el.toId.value,
    bankSel: el.bankSel.value,
    payType: el.payType.value,
    amount: el.amount.value,
    ref: el.ref.value,
    letterSel: el.letterSel.value,
    binSel: el.binSel.value,
    autoName: el.autoName.checked,
    autoBank: el.autoBank.checked,
    autoAcct: el.autoAcct.checked
  };
}
let rhbRestoring = true;

function saveState() {
  if (rhbRestoring) return;

  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(readState())
    );
  } catch (error) {
    console.warn("RHB save failed:", error);
  }
}
function applyState(s){
  if(!s) return;
  el.toName.value = s.toName ?? el.toName.value;
  el.toId.value   = s.toId ?? el.toId.value;
  el.bankSel.value= s.bankSel ?? el.bankSel.value;
  el.payType.value= s.payType ?? el.payType.value;
  el.amount.value = s.amount ?? el.amount.value;
  el.ref.value    = s.ref ?? el.ref.value;
  el.letterSel.value = s.letterSel ?? el.letterSel.value;
  el.binSel.value    = s.binSel ?? el.binSel.value;

  [['autoName',s.autoName],['autoBank',s.autoBank],['autoAcct',s.autoAcct]].forEach(([k,on])=>{
  el[k].checked = !!on;
  window.SharedActiveSwitch?.sync(el[k]);
});
}

function loadState() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "null"
    );

    if (!saved) return;

    applyState(saved);

    [
      el.bankSel,
      el.letterSel,
      el.binSel
    ].forEach(select => {
      select?._sharedDropdown?.refresh?.();
    });

  } catch (error) {
    console.warn("RHB restore failed:", error);
  }
}

function resetAll(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(RHB_RECEIPT_VISIBLE_KEY);
  el.toName.value = '';
  el.toId.value   = '0';
  el.bankSel.value = "";
  el.payType.value= 'Fund Transfer';
  el.amount.value = '0.00';
  el.ref.value    = 'Payment';
  el.letterSel.value = '';
  el.binSel.value    = '';
    [
  el.bankSel,
  el.letterSel,
  el.binSel].forEach(select => {
  select?._sharedDropdown?.refresh?.();
});
el.autoName.checked = false;
el.autoBank.checked = false;
el.autoAcct.checked = false;

[el.autoName, el.autoBank, el.autoAcct].forEach(input => {
  window.SharedActiveSwitch?.sync(input);
});
  render();

  updateRhbEmptyState();
}

/* ---------- Helpers ---------- */
function fmtMYR(val){
  let num = Number(String(val).replace(/[^\d.]/g,'')); if(!isFinite(num)) num = 0;
  return 'MYR ' + num.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function maskAccountKeepDashes(str){
  if (!str) return '';
  const raw = String(str), digits = raw.replace(/\D/g,'');
  let seen = 0, out = '';
  for (const ch of raw){
    if (/\d/.test(ch)){
      seen++;
      const isLastTwo = seen > (digits.length - 1);
      out += isLastTwo ? ch : `<span class="blur">${ch}</span>`;
    } else if (ch === '-') {
      out += `<span class="blur">-</span>`;  // blur tanda '-'
    } else {
      out += ch;
    }
  }
  return out;
}
function maskNameFirst2(name){
  if (!name) return '';
  const s = String(name).trim().toUpperCase();
  let shown = s.slice(0,1), masked = '';
  for (const ch of s.slice(1)) masked += (ch===' ')? ' ' : `<span class="blur">${ch}</span>`;
  return shown + masked;
}
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function randWord(min=2,max=7,startLetter=''){
  const len = randomInt(min,max);
  let s = '';
  if (startLetter){ s += startLetter.toUpperCase(); for (let i=1;i<len;i++) s += ABC[randomInt(0,25)];
  } else { for (let i=0;i<len;i++) s += ABC[randomInt(0,25)]; }
  return s;
}
function makeRandomName(){
  const start = el.letterSel.value || '';
  const middle = Math.random()<0.5 ? randWord(2,4) : '';
  const connector = el.binSel.value || (Math.random()<0.5 ? 'BIN' : 'BINTI');
  const first = randWord(3,7,start);
  const last  = randWord(4,7);
  return (first + (middle? ' '+middle:'') + (connector? ' '+connector:'') + ' ' + last).trim();
}

/* Pola akaun per bank – PASTIKAN nilai <option> sama persis dengan key di sini */

function genDigits(n){return Array.from({length:n},()=>String(randomInt(0,9))).join('')}

let RHB_BANK_RECORDS = {};
const RHB_BANK_PATH = "bank_catalog/rhb";

const RHB_API_BASE =
  "https://fiveg88-admin-backend-v2.onrender.com";

let rhbAccess = {
  role: "",
  actions: []
};

let rhbBankLoaded = false;

function rhbCan(action) {
  return rhbAccess.role === "superadmin" ||
    rhbAccess.actions.includes(action);
}

function rhbUpdateBankButtons() {
  const create = document.getElementById("rhbCreateBank");
  const manage = document.getElementById("rhbManageBank");

  if (create) {
    create.hidden = !rhbCan("create");
  }

  if (manage) {
    manage.hidden = !(
      rhbCan("create") ||
      rhbCan("edit") ||
      rhbCan("delete")
    );
  }
}
function rhbWaitForAuth() {
  return new Promise((resolve, reject) => {
    const unsubscribe = firebase.auth()
      .onAuthStateChanged(user => {
        unsubscribe?.();

        if (!user || user.isAnonymous) {
          reject(new Error("Please login again"));
        } else {
          resolve(user);
        }
      }, reject);
  });
}

async function rhbApi(path, options = {}) {
  const user = await rhbWaitForAuth();
  const token = await user.getIdToken();

  const response = await fetch(RHB_API_BASE + path, {
    method: options.method || "GET",
    headers: {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json"
    },
    body: options.body === undefined
      ? undefined
      : JSON.stringify(options.body)
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok || data.ok === false) {
    throw new Error(
      data.message || `API error ${response.status}`
    );
  }

  return data;
}

async function rhbLoadAccess() {
  const data = await rhbApi("/api/rhb/access");

  rhbAccess = {
    role: data.role || "",
    actions: Array.isArray(data.actions)
      ? data.actions
      : []
  };

  rhbUpdateBankButtons();
}

// ===== RHB BANK - SITE PRELOAD =====
let rhbSites = [];
let rhbSitesLoaded = false;
let rhbSitesPromise = null;
let rhbSitesVersion = 0;

async function rhbLoadSites() {
  const version = rhbSitesVersion;
  const data = await rhbApi("/api/rhb/sites");

  if (version !== rhbSitesVersion) {
    throw new Error("Site session changed");
  }

  rhbSites = Array.isArray(data.sites)
    ? data.sites
    : [];

  rhbSitesLoaded = true;
  return rhbSites;
}

function rhbEnsureSites() {
  if (rhbSitesLoaded) {
    return Promise.resolve(rhbSites);
  }

  if (!rhbSitesPromise) {
    const request = rhbLoadSites();
    rhbSitesPromise = request;

    request.finally(() => {
      if (rhbSitesPromise === request) {
        rhbSitesPromise = null;
      }
    }).catch(() => {});
  }

  return rhbSitesPromise;
}
function makeAccountFor(bank) {
  const record = Object.values(RHB_BANK_RECORDS)
    .find(item => item.name === bank && item.active);

  if (!record) return "";

  const groups = record.pattern
    .split("-")
    .map(Number);

  return groups.map(n => genDigits(n)).join("-");
}



/* ---------- Render ---------- */
function render() {

  // Update receipt preview
  const nameFrag = maskNameFirst2(el.toName.value);
  const idFrag = maskAccountKeepDashes(el.toId.value);

  // Update receipt preview
  el.toLine.innerHTML =
    `${nameFrag}<span class="dot">•</span>${idFrag}`;

  el.vBank.textContent = el.bankSel.value || "";
  el.vType.textContent = el.payType.value || "";
  el.vAmount.textContent = fmtMYR(el.amount.value);
  el.vRef.textContent = el.ref.value || "";
}

/* ==========================================
   RHB BANK - EMPTY STATE CONTROLLER
   ========================================== */

const RHB_RECEIPT_VISIBLE_KEY = "rhb.receipt.visible.v1";

function updateRhbEmptyState() {
  const receiptCard = document.querySelector(
    ".preview-outer-card"
  );

  const emptyCard = document.getElementById(
    "rhbEmptyCard"
  );

  const emptyContent = document.getElementById(
    "rhbEmptyContent"
  );

  if (!receiptCard || !emptyCard || !emptyContent) {

const rhbToast = (message, type = "success") => {
  if (typeof window.showToast === "function") {
    window.showToast(message, type);

function rhbEscape(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function rhbNormalizeBank(value) {
  if (!value || typeof value !== "object") return null;

  const name = String(value.name || "").trim();
  const pattern = String(value.pattern || "").trim();

  if (!name || name.length > 100) return null;
  if (!/^\d{1,2}(-\d{1,2})*$/.test(pattern)) return null;

  const groups = pattern.split("-").map(Number);
  const total = groups.reduce((sum, n) => sum + n, 0);

  if (groups.some(n => n < 1 || n > 30) || total > 30) {
    return null;
  }

  return {
    name,
    pattern,
    active: value.active !== false
  };
}


function rhbRefreshBankDropdown() {
  let saved = {};

  try {
    saved = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "{}"
    ) || {};
  } catch (error) {
    console.warn("RHB saved state error:", error);
  }

  const wantedBank = el.bankSel.value || saved.bankSel || "";

  const banks = Object.values(RHB_BANK_RECORDS)
    .filter(bank => bank.active)
    .sort((a, b) => a.name.localeCompare(b.name));

  el.bankSel.replaceChildren(
    new Option("Select bank", "")
  );

  for (const bank of banks) {
    el.bankSel.add(new Option(bank.name, bank.name));
  }

  const matched = banks.find(
    bank => bank.name === wantedBank
  );

 el.bankSel.value = matched ? matched.name : "";

  el.bankSel._sharedDropdown?.refresh?.();

  render();
}


async function rhbLoadBanks() {
  rhbBankLoaded = false;

  try {
    await rhbLoadAccess();

    const data = await rhbApi("/api/rhb/banks");
    const records = {};

    for (const bank of data.banks || []) {
      const normalized = rhbNormalizeBank(bank);

      if (!normalized || !bank.id) continue;

      records[bank.id] = {
        ...normalized,
        id: bank.id,
        visibleToAllSites:
          bank.visibleToAllSites === true,
        siteVisibility: bank.siteVisibility || {},
        canManage: bank.canManage === true,
        canDelete: bank.canDelete === true
      };
    }

    RHB_BANK_RECORDS = records;
    rhbBankLoaded = true;
    rhbRefreshBankDropdown();

  } catch (error) {
    console.error("RHB bank load failed:", error);

    RHB_BANK_RECORDS = {};
    rhbBankLoaded = false;
    rhbAccess = { role: "", actions: [] };

    rhbUpdateBankButtons();
    rhbRefreshBankDropdown();

    rhbToast(error.message, "error");
  }
}
