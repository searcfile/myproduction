<script>
  (function () {
    const isFloating =  
      new URLSearchParams(location.search)
        .get("floating") === "1";

    if (isFloating) {
      document.documentElement.classList.add(
        "asf-embed-mode"
      );
    }
  })();
</script>

    <style>
  html.fiveg88-hard-reload,
  html.fiveg88-hard-reload body {
    background: #ffffff !important;
  }

  html.fiveg88-hard-reload body {
    visibility: hidden !important;
  }

  html.fiveg88-hard-reload::after {
    content: "";
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 2147483647;
    pointer-events: auto;
  }
</style>

<script>
(function () {
  const KEY = "5g88.hardReloadIntent";
  // Detect Ctrl + Shift + R atau Ctrl + F5
  window.addEventListener("keydown", function (event) {
    const hardReload =
      (event.ctrlKey &&
       event.shiftKey &&
       event.key.toLowerCase() === "r") ||
      (event.ctrlKey && event.key === "F5");

    if (hardReload) {
      sessionStorage.setItem(KEY, String(Date.now()));
    }
  }, true);

  // Semak sama ada reload datang daripada shortcut tadi
  const saved = Number(sessionStorage.getItem(KEY));
  sessionStorage.removeItem(KEY);

  const navigation =
    performance.getEntriesByType("navigation")[0];

  const recentHardReload =
    navigation?.type === "reload" &&
    Number.isFinite(saved) &&
    saved > 0 &&
    Date.now() - saved < 10000;

  if (recentHardReload) {
    document.documentElement.classList.add(
      "fiveg88-hard-reload"
    );
  }
})();
</script>

/* =========================================================
   5G88 ADMIN LIVECHAT | Modern responsive UI upgrade
   UI-only overrides; original Firebase/Cloudinary/chat logic retained
   ========================================================= */
/* AGENT SUPPORT — DARK THEME AS DEFAULT */
:root {
  color-scheme: dark;
  --lc-bg: #090f1b;
  --lc-panel: #111c2e;
  --lc-elevated: #16243a;
  --lc-border: #273850;
  --lc-ink: #eef4ff;
  --lc-muted: #96a9c3;
  --lc-blue: #4c94ff;
  --lc-blue-soft: #1b3455;
  --lc-hover: #1a2b43;
  --lc-shadow: 0 8px 28px rgba(0,0,0,.17);
}

/* LIGHT THEME — HANYA APABILA DIPILIH */
body.light-theme {
  color-scheme: light;
  --lc-bg: #f3f6fb;
  --lc-panel: #fff;
  --lc-elevated: #f8faff;
  --lc-border: #e3e9f3;
  --lc-ink: #17243b;
  --lc-muted: #75849a;
  --lc-blue: #246be8;
  --lc-blue-soft: #eaf2ff;
  --lc-hover: #f0f5fc;
  --lc-shadow: 0 8px 28px rgba(24,49,88,.06);
}
html,body { width:100%;height:100%;margin:0;overflow:hidden; }
body { background:var(--lc-bg)!important;color:var(--lc-ink)!important;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif!important; }
*,*::before,*::after {box-sizing:border-box;}
.livechat-layout {height:100vh!important;height:100dvh!important;width:100%!important;display:grid!important;padding: 0 12px 0 12px;grid-template-columns: minmax(270px,340px) minmax(0,1fr)!important;gap:0!important;background:var(--tx-bg)!important;overflow:hidden!important;}
.user-list-panel {height:100%!important;min-height:0!important;background:var(--lc-panel)!important;border-right:1px solid var(--lc-border)!important;border-radius: 16px 0 0 0;}
.user-list-header {background:var(--lc-panel)!important;border-bottom:1px solid var(--lc-border)!important;padding:20px 16px 16px!important;position:relative!important;}
.user-list-header::before {content:'Conversations';display:block;font-weight:750;font-size:19px;letter-spacing:-.5px;color:var(--lc-ink);margin-bottom:14px;}
#searchUser {height:42px!important;border-radius:11px!important;border:1px solid var(--lc-border)!important;background:var(--lc-elevated)!important;color:var(--lc-ink)!important;padding:0 14px!important;font-size:13px!important;}
#searchUser::placeholder,#searchMessage::placeholder,#msg::placeholder {color:var(--lc-muted)!important;opacity:1;}
#searchUser:focus,#searchMessage:focus {border-color:var(--lc-blue)!important;box-shadow:0 0 0 3px rgba(56,123,241,.13)!important;}
.top-filter-row {gap:7px!important;margin-top:13px!important;}
#filterAll,#filterUnread,#filterOnline {height:32px!important;padding:0 12px!important;border-radius:9px!important;border:1px solid var(--lc-border)!important;background:var(--lc-elevated)!important;color:var(--lc-muted)!important;font-weight:600;font-size:12px;}
#filterAll.active-filter,#filterUnread.active-filter,#filterOnline.active-filter {background:var(--lc-blue-soft)!important;color:var(--lc-blue)!important;border-color:var(--lc-blue)!important;}
.user-stats {width:100%;margin:7px 0 0!important;color:var(--lc-muted)!important;font-size:12px!important;}
.user-scroll-box {min-height:0!important;padding:10px!important;background:var(--lc-panel)!important;scrollbar-color:var(--lc-border) transparent!important;}
.user-item {border:1px solid transparent!important;border-radius:12px!important;background:transparent!important;padding:12px!important;margin:3px 0!important;color:var(--lc-ink)!important;transition:background .18s,border-color .18s!important;}
.user-item:hover {background:var(--lc-hover)!important;border-color:var(--lc-border)!important;}
.user-top-left .label-text {font-weight:500;color:var(--lc-ink)!important;font-size:14px;}
.user-top-date,.user-top-clock,.datetime-list,.user-email-line,.offline-text {color:var(--lc-muted)!important;}
.online-text,.typing-text,.status-main,.status-typing {color:#16bc91!important;}
.unread-badge {background:#f05266!important;box-shadow:none!important;}
.chat-detail-panel {height:100%!important;min-height:0!important;background:var(--lc-bg)!important;}
.chat-detail-wrap {height:100%!important;min-height:0!important;}
#containerChatBox {height:100%!important;min-height:0!important;max-width:none!important;border:1px solid var(--lc-border)!important;border-radius:16px!important;background:var(--lc-panel)!important;box-shadow:var(--lc-shadow)!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;}
#chatHeader {min-height:76px!important;flex:0 0 auto!important;background:var(--lc-panel)!important;border-bottom:1px solid var(--lc-border)!important;padding:13px 20px!important;color:var(--lc-ink)!important;}
#chatUserName {color:var(--lc-ink)!important;font-weight:750!important;font-size:15px!important;}
#chatUserStatus {color:var(--lc-muted)!important;line-height:1.4!important;}

#searchMessage {height:39px!important;min-width:0!important;width:clamp(145px,22vw,250px)!important;border-radius:10px!important;border:1px solid var(--lc-border)!important;background-color:var(--lc-elevated)!important;color:var(--lc-ink)!important;font-size:12px!important;}
.open-user-main-btn {color:var(--lc-blue)!important;background:var(--lc-blue-soft)!important;border-radius:8px!important;height:30px!important;padding:0 10px!important;}

.close-chat-btn:hover {background:var(--lc-hover)!important;color:var(--lc-ink)!important;}
.chat-box {flex:1 1 auto!important;min-height:0!important;height:auto!important;overflow-y:auto!important;overflow-x:hidden!important;background:var(--lc-elevated)!important;padding:22px!important;color:var(--lc-ink)!important;scrollbar-color:var(--lc-border) transparent!important;}
.message {margin:7px 0!important;}

.chat-empty-inner::before {content:'✉';display:flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:20px;background:var(--lc-blue-soft);color:var(--lc-blue);font-size:30px;margin:0 auto 16px;}
/* Stable composer: previews always occupy first row; action buttons never disappear */
.send-box {display:grid!important;grid-template-columns:36px minmax(0,1fr) auto!important;grid-template-rows:auto!important;align-items:end!important;gap:8px 10px!important;flex:0 0 auto!important;min-width:0!important;width:100%!important;max-height:min(38dvh,300px)!important;overflow-y:auto!important;overflow-x:hidden!important;padding:12px 17px!important;margin:0!important;border:0!important;border-top:1px solid var(--lc-border)!important;border-radius:0!important;background:var(--lc-panel)!important;box-shadow:none!important;}
.send-box .image-preview-wrap:not([hidden]) {grid-column:1/-1!important;grid-row:auto!important;display:flex!important;flex:initial!important;width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;max-height:180px!important;overflow:auto!important;padding:4px 0 8px!important;}
.image-preview-wrap[hidden],.image-upload-status[hidden] {display:none!important;}
.send-box .attach-btn {grid-column:1!important;display:flex!important;align-self:center!important;width:36px!important;height:36px!important;min-width:0!important;border-radius:10px!important;justify-content:center!important;align-items:center!important;background:var(--lc-elevated)!important;color:var(--lc-muted)!important;cursor:pointer;}
.send-box #msg {grid-column:2!important;align-self:center!important;width:100%!important;min-width:0!important;min-height:38px!important;max-height:100px!important;padding:10px 4px!important;background:transparent!important;color:var(--lc-ink)!important;font-size:13px!important;box-shadow:none!important;}
.send-box .send-actions {grid-column:3!important;display:flex!important;align-items:center!important;gap:6px!important;min-width:max-content!important;margin:0!important;}

/* 5G88 FIX: composer is a fixed-height grid row, never a scroll container.

  height:var(--lc-viewport-height,100dvh) !important;

}

  height:100% !important;

  max-height:100% !important;

  overflow-x:hidden !important;

.activity-history-dropdown {

  border: 1px solid #303030 !important;

}

.activity-history-heading {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 600;
  border-bottom: 1px solid #353535;
}

.activity-history-heading svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.activity-history-list {
  max-height: 340px;
  overflow-y: auto;
  padding: 14px 12px 8px;
  scrollbar-width: thin;
  scrollbar-color: #555 transparent;
}

/* Garis timeline kiri */
.activity-history-item {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-left: 5px;
  padding: 0 0 20px 20px;
  border: none !important;
  border-left: 1px solid #404040 !important;
  border-radius: 0 !important;
  background: transparent !important;
  min-height: 65px;
}

/* Bulatan hijau */
.activity-history-item::before {
  content: "";
  position: absolute;
  left: -5px;
  top: 3px;
  width: 9px;
  height: 9px;
  border: 1px solid #22c55e;
  border-radius: 50%;
  background: #1f1f1f;
}

/* Offline / keluar tab */
.activity-history-item.activity-history-offline::before {
  border-color: #777 !important;
  background: #1f1f1f !important;
}

.activity-history-item.activity-history-offline
.activity-history-tag {
  background: #303030 !important;
  color: #b5b5b5 !important;
}

/* Enter / aktiviti aktif */
.activity-history-item:not(.activity-history-offline)::before {
  border-color: #22c55e !important;
}

/* Aktiviti terakhir tiada garis panjang */
.activity-history-item:last-child {
  border-left-color: transparent !important;
  padding-bottom: 4px;
}

.activity-history-item strong {
  color: #e5e5e5;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
}

.activity-history-item small {
  color: #929292;
  font-size: 10px;
  line-height: 1.5;
}

/* Label jenis aktiviti */
.activity-history-tag {
  display: inline-flex;
  align-self: flex-start;
  padding: 3px 7px;
  border-radius: 4px;
  background: #18351f;
  color: #4ade80;
  font-size: 10px;
  line-height: 1.2;
}

.activity-history-item:hover {
  background: transparent !important;
}

/* ===== 5G88 MERGED INBOX ===== */
let mergedChatListeners = [];

function getInboxEmail(sid, userData = {}) {
  const raw = String(
    userData.email ||
    chatMeta[sid]?.identity?.email ||
    desanitizeUserId(sid) ||
    ""
  ).trim().toLowerCase();

  // Gabungkan berdasarkan email, bukan nama.
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)
    ? raw
    : "";
}

function getMemberIdsForSid(sid) {
  const row = allUsersData.find(([key]) => key === sid);
  const email = row ? getInboxEmail(sid, row[1]) : "";

  if (!email) return [sid];

  return allUsersData
    .filter(([key, data]) => getInboxEmail(key, data) === email)
    .map(([key]) => key);
}

function isSelectedMember(sid) {

}

function detachMergedChatListeners() {
  mergedChatListeners.forEach(({ ref, handler }) => {
    ref.off("value", handler);
  });

  mergedChatListeners = [];

  if (activeChatRef && activeChatValueHandler) {
    activeChatRef.off("value", activeChatValueHandler);
  }

  activeChatRef = null;
  activeChatValueHandler = null;
  ++selectedChatGeneration;
}
// Pilih destinasi utama untuk membalas user.
// Admin login menggunakan chats/admin_<firebaseUid>.
// Channel lama tetap boleh dibaca oleh Merged Inbox.

function resolveAgentReplySid(memberIds = []) {
  const ids = [...new Set(memberIds)].filter(Boolean);

  if (!ids.length) return null;

  const getData = sid =>
    allUsersData.find(([id]) => id === sid)?.[1] || {};

  ids.sort((a, b) => {
    const adminA = a.startsWith("admin_") ? 1 : 0;
    const adminB = b.startsWith("admin_") ? 1 : 0;

    // Paling penting: pilih channel admin UID dahulu.
    if (adminA !== adminB) return adminB - adminA;

    const dataA = getData(a);
    const dataB = getData(b);

    const onlineA = dataA.online === true ? 1 : 0;
    const onlineB = dataB.online === true ? 1 : 0;

    if (onlineA !== onlineB) return onlineB - onlineA;

    const timeA = Math.max(
      Number(dataA.pageLoginTime || 0),
      Number(dataA.lastLoginAt || 0)
    );

    const timeB = Math.max(
      Number(dataB.pageLoginTime || 0),
      Number(dataB.lastLoginAt || 0)
    );

    return timeB - timeA;
  });

  return ids[0];
}
function buildMergedInboxRows() {
  const groups = new Map();

  for (const [sid, data, activity] of allUsersData) {
    const email = getInboxEmail(sid, data);
    const key = email ? `email:${email}` : `sid:${sid}`;

    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push([sid, data || {}, activity || 0]);
  }

  return [...groups.values()].map(rows => {
    const preferred = [...rows].sort((a, b) =>
      Number(b[0].startsWith("admin_")) -
      Number(a[0].startsWith("admin_")) ||
      (b[2] || 0) - (a[2] || 0)
    )[0];

    const [sid, data] = preferred;
    const members = rows.map(row => row[0]);

    const unread = rows.reduce((sum, [, d]) =>
      sum + Math.max(
        Number(d.unreadCountForAdmin || 0),
        d.unreadForAdmin ? 1 : 0
      ), 0
    );

    const activity = Math.max(
      ...rows.map(row => Number(row[2]) || 0)
    );

    const mostRecent = [...rows].sort(
      (a, b) => (b[2] || 0) - (a[2] || 0)
    )[0];

    const mergedData = {
      ...data,
      name: data.name || mostRecent[1].name,
      email: getInboxEmail(sid, data) || data.email,
      online: rows.some(([, d]) => d.online === true),
      unreadCountForAdmin: unread,
      unreadForAdmin: unread > 0,
      lastChatTime: activity,
      __mergedMembers: members
    };

    return [sid, mergedData, activity];
  }).sort((a, b) => (b[2] || 0) - (a[2] || 0));
}

/* ===== AGENT SUPPORT READ STATUS ===== */

function canAgentMarkRead(force = false) {
  return (
    document.visibilityState === "visible" &&
    !!activeUserIdSanitized &&
    (force || document.hasFocus())
  );
}
let agentReadPromise = null;
let agentReadPromiseKey = "";


async function markActiveAgentChatRead(force = false) {
  if (!canAgentMarkRead(force)) return;

  const selectedAtStart = activeUserIdSanitized;
  const generation = selectedChatGeneration;

  const memberIds = [...new Set(
    selectedChatMemberIds.length
      ? selectedChatMemberIds
      : [selectedAtStart]
  )].filter(Boolean);

  const key = `${generation}:${memberIds.join("|")}`;

  if (agentReadPromise && agentReadPromiseKey === key) {
    return agentReadPromise;
  }

  const task = (async () => {
    try {
      await Promise.all(memberIds.map(async sid => {
        const chatRef = db.ref(`chats/${sid}`);
        const snapshot = await chatRef.once("value");

        if (
          !canAgentMarkRead(force) ||
          activeUserIdSanitized !== selectedAtStart ||
          generation !== selectedChatGeneration
        ) return;

        const updates = {};

        snapshot.forEach(child => {
          const message = child.val();

          if (
            message?.from === "user" &&
            message.readByAdmin !== true
          ) {
            updates[`${child.key}/readByAdmin`] = true;
          }
        });

        if (Object.keys(updates).length) {
          await chatRef.update(updates);
        }

        const latest = await chatRef.once("value");
        let remaining = 0;

        latest.forEach(child => {
          const message = child.val();

          if (
            message?.from === "user" &&
            message.readByAdmin !== true
          ) {
            remaining++;
          }
        });

        if (
          activeUserIdSanitized !== selectedAtStart ||
          generation !== selectedChatGeneration
        ) return;

        await db.ref(`users/${sid}`).update({
          unreadForAdmin: remaining > 0,
          unreadCountForAdmin: remaining
        });

        unreadCountCache[sid] = remaining;

        const idx = allUsersData.findIndex(
          ([id]) => id === sid
        );

        if (idx !== -1) {
          allUsersData[idx][1] = {
            ...allUsersData[idx][1],
            unreadForAdmin: remaining > 0,
            unreadCountForAdmin: remaining
          };
        }
      }));

      if (
        activeUserIdSanitized === selectedAtStart &&
        generation === selectedChatGeneration
      ) {
        scheduleRender();
      }

    } catch (error) {
      console.error(
        "[Agent Support] Mark read failed:",
        error
      );
    }
  })();

  agentReadPromiseKey = key;
  agentReadPromise = task;

  try {
    await task;
  } finally {
    if (agentReadPromise === task) {
      agentReadPromise = null;
      agentReadPromiseKey = "";
    }
  }
}


document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {

const CLOUDINARY_CLOUD_NAME = "dqctvbenv";

/* ===== AGENT SUPPORT IDENTITY FROM FIREBASE ===== */

const DEFAULT_ADMIN_PHOTO = "https://i.imgur.com/qiZFOs9.png";

async function getAdminIdentity() {
  const authUser = firebase.auth().currentUser;

  if (!authUser) {
    throw new Error("No active Firebase login.");
  }

  const uid = authUser.uid;

  const snapshot = await db.ref(`adminUsers/${uid}`).once("value");
  const profile = snapshot.val();

  // Pastikan akaun masih sama selepas Firebase selesai membaca data.
  if (firebase.auth().currentUser?.uid !== uid) {
    throw new Error("Firebase login changed.");
  }

  if (!profile || profile.active !== true) {
    throw new Error("Admin account is missing or inactive.");
  }

  const username = String(profile.username || "").trim();

  if (!username) {
    throw new Error("Admin username not found.");
  }


  return {
    uid,
    name: username,
    role: String(profile.role || "").trim().toLowerCase(),
    email: profile.email || authUser.email || "",
    photoURL: DEFAULT_ADMIN_PHOTO
  };

}

function bindAdminPresence(){
  const ref = db.ref(ADMIN_PRESENCE_PATH);
  const connectedRef = db.ref(".info/connected");

  connectedRef.on("value", snap => {
    const connected = snap.val() === true;

    if (connected) {
      touchAdminPresence({ typing: false });

      ref.onDisconnect().update({
        online: false,
        typing: false,
        lastSeen: Date.now()
      });

      clearInterval(adminPresenceHeartbeat);
      adminPresenceHeartbeat = setInterval(() => {
        touchAdminPresence();
      }, 5000);
    } else {
      clearInterval(adminPresenceHeartbeat);
      ref.update({
        online: false,
        typing: false,
        lastSeen: Date.now()
      }).catch(()=>{});
    }
  });

  window.addEventListener("beforeunload", () => {
    clearInterval(adminPresenceHeartbeat);
    ref.update({
      online: false,
      typing: false,
      lastSeen: Date.now()
    }).catch(()=>{});
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      touchAdminPresence();
    }
  });

  window.addEventListener("focus", () => {
    touchAdminPresence();
  });
}
let adminTypingTimer = null;
let adminPresenceHeartbeat = null;

async function touchAdminPresence(extra = {}) {
  try {
    const admin = await getAdminIdentity();

    // Jangan tulis presence jika login berubah.
    if (firebase.auth().currentUser?.uid !== admin.uid) {
      return;
    }

    await db.ref(ADMIN_PRESENCE_PATH).update({
      name: admin.name,
      email: admin.email,
      photoURL: admin.photoURL,
      online: true,
      typing: false,
      lastSeen: Date.now(),
      ...extra
    });

  } catch (err) {
    console.warn("touchAdminPresence skipped:", err);
  }
}
function bindAdminTyping(){
  if (!msgInput) return;

  msgInput.addEventListener("focus", () => {
    touchAdminPresence({ online: true, typing: false });
  });

  msgInput.addEventListener("input", () => {
    const hasText = !!msgInput.value.trim();

   
    touchAdminPresence({
      online: true,
      typing: hasText,
      lastSeen: Date.now()
    });

    clearTimeout(adminTypingTimer);
    adminTypingTimer = setTimeout(() => {
      touchAdminPresence({
        online: true,
        typing: false,
        lastSeen: Date.now()
      });
    }, 1500);
  });

  msgInput.addEventListener("blur", () => {
    touchAdminPresence({
      online: true,
      typing: false,
      lastSeen: Date.now()
    });
  });
}

/* ==========================================
   SITE ADMIN ACTIVITY - AGENT SUPPORT
   ========================================== */

let siteAdminActivity = {};
let siteAdminActivityRef = null;

function formatAdminActivityTime(timestamp) {
  const date = new Date(Number(timestamp));

  if (!Number.isFinite(date.getTime())) return "";

  const pad = n => String(n).padStart(2, "0");

  return (
    date.getFullYear() + "-" +
    pad(date.getMonth() + 1) + "-" +
    pad(date.getDate()) + " " +
    pad(date.getHours()) + ":" +
    pad(date.getMinutes()) + ":" +
    pad(date.getSeconds())
  );
}

function getSiteAdminActivity(memberIds) {
  const adminSid = (memberIds || []).find(id =>
    /^admin_[^/]+$/.test(String(id))
  );

  if (!adminSid) return null;

  const uid = adminSid.slice(6);
  return siteAdminActivity[uid] || null;
}


function updateSelectedUserActivity() {
  const element = document.getElementById(
    "chatUserActivity"
  );

  if (!element) return;

  const activity = getSiteAdminActivity(
    selectedChatMemberIds
  );

  if (!activity?.page) {
    element.textContent = "";
    element.hidden = true;
    return;
  }

  element.textContent =
    `Enter ${activity.page} · ` +
    formatAdminActivityTime(activity.enteredAt);

  element.hidden = false;
}

async function openSelectedUserActivity() {
  const dropdown = document.getElementById(
    "activityHistoryDropdown"
  );

  const content = document.getElementById(
    "activityHistoryList"
  );

  if (!dropdown || !content) return;

  if (!dropdown.hidden) {
    dropdown.hidden = true;
    return;
  }

  const adminSid = selectedChatMemberIds.find(id =>
    /^admin_[^/]+$/.test(String(id))
  );

  if (!adminSid) return;

  const uid = adminSid.slice(6);

  dropdown.hidden = false;
  content.textContent = "Loading activity...";

  try {
    const snap = await db
      .ref(`adminActivityHistory/${uid}`)
      .orderByChild("timestamp")
      .limitToLast(100)
      .once("value");

    // Jangan paparkan data lama jika user sudah ditukar.
    const currentSid = selectedChatMemberIds.find(id =>
      /^admin_[^/]+$/.test(String(id))
    );

    if (dropdown.hidden || currentSid !== adminSid) return;

    const records = Object.values(snap.val() || {})
      .sort((a, b) =>
        Number(b.timestamp || 0) -
        Number(a.timestamp || 0)
      );

    content.replaceChildren();

    if (!records.length) {
      content.textContent = "No activity history.";
      return;
    }



records.forEach(record => {
  const item = document.createElement("div");
  item.className = "activity-history-item";

  const type = String(record.type || "enter");
  const isExit = type === "exit";
  const isOffline = type === "offline";
  const isLeaving = isExit || isOffline;

  if (isLeaving) {
    item.classList.add("activity-history-offline");
  }

  const name = document.createElement("strong");

  name.textContent = isExit
    ? `Offline - ${record.page || "Unknown"}`
    : isOffline
      ? "Offline"
      : `Enter ${record.page || "Unknown"}`;

  const tag = document.createElement("span");
  tag.className = "activity-history-tag";

  tag.textContent = isOffline
    ? "Connection"
    : "Route Change";

  const time = document.createElement("small");
  time.textContent = formatAdminActivityTime(
    record.timestamp
  );

  item.append(name, tag, time);
  content.appendChild(item);
});



  } catch (error) {
    console.error("[Activity History]", error);
    content.textContent = "Failed to load activity history.";
  }
}


function startSiteAdminActivityListener() {
  if (siteAdminActivityRef) return;

  const authUser = firebase.auth().currentUser;
  if (!authUser) return;

  db.ref(`adminUsers/${authUser.uid}/role`)
    .once("value")
    .then(snapshot => {
      if (
        snapshot.val() !== "superadmin" ||
        siteAdminActivityRef
      ) return;

      siteAdminActivityRef = db.ref("adminActivity");

siteAdminActivityRef.on("value", snapshot => {
  siteAdminActivity = snapshot.val() || {};

  scheduleRender();
  updateSelectedUserActivity();

}, error => {
        console.warn("[Admin Activity Read]", error);
      });
    })
    .catch(error => {
      console.warn("[Admin Activity Init]", error);
    });
}

firebase.auth().onAuthStateChanged(user => {
  if (siteAdminActivityRef) {
    siteAdminActivityRef.off();
    siteAdminActivityRef = null;
  }

  siteAdminActivity = {};

  if (user) startSiteAdminActivityListener();
});

/* ======================= SCHEDULE RENDER ======================= */
function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(()=>{
    const displayList = buildMergedInboxRows()
  .map(([id, user]) => [id, user]);

function formatDateTimeMY(ts){
  const n = Number(ts || 0);
  if (!n) return "-";

  const d = new Date(n);
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yy = d.getFullYear();
  const HH = String(d.getHours()).padStart(2, "0");
  const MM = String(d.getMinutes()).padStart(2, "0");
  const SS = String(d.getSeconds()).padStart(2, "0");

  return `${dd}-${mm}-${yy} ${HH}:${MM}:${SS}`;
}

function desanitizeUserId(sanitized){
  const str = String(sanitized || "");
  const at = str.indexOf("@");
  if (at === -1) return str.replace(/_/g, ".");
  const local  = str.slice(0, at);
  const domain = str.slice(at + 1).replace(/_/g,".");
  return `${local}@${domain}`;
}

function dedupeName(str){
  const s = String(str || "").trim().replace(/\s+/g," ");
  const parts = s.split(" ");
  if (parts.length === 2 && parts[0].toLowerCase() === parts[1].toLowerCase()) return parts[0];
  return s;
}

function formatUserName(name){
  if(!name) return "Unknown";
  const words = String(name).trim().split(" ");
  if (words.length === 2 && words[0] === words[1]) return words[0];
  return name;
}
function makeGuestNameFromSanitized(sanitized) {
  const raw = String(sanitized || "").trim();
  if (!raw) return "Guest-USER";

  const clean = raw.replace(/^g_/i, "").replace(/[^a-zA-Z0-9]/g, "");
  const shortCode = (clean.slice(-5) || "USER").toUpperCase();

  return "Guest-" + shortCode;
}

function getSafeDisplayName(sanitized, userData = {}, metaIdentity = {}) {
  const rawName = String(
    metaIdentity?.name ||
    userData?.name ||
    userData?.displayName ||
    ""
  ).trim();

  const rawEmail = String(
    metaIdentity?.email ||
    userData?.email ||
    ""
  ).trim();

  // 1. kalau memang sudah ada Guest-xxxx atau nama biasa
  if (rawName) {
    return dedupeName(rawName);
  }

  // 2. kalau email guest.local
  if (rawEmail && /@guest\.local$/i.test(rawEmail)) {
    const left = rawEmail.split("@")[0].replace(/^guest-/i, "");
    return "Guest-" + (left || "USER");
  }

  // 3. kalau tiada email sebenar / id guest Firebase / g_xxx
  if (!rawEmail || !rawEmail.includes("@") || /^g_/i.test(String(sanitized || ""))) {
    return makeGuestNameFromSanitized(sanitized);
  }

  // 4. fallback user biasa
  return dedupeName(rawEmail.split("@")[0]);
}

function formatDateLabel(dateInput){
  const today = new Date();
  const date  = new Date(dateInput);
  const reset = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff  = reset(today) - reset(date);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  if (diff === 0){
    return { day:"Today", full: date.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) };
  } else if (diff === 86400000){
    return { day:"Yesterday", full: date.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) };
  } else {
    return {
      day: cap(date.toLocaleDateString("en-GB",{weekday:"long"})),
      full: date.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})
    };
  }
}

    allUsersData = entries.map(([sanitized, data])=>{
      const lastChat = Number(data?.lastChatTime || chatMeta[sanitized]?.lastChatTime || 0);
      const activity = makeActivityTime(lastChat, data);
      return [sanitized, data, activity];

function listenToChat() {
  if (!activeUserIdSanitized) return;

  detachMergedChatListeners();

  const generation = selectedChatGeneration;
  const ids = [
    ...(selectedChatMemberIds.length
      ? selectedChatMemberIds
      : [activeUserIdSanitized])
  ];

  const chatBox = document.getElementById("chatBox");

  if (chatBox) {
    chatBox.innerHTML =
      '<p style="text-align:center;color:white;">Loading...</p>';
  }

  const messagesBySid = new Map();
  const loaded = new Set();
let lastVisualSignature = null; 
  const renderMerged = () => {
    if (generation !== selectedChatGeneration) return;

    // Tunggu semua sumber menerima snapshot pertama.
    if (loaded.size !== ids.length) return;

    const combined = ids
      .flatMap(sid => messagesBySid.get(sid) || [])
      .sort((a, b) =>
        (Number(a.time) || 0) - (Number(b.time) || 0) ||
        String(a._key).localeCompare(String(b._key))
      );

allMessages = combined;
renderMessageSearchPanel();

const visualSignature = JSON.stringify(
  combined.map(m => ({
    key: m._key,
    source: m._sourceSid,
    from: m.from,
    name: m.name,
    text: m.text,
    image: m.image,
    images: m.images,
    time: m.time,
    readByUser: m.readByUser,
    deliveredAt: m.deliveredAt,
    readAt: m.readAt
  }))
);

if (visualSignature !== lastVisualSignature) {
  lastVisualSignature = visualSignature;

  if (!combined.length) {
    if (chatBox) {
      chatBox.innerHTML =
        '<p class="start-message">Start Message.</p>';
    }
  } else {
    renderChatMessages(combined);
  }
}

    if (
      canAgentMarkRead() &&
      combined.some(m =>
        m.from === "user" && !m.readByAdmin
      )
    ) {
      markActiveAgentChatRead().catch(console.error);
    }

    justOpenedChat = false;
    scheduleRender();
  };

  ids.forEach(sid => {
    const ref = db.ref(`chats/${sid}`);

    const handler = snap => {
      if (generation !== selectedChatGeneration) return;

      loaded.add(sid);

      const messages = Object.entries(snap.val() || {})
        .map(([key, raw]) => {
          const msg = normalizeChatMessage(key, raw);

          return msg
            ? {
                ...msg,
                _sourceSid: sid,
                readByAdmin: raw?.readByAdmin === true
              }
            : null;
        })
        .filter(Boolean);

      messagesBySid.set(sid, messages);

// Jangan pilih destinasi berdasarkan mesej lama.
// Gunakan channel utama untuk user yang sedang dipilih.

selectedUserId =
  resolveAgentReplySid(ids) ||
  selectedUserId;

      renderMerged();
    };

    mergedChatListeners.push({ ref, handler });

    ref.on(
      "value",
      handler,
      err => console.error(
        "[Agent Support] Chat read:",
        sid,
        err
      )
    );
  });
}

async function uploadImageToCloudinary(file, uploadToken){
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: "POST",
    body: formData
  });

  const data = await res.json();


  if (!res.ok || !data.secure_url) {
    throw new Error(data?.error?.message || "Upload failed");
  }

  return data.secure_url;
}

async function handleSelectedImageFile(file){
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("❌ Only image allowed");
    return;
  }

  if (file.size > 25 * 1024 * 1024) {
    alert("❌ Image too large (max 25MB)");
    return;
  }

  const localId = "img_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  const uploadToken = currentImageUploadToken;

  const preview = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error("Preview failed"));
    reader.readAsDataURL(file);
  });

  const item = {
    id: localId,
    file,
    preview,
    uploadedUrl: "",
    uploading: true
  };

  pendingImages.push(item);
  renderSelectedImages();

  if (msgInput) {
    msgInput.focus({ preventScroll: true });
  }

  let compressedFile = file;
  try {
    compressedFile = await compressImage(file, 1280, 0.72);
  } catch (err) {
    console.warn("Compress failed, fallback original file:", err);
  }

  isUploadingImage = true;
  setImageUploadLoading(true, "Uploading image...");
  updateSendButtonState();

  try {
    const secureUrl = await uploadImageToCloudinary(compressedFile, uploadToken);

    const target = pendingImages.find(x => x.id === localId);
    if (!target) return;

    target.file = compressedFile;
    target.uploadedUrl = secureUrl || "";
    target.uploading = false;
  } catch (err) {
    console.error("Image pre-upload failed:", err);
    pendingImages = pendingImages.filter(x => x.id !== localId);
    alert("❌ Upload image gagal. Sila cuba lagi.");
  } finally {
    isUploadingImage = pendingImages.some(x => x.uploading);

    if (!isUploadingImage) {
      setImageUploadLoading(false);
    }

    renderSelectedImages();

    if (msgInput) {
      msgInput.focus({ preventScroll: true });
    }
  }
}
async function compressImage(file, maxWidth = 1280, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    const img = new Image();

    reader.onload = (e) => {
      img.src = e.target.result;
    };

    reader.onerror = () => reject(new Error("Failed to read image"));

    img.onload = () => {
      let { width, height } = img;

      if (width > maxWidth) {
        height = Math.round(height * (maxWidth / width));
        width = maxWidth;
      }

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(img, 0, 0, width, height);

      canvas.toBlob(
        (blob) => {
          if (!blob) {
            reject(new Error("Compression failed"));
            return;
          }

          const compressedFile = new File(
            [blob],
            (file.name || "image").replace(/\.\w+$/, "") + ".jpg",
            { type: "image/jpeg" }
          );

          resolve(compressedFile);
        },
        "image/jpeg",
        quality
      );
    };

    img.onerror = () => reject(new Error("Invalid image file"));
    reader.readAsDataURL(file);
  });
}

function updateUserPresenceById(id){
  const prev = lastPresenceId;
  if (prev && prev !== id){
    db.ref("users/" + prev).off();
    db.ref("users/" + prev + "/typing").off();
  }
  lastPresenceId = id;

  const userRef   = db.ref("users/" + id);
  const typingRef = db.ref("users/" + id + "/typing");
  const statusElem = document.getElementById("chatUserStatus");
  if (!statusElem) return;

  userRef.on("value", snap=>{
    const data = snap.val() || {};
    if (data.typing) return;

    if (data.online){
      statusElem.innerHTML = `<span class="status-main">Online</span>`;
    } else {
      const t = data.lastLoginTime;
      if (!t){ 
        statusElem.innerHTML = ``; 
        return; 
      }

      const d = new Date(t), now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      const h = d.getHours(), m = String(d.getMinutes()).padStart(2,"0");
      const ampm = h >= 12 ? "PM" : "AM";
      const hh = h % 12 || 12;

      statusElem.innerHTML = `<span class="status-sub">Last seen ${isToday ? "today" : d.toLocaleDateString()} at ${hh}:${m} ${ampm}</span>`;
    }
  });

  typingRef.on("value", snap=>{
    const isTyping = !!snap.val();

    if (isTyping){
      statusElem.innerHTML = `<span class="status-typing">Typing...</span>`;
      return;
    }

    userRef.once("value", s => {
      const data = s.val() || {};

      if (data.online){
        statusElem.innerHTML = `<span class="status-main">Online</span>`;
      } else {
        const t = data.lastLoginTime;
        if (!t){ 
          statusElem.innerHTML = ``; 
          return; 
        }

        const d = new Date(t), now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const h = d.getHours(), m = String(d.getMinutes()).padStart(2,"0");
        const ampm = h >= 12 ? "PM" : "AM";
        const hh = h % 12 || 12;

        statusElem.innerHTML = `<span class="status-sub">Last seen ${isToday ? "today" : d.toLocaleDateString()} at ${hh}:${m} ${ampm}</span>`;
      }
    });
  });
}

    const body = document.createElement("span");
    body.className = "lc-search-result-text";
    body.textContent = String(m.text || "");
    const time = document.createElement("small");
    time.textContent = Number(m.time) > 0 ? formatDateTimeMY(m.time) : "";
    item.append(name,body,time);
    item.addEventListener("click", () => {
      renderChatMessages(allMessages);
      const key = String(m._sourceSid || "") + ":" + String(m._key || "");
      const target = Array.from(document.querySelectorAll("#chatBox .message"))
        .find(el => el.dataset.messageKey === key);
      if (target) {
        target.scrollIntoView({behavior:"smooth",block:"center"});
        target.classList.add("lc-search-hit");
        window.setTimeout(() => target.classList.remove("lc-search-hit"), 1800);
      }
    });
    results.append(item);
  });
}

      const item = items[i];

        if (file.size > 25 * 1024 * 1024) {

          e.preventDefault();
          return;
        }

        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;

        e.preventDefault();

<script>
/* Presentation-only handlers: existing search/filter/send logic remains unchanged. */
(function(){
  const ready=()=>{
    const panel=document.getElementById('lcSearchPanel');
    const open=document.getElementById('lcOpenSearch');
    const close=document.getElementById('lcCloseSearch');
    const search=document.getElementById('searchMessage');
    const back=document.getElementById('lcMobileBack');
    const layout=document.querySelector('.livechat-layout');
    const chatContainer=document.getElementById('containerChatBox');
    function setChatSearchOpen(isOpen){
      if(!panel || !chatContainer) return;
      panel.hidden=!isOpen;
      chatContainer.classList.toggle('lc-search-open',isOpen);
      open?.setAttribute('aria-expanded',String(isOpen));
      if(isOpen) { renderMessageSearchPanel(); requestAnimationFrame(()=>search?.focus()); }
    }
    open?.setAttribute('aria-controls','lcSearchPanel');
    setChatSearchOpen(false);
    open?.addEventListener('click',()=>setChatSearchOpen(true));
    close?.addEventListener('click',()=>{setChatSearchOpen(false);open?.focus();});
    back?.addEventListener('click',()=>{
      setChatSearchOpen(false);
      layout?.classList.remove('mobile-chat-open');
    });
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape' && panel && !panel.hidden){
        setChatSearchOpen(false);
        open?.focus();
      }
    });
    // Visual counter reflects the existing displayed total, without changing the data source.
    const count=document.querySelector('.lc-count');
    const total=document.getElementById('totalUsers');
    if(count&&total){
      const sync=()=>{count.textContent=(total.textContent||'0').trim()+' shown';};
      sync();new MutationObserver(sync).observe(total,{childList:true,characterData:true,subtree:true});
    }
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
})();
</script>

<script>
/* UI only: retain original input IDs and existing live search handlers. */
(function(){
  function initLiveChatSyncInputs(){
    if(!window.NewUI || typeof window.NewUI.syncSearch !== 'function') return;
    ['searchUser','searchMessage'].forEach(id=>{
      const input=document.getElementById(id);
      if(!input || input._syncSearch) return;
      window.NewUI.syncSearch(input,{
        onSearch: async (value, el) => {
          // Existing listeners own filtering; do not modify their logic.
          el.dispatchEvent(new Event('input',{bubbles:true}));
          // Keep the existing spinning indicator visible briefly for instant local searches.
          await new Promise(resolve=>setTimeout(resolve,280));
        }
      });
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initLiveChatSyncInputs);
  else initLiveChatSyncInputs();
  window.addEventListener('load',initLiveChatSyncInputs,{once:true});
})();
</script>

<script>
/* Responsive height: use the actual visible viewport (including phone keyboard). */
(function(){
  function syncChatViewport(){
    const vv=window.visualViewport;
    const h=vv ? vv.height : window.innerHeight;
    if(!Number.isFinite(h)||h<=0)return;
    document.documentElement.style.setProperty('--lc-viewport-height',Math.floor(h)+'px');
  }
  syncChatViewport();
  window.addEventListener('resize',syncChatViewport,{passive:true});
  window.addEventListener('orientationchange',syncChatViewport,{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',syncChatViewport,{passive:true});
  }
})();
</script>
