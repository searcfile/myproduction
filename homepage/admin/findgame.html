<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>5G88 • Find Game</title>
  <link rel="stylesheet" href="./shared-ui.css">
  <link rel="stylesheet" href="./admin.css">
  <link rel="stylesheet" href="./new-ui.css">
</head>
  <style>
          :root{
    --page-bg: #000;
    --page-text: rgba(255,255,255,0.85);
    --page-input: #141414;
    --border-input:#424242;
    --page-bg2:#1f1f1f;
    --name:#1668dc;
    --blur:rgba(255,255,255,0.25);

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
  }

  body.light-theme{
    --page-bg: #ffffff;
    --page-text: rgba(0,0,0,0.88);
    --page-input: #ffffff;
    --border-input:#d9d9d9;
    --page-bg2:#ffffff;
    --name:#1668dc;
    --blur:rgba(0,0,0,0.25);

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
  }

*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--page-bg);
  color:var(--page-text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  overflow-y:auto;
}

/* ===== FILTERS ===== */
.filters{
  position:relative;
  top:auto;
  left:auto;
  right:auto;
  z-index:auto;
  width:100%;
  background:var(--page-bg);
}

.filters-inner{
width:calc(100% - 24px);
margin:12px;
  padding:10px 12px;
  background:#1f1f1f;
  border:1px solid #424242;
  border-radius:12px;
  display:grid;
  gap:12px;
}

/* ===== SEARCH ===== */
.search{
  position:relative;
  display:flex;
  align-items:center;
  width:100%;
}

.search input{
  width:100%;
  min-width:0;
  height:32px;
  padding: 4px 11px;
  border-radius:6px;
  border:1px solid var(--border-input);
  background:var(--page-input);
  color:var(--page-text);
  outline:none;
  font-size:14px;
  transition:all .22s ease;
}

.search input::placeholder{
  color:var(--blur);
}

.search input:hover{
  border-color:var(--blue-hover);
}

.search input:focus{
  border-color:var(--blue);
}

.btn-clear{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:28px;
  height:28px;
  border:none;
  border-radius:8px;
  background:transparent;
  color:var(--blue);
  font-size:18px;
  line-height:1;
  cursor:pointer;
  transition:all .2s ease;
}

.btn-clear:hover{
  color:var(--blue-hover);
}

.btn-clear:active{
  color:var(--blue-active);
}

/* ===== TAGS ===== */
.tags{
  display:flex;
  gap:10px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  padding-bottom:2px;
}

.tags::-webkit-scrollbar{
  display:none;
}

.tag{
  appearance:none;
  border:none;
  user-select:none;
  white-space:nowrap;
  height:32px;
  padding:0 15px;
  border-radius:6px;
  border:1px solid var(--border-input);
  background:var(--page-input);
  color:var(--page-text);
  cursor:pointer;
  letter-spacing:.02em;
  transition:all .2s ease;
}

.tag:hover{
  border-color:var(--blue-hover);
  color:var(--blue-hover);
}

.tag.active,
.tag[aria-pressed="true"]{
  color:var(--blue);
  border-color:var(--blue);
}

/* ===== WRAP ===== */
.wrap{
  width:100%;
  height:auto;
  min-height:0;
  padding:0 12px 24px;
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:minmax(0,1.65fr) minmax(340px,.95fr);
  gap:14px;
  height:auto;
  min-height:0;
  align-items:start;
}

/* ===== PANELS ===== */
.list,
.detail{
  position:relative;
  border:1px solid var(--border-input);
  border-radius:12px;
  background:var(--page-bg2);
  overflow:hidden;
  backdrop-filter:blur(10px);
}

.list::before,
.detail::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:inherit;
}

.list{
  min-height:0;
  height:100%;
  display:flex;
  flex-direction:column;
  padding:8px;
}

.detail{
  min-height:0;
  height:100%;
  display:flex;
  flex-direction:column;
  overflow:auto;
  padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
}

/* ===== HEADERS ===== */
.list-hdr,
.detail-hdr{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px;
  background:transparent;
  position:relative;
  z-index:1;
}

.list-hdr{
  font-size:.95rem;
  color:var(--page-text);
  font-weight:500;
}

.detail-title{
  font-weight:400;
  letter-spacing:.02em;
  color:var(--page-text);
  font-size:14px;
}

.count{
  font-variant-numeric:tabular-nums;
  color:var(--page-text);
  font-weight:500;
}

.close{
  appearance:none;
  border:1px solid transparent;
  background:var(--blue);
  color:white;
  border-radius:4px;
  padding:5px 12px;
  cursor:pointer;
  transition:all .2s ease;
}

.close:hover{
  background:var(--blue-hover);
}

.close:active{
  background:var(--blue-active);
}

/* ===== LIST SCROLL ===== */
.scroll{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:0;
  scroll-behavior:smooth;
}

.scroll::-webkit-scrollbar{
  width:8px;
  height:8px;
}

.scroll::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.16);
  border-radius:999px;
}

.scroll::-webkit-scrollbar-track{
  background:transparent;
}

/* ===== GAME ITEM ===== */
.game{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
  padding:10px;
  cursor:pointer;
  transition:all .18s ease;
  background:var(--page-input);
  border:1px solid var(--border-input);
  border-radius:8px;
  min-height:50px;
  margin:0 0 8px;
}

.game:hover{
  border-color:var(--blue-hover);
}

.game.active,
.game[aria-selected="true"]{
  border-color:var(--blue);
  background:
    linear-gradient(180deg, rgba(22,104,220,.15), rgba(22,104,220,.06)),
    #10151f;
  box-shadow:var(--shadow-blue);
  color:var(--page-text);
}

.g-name{
  color:var(--page-text);
  letter-spacing:.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:14px;
}

.g-pill{
  font-size:.72rem;
  white-space:nowrap;
  padding:5px 10px;
  border-radius:999px;
  border:1px solid var(--border-input);
  background:var(--page-input);
  color:var(--page-text);
}

/* ===== EMPTY ===== */
.empty,
.hint{
  padding:18px 14px;
  color:var(--blur);
  text-align:center;
}

/* ===== DETAIL IMAGE ===== */
.art{
  padding:10px;
}

.art img{
  width:100%;
  height:240px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--border-input);
  background:var(--page-input);
  box-shadow:0 10px 24px rgba(0,0,0,.25);
  display:block;
}

.art img[src=""],
.art img:not([src]){
  visibility:hidden;
  height:180px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015)),
    #0d0f13;
  border:1px dashed rgba(255,255,255,.08);
}

/* ===== INFO ===== */
.info{
  display:grid;
  gap:5px;
  padding:0 10px;
}

.info .row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:4px 11px;
  background:var(--page-input);
  font-size:14px;
  height:32px;
  border:1px solid var(--border-input);
  border-radius:6px;
}

.k{
  color:var(--blue);
}

.v{
  color:var(--page-text);
  text-align:right;
  font-weight:400;
  font-size:14px;
  word-break:break-word;
}

.ok{
  color:#008000;
}

.no{
  color:red;
}

/* ===== PLATFORM TAGS IN DETAIL ===== */
.platforms{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:10px;
}

.platforms .pill,
.platforms .tag-pill,
.platforms span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:30px;
  padding:6px 11px;
  border-radius:999px;
  border:1px solid var(--border-input);
  background:var(--page-input);
  color:var(--blue);
  font-size:12px;
  font-weight:700;
  line-height:1.2;
  text-transform: uppercase;
}

/* ===== BETS ===== */
.bets{
  padding:0 14px 10px;
}

.bets-title{
  margin:0 0 5px;
  color:var(--page-text);
  font-size:12px;
  font-weight:400;
}

.bet-grid{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
}

.bet{
  border:1px solid var(--border-input);
  background:var(--page-input);
  padding:4px 10px;
  border-radius:50px;
  color:#1668dc;
  font-size:14px;
  height:28px;
  transition:all .18s ease;
}

/* ===== LINE CONTROL ===== */
.line{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  padding:12px 14px 6px;
  margin-top:auto;
  border-top:1px solid var(--border-input);
}

#lineText{
  color:var(--page-text);
  min-width:50px;
  text-align:center;
}

/* ===== BUTTON ===== */
.btn {
    border: 1px solid transparent;
    background: var(--blue);
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
    padding: 4px 10px;
    transition: all .16s ease;
    font-weight: 800;
    box-shadow: 0 6px 14px rgba(22, 104, 220, .20);
}

.btn:hover{
  background:var(--blue-hover);
}

.btn:active{
  background:var(--blue-active);
}

/* ===== FAB TOP ===== */
.fab{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:1300;
  width:46px;
  height:46px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  color:#fff;
  font-size:20px;
  font-weight:900;
  background:linear-gradient(180deg, var(--blue-hover), var(--blue));
  box-shadow:0 10px 24px rgba(22,104,220,.28);
  transition:all .18s ease;
}

.fab:hover{
  background:linear-gradient(180deg, #56a0ff, #2675e6);
}

.fab:active{
  background:var(--blue-active);
}

/* ===== TABLET / MOBILE ===== */
@media (max-width:979px){
  body{
    overflow:auto;
  }

  .filters-inner{
    width:calc(100% - 20px);
  }

  .wrap{
    width:calc(100% - 20px);
    height:auto;
    min-height:calc(100vh - var(--flt-h) - 8px);
    padding-bottom:16px;
  }

  .grid{
    grid-template-columns:1fr;
    height:auto;
  }

  .list{
    min-height:60vh;
    height:auto;
  }

  .detail{
    position:fixed;
    left:10px;
    right:10px;
    top:var(--flt-h);
    bottom:10px;
    height:auto;
    max-height:none;
    border-top-left-radius:12px;
    border-top-right-radius:12px;
    border-bottom-left-radius:12px;
    border-bottom-right-radius:12px;
    transform:translateY(110%);
    transition:transform .28s ease;
    z-index:1200;
    box-shadow:0 -18px 40px rgba(0,0,0,.45);
  }

  .detail.open{
    transform:translateY(0);
  }

  .detail::after{
    content:"";
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:54px;
    height:5px;
    border-radius:999px;
    background:rgba(255,255,255,.18);
    z-index:2;
  }

  .detail-hdr{
    padding-top:24px;
  }

  .art img{
    height:auto;
    max-height:42vh;
  }

  .line{
    padding:12px 14px 10px;
    margin-top:10px;
  }
}

/* ===== PHONE ===== */
@media (max-width:640px){
  :root{
    --flt-h:116px;
  }

  .filters-inner{
    width:calc(100% - 16px);
    padding:10px 0 12px;
    gap:10px;
  }

  .wrap{
    width:100%;
  }

  .list{
    padding:8px;
  }

  .g-pill{
    font-size:.68rem;
    padding:4px 8px;
    max-width:140px;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .info{
    gap:8px;
    padding:0 12px 12px;
  }

  .info .row{
    padding:11px 12px;
    border-radius:11px;
  }

  .art{
    padding:12px 12px 10px;
  }

  .bets{
    padding:0 12px 10px;
  }

  .platforms{
    padding:0 12px 12px;
  }

  .btn{
    min-height:42px;
    padding:7px 14px;
  }

  .close{
    padding:6px 11px;
    font-size:13px;
  }

  .fab{
    right:12px;
    bottom:12px;
    width:44px;
    height:44px;
  }
}

/* ===== VERY SMALL ===== */
@media (max-width:420px){
  .tag{
    height:32px;
    padding:0 14px;
    font-size:13px;
  }

  .detail-title{
    font-size:.96rem;
  }

  .bets-title{
    font-size:.96rem;
  }

  .k,
  .v{
    font-size:13px;
  }

  .g-pill{
    max-width:110px;
  }

  .platforms .pill,
  .platforms .tag-pill,
  .platforms span{
    font-size:11px;
    padding:5px 9px;
  }
}
.detail::-webkit-scrollbar{
  width:8px;
  height:8px;
}

.detail::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.16);
  border-radius:999px;
}

.detail::-webkit-scrollbar-track{
  background:transparent;
}
.detail{
  scrollbar-width:thin;
  scrollbar-color: rgba(255,255,255,.16) transparent;
}
*{
  scrollbar-width:thin;
  scrollbar-color: rgba(255,255,255,.16) transparent;
}

/* Chrome, Edge, Safari */
*::-webkit-scrollbar{
  width:8px;
  height:8px;
}

*::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.16);
  border-radius:999px;
}

*::-webkit-scrollbar-track{
  background:transparent;
}
:where(button, a, .btn, [tabindex]):focus-visible{
  outline: 3px solid #15325b;
  outline-offset: 1px;
  transition: outline-offset 0s, outline 0s;
}
:where(.input, input, select, textarea, [tabindex]):focus{
  border-color: #1668dc !important;
  outline: 0 !important;
  box-shadow: 0 0 0 2px rgba(0,60,180,0.15);
  transition: all .2s ease;
}
select:focus,
select:focus-visible{
  border-color: #1668dc !important;
  outline: none !important;
  box-shadow: 0 0 0 2px rgba(0,60,180,0.15);
  transition: all .2s ease;
}
/* ==========================================
   FIND GAME NORMAL PAGE SCROLL
   ========================================== */

@media (min-width:980px){
  .list,
  .detail{
    height:auto;
    min-height:0;
  }

  .scroll{
    flex:none;
    height:auto;
    overflow:visible;
  }
}
.fg-search .shared-sync-search{width:100%;height:32px}
.fg-search input:not(.shared-sync-search-input){height:32px;width:100%;border:1px solid var(--border-input);border-radius:6px;background:var(--page-input);color:var(--page-text);padding:0 11px}
.fg-create{  
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: max-content !important;
  min-width: 0;
  border-radius:8px;
  border:1px solid transparent;
  background:#1668dc;
  color:#ffffff;
  height: 32px;
  padding: 0 15px;
  justify-self: start;
  white-space: nowrap;
  transition: all 0.2s cubic-bezier(0.645, 0.045, 0.355, 1);
  flex: none;
  font-size:14px;
}
.fg-create:hover{background:var(--blue-hover)}
.fg-create:active{background:var(--blue-active)}
.wrap{padding:0 12px;width:100%!important;min-height:0!important;height:auto!important}
.grid{gap:14px}
.game.active{background:var(--page-input)}
.fg-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.fg-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.fg-field.full{grid-column:1/-1}
.fg-field label{font-size:12px;color:var(--page-text);font-weight:600}
.fg-field input,.fg-field select,.fg-field textarea{width:100%;min-height:35px;border:1px solid var(--border-input);border-radius:6px;padding:8px 10px;background:var(--page-input);color:var(--page-text);font:inherit;outline:none}
.fg-field textarea{min-height:86px;resize:vertical}
.fg-field input:focus,.fg-field textarea:focus{border-color:var(--blue)}
.fg-hint{font-size:12px;color:var(--blur)}
.fg-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.fg-modal-actions button,.fg-detail-actions button{border:1px solid var(--border-input);border-radius:7px;background:var(--page-input);color:var(--page-text);padding:8px 14px;cursor:pointer}
.fg-modal-actions .primary{background:var(--blue);border-color:var(--blue);color:white}
.fg-detail-actions{display:flex;gap:7px;margin-left:auto}
.fg-detail-actions button{padding:5px 10px;font-size:12px}
.fg-detail-actions button.danger{color:#ff4d4f}
@media(max-width:979px){.detail{top:12px!important}}
@media (max-width:700px) {
  .fg-form {
    grid-template-columns: 1fr;
  }
}

/* FIND GAME - RESULTS ACTION BUTTONS */

.fg-row-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-shrink: 0;
}

.fg-row-actions button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.fg-row-edit:hover {
  border-color: var(--blue);
  color: var(--blue);
}

.fg-row-delete:hover {
  border-color: #ff4d4f;
  color: #ff4d4f;
  background: rgba(255,77,79,.06);
}

@media (max-width: 480px) {
  .fg-row-actions {
    gap: 5px;
  }

  .g-name {
    min-width: 0;
  }
}
/* ==========================================
   FIND GAME - CLEAN RESPONSIVE TOOLBAR
   ========================================== */

.filters-inner {
  width: calc(100% - 24px);
  margin: 12px;
  padding: 10px 12px;
  min-width: 0;
  box-sizing: border-box;
}

/* Desktop: Search | Dropdown | Create */
.fg-toolbar {
  display: grid;
  grid-template-columns:
    minmax(0, 400px)
    minmax(0, 400px)
    minmax(max-content, 1fr);
  gap: 10px;
  align-items: center;
  width: 100%;
  min-width: 0;
}

.fg-toolbar .fg-search {
  grid-column: 1;
  grid-row: 1;
  width: 100%;
  min-width: 0;
  max-width: 400px;
}

.fg-toolbar .fg-search .shared-sync-search {
  width: 100%;
  max-width: 100%;
  height: 32px;
}

.fg-toolbar .fg-platform-chips {
  grid-column: 2;
  grid-row: 1;
  width: 100%;
  min-width: 0;
  max-width: 400px;
}

/* Create Game */
.fg-toolbar #fgCreate {
  grid-column: 3;
  grid-row: 1;
  justify-self: end;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: max-content !important;
  min-width: max-content;
  max-width: none;
  height: 32px;
  padding: 0 15px;
  margin: 0;
  cursor:pointer;
  font-size: 14px;
  font-weight: 400;
  line-height: 1;
  white-space: nowrap;
  flex-shrink: 0;
  box-sizing: border-box;
}

/* ==========================================
   SMALL SCREEN - 3 SEPARATE ROWS
   ========================================== */

@media (max-width: 950px) {

  .fg-toolbar {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto;
    gap: 10px;
  }

  /* Row 1: Search */
  .fg-toolbar .fg-search {
    grid-column: 1;
    grid-row: 1;
    width: 100%;
    max-width: 100%;
  }

  /* Row 2: Dropdown */
.fg-toolbar .fg-platform-chips {
  grid-column: 1;
  grid-row: 2;

  width: 100%;
  min-width: 0;
  max-width: none;

  justify-self: stretch;
}

  /* Row 3: Create */
  .fg-toolbar #fgCreate {
    grid-column: 1;
    grid-row: 3;
    justify-self: end;
    width: max-content !important;
    min-width: max-content;
  }
}

const legacyGames = [];

// Utilities
const debounce=(fn,ms=200)=>{let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}

// Restore search
elQ.value = sessionStorage.getItem('fg.q') || '';

// Shared search and multi-select platform chips
const platformOptions = ['918kiss','mega888','pussy888'];

  const names = [...new Set([...platformOptions,...games.flatMap(g=>g.tags||[])].map(x=>String(x).toLowerCase()))].sort();
  platformFilter?.setOptions(names.map(value=>({value,label:value.toUpperCase()})));

/* ========== NEW: kunci tinggi list ke 10 baris ========== */
function applyListMaxHeight(visibleRows = 10){
  const scroller = elList;
  if(!scroller) return;

  const row = scroller.querySelector('.game');
  if(!row){
    scroller.style.removeProperty('max-height');
    return;
  }

  // tinggi 1 baris termasuk margin
  const cs = getComputedStyle(row);
  const rowH = row.getBoundingClientRect().height +
               parseFloat(cs.marginTop||0) +
               parseFloat(cs.marginBottom||0);

  const maxH = Math.max(0, Math.round(rowH * visibleRows));
  scroller.style.maxHeight = maxH + 'px';             // langsung set
  // atau kalau kamu pakai CSS var: document.documentElement.style.setProperty('--list-max', maxH+'px');
}
/* ======================================================== */

// Render list
function renderList(){
  const q = (elQ.value || '').trim().toLowerCase();
  sessionStorage.setItem('fg.q', elQ.value || '');

  const filtered = games.filter(g => {
    const nameMatch = g.name.toLowerCase().includes(q);
    const aliasMatch = (g.alias || '').toLowerCase().includes(q);

    // ✅ search ikut payline sahaja, bukan bet
    const paylineMatch = String(g.payline || '').includes(q);

    const kw = !q || nameMatch || aliasMatch || paylineMatch;

    const chosen = platformFilter?.getValue() || [];
    const platOK = !chosen.length || (g.tags||[]).some(t=>chosen.includes(String(t).toLowerCase()));

    return kw && platOK;
  });

  elList.innerHTML = '';
  count.textContent = filtered.length;

  if(!filtered.length){
    if (window.showEmptyState) showEmptyState(elList,'No Data','large','center'); else elList.textContent='No games found';
    // tetap set max-height supaya box-nya tidak melebar
    requestAnimationFrame(()=>applyListMaxHeight());
    return;
  }

  filtered.forEach((g,i)=>{
    const row = document.createElement('div');
    row.className = 'game';
    row.id = `g-${i}`;
    row.setAttribute('role','button');
    row.setAttribute('tabindex','0');
const label = document.createElement('div');
label.className = 'g-name';
label.textContent = g.name;

const actions = document.createElement('div');
actions.className = 'fg-row-actions';

const editBtn = document.createElement('button');
editBtn.type = 'button';
editBtn.className = 'btn-edit-new';
editBtn.innerHTML = 'Edit';

editBtn.addEventListener('click', e => {
  e.stopPropagation();

  if (!g._id) {
    fgToast('Game lama belum disimpan ke Firebase.', 'warning');
    return;
  }

  fgOpenEditor(g);
});

const deleteBtn = document.createElement('button');
deleteBtn.type = 'button';
deleteBtn.className = 'btn-delete-new';
deleteBtn.innerHTML = 'Delete';

deleteBtn.addEventListener('click', e => {
  e.stopPropagation();

  if (!g._id) {
    fgToast('Game lama belum disimpan ke Firebase.', 'warning');
    return;
  }

  const removeGame = async () => {
    try {
      await fgDatabase().ref(FG_DB_PATH + '/' + g._id).remove();
      fgToast('Game deleted', 'success');
    } catch (err) {
      fgToast(err.message, 'error');
    }
  };

  if (window.NewUI?.confirm) {
    NewUI.confirm({
      title: 'Delete Game',
      message: 'Delete ' + g.name + '?',
      onConfirm: removeGame
    });
  } else if (window.confirm('Delete ' + g.name + '?')) {
    removeGame();
  }
});

actions.append(editBtn, deleteBtn);
row.append(label, actions);
    row.addEventListener('click',()=>openDetail(g, row));
    row.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openDetail(g, row); }});
    if(selectedGame && selectedGame.name===g.name) row.classList.add('active');
    elList.appendChild(row);
  });

  // hitung ulang tinggi setelah DOM jadi
  requestAnimationFrame(()=>applyListMaxHeight());
}

function updateDetailEmpty() {

      window.showEmptyState(empty, 'No Data');
    } else {

    }

let fgPanY = 0;

let fgDragX = 0;
let fgDragY = 0;
let fgPreviewPreviousFocus = null;
let fgPreviousBodyOverflow = '';
let fgRotation = 0;
let fgFlipX = 1;
let fgFlipY = 1;
function fgUpdateZoom() {
  fgZoom = Math.max(1, Math.min(5, fgZoom));

  if (fgZoom === 1) {
    fgPanX = 0;
    fgPanY = 0;
  }

  fgPreviewImg.style.transform = `
    translate(${fgPanX}px, ${fgPanY}px)
    rotate(${fgRotation}deg)
    scale(${fgZoom * fgFlipX}, ${fgZoom * fgFlipY})
  `;

  fgZoomValue.textContent = Math.round(fgZoom * 100) + '%';

  fgPreviewStage.classList.toggle('zoomed', fgZoom > 1);
}

function fgSetZoom(value) {
  fgZoom = value;
  fgUpdateZoom();
}

function fgOpenImagePreview() {
  if (!selectedGame || !dImg.src || !dImg.complete || !dImg.naturalWidth) {
    return;
  }

  fgPreviewPreviousFocus = document.activeElement;
  fgPreviousBodyOverflow = document.body.style.overflow;

  fgPreviewImg.src = dImg.currentSrc || dImg.src;
  fgPreviewImg.alt = dImg.alt || 'Game image';

  fgPreviewTitle.textContent = selectedGame.name || 'Image Preview';

fgZoom = 1;
fgPanX = 0;
fgPanY = 0;
fgRotation = 0;
fgFlipX = 1;
fgFlipY = 1;
fgUpdateZoom();

  fgPreview.classList.add('open');
  fgPreview.setAttribute('aria-hidden', 'false');

  document.body.style.overflow = 'hidden';
  fgPreviewClose.focus();
}

function fgCloseImagePreview() {
  if (!fgPreview.classList.contains('open')) return;

  fgDragging = false;
  fgPreviewStage.classList.remove('dragging');

  fgPreview.classList.remove('open');
  fgPreview.setAttribute('aria-hidden', 'true');

  fgPreviewImg.removeAttribute('src');

  document.body.style.overflow = fgPreviousBodyOverflow;

  fgPreviewPreviousFocus?.focus?.();
}

   ========================================== */

let fgDidDrag = false;
let fgPointerStartX = 0;
let fgPointerStartY = 0;

fgPreviewStage.addEventListener('pointerdown', e => {
  if (fgZoom <= 1) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  e.preventDefault();

  fgDragging = true;
  fgDidDrag = false;

  fgPointerStartX = e.clientX;
  fgPointerStartY = e.clientY;

  fgDragX = e.clientX - fgPanX;
  fgDragY = e.clientY - fgPanY;

  fgPreviewStage.classList.add('dragging');
  fgPreviewStage.setPointerCapture(e.pointerId);
});

fgPreviewStage.addEventListener('pointermove', e => {
  if (!fgDragging) return;

  e.preventDefault();

  if (
    Math.abs(e.clientX - fgPointerStartX) > 3 ||
    Math.abs(e.clientY - fgPointerStartY) > 3
  ) {
    fgDidDrag = true;
  }

  fgPanX = e.clientX - fgDragX;
  fgPanY = e.clientY - fgDragY;

  fgUpdateZoom();
});

function fgStopDragging(e) {
  if (!fgDragging) return;

  fgDragging = false;
  fgPreviewStage.classList.remove('dragging');

  if (
    e &&
    fgPreviewStage.hasPointerCapture(e.pointerId)
  ) {
    fgPreviewStage.releasePointerCapture(e.pointerId);
  }
}

fgPreviewStage.addEventListener('pointerup', fgStopDragging);
fgPreviewStage.addEventListener('pointercancel', fgStopDragging);

fgPreviewStage.addEventListener('lostpointercapture', () => {
  fgDragging = false;
  fgPreviewStage.classList.remove('dragging');
});

  if (e.key === 'Tab') {

// Open detail
function openDetail(game, rowEl){
  selectedGame = game;
  const lines = Object.keys(game.bets||{}).map(Number);
  selectedLine = lines.length ? Math.max(...lines) : 1;
  updateDetail();
  if (matchMedia('(max-width: 979px)').matches){ elDetail.classList.add('open'); }
  [...elList.children].forEach(c=>c.classList.remove('active'));
  rowEl && rowEl.classList.add('active');
  rowEl && rowEl.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function updateDetail(){
  updateDetailEmpty();

  if (!selectedGame) {
    dTitle.textContent = 'Select a game';
    return;
  }
  const g = selectedGame;
  dTitle.textContent = g.name;
  dImg.src = g.image || '';
  dImg.alt = g.name + ' image';
  dImg.onerror = () => {
  dImg.onerror = null;

  dImg.src =
    'data:image/svg+xml,' +
    encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">' +
      '<rect width="200" height="120" fill="#111111"/>' +
      '<text x="100" y="60" text-anchor="middle" dominant-baseline="middle" fill="#999999" font-size="14" font-family="Arial">No image</text>' +
      '</svg>'
    );
};
  dName.textContent = g.alias || g.name;
  dType.textContent = g.type || '-';
  dPay.textContent = g.payline ?? '-';
  dAdj.innerHTML = g.adjustable ? '<span class="ok">Yes</span>' : '<span class="no">No</span>';
  dTags.innerHTML = '';
  (g.tags||[]).forEach(t=>{
    const chip=document.createElement('span');
    chip.className=`p tag-${t.toLowerCase()}`;
    chip.textContent=t;
    dTags.appendChild(chip);
  });
  lineText.textContent = `Line: ${selectedLine}`;
  dBets.innerHTML = '';
  const arr = (g.bets && g.bets[selectedLine]) ? g.bets[selectedLine] : [];
  arr.forEach(v=>{
    const b=document.createElement('span');
    b.className='bet';
    b.textContent=Number(v).toFixed(2);
    dBets.appendChild(b);
  });
}

// Line controls
function changeLine(delta){
  if(!selectedGame) return;
  const lines = Object.keys(selectedGame.bets||{}).map(Number);
  if(!lines.length) return;
  const min = Math.min(...lines), max = Math.max(...lines);
  selectedLine = Math.min(max, Math.max(min, selectedLine + delta));
  lineText.textContent = `Line: ${selectedLine}`;
  updateDetail();
}

/* ===========================================================
   FIREBASE GAME CRUD + SHARED CREATE/EDIT MODAL + IMAGE UPLOAD
   Uses existing shared NewUI components, no image URL input.
=========================================================== */
const FG_DB_PATH='find_game/games';
const FG_CLOUD='dqctvbenv';
const FG_PRESET='game_logos';
let fgDb=null;
let fgEditing=null;
let fgActiveModal=null;
let fgImageUploader=null;
function fgToast(msg,type='info'){if(window.NewUI?.showToast)NewUI.showToast(msg,type);else console.log(type,msg);}
function fgDatabase(){
  if(!window.firebase?.apps?.length) throw new Error('Firebase is not initialized. Check ../firebase.js');
  return firebase.database();
}
function fgRebuild(){
  // Firebase records override matching legacy names; new records append.
  const byName=new Map(legacyGames.map(g=>[String(g.name).toLowerCase(),g]));
  firebaseGames.forEach(g=>byName.set(String(g.name).toLowerCase(),g));
  games=[...byName.values()];
  updatePlatformOptions();renderList();
  if(selectedGame){
    const replacement=games.find(g=>g._id===selectedGame._id && g._id || g.name===selectedGame.name);
    if(replacement){selectedGame=replacement;updateDetail();}
    else {
  selectedGame = null;
  elDetail.classList.remove('open');
  updateDetail();
}
  }
}
function fgListen(){
  try {
    fgDb=fgDatabase();
    fgDb.ref(FG_DB_PATH).on('value',snap=>{
      firebaseGames=[];
      snap.forEach(child=>{
        const g=child.val();
        if(g && typeof g==='object' && g.name)firebaseGames.push({...g,_id:child.key});
      });
      fgRebuild();
    },err=>fgToast('Firebase read failed: '+err.message,'error'));
  }catch(err){fgToast(err.message,'error');}
}
function fgParseBets(text,payline){
  const value=text.trim();
  if(!value)throw new Error('Enter bet values. Example: 0.01, 0.02, 0.05');
  // Per-line input: 1: 0.01,0.02 | 2: 0.02,0.04
  const rows=value.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const out={};
  for(const row of rows){
    const match=row.match(/^(\d+)\s*:\s*(.+)$/);
    const line=match?Number(match[1]):1;
    const values=(match?match[2]:row).split(/[;,\s]+/).filter(Boolean).map(Number);
    if(!Number.isInteger(line)||line<1||line>payline||!values.length||values.some(x=>!Number.isFinite(x)||x<=0))throw new Error('Invalid bet values or line number');
    out[line]=values;
  }
  return out;
}
function fgBetsToText(g){return Object.entries(g?.bets||{}).sort((a,b)=>Number(a[0])-Number(b[0])).map(([k,v])=>k+': '+(Array.isArray(v)?v.join(', '):'')).join('\n');}
async function fgCloudUpload(file,upload){
  if(!file) return upload?.getUrl()||'';
  const form=new FormData();form.append('file',file);form.append('upload_preset',FG_PRESET);
  upload?.setStatus('Uploading to Cloudinary...');
  const response=await fetch('https://api.cloudinary.com/v1_1/'+FG_CLOUD+'/image/upload',{method:'POST',body:form});
  const json=await response.json();
  if(!response.ok||!/^https:\/\//.test(json.secure_url||''))throw new Error(json.error?.message||'Image upload failed');
  return json.secure_url;
}
function fgOpenEditor(record=null){
  if(!window.NewUI?.modal||!window.NewUI?.imageUpload) {fgToast('Shared modal or image upload missing in new-ui.js','error');return;}
  fgEditing=record?record._id||null:null;
  const form=document.createElement('form');form.className='fg-form';form.id='fgGameForm';
  const fields=[
    ['name','Game Name','text',record?.name||'',true],
    ['alias','Alias','text',record?.alias||'',false],
    ['type','Game Type','text',record?.type||'Slot',true],
    ['payline','Paylines','number',record?.payline||20,true]
  ];
  fields.forEach(([id,label,type,value,required])=>{
    const div=document.createElement('div');div.className='fg-field';
    const lab=document.createElement('label');lab.textContent=label;lab.htmlFor='fg-'+id;
    const input=document.createElement('input');input.id='fg-'+id;input.name=id;input.type=type;input.value=value;input.required=required;if(type==='number'){input.min='1';input.max='1000';}
    div.append(lab,input);form.append(div);
  });
  const platformField=document.createElement('div');platformField.className='fg-field full';
  platformField.innerHTML='<label>Platforms</label><div id="fgModalPlatforms"></div>';
  form.append(platformField);
  const adjField=document.createElement('label');adjField.className='fg-field full';
  adjField.innerHTML='<span>Adjustable Lines</span><span><input type="checkbox" id="fg-adjustable" style="width:auto;min-height:auto" /> Yes, player can change paylines</span>';
  form.append(adjField);
  const betsField=document.createElement('div');betsField.className='fg-field full';
  betsField.innerHTML='<label for="fg-bets">Bet Values (per selected line)</label><textarea id="fg-bets" required placeholder="1: 0.01, 0.02, 0.05&#10;2: 0.02, 0.04, 0.10"></textarea><div class="fg-hint">Format: line number : values separated by commas. For a fixed-line game, use one line such as 1: 0.01, 0.02.</div>';
  form.append(betsField);
  const imageField=document.createElement('div');imageField.className='fg-field full';
  imageField.innerHTML='<label>Game Image</label><div id="fgImageHost"></div><div class="fg-hint">Upload PNG, JPG, WEBP or GIF (max 5 MB). Preview appears automatically.</div>';
  form.append(imageField);
  const buttons=document.createElement('div');buttons.className='fg-modal-actions';buttons.style.gridColumn='1/-1';
  const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel';
  const save=document.createElement('button');save.type='submit';save.className='primary';save.textContent=record?'Save Changes':'Create Game';
  buttons.append(cancel,save);form.append(buttons);
  fgActiveModal=NewUI.modal.open({title:record?'Edit Game':'Create Game',content:form,width:620,onClose:()=>{fgImageUploader?.destroy?.();fgImageUploader=null;fgActiveModal=null;}});
  const modalChips=NewUI.chips(form.querySelector('#fgModalPlatforms'),{
    placeholder:'Select platforms',
    options:[...new Set([...platformOptions,...games.flatMap(g=>g.tags||[])].map(x=>String(x).toLowerCase()))].map(value=>({value,label:value.toUpperCase()})),
    value:(record?.tags||[]).map(x=>String(x).toLowerCase())
  });
  form.querySelector('#fg-adjustable').checked=record?.adjustable!==false;
  form.querySelector('#fg-bets').value=record?fgBetsToText(record):'1: 0.01, 0.02, 0.05';
  fgImageUploader=NewUI.imageUpload(form.querySelector('#fgImageHost'),{buttonText:'Upload Image',maxSizeMB:5,initialUrl:record?.image||'',onError:e=>fgToast(e.message,'error')});
  cancel.addEventListener('click',()=>fgActiveModal?.close());
  form.addEventListener('submit',async e=>{
    e.preventDefault();save.disabled=true;
    try{
      const name=form.querySelector('#fg-name').value.trim();
      const alias=form.querySelector('#fg-alias').value.trim();
      const type=form.querySelector('#fg-type').value.trim();
      const payline=Number(form.querySelector('#fg-payline').value);
      const tags=modalChips?.getValue()||[];
      if(!name||!type||!Number.isInteger(payline)||payline<1||payline>1000)throw new Error('Enter valid game name, type and paylines');
      if(!tags.length)throw new Error('Choose at least one platform');
      const bets=fgParseBets(form.querySelector('#fg-bets').value,payline);
      const image=await fgCloudUpload(fgImageUploader?.getFile(),fgImageUploader);
      if(!image)throw new Error('Please upload a game image');
      const db=fgDatabase();
      const data={name,alias,type,payline,adjustable:form.querySelector('#fg-adjustable').checked,tags,bets,image,updatedAt:firebase.database.ServerValue.TIMESTAMP};
      if(fgEditing)await db.ref(FG_DB_PATH+'/'+fgEditing).update(data);
      else await db.ref(FG_DB_PATH).push({...data,createdAt:firebase.database.ServerValue.TIMESTAMP});
      fgToast(record?'Game updated':'Game created','success');fgActiveModal?.close();
    }catch(err){fgToast(err.message,'error');}
    finally{save.disabled=false;}
  });
}

  if(!hdr||document.getElementById('fgDetailActions'))return;

    fgOpenEditor(selectedGame);
  });
  document.getElementById('fgDeleteGame').addEventListener('click',async()=>{
    if(!selectedGame?._id){fgToast('Legacy games cannot be deleted until migrated to Firebase.','warning');return;}

    else if(window.confirm('Delete '+name+'?')){try{await action();}catch(e){fgToast(e.message,'error');}}
  });
}

(function () {
  const THEME_KEY = "siteTheme";

  function applyChildTheme(theme) {
    document.body.classList.remove("light-theme", "dark-theme");
    document.body.classList.add(theme === "light" ? "light-theme" : "dark-theme");
  }

  applyChildTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");

  window.addEventListener("message", function (e) {
    const allowedOrigins = [
      "https://5g88-main.vercel.app"
    ];
    if (!allowedOrigins.includes(e.origin)) return;

    const data = e.data || {};
    if (data.type === "theme-change") {
      const theme = data.theme === "dark" ? "dark" : "light";
      localStorage.setItem(THEME_KEY, theme);
      applyChildTheme(theme);
    }
  });
})();

function sendUserAction(actionName, extra = {}) {
  if (!actionName) return;
  window.parent.postMessage({
    type: "user-tab-action",
    tab: window.HISTORY_TAB_NAME,
    action: actionName,
    extra,
    time: Date.now()
  }, "https://5g88-main.vercel.app");
}
/* =========================
   AUTO TRACK CLICK - COUNT SEMUA CLICK
========================= */
document.addEventListener("click", function(e) {
  const el = e.target.closest("button, [onclick], a, .btn, [data-action]");
  if (!el) return;

  if (el.disabled || el.getAttribute("aria-disabled") === "true") return;

  let name =
    el.getAttribute("data-action") ||
    el.getAttribute("title") ||
    el.getAttribute("aria-label") ||
    el.innerText ||
    el.textContent ||
    el.id ||
    "";

  name = String(name)
    .replace(/\s+/g, " ")
    .trim();

  if (!name || name.length < 2) return;

  name = name.slice(0, 40);

  sendUserAction(name);
}, true);
