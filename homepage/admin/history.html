<script>
(function () {
  const KEY = "5g88.hardReloadIntent";

  // Detect Ctrl + Shift + R atau Ctrl + F5
  window.addEventListener("keydown", function (event) {
    const hardReload =
      (event.ctrlKey &&
       event.shiftKey &&
       event.key.toLowerCase() === "r") ||
      (event.ctrlKey && event.key === "F5");

    if (hardReload) {
      sessionStorage.setItem(KEY, String(Date.now()));
    }
  }, true);

  // Semak sama ada reload datang daripada shortcut tadi
  const saved = Number(sessionStorage.getItem(KEY));
  sessionStorage.removeItem(KEY);

  const navigation =
    performance.getEntriesByType("navigation")[0];

  const recentHardReload =
    navigation?.type === "reload" &&
    Number.isFinite(saved) &&
    saved > 0 &&
    Date.now() - saved < 10000;

  if (recentHardReload) {
    document.documentElement.classList.add(
      "fiveg88-hard-reload"
    );
  }
})();
</script>

@media(max-width:1000px){.history-layout{grid-template-columns:minmax(260px,310px) minmax(0,1fr)}.history-page .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.history-page{padding:12px}.history-hero{padding:14px;margin-bottom:12px}.history-hero-mark{width:42px;height:42px;font-size:27px}.history-live{display:none}.history-layout{grid-template-columns:minmax(0,1fr);gap:12px}.history-page .tab-list{max-height:270px}.history-page .right-panel{padding:12px;min-height:280px}.history-page .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.history-page .range-picker{position:fixed;left:8px!important;top:70px!important;width:calc(100vw - 16px);max-height:calc(100dvh - 90px);overflow-y:auto;z-index:999999}}

<body>
<div class="history-page">
<div class="history-layout">
    <aside class="left-panel">
      <div class="panel-head history-side-heading"><span>Session History</span><span id="sessionCount" class="history-count">0</span></div>
<div class="search-box">
  <input id="searchInput" type="search" placeholder="Search sessions..." aria-label="Search sessions" autocomplete="off">

<div class="custom-range-wrap">
  <div class="date-range-line">
    <input id="dateRangeInput" type="text" readonly placeholder="Select date range" aria-label="Select date range">

    <button type="button" id="rangeToggleBtn" class="range-toggle-btn" aria-label="Toggle Range">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M16.59 8.59L12 13.17L7.41 8.59L6 10l6 6l6-6z"></path>
      </svg>
    </button>
  </div>

  <div id="rangePicker" class="range-picker">
    <div class="range-picker-head">
      <button type="button" id="prevMonthBtn">‹‹</button>
      <div id="pickerTitle"></div>
      <button type="button" id="nextMonthBtn">››</button>
    </div>

    <div class="calendar-grid-wrap">
      <div>
        <div id="leftMonthTitle" class="month-title"></div>
        <div id="leftCalendar" class="calendar-grid"></div>
      </div>

      <div>
        <div id="rightMonthTitle" class="month-title"></div>
        <div id="rightCalendar" class="calendar-grid"></div>
      </div>
    </div>

    <div class="picker-actions">
      <button type="button" id="clearRangeBtn">Clear</button>
      <button type="button" id="applyRangeBtn">Apply</button>
    </div>
  </div>
</div>

  <div class="range-buttons">
    <button type="button" data-range="today">Today</button>
    <button type="button" data-range="yesterday">Yesterday</button>
    <button type="button" data-range="thisWeek">This Week</button>
    <button type="button" data-range="lastWeek">Last Week</button>
    <button type="button" data-range="thisMonth">This Month</button>
    <button type="button" data-range="lastMonth">Last Month</button>
  </div>
</div>
      <div class="history-list-caption"><span>YOUR SESSIONS</span><span id="filterSummary">All dates</span></div>
      <div id="tabList" class="tab-list" aria-live="polite"></div>
      <div class="history-help"><strong>History source:</strong> Saved activity in Firebase. Opening a tab or clicking Create/Edit does not automatically create a record unless that page logs the action.</div>
    </aside>

    <main class="right-panel">
      <div id="detailWrap" class="detail-wrap">
        <div class="history-welcome"><div class="history-welcome-icon">◷</div><h2>Choose a session</h2><p>Select a session from the left to explore activity details.</p></div>
      </div>
    </main>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="../firebase.js"></script>
<script src="./new-ui.js"></script>
<script defer src="./shared-ui.js"></script>
<script src="./admin.js"></script>
<script type="module">

const tabList = document.getElementById("tabList");
const detailWrap = document.getElementById("detailWrap");
const searchInput = document.getElementById("searchInput");
const dateRangeInput = document.getElementById("dateRangeInput");
const rangePicker = document.getElementById("rangePicker");
const pickerTitle = document.getElementById("pickerTitle");
const leftMonthTitle = document.getElementById("leftMonthTitle");
const rightMonthTitle = document.getElementById("rightMonthTitle");
const leftCalendar = document.getElementById("leftCalendar");
const rightCalendar = document.getElementById("rightCalendar");
const prevMonthBtn = document.getElementById("prevMonthBtn");
const nextMonthBtn = document.getElementById("nextMonthBtn");
const applyRangeBtn = document.getElementById("applyRangeBtn");
const clearRangeBtn = document.getElementById("clearRangeBtn");
const rangeButtons = document.querySelectorAll(".range-buttons button");
  const rangeToggleBtn = document.getElementById("rangeToggleBtn");
const rangeButtonsWrap = document.querySelector(".range-buttons");
let pickerBaseDate = new Date();
let tempStartDate = null;
let tempEndDate = null;

let activeRange = {
  start: null,
  end: null,
  key: "all"
};
let allSessions = [];
let selectedSessionId = "";

function historyEmailKey(email) {
  return String(email || "")
    .trim()
    .toLowerCase()
    .replace(/[.#$[\]/]/g, "_");
}

function getLoginData() {
  try {
    return JSON.parse(localStorage.getItem("gmailLogin") || "{}");
  } catch {
    return {};
  }
}

function formatTime(ms) {
  if (!ms) return "-";
  const d = new Date(Number(ms));
  if (isNaN(d.getTime())) return "-";

  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, "0");
  const mi = String(d.getMinutes()).padStart(2, "0");
  const ss = String(d.getSeconds()).padStart(2, "0");

  return `${dd}-${mm}-${yy} ${hh}:${mi}:${ss}`;
}
function pad2(n) {
  return String(n).padStart(2, "0");
}

function toYMD(date) {
  return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
}

function startOfDay(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  return d;
}

function endOfDay(date) {
  const d = new Date(date);
  d.setHours(23, 59, 59, 999);
  return d;
}

// Monday start week
function startOfWeek(date) {
  const d = startOfDay(date);
  const day = d.getDay(); // Sun=0, Mon=1
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}

function endOfWeek(date) {
  const d = startOfWeek(date);
  d.setDate(d.getDate() + 6);
  d.setHours(23, 59, 59, 999);
  return d;
}

function getRangeByKey(key) {
  const now = new Date();
  let start, end;

  if (key === "yesterday") {
    start = startOfDay(now);
    start.setDate(start.getDate() - 1);
    end = endOfDay(start);
  } else if (key === "thisWeek") {
    start = startOfWeek(now);
    end = endOfWeek(now);
  } else if (key === "lastWeek") {
    start = startOfWeek(now);
    start.setDate(start.getDate() - 7);
    end = endOfWeek(start);
  } else if (key === "thisMonth") {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
  } else if (key === "lastMonth") {
    start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    end = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59, 999);
  } else {
    start = startOfDay(now);
    end = endOfDay(now);
  }

  return { start, end };
}

function setActiveRange(key = "all") {
  const range = key === "all" ? {start: null, end: null} : getRangeByKey(key);

  activeRange = {
    key,
    start: range.start ? range.start.getTime() : null,
    end: range.end ? range.end.getTime() : null
  };

if (dateRangeInput) {
  dateRangeInput.value = range.start ? `${toYMD(range.start)} → ${toYMD(range.end)}` : "All dates";
}

  rangeButtons.forEach(btn => {
    btn.classList.toggle("active", btn.dataset.range === key);
  });

  renderTabList();
}
function monthName(date) {
  return date.toLocaleString("en-US", { month: "short", year: "numeric" });
}

function sameDay(a, b) {
  if (!a || !b) return false;
  return toYMD(a) === toYMD(b);
}

function isBetweenDay(day, start, end) {
  if (!day || !start || !end) return false;
  const t = startOfDay(day).getTime();
  return t >= startOfDay(start).getTime() && t <= startOfDay(end).getTime();
}

function renderCalendar(container, titleEl, date) {
  const year = date.getFullYear();
  const month = date.getMonth();

  titleEl.textContent = monthName(date);
  container.innerHTML = "";

  ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"].forEach(w => {
    const el = document.createElement("div");
    el.className = "cal-week";
    el.textContent = w;
    container.appendChild(el);
  });

  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const gridStart = new Date(year, month, 1 - startOffset);

  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cal-day";
    btn.textContent = d.getDate();

    if (d.getMonth() !== month) btn.classList.add("muted");

    if (sameDay(d, tempStartDate) || sameDay(d, tempEndDate)) {
      btn.classList.add("selected");
    } else if (isBetweenDay(d, tempStartDate, tempEndDate)) {
      btn.classList.add("in-range");
    }

btn.addEventListener("click", (e) => {
  e.stopPropagation();

  // Klik pertama = pilih tarikh mula
  if (!tempStartDate || (tempStartDate && tempEndDate)) {
    tempStartDate = startOfDay(d);
    tempEndDate = null;
    renderRangePicker();
    return;
  }

  // Klik kedua = pilih tarikh akhir dan terus apply
  if (d.getTime() < tempStartDate.getTime()) {
    tempEndDate = endOfDay(tempStartDate);
    tempStartDate = startOfDay(d);
  } else {
    tempEndDate = endOfDay(d);
  }

  const start = startOfDay(tempStartDate);
  const end = endOfDay(tempEndDate);

  activeRange = {
    key: "custom",
    start: start.getTime(),
    end: end.getTime()
  };

  if (dateRangeInput) {
    dateRangeInput.value = `${toYMD(start)} → ${toYMD(end)}`;
  }

  rangeButtons.forEach(btn => btn.classList.remove("active"));

  renderRangePicker();
  closeRangePicker();
  renderTabList();
});

    container.appendChild(btn);
  }
}

function renderRangePicker() {
  const leftDate = new Date(pickerBaseDate.getFullYear(), pickerBaseDate.getMonth(), 1);
  const rightDate = new Date(pickerBaseDate.getFullYear(), pickerBaseDate.getMonth() + 1, 1);

  if (pickerTitle) {
    pickerTitle.textContent = `${monthName(leftDate)} - ${monthName(rightDate)}`;
  }

  renderCalendar(leftCalendar, leftMonthTitle, leftDate);
  renderCalendar(rightCalendar, rightMonthTitle, rightDate);
}

function openRangePicker() {
  if (!rangePicker) return;

  const currentStart = activeRange.start ? new Date(activeRange.start) : new Date();
  const currentEnd = activeRange.end ? new Date(activeRange.end) : currentStart;

  tempStartDate = startOfDay(currentStart);
  tempEndDate = endOfDay(currentEnd);
  pickerBaseDate = new Date(currentStart.getFullYear(), currentStart.getMonth(), 1);

  rangePicker.classList.add("open");
  renderRangePicker();
}

function closeRangePicker() {
  rangePicker?.classList.remove("open");
}
function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function historyEmpty(text = "No history found") {
  return typeof window.createEmptyState === "function"
    ? window.createEmptyState(text, "", "center")
    : `<div class="detail-empty">${escapeHtml(text)}</div>`;
}
function safeCount(value) {
  const n = Number(value);
  return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
}
function getSessionActions(item) {
  const actions = item.actions && typeof item.actions === 'object' ? { ...item.actions } : {};
  const labels = item.actionLabels && typeof item.actionLabels === 'object' ? { ...item.actionLabels } : {};
  if (!Object.keys(actions).length) {
    Object.values(item.logs || {}).forEach(log => {
      const name = String(log?.action || '').trim();
      if (!name) return;
      const key = name.toLowerCase().replace(/[.#$[\]/]/g, '_').replace(/\s+/g, '_');
      actions[key] = safeCount(actions[key]) + 1;
      labels[key] = name;
    });
  }
  return { actions, labels };
}
function filteredSessions() {
  const q = searchInput.value.trim().toLocaleLowerCase();
  return allSessions.filter(item => {
    const tab = String(item.tab || '').toLocaleLowerCase();
    const matchSearch = tab.includes(q);
    const openedAt = Number(item.openedAt || 0);
    const matchDate = !activeRange.start || (openedAt >= activeRange.start && openedAt <= activeRange.end);
    return matchSearch && matchDate;
  });
}
function renderTabList() {
  const filtered = filteredSessions();
  document.getElementById('sessionCount').textContent = String(filtered.length);
  document.getElementById('filterSummary').textContent = `${filtered.length} of ${allSessions.length} sessions`;
  if (!filtered.some(x => x.sessionId === selectedSessionId)) selectedSessionId = filtered[0]?.sessionId || '';
  if (!filtered.length) {
    tabList.innerHTML = historyEmpty(allSessions.length ? 'No matching sessions' : 'No saved sessions yet. Open another admin tab to begin tracking.');
    renderDetail();
    return;
  }
  tabList.innerHTML = filtered.map(item => {
    const active = item.sessionId === selectedSessionId;
    const closed = !!item.closedAt;
    const { actions } = getSessionActions(item);
    const total = Object.values(actions).reduce((sum,n)=>sum+safeCount(n),0) || safeCount(item.totalActions);
    return `<button type="button" class="tab-item ${active?'active':''}" data-id="${escapeHtml(item.sessionId)}" aria-pressed="${active}">
      <div class="history-tab-top"><span class="tab-name">${escapeHtml(item.tab || 'Unknown tab')}</span><span class="history-pill ${closed?'closed':'open'}">${closed?'Closed':'Open'}</span></div>
      <div class="tab-meta">Opened ${formatTime(item.openedAt)}</div>
      <div class="history-tab-foot"><span class="history-actions-count">${total} actions</span><span class="history-actions-count">View details ›</span></div>
    </button>`;
  }).join('');
  tabList.querySelectorAll('.tab-item').forEach(btn => btn.addEventListener('click', () => {
    selectedSessionId = btn.dataset.id;
    renderTabList();
    renderDetail();
  }));
  renderDetail();
}
function renderDetail() {
  const item = filteredSessions().find(x => x.sessionId === selectedSessionId);
  if (!item) {
    detailWrap.innerHTML = `<div class="history-welcome"><div class="history-welcome-icon">◷</div><h2>${allSessions.length ? 'No matching session' : 'No activity yet'}</h2><p>${allSessions.length ? 'Try another search or date range.' : 'No activity recorded yet. Open another admin tab to begin tracking.'}</p></div>`;
    return;
  }
  const { actions, labels } = getSessionActions(item);
  const total = Object.values(actions).reduce((sum,n)=>sum+safeCount(n),0) || safeCount(item.totalActions);
  const actionRows = Object.entries(actions).sort((a,b)=>safeCount(b[1])-safeCount(a[1])).map(([key,count]) =>
    `<tr><td>${escapeHtml(labels[key] || key)}</td><td><span class="count-badge">${safeCount(count)}</span></td></tr>`).join('');
  const logs = Object.values(item.logs || {}).sort((a,b)=>Number(b?.time||0)-Number(a?.time||0));
  const logRows = logs.slice(0,50).map(log => `<div class="log-row"><span class="log-action">${escapeHtml(log?.action || 'Activity')}</span><time class="log-time">${formatTime(log?.time)}</time></div>`).join('');
  detailWrap.innerHTML = `
    <div class="history-detail-header"><div><div class="history-section-eyebrow">SESSION OVERVIEW</div><h2>${escapeHtml(item.tab || 'Unknown tab')}</h2><p>Activity summary and recent actions for this session.</p></div><span class="history-pill ${item.closedAt?'closed':'open'}">${item.closedAt?'Closed':'Open'}</span></div>
    <div class="detail-grid">
      <div class="stat-card"><div class="stat-label">Total actions</div><div class="stat-value">${total.toLocaleString()}</div></div>
      <div class="stat-card"><div class="stat-label">Action types</div><div class="stat-value">${Object.keys(actions).length}</div></div>
      <div class="stat-card"><div class="stat-label">Opened at</div><div class="stat-value">${formatTime(item.openedAt)}</div></div>
      <div class="stat-card"><div class="stat-label">Closed at</div><div class="stat-value">${formatTime(item.closedAt)}</div></div>
    </div>
    <div class="history-section-title">Action breakdown</div>
    <div class="table-wrap"><table><thead><tr><th>Action detail</th><th>Total</th></tr></thead><tbody>${actionRows || `<tr><td colspan="2">${historyEmpty('No actions recorded')}</td></tr>`}</tbody></table></div>
    <section class="logs-box"><div class="panel-head">Recent activity <span style="font-size:11px;font-weight:400;color:var(--hist-muted)">Latest ${Math.min(logs.length,50)} of ${logs.length}</span></div><div class="log-list">${logRows || historyEmpty('No activity logs')}</div></section>`;
}

let historyListenerRef = null;
let historyListenerCallback = null;
let historyUserKey = "";
function stopHistoryListener() {
  if (historyListenerRef && historyListenerCallback) historyListenerRef.off("value", historyListenerCallback);
  historyListenerRef = null;
  historyListenerCallback = null;
}
function showHistoryMessage(message, details = "") {
  tabList.innerHTML = historyEmpty(message);
  detailWrap.innerHTML = `<div class="history-welcome"><div class="history-welcome-icon">◷</div><h2>${escapeHtml(message)}</h2><p>${escapeHtml(details)}</p></div>`;
  document.getElementById("sessionCount").textContent = "0";
  document.getElementById("filterSummary").textContent = "";
}
function startHistoryListener(email) {
  if (!email) {
    stopHistoryListener();
    showHistoryMessage("Login required", "Sign in to view your history.");
    return;
  }
  const emailKey = historyEmailKey(email);
  if (historyUserKey === emailKey && historyListenerRef) return;
  stopHistoryListener();
  historyUserKey = emailKey;
  allSessions = [];
  selectedSessionId = "";
  showHistoryMessage("Loading history...", "Fetching your saved sessions.");
  historyListenerRef = db.ref(`tabHistory/${emailKey}/sessions`);
  historyListenerCallback = snap => {
    const data = snap.val() || {};
    allSessions = Object.entries(data).map(([id, item]) => ({
      ...(item && typeof item === "object" ? item : {}),
      sessionId: (item && item.sessionId) || id
    })).sort((a,b) => Number(b.openedAt || 0) - Number(a.openedAt || 0));
    renderTabList();
  };
  historyListenerRef.on("value", historyListenerCallback, error => {
    console.error("History load failed:", error);
    showHistoryMessage("Unable to load history", error?.code === "PERMISSION_DENIED"
      ? "Firebase permission denied. Check the tabHistory read rules for your account."
      : "Check your connection or Firebase database configuration.");
  });
}
function initHistoryAuth() {
  if (typeof auth === "undefined" || !auth || typeof auth.onAuthStateChanged !== "function") {
    showHistoryMessage("Authentication unavailable", "Check firebase.js and Firebase initialization.");
    return;
  }
  auth.onAuthStateChanged(user => {
    if (user && !user.isAnonymous) {
      startHistoryListener(user.email || getLoginData().email);
    } else {
      historyUserKey = "";
      stopHistoryListener();
      allSessions = [];
      showHistoryMessage("Login required", "Please sign in to access your activity history.");
    }
  }, error => {
    console.error("History authentication failed:", error);
    showHistoryMessage("Authentication error", "Unable to verify your login session.");
  });
}

searchInput.addEventListener("input", renderTabList);
window.NewUI?.syncSearch?.(searchInput, {
  onSearch: async () => {
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    renderTabList();
    await new Promise(resolve => setTimeout(resolve, 420));
  }
});
rangeToggleBtn?.addEventListener("click", (e) => {
  e.stopPropagation();
  rangeButtonsWrap?.classList.toggle("show");
  rangeToggleBtn.classList.toggle("active", rangeButtonsWrap?.classList.contains("show"));
});

rangeButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    setActiveRange(btn.dataset.range || "today");

    // pilih range terus hide balik
    rangeButtonsWrap?.classList.remove("show");
    rangeToggleBtn?.classList.remove("active");
  });
});
dateRangeInput?.addEventListener("click", (e) => {
  e.stopPropagation();
  openRangePicker();
});

prevMonthBtn?.addEventListener("click", (e) => {
  e.stopPropagation();
  pickerBaseDate.setMonth(pickerBaseDate.getMonth() - 1);
  renderRangePicker();
});

nextMonthBtn?.addEventListener("click", (e) => {
  e.stopPropagation();
  pickerBaseDate.setMonth(pickerBaseDate.getMonth() + 1);
  renderRangePicker();
});

applyRangeBtn?.addEventListener("click", (e) => {
  e.stopPropagation();
  if (!tempStartDate) return;

  const start = startOfDay(tempStartDate);
  const end = tempEndDate ? endOfDay(tempEndDate) : endOfDay(tempStartDate);

  activeRange = {
    key: "custom",
    start: start.getTime(),
    end: end.getTime()
  };

  if (dateRangeInput) {
    dateRangeInput.value = `${toYMD(start)} → ${toYMD(end)}`;
  }

  rangeButtons.forEach(btn => btn.classList.remove("active"));
  closeRangePicker();
  renderTabList();
});

clearRangeBtn?.addEventListener("click", (e) => {
  e.stopPropagation();
  tempStartDate = null;
  tempEndDate = null;
  setActiveRange("all");
  closeRangePicker();
});

document.addEventListener("click", (e) => {
  if (rangePicker?.classList.contains("open")) {
    if (!rangePicker.contains(e.target) && e.target !== dateRangeInput) {
      closeRangePicker();
    }
  }

  if (rangeButtonsWrap?.classList.contains("show")) {
    if (
      !rangeButtonsWrap.contains(e.target) &&
      !rangeToggleBtn?.contains(e.target)
    ) {
      rangeButtonsWrap.classList.remove("show");
      rangeToggleBtn?.classList.remove("active");
    }
  }
});


setActiveRange("all");
initHistoryAuth();
  (function () {
  const THEME_KEY = "siteTheme";

  function applyChildTheme(theme) {
    document.body.classList.remove("light-theme", "dark-theme");
    document.body.classList.add(theme === "light" ? "light-theme" : "dark-theme");
  }

  applyChildTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");

  window.addEventListener("message", function (e) {
    const allowedOrigins = [
      "https://5g88-main.vercel.app"
    ];
    if (!allowedOrigins.includes(e.origin)) return;

    const data = e.data || {};
    if (data.type === "theme-change") {
      const theme = data.theme === "dark" ? "dark" : "light";
      localStorage.setItem(THEME_KEY, theme);
      applyChildTheme(theme);
    }
  });
})();
</script>
