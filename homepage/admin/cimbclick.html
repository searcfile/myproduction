<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bank Management</title><link rel="stylesheet" href="new-ui.css"><style>body{margin:0;background:#000;color:#eee;font:14px Arial,sans-serif}.page{padding:12px}.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}.btn{background:#1668dc;color:white;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}.card{background:#141414;border:1px solid #424242;border-radius:12px;padding:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;margin-bottom:6px}input{width:100%;height:32px;box-sizing:border-box;background:#141414;border:1px solid #424242;border-radius:6px;padding:0 11px;color:white}input:focus{outline:1px solid #1668dc}.row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #333;padding:10px 0}.muted{color:#999}.dialog{border:1px solid #424242;border-radius:12px;background:#141414;color:white;width:min(440px,calc(100vw - 32px))}.dialog::backdrop{background:#000b}.dialog .field{margin:12px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}}</style></head><body><div class="page"><div class="toolbar"><button class="btn" id="manage">Manage Banks</button><button class="btn" id="create">+ Create Bank</button></div><section class="card"><h3>Bank Settings</h3><div class="grid"><div><label>Select Bank</label><select id="bank" data-shared-dropdown data-placeholder="Select Bank"><option value="">Select Bank</option></select></div><div><label>Bank Name</label><input id="name" readonly placeholder="Select bank"></div><div><label>Bank Code</label><input id="code" readonly placeholder="Bank code"></div></div><div class="row"><span class="muted">Bank directory only. No transaction receipt generation.</span></div></section><section class="card" id="listing" style="margin-top:14px" hidden><h3>Manage Banks</h3><div id="items"></div></section></div><dialog class="dialog" id="editor"><form method="dialog" id="editform"><h3 id="heading">Create Bank</h3><div class="field"><label>Bank Name</label><input id="editname" required maxlength="100"></div><div class="field"><label>Bank Code (optional)</label><input id="editcode" maxlength="30"></div><div class="row" style="justify-content:flex-end"><button value="cancel" type="button" id="cancel" class="btn" style="background:#333">Cancel</button><button type="submit" class="btn">Save</button></div></form></dialog><script src="new-ui.js"></script><script>
(()=>{'use strict';const KEY='bank_directory_v1';let banks=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))banks=x.filter(v=>v&&typeof v.name==='string'&&typeof v.id==='string')}catch{}const $=id=>document.getElementById(id);let editing=null;function persist(){localStorage.setItem(KEY,JSON.stringify(banks))}function render(){const s=$('bank'),old=s.value;s.replaceChildren(new Option('Select Bank',''));banks.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(b=>s.add(new Option(b.name,b.id)));s.value=banks.some(b=>b.id===old)?old:'';if(s._sharedDropdown&&s._sharedDropdown.refresh)s._sharedDropdown.refresh();update();const list=$('items');list.replaceChildren();if(!banks.length){const d=document.createElement('p');d.className='muted';d.textContent='No banks added';list.append(d)}banks.forEach(b=>{const row=document.createElement('div');row.className='item';const title=document.createElement('span');title.textContent=b.name+(b.code?' · '+b.code:'');const actions=document.createElement('span');const edit=document.createElement('button');edit.className='btn';edit.textContent='Edit';edit.onclick=()=>openEditor(b);const del=document.createElement('button');del.className='btn';del.style.background='#b42335';del.style.marginLeft='6px';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete '+b.name+'?')){banks=banks.filter(x=>x.id!==b.id);persist();render()}};actions.append(edit,del);row.append(title,actions);list.append(row)})}function update(){const b=banks.find(x=>x.id===$('bank').value);$('name').value=b?.name||'';$('code').value=b?.code||''}function openEditor(b){editing=b?.id||null;$('heading').textContent=b?'Edit Bank':'Create Bank';$('editname').value=b?.name||'';$('editcode').value=b?.code||'';$('editor').showModal();$('editname').focus()}$('bank').addEventListener('change',update);$('manage').onclick=()=>{$('listing').hidden=!$('listing').hidden};$('create').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('editform').onsubmit=e=>{e.preventDefault();const name=$('editname').value.trim(),code=$('editcode').value.trim();if(!name)return;if(banks.some(b=>b.name.toLowerCase()===name.toLowerCase()&&b.id!==editing)){alert('Bank already exists');return}if(editing){const b=banks.find(x=>x.id===editing);if(b){b.name=name;b.code=code}}else banks.push({id:crypto.randomUUID(),name,code});persist();$('editor').close();render()};render();if(typeof createSharedDropdown==='function')createSharedDropdown($('bank'),{placeholder:'Select Bank'});})();
</script></body></html>
