<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bank Management · UI Demo</title><link rel="stylesheet" href="./new-ui.css"><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#ddd;font:14px system-ui,Arial,sans-serif}.workspace{padding:12px}.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}.button{border:0;border-radius:6px;background:#1668dc;color:white;cursor:pointer;height:32px;padding:0 16px;font:inherit}.button.secondary{background:#202020;border:1px solid #444}.settings{border:1px solid #414141;border-radius:12px;background:#141414;padding:12px}.settings h2{font-size:13px;margin:2px 0 16px}.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{min-width:0}.field label{display:block;font-size:12px;margin-bottom:6px;color:#aaa}.field input{width:100%;height:32px;padding:0 11px;border-radius:6px;border:1px solid #424242;background:#141414;color:#eee;outline:none;font:inherit}.field input:focus{border-color:#1668dc}.divider{border:0;border-top:1px solid #333;margin:16px 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.preview{margin-top:16px;max-width:540px;min-height:140px;border:1px dashed #555;border-radius:8px;padding:20px;color:#aaa}.preview strong{display:block;font-size:18px;color:#eee;margin-bottom:8px}.modal-backdrop{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9999;padding:15px}.modal-backdrop.open{display:flex}.dialog{width:min(100%,470px);border:1px solid #444;border-radius:12px;background:#191919;padding:20px}.dialog h2{margin:0 0 18px;font-size:17px}.dialog .field{margin-bottom:12px}.dialog-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.bank-list{display:grid;gap:8px;max-height:50vh;overflow:auto}.bank-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #444;border-radius:8px;padding:10px}.bank-row .meta{min-width:0;overflow-wrap:anywhere}.bank-row small{color:#999;display:block;margin-top:4px}.bank-row .buttons{display:flex;gap:6px}.hint{color:#999;font-size:12px;margin:10px 0 0}@media(max-width:900px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.fields{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar .button{flex:1}.bank-row{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="workspace"><div class="toolbar"><button class="button" id="manage">Manage Banks</button><button class="button" id="create">+ Create Bank</button></div><section class="settings"><h2>Bank Settings · DEMO</h2><div class="fields"><div class="field"><label for="bank">Select Bank</label><select id="bank" data-shared-dropdown data-placeholder="Select Bank"><option value="">Select Bank</option></select></div><div class="field"><label for="recipient">Recipient Name (sample)</label><input id="recipient" placeholder="Sample name"></div><div class="field"><label for="date">Date & Time (sample)</label><input id="date" type="datetime-local"></div><div class="field"><label for="reference">Internal Reference (sample)</label><input id="reference" placeholder="DEMO-0001"></div></div><hr class="divider"><div class="actions"><button class="button secondary" id="reset">Reset</button><button class="button" id="show">Show Demo</button></div></section><div class="preview" aria-live="polite"><strong>DEMO · NOT PROOF OF PAYMENT</strong><div id="demo">Select a bank to preview its configuration. No transaction receipt is generated.</div></div><p class="hint">Bank data is saved in this browser only (localStorage). Firebase sync requires a separately secured backend.</p></div><div class="modal-backdrop" id="modal" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">Create Bank</h2><div id="edit-fields"><div class="field"><label for="bank-name">Bank Name</label><input id="bank-name" maxlength="100" placeholder="Bank name"></div><div class="field"><label for="bank-code">Bank Code</label><input id="bank-code" maxlength="32" placeholder="e.g. BANK01"></div></div><div class="bank-list" id="bank-list" hidden></div><div class="dialog-footer"><button class="button secondary" id="cancel">Close</button><button class="button" id="save">Save Bank</button></div></div></div><script src="./new-ui.js"></script><script>
(()=>{'use strict';const KEY='bank_manager_demo_v1';let banks=[];try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(stored))banks=stored.filter(b=>b&&typeof b.name==='string'&&typeof b.code==='string')}catch(e){}let editing=null;const $=id=>document.getElementById(id);const toast=(m,t='info')=>window.NewUI?.showToast?.(m,t)||alert(m);function persist(){localStorage.setItem(KEY,JSON.stringify(banks))}function refresh(){const select=$('bank'),v=select.value;select.replaceChildren(new Option('Select Bank',''));banks.forEach(b=>select.add(new Option(b.name,b.code)));select.value=banks.some(b=>b.code===v)?v:'';select._sharedDropdown?.refresh?.();select._sharedDropdown?.update?.();}function close(){$('modal').classList.remove('open')}function open(mode,code=null){editing=code;$('bank-list').hidden=mode!=='manage';$('edit-fields').hidden=mode==='manage';$('save').hidden=mode==='manage';$('modal-title').textContent=mode==='manage'?'Manage Banks':code?'Edit Bank':'Create Bank';if(mode==='manage')renderList();else{const b=banks.find(x=>x.code===code);$('bank-name').value=b?.name||'';$('bank-code').value=b?.code||''}$('modal').classList.add('open')}function renderList(){const list=$('bank-list');list.replaceChildren();if(!banks.length){list.textContent='No banks created yet.';return}banks.forEach(b=>{const row=document.createElement('div');row.className='bank-row';const meta=document.createElement('div');meta.className='meta';meta.textContent=b.name;const sub=document.createElement('small');sub.textContent=b.code;meta.appendChild(sub);const buttons=document.createElement('div');buttons.className='buttons';const edit=document.createElement('button');edit.className='button';edit.textContent='Edit';edit.onclick=()=>open('edit',b.code);const del=document.createElement('button');del.className='button secondary';del.textContent='Delete';del.onclick=()=>{if(!confirm('Delete '+b.name+'?'))return;banks=banks.filter(x=>x.code!==b.code);persist();refresh();renderList();toast('Bank deleted','success')};buttons.append(edit,del);row.append(meta,buttons);list.append(row)})}function save(){const name=$('bank-name').value.trim(),code=$('bank-code').value.trim().toUpperCase();if(!name||!code){toast('Enter bank name and code','error');return}if(!/^[A-Z0-9_-]{2,32}$/.test(code)){toast('Bank code: 2-32 letters, digits, - or _','error');return}if(banks.some(b=>b.code===code&&b.code!==editing)){toast('Bank code already exists','error');return}if(editing)banks=banks.filter(b=>b.code!==editing);banks.push({name,code});banks.sort((a,b)=>a.name.localeCompare(b.name));persist();refresh();$('bank').value=code;$('bank')._sharedDropdown?.refresh?.();close();toast('Bank saved','success')}function show(){const b=banks.find(x=>x.code===$('bank').value);$('demo').textContent=b?'Selected bank: '+b.name+' ('+b.code+'). Sample recipient: '+($('recipient').value.trim()||'—')+'. Reference: '+($('reference').value.trim()||'—')+'.':'Select a bank first.'}window.addEventListener('DOMContentLoaded',()=>{refresh();if(window.NewUI?.dropdown&&!$('bank')._sharedDropdown)window.NewUI.dropdown($('bank'));$('manage').onclick=()=>open('manage');$('create').onclick=()=>open('create');$('cancel').onclick=close;$('save').onclick=save;$('show').onclick=show;$('reset').onclick=()=>{$('recipient').value='';$('date').value='';$('reference').value='';$('bank').value='';$('demo').textContent='Select a bank to preview its configuration. No transaction receipt is generated.';$('bank')._sharedDropdown?.refresh?.()};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()})})})();
</script></body></html>
