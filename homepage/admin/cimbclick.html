<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <title>CIMB Clicks</title>

  <style>
    :root{
    --page-bg: #000;
    --page-text: rgba(255,255,255,0.85);
    --page-input: #141414;
    --border-input:#424242;
    --page-bg2:#1f1f1f;
    --name:#1668dc;
    --blur:rgba(255,255,255,0.25);

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
  }

  body.light-theme{
    --page-bg: #ffffff;
    --page-text: rgba(0,0,0,0.88);
    --page-input: #ffffff;
    --border-input:#d9d9d9;
    --page-bg2:#ffffff;
    --name:#1668dc;
    --blur:rgba(0,0,0,0.25);

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
  }
body {
      font-family: "Open Sans", Verdana, Helvetica, sans-serif;
      background:var(--page-bg);
      margin: 0;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #f4f4f4;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .footer{display:none !important;}
    .status-bar {
      background: #e5e5e5;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-bar .left {
      gap: 8px;  
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #000;
    }
.cimb-success-icon{
  width: 18px;
  height: 18px;
  background: #7db680;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.check-img{
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
    .success-text {
      color: rgb(125, 182, 128);
      font-weight: 700;
    }
    .details {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      border-bottom: 1px solid #d6d6d6;
    }
    .left, .right {
      width: 48%;
    }
    .label {
      font-size: 14px;
      color: #555;
    }
    .value {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 16px;
      color: #000;
      white-space: nowrap;
    }
    .amount-label {
     font-size: 20px;
     font-weight: 700;
     margin-bottom: 8px;
     color: #000; 
    }
    .amount {
     font-weight: bold;
     color: #000;
     margin-bottom: 10px;
    }
    .currency {
     font-size: 11px;
     position: relative;
     margin-right: 2px;
     top: -10px;
     font-weight: 850;
    }
    #main-amount {
     font-size: 20px;
     position: relative;
     top: 0;
     font-weight: 720;
    }
    .sen {
     font-size: 11px;
     position: relative;
     top: -10px;
     margin-left: 1px;
     font-weight: 700;
    }  
    .charges {
     font-size: 13px;
     color: #000;
     top: -8px;
     position: relative;
    }
    .charge-amount {
     font-size: 12px;
     position: relative;
     top: 0;
     font-weight: bold;
    }
    .charge-sen {
     font-size: 8px;
     position: relative;
     font-weight: bold;
     top: -3px;
    }
    .charges .currency {
     top: -3px;
     font-size: 8px;
     position: relative;
    }
    .footer {
     padding: 10px 5px 20px;
     background: #fff;
     font-size: 13px;
     color: #d50000;
     font-weight: 500;
     border-top: 1px solid #ccc;
    }
    .top-inputs {
     width: 100%;;
    }

    #transfer-date, #ref-number {
     font-family: Open Sans;
     font-size: 14px;
      color:#000;
    }

.btn-update{
  width:100%;
  height: 32px;
  padding: 0 15px;
  font-size: 14px;
  border: 1px solid transparent;
  border-radius: 6px;
  background-color: var(--blue);
  color: white;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-reset{
  width:100%;
  height: 32px;
  padding: 0 15px;
  font-size: 14px;
  border: 1px solid var(--border-input);
  border-radius: 6px;
  background-color:var(--page-input);
  color: var(--page-text);
  cursor: pointer;
  transition: all 0.2s;
}
    @media (max-width: 600px) {
    .left, .right {
    width: 100%;
    }
  }
  /* ===== NEW LAYOUT: builder kiri, preview kanan ===== */
.app-layout{
  width: calc(100% - 24px);
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin: 16px 12px;
}

/* panel kiri */
.builder-panel{
  width: 540px;
  flex: 0 0 540px;
  position: sticky;
  top: 16px;
}

/* panel kanan */
.preview-panel{
  flex: 1;
  min-width: 0;
}
.preview-panel{
  flex: 0 0 540px;
  width: 540px;
  max-width: 540px;
}
/* susun input dalam panel kiri */
.builder-row{
  background: transparent;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* preview jangan auto-center 700px, bagi responsive */
.container{
  max-width: none;
  width: 100%;
  margin: 0;
}

/* mobile: jadi atas-bawah */
@media (max-width: 1085px){
  .app-layout{
    width: calc(100% - 24px);
    flex-direction: column;
    align-items: stretch;
    margin: 16px 12px;
  }

  .builder-panel{
    width: 100%;
    max-width: 100%;
    flex: 0 0 auto;
    position: relative;
    top: auto;
  }

  .container{
    width: 100%;
    max-width: 100%;
    margin: 0;
  }
}
@media (max-width: 678px){
    .preview-panel{
    width: 100%;
    max-width: 100%;
    flex: 0 0 auto;
  }
}
  .btn-row{
  display: flex;
  gap: 8px;
  width: 100%;
}
.btn-row > button{
  flex: 1;
  min-width: 0;
}
.builder-field label{
  font-size: 12px;
  color: var(--page-text);
  display: block;
}

.input-row{
  display: flex;
  gap: 8px;
  align-items: center;
}

.input-row input, input{
  flex: 1;
    width: 100%;
    height: 32px;
    min-width: 0;
    padding: 4px 11px;
    border: 1px solid var(--input-line);
    border-radius: 6px;
    outline: none;
    color: var(--text);
    background: var(--input);
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.5;
    caret-color: var(--caret-color);
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
}

.btn-now{
  flex: 0 0 90px;        /* lebar Now */
  height: 32px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: var(--blue);
  color: white;
  font-size: 14px;
  cursor: pointer;
  transition: all .2s;
}
.btn-update:active{ background:var(--blue-active)!important;}
.btn-reset:hover{ color:var(--blue-hover);border:1px solid var(--blue-hover);}
.btn-reset:active{ color:var(--blue-active)!important;border:1px solid var(--blue-active);}
.btn-now:hover{ background:var(--blue-hover);}
.btn-now:active{ background:var(--blue-active)!important;}
.btn-update:hover{ background:var(--blue-hover);}
*, *::before, *::after { box-sizing: border-box; }
.builder-row-2{
  display: flex;
  width: 100%;
  gap:8px;
}

.builder-row-2 .builder-field{
  flex: 1;
  display: flex;
  flex-direction: column;
}

    #account-number, #recipient-name{
  letter-spacing: 0.5px;
}
.blur{
  display: inline-block;
  filter: blur(5px);
  opacity: .9;
}

.keep{
  display: inline-block;
}
.btn-now.off{
  background:var(--page-input);
  border-color:var(--border-input);
  color:var(--page-text);
  opacity:.9;
}
input::placeholder{
  color: var(--blur);
}
:where(button, a, .btn, [tabindex]):focus-visible{
  outline: 3px solid #15325b;
  outline-offset: 1px;
  transition: outline-offset 0s, outline 0s;
}
:where(.input, input:not(.shared-input), textarea):focus{
  border-color: #1668dc !important;
  outline: 0 !important;
  transition: all .2s ease;
}
select:focus,
select:focus-visible{
  border-color: #1668dc !important;
  outline: none !important;
  transition: all .2s ease;
}
/* Chrome, Edge, Safari */
::-webkit-scrollbar {
  width: 6px; /* nipis */
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #555;
  border-radius: 10px;
  transition: all 0.25s ease;
}

::-webkit-scrollbar-thumb:hover {
  background: #777;
}

/* Firefox */
html {
  scrollbar-width: thin;
  scrollbar-color: #555 transparent;
}
  
/* =====================================================
   SETTINGS UI ONLY — preview markup/styles untouched
   ===================================================== */
.app-layout {
  display: flex !important;
  flex-direction: column !important;
  align-items: flex-start !important;
  gap: 12px !important;
  width: calc(100% - 24px) !important;
  margin: 16px 12px !important;
}
.app-layout > .builder-panel {
  position: static !important;
  top: auto !important;
  flex: 0 0 auto !important;
  width: 100% !important;
  max-width: 100% !important;
  padding: 12px;
  border: 1px solid var(--border-input);
  border-radius: 12px;
  background: var(--page-input);
}
.builder-panel .builder-row {
  display: grid !important;
  grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
  gap: 8px !important;
  align-items: end;
}
.builder-panel .builder-row > * { min-width: 0; }
.builder-panel .builder-row > .btn-row {
  grid-column: 1 / -1;
  justify-content: flex-start;
}
.builder-panel .btn-row > button { flex: 0 1 150px; }
.app-layout > .preview-panel {
  flex: 0 0 auto !important;
  align-self: flex-start !important;
}
@media (max-width: 1000px) {
  .builder-panel .builder-row {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  }
}
@media (max-width: 600px) {
  .builder-panel .builder-row {
    grid-template-columns: minmax(0, 1fr) !important;
  }
  .builder-panel .btn-row { flex-wrap: wrap; }
  .builder-panel .btn-row > button { flex: 1 1 calc(50% - 8px); }
}

/* ==========================================
   CIMB CLICKS - PREVIEW OUTER PANEL
   STYLE SEPERTI MEGA888
   ========================================== */


/* CIMB - OUTER PREVIEW PANEL SCROLL */
.cimb-preview-outer {
  width: 100%;
  min-width: 0;
  max-width: 100%;

  padding: 12px;
  background: var(--page-input);
  border: 1px solid var(--border-input);
  border-radius: 12px;
  box-sizing: border-box;

  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}


/* Wrapper preview memenuhi lebar panel */
.app-layout > .preview-panel {
  width: 100% !important;
  max-width: 100% !important;
  flex: 0 0 auto !important;
  align-self: stretch !important;
}

/* Receipt kekal saiz asal */
.cimb-preview-outer > .container {
  width: 100%;
  max-width: 540px;
  margin: 0;
}

/* Mobile */
@media (max-width: 650px) {
  .cimb-preview-outer > .container {
    max-width: 100%;
  }
}
/* ==========================================
   CIMB CLICKS - NO DATA CARD
   ========================================== */

.cimb-empty-card {
  width: 100%;
  min-height: 185px;
  padding: 12px;
  background: var(--page-input);
  border: 1px solid var(--border-input);
  border-radius: 12px;
  box-sizing: border-box;

  display: flex;
  align-items: center;
  justify-content: center;
}

.cimb-empty-card .shared-empty {
  width: 100%;
  min-height: 160px;
}

/* Dynamic Bank Management: only settings UI, receipt unchanged */
/* CREATE BANK & MANAGE BANKS - AUTO WIDTH */
.cimb-bank-actions {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
  width: 100%;
}

.cimb-bank-actions button {
  flex: 0 0 auto !important;
  width: auto !important;
  min-width: max-content !important;
  max-width: none !important;
  padding: 0 15px !important;
  white-space: nowrap !important;
  font-size: 14px;
}
.cimb-bank-form{display:grid;gap:12px}
.cimb-bank-form label{display:grid;gap:5px;font-size:13px;color:var(--page-text)}
.cimb-bank-form .cimb-bank-form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cimb-bank-form-actions{display:flex;justify-content:flex-end;gap:8px;}
.cimb-bank-form-actions button{width:auto;min-width:92px}
.cimb-bank-list{display:grid;gap:8px;max-height:55vh;overflow:auto}
.cimb-bank-list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border:1px solid var(--border-input);border-radius:8px;color:var(--page-text)}
.cimb-bank-list-row small{display:block;opacity:.65;margin-top:4px}
.cimb-bank-list-row .cimb-bank-list-buttons{display:flex;gap:6px;flex-shrink:0}
@media(max-width:550px){.cimb-bank-form .cimb-bank-form-row{grid-template-columns:1fr}.cimb-bank-list-row{flex-wrap:wrap}}
/* Other action buttons - prevent text wrapping */
.builder-panel .btn-row button {
  white-space: nowrap;
  min-width: 0;
}

@media (max-width: 550px) {
  .builder-panel .btn-row button {
    font-size: 14px;
    padding-left: 6px;
    padding-right: 6px;
  }
}
/* FIX ACTION BUTTONS - AUTO WIDTH */
.builder-panel .btn-row {
  display: flex !important;
  flex-wrap: wrap !important;
  align-items: center;
  justify-content: flex-start !important;
  gap: 8px;
  width: 100%;
  min-width: 0;
}

.builder-panel .btn-row > button {
  flex: 0 0 auto !important;
  width: auto !important;
  min-width: max-content !important;
  max-width: none !important;
  padding: 0 15px !important;
  white-space: nowrap !important;
  font-size: 14px;
}
    /* ==========================================
   CIMB - BOTTOM ACTIONS LEFT & RIGHT
   ========================================== */

.builder-panel .cimb-bottom-actions {
  grid-column: 1 / -1 !important;
  width: 100%;
  min-width: 0;

  display: flex !important;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

/* LEFT: Create, Blur, Copy Image, Reset */
.builder-panel .cimb-bottom-actions .btn-row {
  display: flex !important;
  align-items: center;
  justify-content: flex-start !important;
  flex: 0 1 auto;
  width: auto !important;
  gap: 8px;
  flex-wrap: wrap;
}

.builder-panel .cimb-bottom-actions .btn-row > button {
  flex: 0 0 auto !important;
  width: fit-content !important;
  min-width: 0 !important;
  height: 32px;
  padding: 0 15px !important;
  white-space: nowrap;
}

/* RIGHT: Create Bank & Manage Banks */
.builder-panel .cimb-bottom-actions .cimb-bank-actions {
  display: flex !important;
  align-items: center;
  justify-content: flex-end !important;
  flex: 0 0 auto;
  width: auto !important;
  gap: 8px;
  margin: 0 !important;
  margin-left: auto !important;
}

.builder-panel .cimb-bottom-actions .cimb-bank-actions > button {
  flex: 0 0 auto !important;
  width: fit-content !important;
  min-width: 0 !important;
  height: 32px;
  padding: 0 15px !important;
  white-space: nowrap;
}

/* ==========================================
   CIMB CLICKS - MOBILE BUTTONS 2 GRID
   ========================================== */

@media (max-width: 650px) {

  /* Wrapper utama */
  .builder-panel .cimb-bottom-actions {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) !important;
    gap: 8px !important;
    width: 100% !important;
    min-width: 0 !important;
    align-items: stretch !important;
  }

  /* Empat tombol utama */
  .builder-panel .cimb-bottom-actions .btn-row {
    display: grid !important;

    min-width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  /* Dua tombol bank */
  .builder-panel .cimb-bottom-actions .cimb-bank-actions {

    margin: 0 !important;

  /* Semua tombol ikut lebar grid */
  .builder-panel .cimb-bottom-actions .btn-row > button,

}
</style>

function randDigits(n){
  let s = "";
  for(let i=0;i<n;i++) s += Math.floor(Math.random()*10);

}

function buildAccountNumber(bankName){
  const cfg = BANK_CONFIG[bankName];
  if(!cfg) return "7002795979";

  const head = (cfg.prefix ?? cfg.start ?? "");
  const need = Math.max(0, (cfg.len || 10) - head.length);
  return head + randDigits(need);
}
function buildZeroAccount(bankName){

// ===== FORMAT DATE TIME =====
function getFormattedDateTime() {
  const now = new Date();

  const day = String(now.getDate()).padStart(2, "0");
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const month = monthNames[now.getMonth()];
  const year = now.getFullYear();

  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, "0");
  const seconds = String(now.getSeconds()).padStart(2, "0");

  const ampm = hours >= 12 ? "pm" : "am";
  hours = hours % 12 || 12;

  return `${day} ${month} ${year}, ${String(hours).padStart(2, "0")}:${minutes}:${seconds} ${ampm}`;
}

// ===== FORMAT AMOUNT WITH COMMAS =====
function formatNumberWithCommas(numStr) {
  const cleaned = String(numStr ?? "").replace(/[^\d.]/g, "");
  if (cleaned === "") return "";
  const [whole, decimal] = cleaned.split(".");
  const formattedWhole = (parseInt(whole || "0", 10)).toLocaleString("en-MY");
  return formattedWhole + (decimal !== undefined ? "." + decimal : "");
}

async function copyReceiptImage() {
  const target = document.querySelector(".container");
  if (!target) return;

  try {
    const canvas = await html2canvas(target, {
      backgroundColor: null,
      scale: 2,
      useCORS: true
    });

    const blob = await new Promise((resolve, reject) => {
      canvas.toBlob(
        result => result
          ? resolve(result)
          : reject(new Error("Failed to create image")),
        "image/png"
      );
    });

    await navigator.clipboard.write([
      new ClipboardItem({
        "image/png": blob
      })
    ]);

    sendUserAction("COPY IMAGE", {
      method: "button"
    });

    // SUCCESS TOAST
    if (typeof window.showToast === "function") {
      window.showToast("Image copied successfully!", "success");
    }

  } catch (err) {
    console.error("Copy image failed:", err);

    // ERROR TOAST
    if (typeof window.showToast === "function") {
      window.showToast(
        "Copy image failed. Please allow clipboard permission.",
        "error"
      );
    }
  }
}

    "cimbEmptyContent"
  );

  if (!receiptCard || !emptyCard || !emptyContent) {
    return;
  }

  let hasData = false;

  try {
    const stored = JSON.parse(
      localStorage.getItem("displayData") || "null"
    );

    hasData = Boolean(
      stored &&
      stored.mode !== "reset"
    );
  } catch (error) {
    hasData = false;
  }

  receiptCard.style.display = hasData ? "" : "none";
  emptyCard.style.display = hasData ? "none" : "flex";

  if (!hasData) {
    if (typeof window.showEmptyState === "function") {
      window.showEmptyState(
        emptyContent,
        "No data",
        "large",
        "center"
      );
    } else {
      emptyContent.textContent = "No data";
    }
  }
}

/* Selepas tekan Create */
document.getElementById("btn-create")
  ?.addEventListener("click", () => {
    updateCimbEmptyState();
  });

/* Selepas tekan Reset */
document.getElementById("btn-reset")
  ?.addEventListener("click", () => {
    updateCimbEmptyState();
  });

/* Restore selepas refresh */
window.addEventListener("DOMContentLoaded", () => {
  updateCimbEmptyState();
});
document.addEventListener("keydown", function(e) {
  const key = String(e.key || "").toLowerCase();

  if ((e.ctrlKey || e.metaKey) && key === "c") {
    const active = document.activeElement;
    const isTyping = active && (
      active.tagName === "INPUT" ||
      active.tagName === "TEXTAREA" ||
      active.isContentEditable
    );

    if (isTyping) return;

    e.preventDefault();
    copyReceiptImage();
  }
}, true);

/* =====================================================
   CIMB CLICKS - FIREBASE BANK CATALOG
   Uses existing Firebase compat SDK and existing NewUI.
   RTDB rules must restrict writes to authorized admins.
   ===================================================== */
const bankToast = (message, type="success") => {
  if (typeof window.showToast === "function") window.showToast(message, type);
  else console[type === "error" ? "error" : "log"](message);
};
const bankDb = () => {
  try {
    if (!window.firebase || !firebase.apps.length) return null;
    return firebase.database().ref(BANK_DB_PATH);
  } catch (error) {
    console.error("Bank catalog Firebase:", error);
    return null;
  }
};
const bankEscape = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
})[char]);
function normalizedBankRecord(value) {
  if (!value || typeof value !== "object") return null;
  const name = String(value.name || "").trim();
  const len = Number(value.len);
  const rule = value.rule === "start" ? "start" : "prefix";
  const digits = String(value.digits ?? "");
  if (!name || name.length > 100 || !Number.isInteger(len) || len < 1 || len > 30 ||
      !/^\d*$/.test(digits) || digits.length > len) return null;
  return {name,len,rule,digits,active:value.active !== false};
}
function refreshBankCatalog() {
  if (!bankCatalogLoaded) return;

  const active = Object.values(BANK_RECORDS)
    .filter(bank => bank.active);

  BANK_CONFIG = Object.fromEntries(
    active.map(bank => [
      bank.name,
      {
        len: bank.len,
        [bank.rule]: bank.digits
      }
    ])
  );

  if (!BANK_CONFIG[selectedBank]) {
    selectedBank = Object.keys(BANK_CONFIG)[0] || "";

    if (selectedBank) {
      localStorage.setItem("selectedBank", selectedBank);

      lastRealAcc = buildAccountNumber(selectedBank);

      toggleAccountNameByBank(selectedBank);
      updateBankChargeCurrencyVisibility(selectedBank);
    } else {
      localStorage.removeItem("selectedBank");
      lastRealAcc = "";
      toggleAccountNameByBank("");
      updateBankChargeCurrencyVisibility("");
    }
  }

renderBankMenu();
}
function initFirebaseBanks() {
  const ref = bankDb();
  if (!ref) {
    bankToast("Data belum siap. Tidak dapat memuatkan senarai bank.", "warning");
    return;
  }
  ref.on("value", snap => {
    const records = {};
    snap.forEach(child => {
      const normalized = normalizedBankRecord(child.val());
      if (normalized) records[child.key] = normalized;
    });
    BANK_RECORDS = records;
    bankCatalogLoaded = true;
    refreshBankCatalog();
  }, error => bankToast("Tidak dapat membaca bank Firebase: " + error.message, "error"));
}
function bankFormModal(id=null) {
  if (!window.NewUI?.modal?.open) return bankToast("Custom modal belum tersedia.", "error");
  const current = id ? BANK_RECORDS[id] : null;
  const content = document.createElement("form");
  content.className = "cimb-bank-form";
content.innerHTML = `
  <label>Bank Name
    <input name="name" data-new-ui-input
      maxlength="100" required
      placeholder="Bank name"
      value="${bankEscape(current?.name || "")}">
  </label>

  <div class="cimb-bank-form-row">
    <label>Account Length
      <input name="len" data-new-ui-input
        type="number" min="1" max="30" required
        value="${current?.len ?? 10}">
    </label>

    <label>Number Rule
      <select name="rule"
        data-shared-dropdown
        data-placeholder="Select rule">
        <option value="prefix">Prefix</option>
        <option value="start">Start</option>
      </select>
    </label>
  </div>

  <label>Prefix / Start digits
    <input name="digits" data-new-ui-input
      inputmode="numeric" pattern="[0-9]*"
      placeholder="Example: 7 Or 88"
      value="${bankEscape(current?.digits ?? "")}">
  </label>

<div style="
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
  width:100%;
">
  <span style="
    font-size:12px;
    color:var(--page-text);
    font-weight:400;
  ">Status</span>

  <label class="shared-active-switch">

    <input
      name="active"
      type="checkbox"
      data-active-label="Active"
      data-inactive-label="Inactive"
      ${current?.active === false ? "" : "checked"}
    >

    <span class="shared-active-track">
      <span class="shared-active-text"></span>
      <span class="shared-active-knob" aria-hidden="true"></span>
    </span>

  </label>

</div>

  <div class="cimb-bank-form-actions">
    <button type="button" class="btn-cancel-new" data-cancel>
      Cancel
    </button>
    <button type="submit" class="btn-primary-new" data-save>
      ${id ? "Save Changes" : "Create Bank"}
    </button>
  </div>
`;
  content.elements.rule.value = current?.rule || "prefix";
  const modal = NewUI.modal.open({title:id ? "Edit Bank" : "Create Bank",content,width:720});
  NewUI.init(content);
  NewUI.activeSwitch.init(content);
  content.querySelector("[data-cancel]").addEventListener("click",()=>modal.close());
  content.addEventListener("submit", async event => {
    event.preventDefault();
    const ref = bankDb();
    if (!ref) return bankToast("Firebase belum tersedia.", "error");
    const value = normalizedBankRecord({
      name:content.elements.name.value, len:Number(content.elements.len.value),
      rule:content.elements.rule.value, digits:content.elements.digits.value.trim(),
      active:content.elements.active.checked
    });
    if (!value) return bankToast("Semak nama bank, length dan digits.", "warning");
    if (Object.entries(BANK_RECORDS).some(([key,other])=>key!==id && other.name.toLowerCase()===value.name.toLowerCase()))
      return bankToast("Nama bank sudah wujud.", "warning");
const saveButton = content.querySelector("[data-save]");

await NewUI.setButtonLoading(saveButton, true, {
  text: id ? "Saving..." : "Creating..."
});
    try {
      await (id ? ref.child(id) : ref.push()).set({...value,updatedAt:firebase.database.ServerValue.TIMESTAMP});
localStorage.setItem("cimb_bank_catalog_initialized", "1");

// Tunggu loading minimum 700ms seperti MEGA888
await NewUI.setButtonLoading(saveButton, false, {
  minDuration: 700
});

// Tutup modal selepas loading selesai
modal.close();

bankToast(
  id ? "Bank updated successfully" : "Bank created successfully",
  "success"
);
    } catch (error) {
      bankToast("Gagal simpan bank: " + error.message,"error");
} finally {
  await NewUI.setButtonLoading(saveButton, false);
}
  });
}
function bankManageModal() {
  if (!window.NewUI?.modal?.open) return bankToast("Custom modal belum tersedia.", "error");
  const content = document.createElement("div");
  const toolbar = document.createElement("div");
  toolbar.className = "cimb-bank-form-actions";
  toolbar.style.marginBottom = "12px";
  const addButton = document.createElement("button");
  addButton.type="button"; addButton.className="btn-update";addButton.textContent="+ Create Bank";
  toolbar.append(addButton);
  const list = document.createElement("div");list.className="cimb-bank-list";
  content.append(toolbar,list);
  const modal = NewUI.modal.open({title:"Manage Banks",content,width:720});
  function renderList() {
    list.replaceChildren();
    const records = Object.entries(BANK_RECORDS).sort((a,b)=>a[1].name.localeCompare(b[1].name));
    if (!records.length) {
      if (window.showEmptyState) window.showEmptyState(list,"No data","large","center");
      else list.textContent="No data";
      return;
    }
    for (const [key,bank] of records) {
      const row=document.createElement("div");row.className="cimb-bank-list-row";
      const description=document.createElement("div");
      const strong=document.createElement("strong");strong.textContent=bank.name;
      const detail=document.createElement("small");
      detail.textContent=`Length: ${bank.len} · ${bank.rule}: ${bank.digits || "(none)"} · ${bank.active ? "Active" : "Inactive"}`;
      description.append(strong,detail);
      const buttons=document.createElement("div");buttons.className="cimb-bank-list-buttons";
      const edit=document.createElement("button");edit.type="button";edit.className="btn-edit-new";edit.textContent="Edit";
      edit.addEventListener("click",()=>{modal.close();bankFormModal(key);});
      const del=document.createElement("button");del.type="button";del.className="btn-delete-new";del.textContent="Delete";
      del.addEventListener("click",async()=>{
        if (!window.NewUI?.confirm) return bankToast("Custom confirm belum tersedia.","error");
        const confirmed=await NewUI.confirm({target:del,title:"Delete Bank",message:`Delete ${bank.name}?`,confirmText:"Delete",danger:true});
        if (!confirmed) return;
        const ref=bankDb();if(!ref)return bankToast("Firebase belum tersedia.","error");
        try {await ref.child(key).remove();bankToast("Bank deleted successfully");renderList();}
        catch(error){bankToast("Gagal delete: "+error.message,"error");}
      });
      buttons.append(edit,del);row.append(description,buttons);list.append(row);
    }
  }
  addButton.addEventListener("click",()=>{modal.close();bankFormModal();});
 
  const ref=bankDb();
  if(ref) ref.once("value").then(snap=>{
    const records={};snap.forEach(child=>{const v=normalizedBankRecord(child.val());if(v)records[child.key]=v;});
    BANK_RECORDS=records;renderList();
  }).catch(error=>bankToast(error.message,"error"));
  else renderList();
}
document.getElementById("bankCreate")?.addEventListener("click",()=>bankFormModal());
document.getElementById("bankManage")?.addEventListener("click",bankManageModal);
initFirebaseBanks();

</script>
