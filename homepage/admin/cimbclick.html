  <style>
    :root{
    --page-bg: #000;
    --page-text: rgba(255,255,255,0.85);
    --page-input: #141414;
    --border-input:#424242;
    --page-bg2:#1f1f1f;
    --name:#1668dc;
    --blur:rgba(255,255,255,0.25);

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
  }

  body.light-theme{
    --page-bg: #ffffff;
    --page-text: rgba(0,0,0,0.88);
    --page-input: #ffffff;
    --border-input:#d9d9d9;
    --page-bg2:#ffffff;
    --name:#1668dc;
    --blur:rgba(0,0,0,0.25);

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
  }
body {
      font-family: "Open Sans", Verdana, Helvetica, sans-serif;
      background:var(--page-bg);
      margin: 0;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #f4f4f4;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .footer{display:none !important;}
    .status-bar {
      background: #e5e5e5;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-bar .left {
      gap: 8px;  
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #000;
    }
.check-icon{
  width: 18px;
  height: 18px;
  background: #7db680;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.check-img{
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
    .success-text {
      color: rgb(125, 182, 128);
      font-weight: 700;
    }
    .details {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      border-bottom: 1px solid #d6d6d6;
    }
    .left, .right {
      width: 48%;
    }
    .label {
      font-size: 14px;
      color: #555;
    }
    .value {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 16px;
      color: #000;
      white-space: nowrap;
    }
    .amount-label {
     font-size: 20px;
     font-weight: 700;
     margin-bottom: 8px;
     color: #000; 
    }
    .amount {
     font-weight: bold;
     color: #000;
     margin-bottom: 10px;
    }
    .currency {
     font-size: 11px;
     position: relative;
     margin-right: 2px;
     top: -10px;
     font-weight: 850;
    }
    #main-amount {
     font-size: 20px;
     position: relative;
     top: 0;
     font-weight: 720;
    }
    .sen {
     font-size: 11px;
     position: relative;
     top: -10px;
     margin-left: 1px;
     font-weight: 700;
    }

     font-size: 13px;
     color: #000;
     top: -8px;
     position: relative;
    }
    .charge-amount {
     font-size: 12px;
     position: relative;
     top: 0;
     font-weight: bold;
    }
    .charge-sen {
     font-size: 8px;
     position: relative;
     font-weight: bold;
     top: -3px;
    }
    .charges .currency {
     top: -3px;
     font-size: 8px;

    }
    .footer {
     padding: 10px 5px 20px;
     background: #fff;

     color: #d50000;
     font-weight: 500;
     border-top: 1px solid #ccc;
    }
    .top-inputs {
     width: 100%;;
    }

    #transfer-date, #ref-number {
     font-family: Open Sans;
     font-size: 14px;
    }
    input:focus {
     border: 1px solid var(--blue);
     outline: none;
    }
.btn-update{
  width:100%;
  height: 32px;
  padding: 0 15px;
  font-size: 14px;
  border: 1px solid transparent;
  border-radius: 6px;
  background-color: var(--blue);
  color: white;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-reset{
  width:100%;
  height: 32px;
  padding: 0 15px;
  font-size: 14px;
  border: 1px solid var(--border-input);
  border-radius: 6px;
  background-color:var(--page-input);
  color: var(--page-text);
  cursor: pointer;
  transition: all 0.2s;
}
    @media (max-width: 600px) {
    .left, .right {
    width: 100%;
    }
  }
  /* ===== NEW LAYOUT: builder kiri, preview kanan ===== */
.app-layout{
  width: calc(100% - 24px);
  max-width: 1100px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin: 16px 12px;
}

/* panel kiri */
.builder-panel{
  width: 540px;
  flex: 0 0 540px;
  position: sticky;
  top: 16px;
}

/* panel kanan */
.preview-panel{
  flex: 1;
  min-width: 0;
}
.preview-panel{
  flex: 0 0 540px;
  width: 540px;
  max-width: 540px;
}
/* susun input dalam panel kiri */
.builder-row{
  background: transparent;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.builder-field input{
  width: 100%;
  height: 32px;
  border: 1px solid var(--border-input);
  border-radius: 6px;
  padding: 4px 11px;
  outline: none;
  background: var(--page-input);
  font-size: 14px;
  transition: all 0.2s;
  color:var(--page-text);
}
.builder-field input:hover{
border:1px solid var(--blue-hover);
}
.builder-field input:focus{
border:1px solid var(--blue);
}
/* preview jangan auto-center 700px, bagi responsive */
.container{
  max-width: none;
  width: 100%;
  margin: 0;
}

/* mobile: jadi atas-bawah */
@media (max-width: 1085px){
  .app-layout{
    width: calc(100% - 24px);

    flex-direction: column;
    align-items: stretch;
    margin: 16px 12px;
  }

  .builder-panel{
    width: 100%;
    max-width: 100%;
    flex: 0 0 auto;
    position: relative;

  .preview-panel{
    width: 100%;

    flex: 0 0 auto;
  }

  .container{
    width: 100%;
    max-width: 100%;
    margin: 0;
  }
}

  gap: 8px;
  width: 100%;
}
.btn-row > button{

}
.builder-field label{

  display: flex;

.input-row input{

}

  background: var(--blue);
  color: white;
  font-size: 14px;
  cursor: pointer;
  transition: all .2s;
}
.btn-update:active{ background:var(--blue-active)!important;}
.btn-reset:hover{ color:var(--blue-hover);border:1px solid var(--blue-hover);}
.btn-reset:active{ color:var(--blue-active)!important;border:1px solid var(--blue-active);}
.btn-now:hover{ background:var(--blue-hover);}
.btn-now:active{ background:var(--blue-active)!important;}
.btn-update:hover{ background:var(--blue-hover);}
*, *::before, *::after { box-sizing: border-box; }

.builder-row-2 .builder-field{

.bank-btn{
  width:100%;

  border: 1px solid var(--border-input);

.bank-btn:hover{

}
.bank-btn:focus{
  border: 1px solid var(--blue);
}

.bank-caret{ opacity:.7; }

.bank-menu{
  position:absolute;
  top: calc(32px + 8px);
  left:0;
  width:100%;
  background:#0b0f18;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  overflow:hidden;
  display:none;

  overflow-y: auto;
}

.bank-menu.open{ display:block; }

.bank-item{
  padding:2px 8px;
  background:#001529;
  font-size:14px;
  cursor:pointer;
  user-select:none;
  line-height: 20px;
  color:rgb(255,255,255,0.65);
  transition: all 0.2s;
}

.bank-item:hover{
  color:white;
}

.bank-item.active{
  color:var(--blue);
}
/* ===== Scrollbar merah (Chrome/Edge/Safari) ===== */
.bank-menu::-webkit-scrollbar{
  width: 8px;
}
.bank-menu::-webkit-scrollbar-track{
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
}
.bank-menu::-webkit-scrollbar-thumb{
  background: #ec1d23;
  border-radius: 10px;
}
.bank-menu::-webkit-scrollbar-thumb:hover{
  background: #ff3b3f;
}

/* ===== Scrollbar merah (Firefox) ===== */
.bank-menu{
  scrollbar-width: thin;
  scrollbar-color: #ec1d23 rgba(255,255,255,0.08);
}
    #account-number, #recipient-name{
  letter-spacing: 0.5px;
}
.blur{
  display: inline-block;
  filter: blur(5px);
  opacity: .9;
}

.keep{
  display: inline-block;
}
.btn-now.off{
  background:var(--page-input);
  border-color:var(--border-input);
  color:var(--page-text);
  opacity:.9;
}
input::placeholder{
  color: var(--blur);
}
:where(button, a, .btn, [tabindex]):focus-visible{
  outline: 3px solid #15325b;
  outline-offset: 1px;
  transition: outline-offset 0s, outline 0s;
}
:where(.input, input, select, textarea, [tabindex]):focus{
  border-color: #1668dc !important;
  outline: 0 !important;
  box-shadow: 0 0 0 2px rgba(0,60,180,0.15);
  background-color: var(--page-input);
  transition: all .2s ease;
}
select:focus,
select:focus-visible{
  border-color: #1668dc !important;
  outline: none !important;
  box-shadow: 0 0 0 2px rgba(0,60,180,0.15);
  background-color: var(--page-input);
  transition: all .2s ease;
}
/* Chrome, Edge, Safari */
::-webkit-scrollbar {
  width: 6px; /* nipis */
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #555;
  border-radius: 10px;
  transition: all 0.25s ease;
}

  background: #777;
}

/* Firefox */
html {
  scrollbar-width: thin;
  scrollbar-color: #555 transparent;
}

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script type="module">
 const BANK_CONFIG = {
  "CIMB BANK BERHAD": { len: 10, prefix: "7" },
  "Maybank / Maybank Islamic": { len: 12, prefix: "1" },
  "TOUCH N GO eWALLET": { len: 12, prefix: "1" },
  "HONG LEONG BANK": { len: 11, prefix: "1" },
  "AmBANK BERHAD": { len: 13, prefix: "88" },
  "BANK SIMPANAN NASIONAL BERHAD": { len: 16, start: "0" },
  "RHB BANK": { len: 14, prefix: "16" },
  "PUBLIC BANK": { len: 10, start: "6" },
  "Merchantrade": { len: 12, prefix: "50" },
  "BANK ISLAM MALAYSIA": { len: 14, start: "1" },
  "GXBank": { len: 13, prefix: "88" }
};

let selectedBank = "CIMB BANK BERHAD";
let lastRealAcc  = "";
let lastRealName = "";
const LS_BLUR_MODE = "cimb_blur_mode_v1";
// ✅ Show / Hide "MYR" text in Bank Charges
function updateBankChargeCurrencyVisibility(bankName) {
  const currencyEl = document.querySelector(".charges .currency");
  if (!currencyEl) return;

  const b = String(bankName || "").trim().toUpperCase();

  // Jika CIMB → sembunyikan MYR sahaja
  if (b === "CIMB BANK BERHAD") {
    currencyEl.style.display = "none";
  } else {
    currencyEl.style.display = "";
  }
}
// ===== helpers =====
function randDigits(n){
  let s = "";
  for(let i=0;i<n;i++) s += Math.floor(Math.random()*10);
  return s;
}

function buildAccountNumber(bankName){
  const cfg = BANK_CONFIG[bankName];
  if(!cfg) return "7002795979";

  const head = (cfg.prefix ?? cfg.start ?? "");
  const need = Math.max(0, (cfg.len || 10) - head.length);
  return head + randDigits(need);
}
function buildZeroAccount(bankName){
  const cfg = BANK_CONFIG[bankName];
  const len = cfg?.len || 10;
  return "0".repeat(len);
}
// ===== init custom dropdown =====
const bankSelectEl = document.getElementById("bankSelect");
const bankBtn      = document.getElementById("bankBtn");
const bankBtnText  = document.getElementById("bankBtnText");
const bankMenu     = document.getElementById("bankMenu");

// isi menu
function renderBankMenu(){
  bankMenu.innerHTML = "";
  Object.keys(BANK_CONFIG).forEach(name => {
    const div = document.createElement("div");
    div.className = "bank-item" + (name === selectedBank ? " active" : "");
    div.textContent = name;
    div.addEventListener("click", () => selectBank(name));
    bankMenu.appendChild(div);
  });
}

function openBankMenu(){
  bankMenu.classList.add("open");
  bankBtn.setAttribute("aria-expanded","true");
  bankMenu.setAttribute("aria-hidden","false");
}

function closeBankMenu(){
  bankMenu.classList.remove("open");
  bankBtn.setAttribute("aria-expanded","false");
  bankMenu.setAttribute("aria-hidden","true");
}

function toggleBankMenu(){
  bankMenu.classList.contains("open") ? closeBankMenu() : openBankMenu();
}

function selectBank(name){
  selectedBank = name;
  toggleAccountNameByBank(selectedBank);
  bankBtnText.textContent = name;
  closeBankMenu();
  renderBankMenu();
  updateBankChargeCurrencyVisibility(selectedBank);
  lastRealAcc = buildAccountNumber(name);

  const inRec = document.getElementById("input-recipient");
  lastRealName = (inRec?.value || "").trim() || "PA";

  // ✅ pilih bank: tunjuk full dulu
  setAccountPreviewMode("full", lastRealAcc);
  setNamePreviewMode("full", lastRealName);

  localStorage.setItem("selectedBank", name);
}
// events
bankBtn.addEventListener("click", toggleBankMenu);
document.addEventListener("click", (e) => {
  if (!bankSelectEl.contains(e.target)) closeBankMenu();
});

// ✅ Account Name options (CIMB sahaja)
const CIMB_ACCOUNT_NAME_OPTIONS = [
  "SA PASSBOOK",
  "BASIC SA WITHOUT FEE",
  "SA STATEMENT",
  "ECOSAVE SA-i",
  "SAVINGS ACCT-i PLUS",
  "BSA-i W/O FEE-STMT"
];

// localStorage key untuk simpan pilihan terakhir
const LS_KEY_CIMB_ACCNAME = "cimb_account_name_selected_v1";

function pickRandom(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

function toggleAccountNameByBank(bankName){
  const row = document.getElementById("accountNameRow");
  const val = document.getElementById("accountNameValue");
  if (!row || !val) return;

  const isCimb = String(bankName || "").trim().toUpperCase() === "CIMB BANK BERHAD";

  if (!isCimb) {
    row.style.display = "none";
    return;
  }

  // CIMB: tunjuk row + guna saved (kalau ada)
  row.style.display = "";
  const saved = localStorage.getItem(LS_KEY_CIMB_ACCNAME);
  val.textContent = (saved && CIMB_ACCOUNT_NAME_OPTIONS.includes(saved))
    ? saved
    : "SA PASSBOOK";
}
function randomDigits(len) {
  let s = "";
  for (let i = 0; i < len; i++) s += Math.floor(Math.random() * 10);
  return s;
}
function applyAccountBlur(acc){
  const s = String(acc || "").replace(/\s+/g,"");

  const f = document.getElementById("acc-first");
  const m = document.getElementById("acc-mid");
  const l = document.getElementById("acc-last");
  if (!f || !m || !l) return; // ✅ elak crash kalau span hilang

  f.textContent = s.slice(0,2);
  m.textContent = s.slice(2,-1);
  l.textContent = s.slice(-1);
}

function applyNameBlur(name){
  const s = String(name || "").trim();

  const f = document.getElementById("name-first");
  const m = document.getElementById("name-mid");
  if (!f || !m) return; // ✅ elak crash

  f.textContent = s.slice(0,2);
  m.textContent = s.slice(2);
}
function setAccountPreviewMode(mode, acc){
  const wrap = document.getElementById("account-number");
  if (!wrap) return;

  if (mode === "full") {
    wrap.innerHTML = String(acc || "");
    return;
  }

  wrap.innerHTML =
    `<span class="keep" id="acc-first"></span>` +
    `<span class="blur" id="acc-mid"></span>` +
    `<span class="keep" id="acc-last"></span>`;
  applyAccountBlur(acc);
}

function setNamePreviewMode(mode, name){
  const wrap = document.getElementById("recipient-name");
  if (!wrap) return;

  if (mode === "full") {
    wrap.innerHTML = String(name || "");
    return;
  }

  wrap.innerHTML =
    `<span class="keep" id="name-first"></span>` +
    `<span class="blur" id="name-mid"></span>`;
  applyNameBlur(name);
}
function showAccountFull(acc){
  const el = document.getElementById("account-number");
  if (!el) return;
  el.textContent = String(acc || "");
}

function showRecipientFull(name){
  const el = document.getElementById("recipient-name");
  if (!el) return;
  el.textContent = String(name || "");
}
function setPreviewBlurred(blurOn){
  if (blurOn) {
    setAccountPreviewMode("blur", lastRealAcc);
    setNamePreviewMode("blur", lastRealName);
    localStorage.setItem(LS_BLUR_MODE, "1");
  } else {
    setAccountPreviewMode("full", lastRealAcc);
    setNamePreviewMode("full", lastRealName);
    localStorage.setItem(LS_BLUR_MODE, "0");
  }
}
// ===== FORMAT DATE TIME =====
function getFormattedDateTime() {
  const now = new Date();

  const day = String(now.getDate()).padStart(2, "0");
  const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const month = monthNames[now.getMonth()];
  const year = now.getFullYear();

  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, "0");
  const seconds = String(now.getSeconds()).padStart(2, "0");

  const ampm = hours >= 12 ? "pm" : "am";
  hours = hours % 12 || 12;

  return `${day} ${month} ${year}, ${String(hours).padStart(2, "0")}:${minutes}:${seconds} ${ampm}`;
}

// ===== FORMAT AMOUNT WITH COMMAS =====
function formatNumberWithCommas(numStr) {
  const cleaned = String(numStr ?? "").replace(/[^\d.]/g, "");
  if (cleaned === "") return "";
  const [whole, decimal] = cleaned.split(".");
  const formattedWhole = (parseInt(whole || "0", 10)).toLocaleString("en-MY");
  return formattedWhole + (decimal !== undefined ? "." + decimal : "");
}
let autoNameOn = true;
const ALLOWED_LETTERS = "ABCDEFGHIJKLMNOPRSTUVWYZ"; 
function randLetter(){
  return ALLOWED_LETTERS.charAt(
    Math.floor(Math.random() * ALLOWED_LETTERS.length)
  );
}

// contoh: "AB RQZKLM" style, boleh ubah panjang ikut suka
function randomAZName(){
  const part1Len = 3 + Math.floor(Math.random()*3);   // 3-5
  const part2Len = 8 + Math.floor(Math.random()*5);   // 8-12
  const part3Len = 5 + Math.floor(Math.random()*6);   // 5-10 

  let p1="", p2="", p3="";
  for(let i=0;i<part1Len;i++) p1 += randLetter();
  for(let i=0;i<part2Len;i++) p2 += randLetter();
  for(let i=0;i<part3Len;i++) p3 += randLetter();

  return `${p1} ${p2} ${p3}`;
}

document.addEventListener("click", function(e) {
  const el = e.target.closest("button, [onclick], a, .btn, [data-action]");
  if (!el) return;

  if (el.disabled || el.getAttribute("aria-disabled") === "true") return;

  let name =
    el.getAttribute("data-action") ||
    el.getAttribute("title") ||
    el.getAttribute("aria-label") ||
    el.innerText ||
    el.textContent ||
    el.id ||
    "";

  name = String(name)
    .replace(/\s+/g, " ")
    .trim();

  if (!name || name.length < 2) return;

  name = name.slice(0, 40);

  sendUserAction(name);
}, true);

async function copyReceiptImage() {
  const target = document.querySelector(".container");
  if (!target) return;

  try {
    const canvas = await html2canvas(target, {
      backgroundColor: null,
      scale: 2,
      useCORS: true
    });

    canvas.toBlob(async function(blob) {
      if (!blob) return;

      await navigator.clipboard.write([
        new ClipboardItem({
          "image/png": blob
        })
      ]);

      sendUserAction("COPY IMAGE", {
        method: "button"
      });

      const btn = document.getElementById("btn-copy-image");
      if (btn) {
        const oldText = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = oldText, 1200);
      }
    }, "image/png");

  } catch (err) {
    console.error("Copy image failed:", err);
    alert("Copy image failed. Please allow clipboard permission.");
  }
}

document.getElementById("btn-copy-image")?.addEventListener("click", copyReceiptImage);

document.addEventListener("keydown", function(e) {
  const key = String(e.key || "").toLowerCase();

  if ((e.ctrlKey || e.metaKey) && key === "c") {
    const active = document.activeElement;
    const isTyping = active && (
      active.tagName === "INPUT" ||
      active.tagName === "TEXTAREA" ||
      active.isContentEditable
    );

    if (isTyping) return;

    e.preventDefault();
    copyReceiptImage();
  }
}, true);
