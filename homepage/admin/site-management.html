<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site Management · 5G88</title><link rel="icon" href="./logo.svg"><link rel="stylesheet" href="./shared-ui.css"><link rel="stylesheet" href="./admin.css"><link rel="stylesheet" href="./modern-admin.css"></head><body>
<main class="workspace"><div class="page-top"><div><div class="eyebrow">Workspace management</div><h1>Site Management</h1><p class="subtitle">Manage sites, status and wallet group references.</p></div><button id="create" class="btn primary" disabled>+ Add Site</button></div>
<div class="stats"><div class="card stat"><small>Total sites</small><strong id="total">—</strong></div><div class="card stat"><small>Active sites</small><strong id="activeCount">—</strong></div><div class="card stat"><small>Inactive sites</small><strong id="inactiveCount">—</strong></div></div>
<section class="card"><div class="toolbar"><div class="tools"><input id="search" class="search" placeholder="Search site name or ID"><button id="refresh" class="btn">↻ Refresh</button></div></div><div class="tablewrap"><table><thead><tr><th>Site name</th><th>Site ID</th><th>Wallet group</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Loading sites…</td></tr></tbody></table></div><div id="status" class="status" role="status">Checking admin session…</div></section></main>
<div class="modal" id="modal"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">Add Site</h2><button id="close" class="btn small" type="button">✕</button></div><form id="siteForm"><div class="modalbody"><div class="formgrid"><div class="field"><label for="siteName">Site Name</label><input id="siteName" required maxlength="100" placeholder="e.g. 5G88"></div><div class="field"><label for="siteId">Site ID</label><input id="siteId" required pattern="[a-z0-9_-]+" maxlength="48" placeholder="e.g. 5g88"><div class="hint">Site ID cannot be changed later.</div></div><div class="field"><label for="walletGroupId">Wallet Group ID (optional)</label><input id="walletGroupId" maxlength="60" placeholder="e.g. group-a"></div><div class="field"><label for="active">Status</label><select id="active"><option value="true">Active</option><option value="false">Inactive</option></select></div></div></div><div class="modalfooter"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary" id="save">Save Site</button></div></form></div></div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="../firebase.js"></script>
   <script defer src="./shared-ui.js"></script>
   <script>
"use strict";
const BACKEND = "https://fiveg88-admin-backend-v2.onrender.com";
const $ = id => document.getElementById(id);
let currentAdmin = null;
function status(message, error=false){const e=$("status");e.textContent=message;e.classList.toggle("error",error);}
function openModal(){ $("modal").classList.add("open"); }
function closeModal(){ $("modal").classList.remove("open"); }
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal();});

async function verifySuperadmin(){
 const user=await new Promise(resolve=>{const unsub=auth.onAuthStateChanged(u=>{unsub();resolve(u);},()=>resolve(null));});
 if(!user||user.isAnonymous){location.replace("./login.html");return false;}
 const token=await user.getIdTokenResult(true);
 if(token.claims.secondVerified!==true||!Number.isSafeInteger(token.claims.pinVersion)){await auth.signOut();location.replace("./login.html");return false;}
 const snap=await db.ref("adminUsers/"+user.uid).once("value");
 const profile=snap.val();
 if(!profile||profile.active!==true||profile.secondPasswordEnabled!==true||profile.role!=="superadmin"||profile.pinVersion!==token.claims.pinVersion){status("Access denied: Superadmin only.",true);return false;}
 currentAdmin={uid:user.uid,role:profile.role,username:profile.username};return true;
}
async function api(path,options={}){
 const user=auth.currentUser;if(!user)throw Error("Session expired. Please log in again.");
 const idToken=await user.getIdToken(true);
 const response=await fetch(BACKEND+path,{...options,headers:{Authorization:"Bearer "+idToken,...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})}});
 const raw=await response.text();let data;try{data=raw?JSON.parse(raw):{};}catch{data={message:raw.slice(0,160)};}
 if(!response.ok)throw Error(data.error||data.message||("Backend error HTTP "+response.status));
 return data;
}
function td(tr,value){const cell=document.createElement("td");cell.textContent=String(value??"—");tr.appendChild(cell);return cell;}
function badge(tr,enabled){const cell=document.createElement("td");const span=document.createElement("span");span.className="pill"+(enabled?"":" off");span.textContent=enabled?"Active":"Inactive";cell.appendChild(span);tr.appendChild(cell);}

let sites=[];let editingId=null;
function render(){const q=$("search").value.trim().toLowerCase();const body=$("rows");body.replaceChildren();const filtered=sites.filter(s=>String(s.id||"").toLowerCase().includes(q)||String(s.name||"").toLowerCase().includes(q));if(!filtered.length){const tr=document.createElement("tr");const cell=td(tr,"No matching sites");cell.colSpan=5;cell.className="empty";body.appendChild(tr);return;}for(const s of filtered){const tr=document.createElement("tr");td(tr,s.name);td(tr,s.id);td(tr,s.walletGroupId||"—");badge(tr,s.active===true);const cell=document.createElement("td");const btn=document.createElement("button");btn.textContent="Edit";btn.className="btn small";btn.onclick=()=>edit(s);cell.appendChild(btn);tr.appendChild(cell);body.appendChild(tr);}}
async function load() {
  status("Loading sites…");
  $("create").disabled = true;

  try {
    const data = await api("/api/sites");
    const raw = Array.isArray(data)
      ? data
      : Array.isArray(data.sites)
        ? data.sites
        : data.sites || data.items || [];

    sites = Array.isArray(raw)
      ? raw
      : Object.entries(raw).map(([id, site]) => ({ id, ...site }));

    render();
    $("total").textContent=sites.length;
    $("activeCount").textContent=sites.filter(s=>s.active===true).length;
    $("inactiveCount").textContent=sites.filter(s=>s.active!==true).length;
    $("create").disabled = false;
    status("Loaded " + sites.length + " sites.");
  } catch (error) {
    sites = [];
    render();
    $("create").disabled = true;
    status("Cannot load sites: " + error.message, true);
  }
}
function edit(s){editingId=s.id;$("modalTitle").textContent="Edit Site";$("siteForm").reset();$("siteId").value=s.id;$("siteId").disabled=true;$("siteName").value=s.name||"";$("walletGroupId").value=s.walletGroupId||"";$("active").value=String(s.active===true);openModal();}
$("close").onclick=closeModal;$("search").oninput=render;$("refresh").onclick=load;$("create").onclick=()=>{editingId=null;$("modalTitle").textContent="Add Site";$("siteForm").reset();$("siteId").disabled=false;openModal();};$("cancel").onclick=closeModal;
$("siteForm").onsubmit = async e => {
  e.preventDefault();
  const btn = $("save");
  btn.disabled = true;

  try {
    const id = editingId || $("siteId").value.trim().toLowerCase();
    if (id.length > 48) {
      throw Error("Site ID cannot exceed 48 characters.");
    }
    if (!/^[a-z0-9_-]+$/.test(id)) {
      throw Error("Site ID must use lowercase letters, numbers, _ or -.");
    }

    const payload = {
      name: $("siteName").value.trim(),
      walletGroupId: $("walletGroupId").value.trim() || null,
      active: $("active").value === "true"
    };
    if (!payload.name) throw Error("Site name required.");

    if (editingId) {
      await api("/api/sites/" + encodeURIComponent(editingId), {
        method: "PATCH", body: JSON.stringify(payload)
      });
    } else {
      await api("/api/sites", {
        method: "POST", body: JSON.stringify({ id, ...payload })
      });
    }

    closeModal();
    await load();
    status("Site saved. Wallet group changes require backend validation and atomic balance rules.");
  } catch (err) {
    status("Save failed: " + err.message, true);
  } finally {
    btn.disabled = false;
  }
};
(async()=>{try{if(!await verifySuperadmin())return;await load();}catch(e){status("Authorization failed: "+e.message,true);}})();

</script></body></html>
