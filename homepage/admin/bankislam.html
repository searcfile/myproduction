 .btn.primary:hover{background:var(--blue-hover);}.btn.primary:active{background:var(--blue-active);}

/* =====================================================
   BANK ISLAM - CLEAN SETTINGS UI
   Custom NewUI Input + Shared Dropdown
   ===================================================== */

html,
body {
  min-height: 100%;
  height: auto !important;
  overflow-y: auto !important;
}

body {
  overflow-x: hidden !important;
}

/* MAIN LAYOUT */
.layout {
  display: flex !important;
  flex-direction: column !important;
  align-items: stretch !important;
  gap: 14px !important;
  width: calc(100% - 24px) !important;
  max-width: none !important;
  margin: 16px 12px 56px !important;
  padding: 0 !important;
}

/* SETTINGS CONTAINER */
#back {
  display: block !important;
  position: static !important;
  inset: auto !important;
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  background: transparent !important;
}

/* SETTINGS CARD */
#back .modal {
  position: static !important;
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  align-items: start !important;
  gap: 8px !important;

  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding:12px !important;

  border: 1px solid var(--border-input) !important;
  border-radius: 12px !important;
  background: var(--page-input) !important;
  box-shadow: none !important;
  overflow: visible !important;
}

/* KEEP FIELD GROUPS TOGETHER */
#back .modal > .row {
  display: contents !important;
}

#back .modal .fld {
  min-width: 0 !important;
  margin: 0 !important;
}

#back .modal .row > .col {
  min-width: 0 !important;
  flex: initial !important;
}

/* HIDE OLD FIELD LABELS */
#back .modal .fld > label {
  display: none !important;
}

/* CUSTOM INPUT */
#back .modal .new-ui-input-wrap {
  display: flex;
  flex: 1 1 0;
  width: 100%;
  min-width: 0 !important;
}

#back .modal input[data-new-ui-input] {
  width: 100% !important;
  height: 32px !important;
  min-height: 32px !important;
  max-height: 32px !important;
  min-width: 0 !important;
  color: var(--text) !important;
}

/* CUSTOM DROPDOWN */
#back .modal .shared-dropdown {
  width: 100%;
  min-width: 0 !important;
}

#back .modal .shared-dropdown-trigger {
  height: 32px !important;
  min-height: 32px !important;
  max-height: 32px !important;
}

#back .modal .shared-dropdown-input {
  height: 100% !important;
  min-height: 0 !important;
  border: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

/* DATE + NOW */
#back .modal .dt-wrap {
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  width: 100%;
  min-width: 0 !important;
}

#back .modal .dt-wrap > .new-ui-input-wrap {
  flex: 1 1 0 !important;
  min-width: 0 !important;
  order: 1;
}

#back .modal .dt-wrap > .btn-now {
  flex: 0 0 auto !important;
  order: 2;
}

/* NAME + AUTO + A-Z */
#back .modal .name-wrap {
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  width: 100%;
  min-width: 0 !important;
}

#back .modal .name-wrap > .btn-mini {
  flex: 0 0 auto !important;
}

#back .modal .name-wrap > .shared-dropdown {
  flex: 0 0 155px !important;
  width: 155px !important;
  min-width: 155px !important;
  max-width: 155px !important;
}

#back .modal .name-wrap .shared-dropdown-trigger {
  width: 100% !important;
  box-sizing: border-box !important;
}

#back .modal .name-wrap .shared-dropdown-input {
  min-width: 0 !important;
  width: 100% !important;
  padding-right: 30px !important;
  text-overflow: ellipsis;
}

#back .modal .name-wrap > .new-ui-input-wrap {
  flex: 1 1 0 !important;
  min-width: 0 !important;
}

/* SMALL BUTTONS */
#back .modal .btn-now,
#back .modal .btn-mini {
  height: 32px !important;
  min-height: 32px !important;
  padding: 0 15px !important;
  white-space: nowrap;
}

/* ACTION BUTTONS */
#back .modal .ctl {
  grid-column: 1 / -1 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: flex-start !important;
  flex-wrap: wrap !important;
  gap: 10px !important;
  margin: 0 !important;
}

#back .modal .ctl > .btn {
  flex: 0 1 190px !important;
  min-width: 110px !important;
  height: 32px !important;
}

@media (max-width: 1150px) {
  #back .modal {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  }

  /* ======== DATA BANK (panjang no. akun) ======== */
/* BANK ISLAM - REALTIME BANK CATALOG */
const BI_BANK_PATH = "bank_catalog/bankislam";

let BANKS = [];
let biBankRecords = {};
let biBanksLoaded = false;

const biToast = (message, type = "success") =>
  window.showToast?.(message, type);

function biBankRef() {
  if (!window.firebase || !firebase.apps.length) {
    throw new Error("Firebase is not initialized");
  }

  return firebase.database().ref(BI_BANK_PATH);
}

function biNormalizeBank(data) {
  if (!data || typeof data !== "object") return null;

  const name = String(data.name || "").trim();
  const len = Number(data.len);
  const rule = data.rule === "start" ? "start" : "prefix";
  const startDigits = String(data.digits ?? "");

  if (
    !name ||
    name.length > 100 ||
    !Number.isInteger(len) ||
    len < 1 ||
    len > 30 ||
    !/^\d*$/.test(startDigits) ||
    startDigits.length > len
  ) return null;

  return { name, len, rule, digits: startDigits };
}

function biEscape(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function biRefreshBankDropdown() {
  const previous = inBank.value;

  BANKS = Object.values(biBankRecords)
    .sort((a, b) => a.name.localeCompare(b.name));

  inBank.replaceChildren(new Option("Random Bank", ""));

  BANKS.forEach(bank => {
    inBank.add(new Option(bank.name, bank.name));
  });

  inBank.value = BANKS.some(bank => bank.name === previous)
    ? previous
    : "";

  inBank._sharedDropdown?.refresh?.();
}

function biStartBankListener() {
  try {
    biBankRef().on("value", snapshot => {
      const records = {};

      snapshot.forEach(child => {
        const bank = biNormalizeBank(child.val());

        if (bank) {
          records[child.key] = {
            id: child.key,
            ...bank
          };
        }
      });

      biBankRecords = records;
      biBanksLoaded = true;
      biRefreshBankDropdown();

    }, error => {
      console.error("Bank Islam catalog:", error);
      biToast("Failed to load banks", "error");
    });

  } catch (error) {
    console.error(error);
    biToast(error.message, "error");
  }
}

 const btnBlur = document.getElementById('btnBlur');

  /* ======== HELPERS ======== */
  const pad2   = n => String(n).padStart(2,'0');
  const randi  = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
  const digits = n => Array.from({length:n},()=>String(randi(0,9))).join('');
const pickBank = forced => {
  if (!BANKS.length) return null;

  return forced
    ? BANKS.find(bank => bank.name === forced) || null
    : BANKS[randi(0, BANKS.length - 1)];
};  const splitName = name => {
    const s=(name||'').trim().toUpperCase();
    if(!s) return {i:'—', r:''};
    return {i:s[0], r:s.slice(1)};
  };
  const DEFAULT_REF_TOTAL = 23;
  const KEEP_VISIBLE = 12;
  
  function buildFullRefForDisplay(dt, totalLen = DEFAULT_REF_TOTAL, keepVisible = KEEP_VISIBLE){
  const base = prefixFromDate(dt);             // 12 digit timestamp
  const extraVisibleCount = Math.max(0, keepVisible - base.length);
  const extraVisible      = extraVisibleCount ? digits(extraVisibleCount) : '';
  const tailLen           = Math.max(0, totalLen - base.length - extraVisible.length);
  const tail              = tailLen ? digits(tailLen) : '';
  return {
    fullRef: base + extraVisible + tail,       // ref 23 digit
    keep:    base.length + extraVisible.length // banyaknya digit non-blur
  };
}
  // Format NOW ke "DD/MM/YYYY hh:mm:ss AM/PM"
  function formatNowDDMMYYYY_12(d = new Date()){
    let hh = d.getHours();
    const ap = hh>=12 ? 'PM' : 'AM';
    hh = hh%12 || 12;
    return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()} ${pad2(hh)}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())} ${ap}`;
  }
  function parseManualDate(str){
    const s = String(str||'').trim();
    if(!s) return null;

    // 12h + AM/PM
    let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])$/);
    if (m){
      let [, dd, mm, yyyy, hh, mi, ss='0', ap] = m;
      hh = Number(hh);
      if (/pm/i.test(ap) && hh !== 12) hh += 12;
      if (/am/i.test(ap) && hh === 12) hh = 0;
      const d = new Date(+yyyy, +mm-1, +dd, hh, +mi, +ss);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    // 24h
    m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})(?::(\d{2}))?$/);
    if (m){
      const [, dd, mm, yyyy, HH, MI, SS='0'] = m;
      const d = new Date(+yyyy, +mm-1, +dd, +HH, +MI, +SS);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    // ISO fallback
    const iso = new Date(s);
    return Number.isNaN(iso.getTime()) ? null : iso;
  }
  // === Buat prefix dari tanggal (YYMMDDHHMMSS, 24h) ===
function prefixFromDate(dt){
  const yy = String(dt.getFullYear()).slice(-2);
  const MM = pad2(dt.getMonth()+1);
  const dd = pad2(dt.getDate());
  const HH = pad2(dt.getHours());
  const mi = pad2(dt.getMinutes());
  const ss = pad2(dt.getSeconds());
  return `${yy}${MM}${dd}${HH}${mi}${ss}`;
}

// === Sinkronkan input inPrefix dari inDate ===
function updatePrefixFromDate(){
  const dt = parseManualDate(inDate.value);
  if(!dt) return;
  const stamp = prefixFromDate(dt);
  inPrefix.value = stamp;

  // pastikan tetap 23 (bukan 12)
  if (+inLen.value !== DEFAULT_REF_TOTAL) {
    inLen.value = String(DEFAULT_REF_TOTAL);
  }

  saveDraft?.();
}
  // ======== PERSISTENCE (LocalStorage) ========
const LS_DRAFT = 'txn_editor_draft_v1';
const LS_CARD  = 'txn_card_snapshot_v1';
const LS_BLUR  = 'txn_card_blur_v1'; 

function saveDraft(){
  const data = {
    amount: inAmount.value,
    date:   inDate.value,
    prefix: inPrefix.value,
    len:    inLen.value,
    bank:   inBank.value,
    name:   inName.value,
  };
  localStorage.setItem(LS_DRAFT, JSON.stringify(data));
}

function loadDraft(){
  try { return JSON.parse(localStorage.getItem(LS_DRAFT) || 'null'); }
  catch { return null; }
}

function saveCardSnapshot(extra={}){
  const snap = {
    // simpan REF full (tanpa mask), kirim via argumen dari Apply
    ref: extra.ref || (refNum.textContent || '').replace(/\s+/g,''),
    amountText: amt.textContent,
    dateText:   dateText.textContent,
    bank:       bankName.textContent,
    acc:        accNum.textContent,
    name:       (inName.value || '').toUpperCase(),
  };
  localStorage.setItem(LS_CARD, JSON.stringify(snap));
}

function loadCardSnapshot(){
  try { return JSON.parse(localStorage.getItem(LS_CARD) || 'null'); }
  catch { return null; }
}
function setBlurState(shouldBlur){
  [nmRest, accNum].forEach(el => {
    el.classList.toggle('blurred', !!shouldBlur);
  });
  localStorage.setItem(LS_BLUR, shouldBlur ? '1' : '0');
}

function getBlurState(){
  return localStorage.getItem(LS_BLUR) === '1';
}
function restoreFromStorage(){
  // 1) Balikkan draft -> isi form editor
  const d = loadDraft();
  if (d){
    if (d.amount != null) inAmount.value = formatAmountInput(d.amount);
    if (d.date   != null) inDate.value   = d.date;
    if (d.prefix != null) inPrefix.value = d.prefix;
    if (d.len    != null) inLen.value    = d.len;
    if (d.bank   != null) inBank.value   = d.bank;
    if (d.name   != null) inName.value   = d.name;
  }

  // 2) Balikkan snapshot -> tampilan kartu
  const s = loadCardSnapshot();
  if (s){
    amt.textContent      = s.amountText;
    dateText.textContent = s.dateText;
    showRefMasked(s.ref, KEEP_VISIBLE);    // 4 depan terlihat, sisanya blur
    bankName.textContent = s.bank;
    accNum.textContent   = s.acc;

    const {i,r} = splitName(s.name || inName.value);
    nmIni.textContent  = i;
    nmRest.textContent = r;

    // apply blur seperti setelah Apply
    // ikut status blur yang disimpan
    setBlurState(getBlurState());
    amt.classList.remove('blurred');
    dateText.classList.remove('blurred');
  }else{
    showRefMasked(refNum.textContent, KEEP_VISIBLE);
    setBlurState(false);
  }
}

// Simpan draft otomatis saat user mengetik/ubah
[inAmount, inDate, inPrefix, inLen, inBank, inName].forEach(el=>{

  el?.addEventListener('change', saveDraft);
});

  // Teks kartu "DD Mon YYYY HH:MM:SS AM/PM"
  function toCardDate(userVal){
    if(!userVal) return '02 Oct 2025 05:07:21 PM';
    let dt = parseManualDate(userVal);
    if(!dt) dt = new Date(); // fallback
    const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    let hh = dt.getHours(); const ap = hh>=12 ? 'PM':'AM'; hh = hh%12 || 12;
    return `${pad2(dt.getDate())} ${MON[dt.getMonth()]} ${dt.getFullYear()} ${pad2(hh)}:${pad2(dt.getMinutes())}:${pad2(dt.getSeconds())} ${ap}`;
  }

      );

function showRefMasked(fullRef, keep = KEEP_VISIBLE){
  const s = String(fullRef || '');
  const head = s.slice(0, keep);   // 12 digit pertama tampil
  const tail = s.slice(keep);      // sisanya blur
  refNum.innerHTML =
    `<span class="ref-keep">${head}</span><span class="ref-blur">${tail}</span>`;
}
// ===== Amount format helpers =====
const cleanNum   = s => String(s||'').replace(/[^0-9.]/g,''); // buang koma/karakter lain
const toNumber   = s => Number(cleanNum(s) || 0);
function formatAmountInput(s){
  if(!s) return '';
  let [int, dec] = cleanNum(s).split('.');
  int = (int||'').replace(/\B(?=(\d{3})+(?!\d))/g, ','); // ribuan
  if(dec !== undefined) dec = dec.slice(0, 2);           // batasi 2 desimal saat ketik
  return dec !== undefined ? `${int}.${dec}` : int;
}

// Format saat halaman dibuka (value awal)
inAmount.value = formatAmountInput(inAmount.value);

// Format live ketika mengetik
inAmount.addEventListener('input', () => {
  const wasEnd = inAmount.selectionStart === inAmount.value.length; // simple caret keep-end
  inAmount.value = formatAmountInput(inAmount.value);
  if (wasEnd) inAmount.setSelectionRange(inAmount.value.length, inAmount.value.length);
  saveDraft();
});

// Saat blur: pastikan 2 desimal rapih
inAmount.addEventListener('blur', () => {
  const n = toNumber(inAmount.value);
  inAmount.value = n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  saveDraft();
});
// Random huruf
function randLetters(n){
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let out=''; for(let i=0;i<n;i++) out += A[Math.floor(Math.random()*26)];
  return out;
}
// Generate nama dengan huruf awal tertentu
function genNameByLetter(letter){
  let L = (letter||'').toUpperCase();
  if(!/^[A-Z]$/.test(L)) L = randLetters(1);
  const first  = L + randLetters( Math.floor(Math.random()*4)+4 ); // 5–8 huruf total
  const joiner = [' BIN ',' BINTI ',' '][Math.floor(Math.random()*3)];
  const second = randLetters( Math.floor(Math.random()*6)+3 );     // 3–8 huruf
  let full = `${first}${joiner}${second}`;
  if(Math.random() < 0.35) full += ' ' + randLetters( Math.floor(Math.random()*5)+3 );
  return full;
}
/* ==========================================

function updateBankIslamEmptyState() {
  const receiptCard = document.querySelector(
    ".preview-outer-card"
  );

  const emptyCard = document.getElementById(
    "bankIslamEmptyCard"
  );

  const emptyContent = document.getElementById(
    "bankIslamEmptyContent"
  );

  if (!receiptCard || !emptyCard || !emptyContent) {
    return;
  }

  const hasReceipt = loadCardSnapshot() !== null;

  receiptCard.style.display = hasReceipt ? "" : "none";
  emptyCard.hidden = hasReceipt;

  if (!hasReceipt) {
    if (typeof window.showEmptyState === "function") {
      window.showEmptyState(
        emptyContent,
        "No data",
        "large",
        "center"
      );
    } else {
      emptyContent.textContent = "No data";
    }
  }
}

(function () {
  const THEME_KEY = "siteTheme";

  function applyChildTheme(theme) {
    document.body.classList.remove("light-theme", "dark-theme");
    document.body.classList.add(theme === "light" ? "light-theme" : "dark-theme");
  }

  applyChildTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");

  window.addEventListener("message", function (e) {
    const allowedOrigins = [
      "https://5g88-main.vercel.app",
    ];
    if (!allowedOrigins.includes(e.origin)) return;

    const data = e.data || {};
    if (data.type === "theme-change") {
      const theme = data.theme === "dark" ? "dark" : "light";
      localStorage.setItem(THEME_KEY, theme);
      applyChildTheme(theme);
    }
  });
})();
/* =====================================================
   BANK ISLAM - CREATE / EDIT / MANAGE BANKS
   ===================================================== */

function biOpenBankForm(editId = null) {
  const editing = editId !== null;
  const existing = editing ? biBankRecords[editId] : null;

  if (editing && !existing) {
    biToast("Bank not found", "error");
    return;
  }

  const modal = NewUI.modal.open({
    title: editing ? "Edit Bank" : "Create Bank",
    width: 720,
    content: `
      <form id="biBankForm" class="bi-bank-form">
        <label>
          Bank Name
          <input id="biBankName"
                 data-new-ui-input
                 type="text"
                 maxlength="100"
                 placeholder="Enter bank name"
                 required>
        </label>

        <div class="bi-bank-form-row">
          <label>
            Account Number Length
            <input id="biBankLength"
                   data-new-ui-input
                   type="number"
                   min="1"
                   max="30"
                   required>
          </label>

          <label>
            Number Rule
            <select id="biBankRule"
                    data-shared-dropdown>
              <option value="prefix">Prefix</option>
              <option value="start">Start</option>
            </select>
          </label>
        </div>

        <label>
          Starting Digits
          <input id="biBankDigits"
                 data-new-ui-input
                 type="text"
                 inputmode="numeric"
                 maxlength="30"
                 placeholder="Example: 12">
        </label>
      </form>
    `
  });

  const root = modal.body;
  const form = root.querySelector("#biBankForm");
  const name = root.querySelector("#biBankName");
  const length = root.querySelector("#biBankLength");
  const rule = root.querySelector("#biBankRule");
  const number = root.querySelector("#biBankDigits");

  name.value = existing?.name || "";
  length.value = existing?.len || 12;
  rule.value = existing?.rule || "prefix";
  number.value = existing?.digits || "";

  NewUI.init(root);
  rule._sharedDropdown?.refresh?.();

  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "btn-cancel-new";
  cancelBtn.textContent = "Cancel";

  const saveBtn = document.createElement("button");
  saveBtn.type = "submit";
  saveBtn.className = "btn-primary-new";
  saveBtn.textContent = editing ? "Save Changes" : "Create Bank";

  modal.setFooter(null);
  modal.footer.hidden = false;
  modal.footer.append(cancelBtn, saveBtn);

  cancelBtn.addEventListener("click", () => modal.close());

  number.addEventListener("input", () => {
    number.value = number.value.replace(/\D/g, "");
  });

  form.addEventListener("submit", async event => {
    event.preventDefault();

    if (!form.reportValidity()) return;

    const data = biNormalizeBank({
      name: name.value,
      len: length.value,
      rule: rule.value,
      digits: number.value
    });

    if (!data) {
      biToast("Please enter valid bank information", "error");
      return;
    }

    const duplicate = Object.entries(biBankRecords)
      .some(([id, bank]) =>
        id !== editId &&
        bank.name.toLowerCase() === data.name.toLowerCase()
      );

    if (duplicate) {
      biToast("Bank name already exists", "error");
      return;
    }

    cancelBtn.disabled = true;

    await NewUI.setButtonLoading(saveBtn, true, {
      text: "Saving..."
    });

    let success = false;

    try {
      const ref = biBankRef();

      if (editing) {
        await ref.child(editId).set(data);
      } else {
        await ref.push(data);
      }

      success = true;

    } catch (error) {
      console.error("Save bank failed:", error);
      biToast(error.message || "Failed to save bank", "error");

    } finally {
      await NewUI.setButtonLoading(saveBtn, false, {
        minDuration: 700
      });

      cancelBtn.disabled = false;
    }

    if (success) {
      modal.close();

      biToast(
        editing
          ? "Bank updated successfully"
          : "Bank created successfully",
        "success"
      );
    }
  });

  saveBtn.addEventListener("click", () => {
    form.requestSubmit();
  });
}

function biOpenManageBanks() {
  const modal = NewUI.modal.open({
    title: "Manage Banks",
    width: 720,
    content: `<div id="biBankList" class="bi-bank-list"></div>`
  });

  const list = modal.body.querySelector("#biBankList");
  const banks = Object.values(biBankRecords)
    .sort((a, b) => a.name.localeCompare(b.name));

  if (!banks.length) {
    window.showEmptyState?.(list, "No data", "large", "center");
    return;
  }

  banks.forEach(bank => {
    const row = document.createElement("div");
    row.className = "bi-bank-row";

    row.innerHTML = `
      <div class="bi-bank-info">
        <strong>${biEscape(bank.name)}</strong>
        <small>
          Length: ${bank.len}
          | ${biEscape(bank.rule)}
          | ${biEscape(bank.digits || "No digits")}
        </small>
      </div>

      <div class="bi-bank-buttons">
        <button type="button"
                class="btn-edit-new"
                data-edit>Edit</button>

        <button type="button"
                class="btn-delete-new"
                data-delete>Delete</button>
      </div>
    `;

    row.querySelector("[data-edit]")
      .addEventListener("click", () => {
        modal.close();
        biOpenBankForm(bank.id);
      });

    const deleteBtn = row.querySelector("[data-delete]");

    deleteBtn.addEventListener("click", () => {
      NewUI.confirm({
        target: deleteBtn,
        title: "Delete Bank",
        message: `Delete ${bank.name}?`,
        confirmText: "Delete",
        cancelText: "Cancel",
        loadingText: "Deleting...",

        onConfirm: async () => {
          await biBankRef().child(bank.id).remove();

          biToast("Bank deleted successfully", "success");
          modal.close();
          biOpenManageBanks();
        }
      });
    });

    list.appendChild(row);
  });
}

document.getElementById("biCreateBank")
  ?.addEventListener("click", () => {
    if (!biBanksLoaded) {
      biToast("Bank data is still loading", "error");
      return;
    }

    biOpenBankForm();
  });

document.getElementById("biManageBanks")
  ?.addEventListener("click", () => {
    if (!biBanksLoaded) {
      biToast("Bank data is still loading", "error");
      return;
    }

    biOpenManageBanks();
  });

/* START REALTIME DATABASE */
biStartBankListener();
/* ==========================================
   BANK ISLAM - COPY IMAGE WITH CUSTOM TOAST
   ========================================== */

const btnCopy = document.getElementById("copyImg");

btnCopy?.addEventListener("click", async () => {
  const card = document.getElementById("card");

  if (!card || !loadCardSnapshot()) {
    biToast("Please create a receipt first", "error");
    return;
  }

  if (!navigator.clipboard?.write || !window.ClipboardItem) {
    biToast("Image clipboard is not supported in this browser", "error");
    return;
  }

  if (btnCopy.disabled) return;

  btnCopy.disabled = true;

  try {
    const canvas = await html2canvas(card, {
      scale: 3,
      useCORS: true,
      backgroundColor: "#ffffff",

      onclone: (clonedDoc) => {
        const clonedCard = clonedDoc.getElementById("card");
        if (!clonedCard) return;

        const chev = clonedCard.querySelector(".more .chev");

        if (chev) {
          const svg = clonedDoc.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
          );

          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("aria-hidden", "true");

          svg.style.width = "19px";
          svg.style.height = "19px";
          svg.style.display = "block";
          svg.style.fill = getComputedStyle(chev).color || "currentColor";
          svg.style.flex = "0 0 auto";

          const path = clonedDoc.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
          );

          path.setAttribute(
            "d",
            "M7.41 8.59 12 13.17l4.59-4.58 1.41 1.41L12 16 6 10l1.41-1.41Z"
          );

          svg.appendChild(path);
          chev.replaceWith(svg);
        }

        clonedCard.style.background = "#ffffff";
      }
    });

    const blob = await new Promise((resolve, reject) => {
      canvas.toBlob(
        result => {
          if (result) {
            resolve(result);
          } else {
            reject(new Error("Failed to generate image"));
          }
        },
        "image/png"
      );
    });

    await navigator.clipboard.write([
      new ClipboardItem({
        "image/png": blob
      })
    ]);

    biToast("Image copied successfully!", "success");

  } catch (error) {
    console.error("Copy Image Error:", error);

    biToast(
      "Failed to copy image. Please try again.",
      "error"
    );

  } finally {
    btnCopy.disabled = false;
  }
});

// ✅ Hantar ke main page
function sendUserAction(actionName, extra = {}) {
  if (!actionName) return;
  window.parent.postMessage({
    type: "user-tab-action",
    tab: window.HISTORY_TAB_NAME,
    action: actionName,
    extra,
    time: Date.now()
  }, "https://5g88-main.vercel.app");
}
/* =========================
   AUTO TRACK CLICK - COUNT SEMUA CLICK
========================= */
document.addEventListener("click", function(e) {
  const el = e.target.closest("button, [onclick], a, .btn, [data-action]");
  if (!el) return;

  if (el.disabled || el.getAttribute("aria-disabled") === "true") return;

  let name =
    el.getAttribute("data-action") ||
    el.getAttribute("title") ||
    el.getAttribute("aria-label") ||
    el.innerText ||
    el.textContent ||
    el.id ||
    "";

  name = String(name)
    .replace(/\s+/g, " ")
    .trim();

  if (!name || name.length < 2) return;

  name = name.slice(0, 40);

  sendUserAction(name);
}, true);
/* =========================
   AUTO TRACK CTRL + C / COPY IMAGE
========================= */
document.addEventListener("keydown", function(e) {
  const key = String(e.key || "").toLowerCase();

  if ((e.ctrlKey || e.metaKey) && key === "c") {
    sendUserAction("COPY IMAGE", {
      method: "keyboard",
      shortcut: "Ctrl+C"
    });
  }
}, true);
/* =========================
   AUTO TRACK BROWSER COPY EVENT
========================= */
document.addEventListener("copy", function() {
  sendUserAction("COPY IMAGE", {
    method: "copy-event"
  });
}, true);
