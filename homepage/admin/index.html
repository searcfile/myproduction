  <div id="cpModal" role="dialog" aria-modal="true" aria-labelledby="cpTitle">
  <div id="cpDialog">
    <div id="cpHead">
      <div id="cpTitle">Change Password</div>
      <button id="cpClose" aria-label="Close">
        <svg viewBox="64 64 896 896" aria-hidden="true">
  <path fill="currentColor" d="M799.86 166.31c.02 0 .04.02.08.06l57.69 57.7c.04.03.05.05.06.08a.12.12 0 010 .06c0 .03-.02.05-.06.09L569.93 512l287.7 287.7c.04.04.05.06.06.09a.12.12 0 010 .07c0 .02-.02.04-.06.08l-57.7 57.69c-.03.04-.05.05-.07.06a.12.12 0 01-.07 0c-.03 0-.05-.02-.09-.06L512 569.93l-287.7 287.7c-.04.04-.06.05-.09.06a.12.12 0 01-.07 0c-.02 0-.04-.02-.08-.06l-57.69-57.7c-.04-.03-.05-.05-.06-.07a.12.12 0 010-.07c0-.03.02-.05.06-.09L454.07 512l-287.7-287.7c-.04-.04-.05-.06-.06-.09a.12.12 0 010-.07c0-.02.02-.04.06-.08l57.7-57.69c.03-.04.05-.05.07-.06a.12.12 0 01.07 0c.03 0 .05.02.09.06L512 454.07l287.7-287.7c.04-.04.06-.05.09-.06a.12.12 0 01.07 0z"/>
</svg>
      </button>
    </div>
    <div id="cpBody">
      <div class="cp-hint">Enter your old password & new password (min 6 characters).</div>
      <div id="cpErr" class="cp-error"></div>
      <div id="cpOk" class="cp-ok"></div>

      <div class="cp-group">
        <label class="label-required" for="cpOld">Current Password</label>
        <input id="cpOld" type="password" class="cp-input" autocomplete="off" placeholder="Enter current password" />
      </div>
      <div class="cp-group">
        <label class="label-required" for="cpNew">New Password</label>
        <input id="cpNew" type="password" class="cp-input" autocomplete="off" placeholder="Enter new password" />
      </div>
      <div class="cp-group">
        <label class="label-required" for="cpNew2">Confirm Password</label>
        <input id="cpNew2" type="password" class="cp-input" autocomplete="off" placeholder="Confirm new password" />
      </div>
    </div>
    <div id="cpFoot">
      <button class="cp-btn" id="cpCancel">Cancel</button>
      <button class="cp-btn primary" id="cpSubmit">Change</button>
    </div>
  </div>
</div>
  
  <div id="cp2Modal" role="dialog" aria-modal="true" aria-labelledby="cp2Title">
  <div id="cp2Dialog">
    <div id="cp2Head">
      <div id="cp2Title">Change 2nd Password</div>
      <button id="cp2Close" aria-label="Close">
        <svg viewBox="64 64 896 896" aria-hidden="true">
  <path fill="currentColor" d="M799.86 166.31c.02 0 .04.02.08.06l57.69 57.7c.04.03.05.05.06.08a.12.12 0 010 .06c0 .03-.02.05-.06.09L569.93 512l287.7 287.7c.04.04.05.06.06.09a.12.12 0 010 .07c0 .02-.02.04-.06.08l-57.7 57.69c-.03.04-.05.05-.07.06a.12.12 0 01-.07 0c-.03 0-.05-.02-.09-.06L512 569.93l-287.7 287.7c-.04.04-.06.05-.09.06a.12.12 0 01-.07 0c-.02 0-.04-.02-.08-.06l-57.69-57.7c-.04-.03-.05-.05-.06-.07a.12.12 0 010-.07c0-.03.02-.05.06-.09L454.07 512l-287.7-287.7c-.04-.04-.05-.06-.06-.09a.12.12 0 010-.07c0-.02.02-.04.06-.08l57.7-57.69c.03-.04.05-.05.07-.06a.12.12 0 01.07 0c.03 0 .05.02.09.06L512 454.07l287.7-287.7c.04-.04.06-.05.09-.06a.12.12 0 01.07 0z"/>
</svg>
      </button>
    </div>

    <div id="cp2Body">
      <div class="cp-hint">Enter your current 2nd password & new 6 digit 2nd password.</div>
      <div id="cp2Err" class="cp-error"></div>
      <div id="cp2Ok" class="cp-ok"></div>

      <div class="cp-group">
        <label class="label-required" for="cp2Old">Current 2nd Password</label>
        <input id="cp2Old" type="password" class="cp-input" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Enter current 2nd password" />
      </div>

      <div class="cp-group">
        <label class="label-required" for="cp2New">New 2nd Password</label>
        <input id="cp2New" type="password" class="cp-input" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Enter new 6 digit 2nd password" />
      </div>

      <div class="cp-group">
        <label class="label-required" for="cp2New2">Confirm 2nd Password</label>
        <input id="cp2New2" type="password" class="cp-input" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Confirm new 2nd password" />
      </div>
    </div>

    <div id="cp2Foot">
      <button id="cp2Cancel" type="button">Cancel</button>
      <button id="cp2Submit" type="button">Save</button>
    </div>
  </div>
</div>
