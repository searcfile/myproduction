  <style>
  /* HOME - CUSTOM EMPTY STATE */
  #mainContainer {
    position: relative;
    min-height: calc(
      100dvh - var(--admin-header-height, 64px)
      - var(--admin-tabs-height, 52px)
    );
  }

    position: absolute;
    inset: 0;
    display: flex;

    justify-content: center;
    pointer-events: none;
  }

  #homeEmptyState .shared-empty {
    width: 100%;
    min-height: 0;
  }

    display: none !important;
  }

    display: none !important;

/* ==========================================
   5G88 FLOATING LIVECHAT
   ========================================== */

#g88ChatLauncher {
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  z-index: 950;
  width: 46px;
  height: 58px;
  display: none;
  align-items: center;
  justify-content: center;
  border: 1px solid #424242;
  border-right: 0;
  border-radius: 16px 0 0 16px;
  background: #1f1f1f;
  color: #fff;
  box-shadow: -3px 4px 18px #0005;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

#g88ChatLauncher.visible {
  display: flex;
}

#g88ChatLauncher.dragging {
  cursor: grabbing;
  transition: none;
}

#g88ChatLauncher svg {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
}

#g88ChatPanel {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 951;
  display: none;
  flex-direction: column;
  width: min(460px, calc(100vw - 24px));
  height: min(720px, calc(100dvh - 32px));
  overflow: hidden;
  border: 1px solid #303640;
  border-radius: 18px;
  background: #171a21;
  box-shadow: 0 12px 48px #0006;
}

#g88ChatPanel.open {
  display: flex;
}

.g88-chat-panel-header {
  min-height: 56px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 1px solid #303640;
  color: #fff;
  font-weight: 600;
}

.g88-chat-panel-header button {
  border: 0;
  background: transparent;
  color: #fff;
  cursor: pointer;
  font-size: 23px;
  width: 32px;
  height: 32px;
}

#g88ChatFrame {
  width: 100%;
  height: 100%;
  flex: 1;
  min-height: 0;
  border: 0;
  background: #111;
}

@media (max-width: 520px) {
  #g88ChatPanel {
    right: 8px;
    width: calc(100vw - 16px);

<script>
  (function () {
    const empty = document.getElementById("homeEmptyState");
    const main = document.getElementById("mainContainer");

    if (!empty || !main) return;

    // Use existing custom No Data SVG from shared-ui.js
    if (typeof window.showEmptyState === "function") {
      window.showEmptyState(
        empty,
        "No data",
        "large",
        "center"
      );
    }

    function syncHomeEmpty() {
      const hasIframe = !!main.querySelector("iframe");
      empty.hidden = hasIframe;
    }

    syncHomeEmpty();

    // Watch when admin.js adds/removes tab content
    const observer = new MutationObserver(syncHomeEmpty);

    observer.observe(main, {
      childList: true,
      subtree: true
    });
  })();
</script>

<script>
/* ==========================================
   5G88 FLOATING LIVECHAT — ADMIN INDEX
   ========================================== */
(function () {
  "use strict";

  const API_BASE =
    "https://fiveg88-admin-backend-v2.onrender.com";

  // Mesti sama dengan Site ID sebenar.
  const SITE_ID = "5g88";

  // URL asal LiveChat User.
  const DEFAULT_CHAT_URL = "./livechat.html";

  const POSITION_KEY =
    "5g88.floatingLivechat.position";

  const launcher =
    document.getElementById("g88ChatLauncher");

  const panel =
    document.getElementById("g88ChatPanel");

  const frame =
    document.getElementById("g88ChatFrame");

  const closeBtn =
    document.getElementById("g88ChatClose");

  if (!launcher || !panel || !frame || !closeBtn) {
    return;
  }

  let enabled = false;
  let chatUrl = DEFAULT_CHAT_URL;
  let opened = false;
  let dragging = false;
  let pointerStartY = 0;
  let launcherStartY = 0;
  let moved = false;

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  function setLauncherY(y) {
    const height = launcher.offsetHeight || 58;
    const maxY = Math.max(12, innerHeight - height - 12);

    const top = clamp(y, 12, maxY);

    launcher.style.top = top + "px";
    launcher.style.transform = "none";

    return top;
  }

  function restorePosition() {
    const saved = Number(localStorage.getItem(POSITION_KEY));

    if (Number.isFinite(saved) && saved >= 0 && saved <= 1) {
      setLauncherY(saved * innerHeight);
    } else {
      setLauncherY(innerHeight / 2 - 29);
    }
  }

  function savePosition() {
    const top = launcher.getBoundingClientRect().top;

    localStorage.setItem(
      POSITION_KEY,
      String(top / Math.max(1, innerHeight))
    );
  }

  function openChat() {
    if (!enabled) return;

    if (!frame.getAttribute("src")) {
      frame.src = chatUrl;
    }

    panel.classList.add("open");
    launcher.style.display = "none";
    launcher.setAttribute("aria-expanded", "true");
    opened = true;
  }

  function closeChat() {
    panel.classList.remove("open");
    launcher.setAttribute("aria-expanded", "false");
    launcher.style.display = enabled ? "flex" : "none";
    opened = false;
  }

  function applyConfig(config) {
    const nextEnabled = config?.enabled === true;
    const nextUrl = typeof config?.chatUrl === "string"
      ? config.chatUrl.trim()
      : DEFAULT_CHAT_URL;

    enabled = nextEnabled;

    // Hanya benarkan URL dari origin yang sama.
    try {
      const parsed = new URL(nextUrl, location.href);

      chatUrl = parsed.origin === location.origin &&
        /^https?:$/.test(parsed.protocol)
        ? parsed.href
        : new URL(DEFAULT_CHAT_URL, location.href).href;
    } catch (_) {
      chatUrl = new URL(DEFAULT_CHAT_URL, location.href).href;
    }

    if (!enabled) {
      closeChat();
      launcher.classList.remove("visible");
      frame.removeAttribute("src");
      return;
    }

    launcher.classList.add("visible");

    if (opened && frame.src !== chatUrl) {
      frame.src = chatUrl;
    }

    launcher.style.display = opened ? "none" : "flex";
  }

  async function loadConfig() {
    try {
      const response = await fetch(
        API_BASE + "/api/public/livechat-skin/" +
          encodeURIComponent(SITE_ID),
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const config = await response.json();
      applyConfig(config);

    } catch (error) {
      console.warn("[Floating LiveChat]", error);
      // Fail closed jika API tidak tersedia.
      applyConfig({ enabled: false });
    }
  }

  launcher.addEventListener("pointerdown", function (event) {
    if (!enabled) return;

    dragging = true;
    moved = false;

    pointerStartY = event.clientY;
    launcherStartY =
      launcher.getBoundingClientRect().top;

    launcher.classList.add("dragging");
    launcher.setPointerCapture(event.pointerId);
  });

  launcher.addEventListener("pointermove", function (event) {
    if (!dragging) return;

    const delta = event.clientY - pointerStartY;

    if (Math.abs(delta) > 5) {
      moved = true;
    }

    if (moved) {
      setLauncherY(launcherStartY + delta);
    }
  });

  launcher.addEventListener("pointerup", function () {
    if (!dragging) return;

    dragging = false;
    launcher.classList.remove("dragging");

    if (moved) {
      savePosition();
    } else {
      openChat();
    }
  });

  launcher.addEventListener("pointercancel", function () {
    dragging = false;
    launcher.classList.remove("dragging");
  });

  closeBtn.addEventListener("click", closeChat);

  window.addEventListener("resize", restorePosition);

  restorePosition();
  loadConfig();

  // Refresh setting tanpa reload halaman.
  setInterval(loadConfig, 30000);

  window.addEventListener("focus", loadConfig);
})();
</script>
