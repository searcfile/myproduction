<!-- TABBAR SEBENAR: WUJUD TERUS DALAM HTML -->
<div id="tabBar" class="tab-bar"></div>
<script>
(() => {
  const tabBar = document.getElementById("tabBar");
  if (!tabBar) return;

  try {
const uid = sessionStorage.getItem("5g88.adminSession");

const expiryRaw = localStorage.getItem("autoLogout.expireAt");
const expireAt = Number(expiryRaw);

if (
  !uid ||
  !expiryRaw ||
  !Number.isFinite(expireAt) ||
  expireAt <= Date.now()
) {
  return;
}

    const cacheKey = "5g88.workspacePreview." + uid;

    const tabs = JSON.parse(
      sessionStorage.getItem(cacheKey) || "[]"
    );

    if (!Array.isArray(tabs) || !tabs.length) return;

    const list = document.createElement("div");
    list.className =
      "admin-workspace-tabs-list admin-static-tab-preview";

    const currentFile =
      location.pathname.split("/").pop().toLowerCase();

    tabs.slice(0, 20).forEach(tab => {
      if (!tab || typeof tab !== "object") return;

      const file = String(tab.file || "").toLowerCase();
      const name = String(tab.name || "").trim();

      if (!file || !name) return;

      const element = document.createElement("div");
      element.className = "tab admin-workspace-tab";

      if (file === currentFile) {
        element.classList.add("active");
      }

      const title = document.createElement("span");
      title.className = "admin-workspace-tab-name";
      title.textContent = name;

      element.appendChild(title);
      list.appendChild(element);
    });

    tabBar.appendChild(list);

  } catch (error) {
    console.warn("[5G88] Restore workspace preview:", error);
  }
})();
</script>

<script>
(() => {
  document.documentElement.classList.add("admin-auth-pending");

  const auth = firebase.auth();
  const db = firebase.database();

  let checking = false;
  let redirecting = false;
  let verified = false;

  async function logoutToLogin() {
    if (redirecting) return;
    redirecting = true;

    document.documentElement.style.visibility = "hidden";

    try {
      sessionStorage.removeItem("5g88.adminSession");
      localStorage.removeItem("autoLogout.expireAt");
    } catch (_) {}

    try {
      await auth.signOut();
    } catch (error) {
      console.warn("Sign out failed:", error);
    }

    location.replace("./login.html");
  }

  async function checkSession() {
    if (checking || redirecting) return;

    checking = true;

    try {
      const user = auth.currentUser;

      if (!user || user.isAnonymous) {
        await logoutToLogin();
        return;
      }

const marker = sessionStorage.getItem("5g88.adminSession");
const expiryRaw = localStorage.getItem("autoLogout.expireAt");
const expireAt = Number(expiryRaw);

      if (
        marker !== user.uid ||
        !expiryRaw ||
        !Number.isFinite(expireAt) ||
        expireAt <= Date.now()
      ) {
        await logoutToLogin();
        return;
      }

      const token = await user.getIdTokenResult(true);

      if (
        token.claims.secondVerified !== true ||
        !Number.isSafeInteger(token.claims.pinVersion)
      ) {
        await logoutToLogin();
        return;
      }

      const snap = await db
        .ref("adminUsers/" + user.uid)
        .once("value");

      const profile = snap.val();

      if (
        !profile ||
        profile.active !== true ||
        profile.secondPasswordEnabled !== true ||
        !["superadmin", "siteadmin"].includes(profile.role) ||
        token.claims.pinVersion !== profile.pinVersion
      ) {
        await logoutToLogin();
        return;
      }

      verified = true;
      document.documentElement.classList.remove("admin-auth-pending");
      document.documentElement.style.visibility = "";

    } catch (error) {
      console.error("Admin session verification failed:", error);
      await logoutToLogin();
    } finally {
      checking = false;
    }
  }

  auth.onAuthStateChanged(user => {
    if (!user || user.isAnonymous) {
      logoutToLogin();
    } else {
      checkSession();
    }
  }, error => {
    console.error("Auth listener failed:", error);
    logoutToLogin();
  });

  // Semak semula hanya selepas Firebase Auth sudah siap
  window.addEventListener("focus", () => {
    if (verified && !redirecting) {
      checkSession();
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && verified && !redirecting) {
      checkSession();
    }
  });

window.addEventListener("pageshow", event => {
  if (event.persisted) {
    location.reload();
  }
});

  // Semak setiap 5 saat untuk storage yang dipadam
  setInterval(() => {
    if (verified && !redirecting) {
      const user = auth.currentUser;
      const marker = sessionStorage.getItem("5g88.adminSession");
      const expiryRaw = localStorage.getItem("autoLogout.expireAt");
      const expireAt = Number(expiryRaw);

if (
  !user ||
  marker !== user.uid ||
  !expiryRaw ||
  !Number.isFinite(expireAt) ||
  expireAt <= Date.now()
) {
  logoutToLogin();
}
    }
  }, 5000);

})();
</script>
