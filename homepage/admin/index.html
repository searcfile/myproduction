<script src="../firebase.js"></script>

<script>
(function () {
  const LOGIN_URL = "./login.html";
  const auth = firebase.auth();

  let redirecting = false;
  let checking = false;

  document.documentElement.style.visibility = "hidden";

  async function goToLogin() {
    if (redirecting) return;
    redirecting = true;

    document.documentElement.style.visibility = "hidden";

    try {
      await auth.signOut();
    } catch (error) {
      console.warn("Sign out failed:", error);
    } finally {
      location.replace(LOGIN_URL);
    }
  }

  async function verifySession(user) {
    if (checking || redirecting) return;

    checking = true;

    try {
      user = user || auth.currentUser;

      if (!user || user.isAnonymous) {
        await goToLogin();
        return;
      }

      const token = await user.getIdTokenResult(true);

      if (
        token.claims.secondVerified !== true ||
        !Number.isSafeInteger(token.claims.pinVersion)
      ) {
        await goToLogin();
        return;
      }

      const snap = await firebase.database()
        .ref("adminUsers/" + user.uid)
        .once("value");

      const profile = snap.val();

      if (
        !profile ||
        profile.active !== true ||
        profile.secondPasswordEnabled !== true ||
        !["superadmin", "siteadmin"].includes(profile.role) ||
        token.claims.pinVersion !== profile.pinVersion
      ) {
        await goToLogin();
        return;
      }

      document.documentElement.style.visibility = "";

    } catch (error) {
      console.error("Session verification failed:", error);
      // Network error bukan bukti user sudah logout.
    } finally {
      checking = false;
    }
  }

  auth.onAuthStateChanged(user => {
    if (!user || user.isAnonymous) {
      goToLogin();
      return;
    }

    verifySession(user);
  });

  window.addEventListener("focus", () => {
    if (!redirecting) verifySession(auth.currentUser);
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !redirecting) {
      verifySession(auth.currentUser);
    }
  });

  setInterval(() => {
    if (!redirecting && auth.currentUser === null) {
      goToLogin();
    }
  }, 3000);
})();
</script>
