  <style>
  /* HOME - CUSTOM EMPTY STATE */
  #mainContainer {
    position: relative;
    min-height: calc(
      100dvh - var(--admin-header-height, 64px)
      - var(--admin-tabs-height, 52px)
    );
  }

  #homeEmptyState {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #homeEmptyState .shared-empty {
    width: 100%;
    min-height: 0;
  }

  #homeEmptyState[hidden] {
    display: none !important;
  }

  /* Hide empty state when iframe content exists */
  #mainContainer:has(iframe) #homeEmptyState {
    display: none !important;
  }
</style>
<body>
<div class="container" id="mainContainer">
  <div id="homeEmptyState" role="status" aria-live="polite"></div>
</div>
<audio id="notifSound" src="./audio/audio.wav" preload="auto"></audio>
<audio id="christmasMusic" loop> <source src="https://5g88-main.vercel.app/main/merrychristmas/" type="audio/mpeg" /></audio>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  window.renderMobileUserBtn =
    window.renderMobileUserBtn || function(){};
</script>

<script src="./new-ui.js"></script>
<script src="./shared-ui.js"></script>
<script src="./admin.js"></script>
  
<script>
  (function () {
    const empty = document.getElementById("homeEmptyState");
    const main = document.getElementById("mainContainer");

    if (!empty || !main) return;

    // Use existing custom No Data SVG from shared-ui.js
    if (typeof window.showEmptyState === "function") {
      window.showEmptyState(
        empty,
        "No data",
        "large",
        "center"
      );
    }

    function syncHomeEmpty() {
      const hasIframe = !!main.querySelector("iframe");
      empty.hidden = hasIframe;
    }

    syncHomeEmpty();

    // Watch when admin.js adds/removes tab content
    const observer = new MutationObserver(syncHomeEmpty);

    observer.observe(main, {
      childList: true,
      subtree: true
    });
  })();
</script>
