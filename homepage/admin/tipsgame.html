<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
      :root{
    --page-bg: #000;
    --page-text: rgba(255,255,255,0.85);
    --page-input: #141414;
    --border-input:#424242;
    --page-bg2:#1f1f1f;
  

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
    
  }

  body.light-theme{
    --page-bg: #ffffff;
    --page-text: rgba(0,0,0,0.88);
    --page-input: #ffffff;
    --border-input:#d9d9d9;
    --page-bg2:#ffffff;

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
  }
body {
background: var(--page-bg);
      color: gold;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0 ;
      overflow-x: hidden;
    }
    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
      overflow-y: scroll;
    }
   html::-webkit-scrollbar {
     display: none;
    }
    .platform-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      z-index: 0;
      margin:0 12px;
    }

    .platform-box {
      background: var(--page-bg2);
      color: var(--page-text);
      border: 1px solid var(--border-input);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 280px;
      padding: 10px;
      z-index: 0;
    }

    .platform-header {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-input);
      width: 100%;
    }

    .tip-list {
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
      padding: 10px;
      background: var(--page-input);
      color: var(--page-text);
      border-radius: 6px;
      height: 130px;
      width: 90%;
      margin-bottom: 10px;
      overflow-y: auto;
      box-sizing: border-box;
      scrollbar-width: none; 
      -ms-overflow-style: none;
      border: 1px solid var(--border-input);
    }
    .tip-list::-webkit-scrollbar {
      display: none;
    }

    .bottom-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 0;
    }

    .row-center {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .count-input, .duration-input {
      width: 60px;
      padding: 2px;
      border-radius: 4px;
      border: 1px solid var(--border-input);
      background:var(--page-input);
      color:var(--page-text);
      outline: none;
      transition: all 0.2s ease;
    }
    .duration-input:hover{
      border:1px solid var(--blue-hover);}
    .duration-input:focus{
      border:1px solid var(--blue);}
    .count-input:hover{
      border:1px solid var(--blue-hover);}
    .count-input:focus{
      border:1px solid var(--blue);}
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 22px;
      z-index: 0;
   }
    .auto-toggle label {
      display: block;
      width: 100%;
      height: 100%;
   }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: red;
      transition: .4s;
      border-radius: 34px;
      z-index: 0;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--blue);
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    .btn-refresh{
      transition: all 0.2s ease;
      font-size: 14px;
      background: var(--blue);
      border: 1px solid transparent;
      color: white;
      cursor: pointer;
      border-radius: 6px;
      padding: 0px 15px;
      height:28px
    }
    .btn-refresh:active {
      background:var(--blue-active)!important;
    }
     .btn-refresh:hover, .btn-number:hover {
      background:var(--blue-hover);
    }
     .btn-copy {
      transition: all 0.2s ease;
      font-size: 14px;
      background: var(--blue);
      border: 1px solid transparent;
      color: white;
      cursor: pointer;
      border-radius: 6px;
      padding: 0px 15px;
      height:28px
    }
     .btn-copy:active {
      background:var(--blue-active)!important;
    }
     .btn-copy:hover{
      background:var(--blue-hover);
    }
    
    .timestamp {
      font-size: 10px;
      color: var(--page-text);
      text-align: center;
      margin-top: 6px;
    }
    .duration-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .duration-label {
      font-size: 10px;
      margin-top: 2px;
      color: #000;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 2px;
    }
    .input-label {
      font-size: 12px;
      margin-top: 2px;
      color: var(--page-text); 
      text-align: center;
    }
    .btn-number {
  background: var(--blue);
  color: white;
  border: 1px solid transparent;
  padding: 0px 15px;
  border-radius: 6px;
  font-size: 14px;
  height:28px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-number.active {
  background: var(--page-bg2);
  color: var(--page-text);
}
.tip-top-bar{
  width: 90%;
  display: flex;
  align-items: center;
  gap: 0;
  margin: 0 0 10px 0;
}

.tip-search-input{
  flex: 1;
  min-width: 0;
  height: 30px;
  padding: 0 10px;
  margin: 0;
  border: 1px solid var(--border-input);
  border-right:1px solid var(--border-input);
  border-radius: 6px 0 0 6px;
  background: var(--page-input);
  color: var(--page-text);
  outline: none;
  box-sizing: border-box;
  font-size: 13px;
  transition: all 0.3s ease;
}

.tip-search-input::placeholder{
  color: rgba(255,255,255,0.45);
}

body.light-theme .tip-search-input::placeholder{
  color: rgba(0,0,0,0.35);
}
.tip-search-input:hover{
  border-color: var(--blue-hover);
}
.tip-search-input:focus{
  border-color: var(--blue);
}

.percent-toggle-wrap{
  display: flex;
  align-items: center;
  justify-content: center;
  width: 50px;
  height: 30px;
  flex: 0 0 50px;
  margin: 0;
  padding: 0;
}

.percent-checkbox{
  appearance: none;
  -webkit-appearance: none;
  width: 50px;
  height: 30px;
  margin: 0;
  padding: 0;
  border: 1px solid var(--border-input);
  border-radius: 0 6px 6px 0;
  background: var(--page-input);
  cursor: pointer;
  position: relative;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  flex: 0 0 50px;
}
.percent-checkbox:checked{
  color: var(--blue);
  border:1px solid var(--blue);
}
.percent-checkbox::after{
  content: "OFF";
  color: white;
  font-size: 11px;
  letter-spacing: 0;
  line-height: 1;
}
.percent-checkbox:checked::after{
  content: "%"; /* boleh tukar jadi ON kalau mau */
  color: #3c89e8;
  font-size: 13px;
}
.percent-checkbox:hover{
  border-color: var(--blue-hover);
}
/* ================= SCROLLBAR GLOBAL ================= */

/* Chrome, Edge, Safari */
::-webkit-scrollbar {
  width: 6px; /* nipis */
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #555;
  border-radius: 10px;
  transition: all 0.25s ease;
}

::-webkit-scrollbar-thumb:hover {

/* Firefox */
html {
  scrollbar-width: thin;
  scrollbar-color: #555 transparent;
}
:where(button, a, .btn, [tabindex]):focus-visible{
  outline: 3px solid #15325b;

}
:where(.input, input, select, textarea, [tabindex]):focus{

  outline: 0 !important;

  transition: all .2s ease;
}
select:focus,
select:focus-visible{
  border-color: #1668dc !important;

  transition: all .2s ease;
}

/* Tips Game management additions; form controls reuse new-ui.css */
.tips-admin-toolbar {
  width: calc(100% - 24px);
  max-width: none;
  min-width: 0;
  box-sizing: border-box;

  margin: 12px;
  padding: 10px 12px;

  display: block;
  background: var(--page-bg2);
  color: var(--page-text);
  border: 1px solid var(--border-input);
  border-radius: 12px;

}
.tips-admin-toolbar-text{display:flex;flex-direction:column;gap:4px}.tips-admin-toolbar-text strong{font-size:20px}.tips-admin-toolbar-text span{font-size:12px;opacity:.65}
.tips-admin-toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
.tips-btn-primary,.tips-btn-secondary{border:1px solid transparent;border-radius:6px;min-height:34px;padding:0 14px;color:white;background:var(--blue);cursor:pointer;font:inherit;font-size:13px}
.tips-btn-primary:hover{background:var(--blue-hover)}.tips-btn-secondary{background:var(--page-bg2);color:var(--page-text);border-color:var(--border-input)}
.tips-btn-secondary:hover{border-color:var(--blue-hover)}
.tips-platform-actions{display:flex;gap:4px;align-items:center}.tips-platform-title{overflow-wrap:anywhere}.platform-header{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding-bottom:7px;font-size:19px}
.tips-mini-btn{border:1px solid var(--border-input);border-radius:5px;background:transparent;color:var(--page-text);height:26px;width:27px;cursor:pointer;font-size:16px;flex:none}.tips-mini-btn:hover{border-color:var(--blue-hover)}.tips-delete:hover{color:#dc4352;border-color:#dc4352}
.tips-form{display:grid;gap:14px;text-align:left}.tips-field{display:flex;flex-direction:column;gap:6px}.tips-field label{font-size:13px;color:var(--text)}.tips-field .shared-textarea{min-height:200px;resize:vertical;width:100%;box-sizing:border-box}.tips-field .shared-input{box-sizing:border-box}
.tips-help{font-size:12px;color:var(--muted);line-height:1.5}.tips-form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}
.tips-empty{margin:36px auto;color:var(--page-text);opacity:.75;font-size:14px}
/* ==========================================
   TIPS GAME TOOLBAR - RESPONSIVE GRID
   ========================================== */

.tips-toolbar-grid {
  display: grid;
  grid-template-columns:
    repeat(3, minmax(0, 400px))
    minmax(140px, 1fr);
  align-items: center;
  gap: 10px;
  width: 100%;
  min-width: 0;
}

.tips-toolbar-grid > * {
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
}

/* Shared Search */
.tips-toolbar-grid .shared-sync-search {
  width: 100%;
  min-width: 0;
  height: 32px;
}

/* Shared Chip Dropdown */
.tips-toolbar-grid .shared-chip-dropdown {
  width: 100%;
  min-width: 0;
}

/* Create button wrapper */
.tips-toolbar-grid .tips-admin-toolbar-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  width: 100%;
  min-width: 0;
}

/* Create Platform Button */
.tips-toolbar-grid #tipsCreate {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  flex: 0 0 auto;

  width: max-content;
  max-width: 100%;
  min-width: max-content;
  height: 34px;
  padding: 0 14px;

  white-space: nowrap;
  box-sizing: border-box;
  font-size: 13px;
  line-height: 1;
}

/* Tablet */
@media (max-width: 1100px) {
  .tips-toolbar-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .tips-toolbar-grid .tips-admin-toolbar-actions {
    justify-content: flex-end;
  }
}

/* Phone */
@media (max-width: 600px) {
  .tips-admin-toolbar {
    width: calc(100% - 20px);
    margin: 10px;
    padding: 10px;
  }

  .tips-toolbar-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }

  .tips-toolbar-grid .tips-admin-toolbar-actions {
    width: 100%;
    justify-content: flex-end;
  }

  .tips-toolbar-grid #tipsCreate {
    width: auto;
    min-width: max-content;
    flex: 0 0 auto;
  }
}

<body>
  <div class="tips-admin-toolbar">
    <div class="tips-toolbar-grid">
<input
  type="search"
  id="tipsSearchPlatform"
  placeholder="Search platform..."
  aria-label="Search platform"
  autocomplete="off"
>
      <div id="tipsStatusFilter" data-placeholder="All Status" aria-label="Filter status"></div>
      <div id="tipsPlatformFilter" data-placeholder="All Platforms" aria-label="Filter platforms"></div>
      <div class="tips-admin-toolbar-actions"><button type="button" id="tipsCreate" class="btn-primary-new">+ Create Platform</button></div>
    </div>
  </div>
  <div class="platform-row" id="row-1"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="../firebase.js"></script>
<script src="./new-ui.js"></script>
<script defer src="./shared-ui.js"></script>
<script>
   let platformData = {};
    const autoIntervals = {};
function formatLastUpdatedNow(){
  const d = new Date();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const date = d.toLocaleDateString('en-GB');
  return `${time} ${date}`;
}

function setLastUpdatedFromCopy(name){
  const stamp = formatLastUpdatedNow();

  const el = document.getElementById('time-' + name);
  if (el) el.innerText = `Last Updated on ${stamp}`;

  // ✅ simpan supaya refresh kekal
  localStorage.setItem(`lastUpdated-${name}`, stamp);
}

function restoreLastUpdated(name){
  const saved = localStorage.getItem(`lastUpdated-${name}`);
  const el = document.getElementById('time-' + name);
  if (saved && el) el.innerText = `Last Updated on ${saved}`;
}
function generateRandomPercent() {
  const value = (90 + Math.random() * 8.99).toFixed(2);
  return `${value}%`;
}

function getPercentState(name) {
  return localStorage.getItem(`percent-${name}`) === 'on';
}

function filterTipsBySearch(name, list) {
  const searchEl = document.getElementById(`search-${name}`);
  const keyword = (searchEl?.value || '').trim().toLowerCase();

  if (!keyword) return list;
  return list.filter(item => item.toLowerCase().includes(keyword));
}
function createPlatform(name, tips, rowId) {
  const container = document.createElement('div');
  container.className = 'platform-box';
  container.setAttribute('data-platform', name.toLowerCase());
  container.dataset.platformId=platformIdByName.get(name);

  const tipListId = `tips-${name}`;
  const countId = `count-${name}`;
  const autoId = `auto-${name}`;
  const durationId = `duration-${name}`;
  const timeId = `time-${name}`;
  const searchId = `search-${name}`;
  const percentId = `percent-${name}`;

  container.innerHTML = `
    <div class="platform-header"><span class="tips-platform-title"></span></div>

    <div class="tip-top-bar">
      <input
        type="text"
        class="tip-search-input"
        id="${searchId}"
        placeholder="Search tips..."
        oninput="refreshList('${name}')"
      >

      <label class="percent-toggle-wrap" for="${percentId}">
        <input
          type="checkbox"
          class="percent-checkbox"
          id="${percentId}"
          onchange="togglePercent('${name}')"
        >
      </label>
    </div>

    <div class="tip-list" id="${tipListId}"></div>

    <div class="bottom-controls">
      <div class="row-center">
        <button class="btn-number" onclick="toggleNumber('${name}', this)">NUMBER</button>
        <button class="btn-refresh" onclick="refreshList('${name}')">CHANGE</button>
        <button class="btn-copy" onclick="copyTips('${name}')">COPY</button>
      </div>

      <div class="row-center">
        <div class="input-group">
          <input class="count-input" type="number" id="${countId}" value="3" min="1" max="${Math.max(tips.length,1)}" title="Game List">
          <div class="input-label">List Input</div>
        </div>

        <div class="input-group">
          <label class="switch">
            <input type="checkbox" id="${autoId}" onchange="toggleAuto('${name}')">
            <span class="slider"></span>
          </label>
          <div class="input-label">Off-On</div>
        </div>

        <div class="input-group">
          <input class="duration-input" type="number" value="0.5" min="1" id="${durationId}" title="Second">
          <div class="input-label">Time</div>
        </div>
      </div>

      <div class="timestamp" id="${timeId}">Last Updated on --</div>
      <div class="tips-card-footer">
        <label class="shared-active-switch" title="Enable or disable platform">
          <input type="checkbox" class="tips-platform-active" data-active-label="Active" data-inactive-label="Inactive">
          <span class="shared-active-track"><span class="shared-active-text"></span><span class="shared-active-knob" aria-hidden="true"></span></span>
        </label>
        <div class="tips-platform-actions"><button type="button" class="tips-mini-btn tips-edit" title="Edit platform and games" aria-label="Edit platform">✎</button><button type="button" class="tips-mini-btn tips-delete" title="Delete platform" aria-label="Delete platform">×</button></div>
      </div>
    </div>
  `;

  container.querySelector('.tips-platform-title').textContent = name;
  const recordId = platformIdByName.get(name);
  const isActive = tipsRecords[recordId]?.active !== false;
  const activeInput = container.querySelector('.tips-platform-active');
  activeInput.checked = isActive;
  window.SharedActiveSwitch?.sync(activeInput);
  activeInput.addEventListener('change', () => savePlatformActive(recordId, activeInput));
  applyPlatformActive(container, isActive);
  container.querySelector('.tips-edit').addEventListener('click', () => openPlatformEditor(platformIdByName.get(name)));
  container.querySelector('.tips-delete').addEventListener('click', e => deletePlatform(platformIdByName.get(name), e.currentTarget));
  document.getElementById(rowId).appendChild(container);
  restoreLastUpdated(name);

  const numberStatus = localStorage.getItem(`number-${name}`);
  if (numberStatus === 'on') {
    const numberBtn = container.querySelector('.btn-number');
    if (numberBtn) numberBtn.classList.add('active');
  }

  const percentCheckbox = document.getElementById(percentId);
  const savedPercent = localStorage.getItem(`percent-${name}`);
  if (savedPercent === 'on') {
    percentCheckbox.checked = true;
  }

  refreshList(name);

  const autoCheckbox = document.getElementById(`auto-${name}`);
  const savedStatus = localStorage.getItem(`auto-${name}`);
  if (savedStatus === 'on') {
    autoCheckbox.checked = true;
    if(isActive) toggleAuto(name);
    else { autoCheckbox.checked=false; localStorage.setItem(`auto-${name}`,'off'); }
  }
}
function renderTips(name, tips) {
  const el = document.getElementById('tips-' + name);
  const numberBtn = document.querySelector(`.platform-box[data-platform="${name.toLowerCase()}"] .btn-number`);
  const percentOn = getPercentState(name);

  let content = `<strong>${escapeTipsHtml(name)}</strong><br>=========<br>`;

  tips.forEach((t, i) => {
    let line = numberBtn && numberBtn.classList.contains('active')
      ? `${i + 1}. ${t}`
      : t;

    if (percentOn) {
      line += ` ${generateRandomPercent()}`;
    }

    content += `${escapeTipsHtml(line)}<br>`;
  });

  el.innerHTML = content;
}

function refreshList(name) {
  const count = parseInt(document.getElementById('count-' + name).value) || 3;
  const list = platformData[name] || [];

  const filteredList = filterTipsBySearch(name, list);
  const shuffled = [...filteredList].sort(() => 0.5 - Math.random());
  const random = shuffled.slice(0, count);

  renderTips(name, random);
}

    function copyTips(name) {
  const text = document.getElementById('tips-' + name).innerText;
  const button = document.querySelector(`.platform-box[data-platform="${name.toLowerCase()}"] .btn-copy`);

  
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
    setLastUpdatedFromCopy(name);
      tipsToast('Tips copied to clipboard!');
    }).catch(() => {
      fallbackCopy();
    });
  } else {
    fallbackCopy();
  }

  function fallbackCopy() {
    const tempInput = document.createElement("textarea");
    tempInput.value = text;
    tempInput.style.position = "fixed";
    tempInput.style.opacity = "0";
    document.body.appendChild(tempInput);
    tempInput.focus();
    tempInput.select();
    let copied=false;
    try {copied=document.execCommand("copy");} catch(err) {console.error(err);}
    document.body.removeChild(tempInput);
    if(copied){tipsToast('Tips copied to clipboard!');setLastUpdatedFromCopy(name);}
    else NewUI.showToast('Copy failed. Please check clipboard permission.','error');
  }


}

function toggleAuto(name) {
  const checkbox = document.getElementById('auto-' + name);
  clearInterval(autoIntervals[name]);
  localStorage.setItem(`auto-${name}`, checkbox.checked ? 'on' : 'off');
  
  if (checkbox.checked) {
    let duration = parseFloat(document.getElementById('duration-' + name).value) || 1;

    if (duration < 1) {
      duration = duration * 10 * 1000;
    } else {
      duration = duration * 60 * 1000;
    }

    autoIntervals[name] = setInterval(() => refreshList(name), duration);
  }
}

function togglePercent(name) {
  const checkbox = document.getElementById(`percent-${name}`);
  localStorage.setItem(`percent-${name}`, checkbox.checked ? 'on' : 'off');
  refreshList(name);
}

/* =========================================================
   TIPS GAME - FIREBASE MANAGEMENT
   Uses existing new-ui.js modal, confirm, toast and loading.
   Data location: tips_game/platforms/{firebasePushId}
   Starts empty; platforms are created manually and saved to Firebase.
   ========================================================= */
const TIPS_DB_PATH = 'tips_game/platforms';
const platformIdByName = new Map();
let tipsRecords = {};
let tipsDb = null;
let tipsLoaded = false;
const tipsCreate = document.getElementById('tipsCreate');

function escapeTipsHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function tipsToast(message, type='success') { NewUI.showToast(message,type); }
function normalizeGameNames(raw) {
  return [...new Set(String(raw || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean))];
}
function safePlatformName(raw) {
  const name=String(raw||'').trim().replace(/\s+/g,' ');
  if(!name || name.length>60) throw new Error('Platform name must be 1–60 characters.');
  // Existing UI uses names for IDs and inline handlers; restrict unsafe characters.
  if(!/^[\p{L}\p{N} _+.-]+$/u.test(name)) throw new Error('Platform name may use letters, numbers, spaces, _ + . - only.');
  return name;
}
function clearTipsIntervals() {
  Object.keys(autoIntervals).forEach(key => { clearInterval(autoIntervals[key]); delete autoIntervals[key]; });
}
function renderPlatformsFromDatabase() {
  clearTipsIntervals();
  document.getElementById('row-1').replaceChildren();
  platformData = {};
  platformIdByName.clear();
  const records=Object.entries(tipsRecords).map(([id, record])=>({id,...record})).filter(r=>r.name && Array.isArray(r.games));
  records.sort((a,b)=>(a.order??9999)-(b.order??9999)||a.name.localeCompare(b.name));
  for(const record of records) {
    const name=record.name;
    if(platformIdByName.has(name))continue;
    platformIdByName.set(name,record.id);
    platformData[name]=record.games.filter(x=>typeof x==='string');
    createPlatform(name,platformData[name],'row-1');
  }
  updateTipsFilterOptions(records);
  applyTipsFilters();
  if(!records.length) {
    const empty=document.createElement('div');empty.className='tips-empty';
    empty.textContent='No platforms yet. Click + Create Platform to add your first platform.';
    document.getElementById('row-1').appendChild(empty);
  }
  
}
function tipsDatabase() {
  if(tipsDb)return tipsDb;
  if(!window.firebase?.database)throw new Error('Firebase Realtime Database is unavailable. Check ../firebase.js');
  tipsDb=firebase.database();
  return tipsDb;
}
function openPlatformEditor(id=null) {
  if(!tipsLoaded){tipsToast('Wait for Firebase to connect.','error');return;}
  const record=id?tipsRecords[id]:null;
  if(id&&!record){tipsToast('Platform no longer exists.','error');return;}
  const form=document.createElement('form');form.className='tips-form';
  form.innerHTML=`
    <div class="tips-field"><label for="tipsPlatformName">Platform Name</label><input id="tipsPlatformName" class="shared-input" maxlength="60" placeholder="e.g. MEGA888" required></div>
    <div class="tips-field"><label for="tipsGameNames">Game Names</label><textarea id="tipsGameNames" class="shared-textarea" placeholder="One game name per line" spellcheck="false"></textarea><div class="tips-help">Enter one game per line. Duplicates are removed automatically. CHANGE, AUTO, COPY and Percentage will use this list.</div></div>
    <div class="tips-form-actions"><button type="button" class="btn-cancel-new" data-cancel>Cancel</button><button type="submit" class="btn-primary-new" data-save>${id?'Update':'Create'}</button></div>`;
  const nameInput=form.querySelector('#tipsPlatformName');
  const gamesInput=form.querySelector('#tipsGameNames');
  const save=form.querySelector('[data-save]');
  nameInput.value=record?.name||'';
  gamesInput.value=(record?.games||[]).join('\n');
  const modal=NewUI.modal.open({title:id?'Edit Tips Platform':'Create Tips Platform',content:form,width:540});
  form.querySelector('[data-cancel]').addEventListener('click',()=>modal.close());
  form.addEventListener('submit',async e=>{
    e.preventDefault();if(save.disabled)return;
    let success=false;
    try {
      const name=safePlatformName(nameInput.value);
      const games=normalizeGameNames(gamesInput.value);
      if(!games.length)throw new Error('Enter at least one game name.');
      if(games.length>3000)throw new Error('Maximum 3000 games per platform.');
      if(games.some(x=>x.length>150))throw new Error('Game names must be 150 characters or fewer.');
      const duplicate=Object.entries(tipsRecords).some(([key,r])=>key!==id && String(r.name||'').toLowerCase()===name.toLowerCase());
      if(duplicate)throw new Error('Platform name already exists.');
      NewUI.setButtonLoading(save,true,{text:id?'Updating...':'Saving...'});
      const db=tipsDatabase();
      const data={name,games,updatedAt:firebase.database.ServerValue.TIMESTAMP};
       if(!id) data.active = true;
      if(id)await db.ref(`${TIPS_DB_PATH}/${id}`).update(data);
      else await db.ref(TIPS_DB_PATH).push({...data,createdAt:firebase.database.ServerValue.TIMESTAMP});
      success=true;
      await NewUI.setButtonLoading(save,false);
      modal.close();tipsToast(id?'Platform updated!':'Platform created!');
    } catch(err){console.error(err);tipsToast(err.message||'Save failed','error');}
    finally {await NewUI.setButtonLoading(save,false);}
  });
}
async function deletePlatform(id,button) {
  const record=tipsRecords[id];if(!record)return;
  const yes=await NewUI.confirm({target:button,title:'Delete Tips Platform?',message:`Delete "${record.name}" and its ${record.games?.length||0} game names? This cannot be undone.`,confirmText:'Delete',danger:true});
  if(!yes)return;
  // Confirm box is closed before the realtime record is deleted.
  try {await tipsDatabase().ref(`${TIPS_DB_PATH}/${id}`).remove();tipsToast('Platform deleted!');}
  catch(err){console.error(err);tipsToast('Delete failed: '+err.message,'error');}
}
/* ===== Platform status + shared filters ===== */
const tipsPlatformFilterEl = document.getElementById('tipsPlatformFilter');
const tipsStatusFilterEl = document.getElementById('tipsStatusFilter');
const tipsSearchPlatformEl = document.getElementById('tipsSearchPlatform');
NewUI.syncSearch('#tipsSearchPlatform', {
  onSearch: async () => {
    await new Promise(resolve =>
      requestAnimationFrame(() =>
        requestAnimationFrame(resolve)
      )
    );


    applyTipsFilters();

    await new Promise(resolve =>
      setTimeout(resolve, 500)
    );
  }
});
const tipsPlatformChips = NewUI.chips(tipsPlatformFilterEl, {
  placeholder:'All Platforms', options:[], value:[], onChange:applyTipsFilters
});
const tipsStatusChips = NewUI.chips(tipsStatusFilterEl, {
  placeholder:'All Status',
  options:[{value:'active',label:'Active'},{value:'inactive',label:'Inactive'}],
  value:[],onChange:applyTipsFilters
});
tipsSearchPlatformEl.addEventListener('input',applyTipsFilters);
function updateTipsFilterOptions(records) {
  const current = tipsPlatformChips.getValue();
  tipsPlatformChips.setOptions(records.map(r=>({value:r.id,label:r.name})).sort((a,b)=>a.label.localeCompare(b.label)));
  tipsPlatformChips.setValue(current.filter(id=>tipsRecords[id]),false);
}
function applyTipsFilters() {
  const selected = new Set(tipsPlatformChips?.getValue() || []);
  const statuses = new Set(tipsStatusChips?.getValue() || []);
  const query = (tipsSearchPlatformEl?.value || '').trim().toLowerCase();
  document.querySelectorAll('.platform-box').forEach(box=>{
    const id=box.dataset.platformId;
    const record=tipsRecords[id];
    if(!record) return;
    const active=record.active !== false;
    const matchPlatform=!selected.size || selected.has(id);
    const matchStatus=!statuses.size || statuses.has(active?'active':'inactive');
    const matchSearch=String(record.name||'').toLowerCase().includes(query);
    box.hidden=!(matchPlatform && matchStatus && matchSearch);
  });
}
function applyPlatformActive(box, active) {
  box.classList.toggle('tips-platform-disabled', !active);

  // Disable fungsi game sahaja.
  // Toggle Active/Inactive, Edit dan Delete kekal boleh digunakan.
  box.querySelectorAll(
    '.tip-top-bar input, ' +
    '.bottom-controls .row-center button, ' +
    '.bottom-controls .row-center input'
  ).forEach(el => {
    el.disabled = !active;
  });

  // Toggle status mesti sentiasa boleh digunakan.
  const activeToggle = box.querySelector('.tips-platform-active');

  if (activeToggle) {
    activeToggle.disabled = false;
    activeToggle.checked = active;
    window.SharedActiveSwitch?.sync(activeToggle);
  }

  // Hentikan AUTO apabila platform Inactive.
  if (!active) {
    const name = box.querySelector('.tips-platform-title')?.textContent;

    if (name) {
      clearInterval(autoIntervals[name]);
      delete autoIntervals[name];

      const autoCheckbox = box.querySelector(`#${CSS.escape('auto-' + name)}`);
      if (autoCheckbox) autoCheckbox.checked = false;

      localStorage.setItem(`auto-${name}`, 'off');
    }
  }
}
async function savePlatformActive(id,input) {
  const next=input.checked;
  input.disabled=true;
  try {
    await tipsDatabase().ref(`${TIPS_DB_PATH}/${id}`).update({active:next,updatedAt:firebase.database.ServerValue.TIMESTAMP});
    tipsToast(next?'Platform activated!':'Platform deactivated!');
  }catch(error){
    input.checked=!next;
    window.SharedActiveSwitch?.sync(input);
    tipsToast('Cannot update platform: '+error.message,'error');
  }finally{input.disabled=false;}
}

function startTipsRealtime() {
  try {
    tipsDatabase().ref(TIPS_DB_PATH).on('value',snapshot=>{
      tipsRecords=snapshot.val()||{};
      tipsLoaded=true;
      renderPlatformsFromDatabase();
    },error=>{
      console.error('Tips Firebase listener:',error);
      tipsToast('Cannot load Tips Game data: '+error.message,'error');
    });
}catch(err){
  console.error('Tips Firebase connection:', err);
  tipsToast(err.message || 'Firebase not connected', 'error');
}
}
tipsCreate.addEventListener('click',()=>openPlatformEditor());
// Legacy card buttons use inline handlers. Expose only the existing UI actions.
Object.assign(window,{refreshList,copyTips,toggleAuto,togglePercent,toggleNumber});
startTipsRealtime();

function toggleNumber(name, btn) {
  btn.classList.toggle('active');

  const isActive = btn.classList.contains('active');
  localStorage.setItem(`number-${name}`, isActive ? 'on' : 'off');

  refreshList(name);
}
(function () {
  const THEME_KEY = "siteTheme";

  function applyChildTheme(theme) {
    document.body.classList.remove("light-theme", "dark-theme");
    document.body.classList.add(theme === "light" ? "light-theme" : "dark-theme");
  }

  applyChildTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");

  window.addEventListener("message", function (e) {
    const allowedOrigins = [
      "https://5g88-main.vercel.app",
      "https://searcfile.github.io"
    ];
    if (!allowedOrigins.includes(e.origin)) return;

    const data = e.data || {};
    if (data.type === "theme-change") {
      const theme = data.theme === "dark" ? "dark" : "light";
      localStorage.setItem(THEME_KEY, theme);
      applyChildTheme(theme);
    }
  });
})();
// ✅ Tukar ikut page
window.HISTORY_TAB_NAME = "TIPS GAME";

// ✅ Hantar ke main page
function sendUserAction(actionName, extra = {}) {
  if (!actionName) return;

  window.parent.postMessage({
    type: "user-tab-action",
    tab: window.HISTORY_TAB_NAME,
    action: actionName,
    extra,
    time: Date.now()
  }, "https://5g88-main.vercel.app");
}

   AUTO TRACK CLICK - COUNT SEMUA CLICK
========================= */
document.addEventListener("click", function(e) {
  const el = e.target.closest("button, [onclick], a, .btn, [data-action]");
  if (!el) return;

  if (el.disabled || el.getAttribute("aria-disabled") === "true") return;

  let name =
    el.getAttribute("data-action") ||
    el.getAttribute("title") ||
    el.getAttribute("aria-label") ||
    el.innerText ||
    el.textContent ||
    el.id ||
    "";

  name = String(name)
    .replace(/\s+/g, " ")
    .trim();

  if (!name || name.length < 2) return;

  name = name.slice(0, 40);

  sendUserAction(name);
}, true);

========================= */
document.addEventListener("keydown", function(e) {
  const key = String(e.key || "").toLowerCase();

  if ((e.ctrlKey || e.metaKey) && key === "c") {
    sendUserAction("COPY IMAGE", {
      method: "keyboard",
      shortcut: "Ctrl+C"
    });
  }
}, true);

  });
