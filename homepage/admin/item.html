  <style>
      :root{
    --page-bg: #000;
    --page-text: rgba(255,255,255,0.85);
    --page-input: #141414;
    --border-input:#424242;
    --page-bg2:#1f1f1f;
    --name:#1668dc;
    --blur:rgba(255,255,255,0.25);

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
  }

  body.light-theme{
    --page-bg: #ffffff;
    --page-text: rgba(0,0,0,0.88);
    --page-input: #ffffff;
    --border-input:#d9d9d9;
    --page-bg2:#ffffff;
    --name:#1668dc;
    --blur:#00000063;

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
  }


    *{ box-sizing:border-box; margin:0; padding:0; }

body{
  min-height:100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:var(--page-bg);
  color:var(--page-text);
  margin:0;
  padding:0;
}

.wrapper{
  width:calc(100% - 24px);
  max-width:1400px;
  margin:16px auto 0;
}

    /* SEARCH */
    .search-wrapper{
      display:flex;
      justify-content:center;
      margin-bottom:10px;
    }

    .search-box{
      position:relative;
      width:100%;
      max-width:360px;
    }

    .search-input{
      width:100%;
      padding:9px 40px 9px 38px;
      border-radius:6px;
      border:1px solid var(--border-input);
      background:var(--page-input);
      color:var(--page-text);
      font-size:0.9rem;
      outline:none;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease,
        transform 0.08s ease;
    }

    .search-input::placeholder{
      color:var(--blur);
    }

    .search-input:focus{
      border-color:var(--blue);
    }
    .search-input:hover{
      border-color:var(--blue-hover);
    }
    .search-icon{
      position:absolute;
      left:12px;
      top:50%;
      transform:translateY(-50%);
      font-size:0.9rem;
      opacity:0.8;
      pointer-events:none;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .search-svg{
      width:16px;
      height:16px;
      fill:var(--blur);
      transition:fill 0.15s ease;
    }

    .search-input:focus ~ .search-icon .search-svg{
      fill:var(--accent-soft);
    }

    .clear-btn{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      width:22px;
      height:22px;
      border-radius:999px;
      border:1px solid transparent;
      background:transparent;
      color:var(--page-text);
      font-size:0.78rem;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      pointer-events:none;
      transition:
        opacity 0.12s ease,
        background 0.12s ease,
        border-color 0.12s ease,
        color 0.12s ease,
        transform 0.08s ease;
    }

    .clear-btn:hover{
      color:var(--blue-hover);
    }

    .clear-btn:active{
     color:var(--blue-active);
    }

    /* GRID */
    .card-grid{
      display:flex;
      flex-wrap:wrap;
      gap:16px;
      justify-content:center;
      align-items:flex-start;
      width:100%;
    }

    .item-card{
      background:var(--page-bg2);
      border-radius:6px;
      border:1px solid var(--border-input);
      padding:12px 12px 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      position:relative;
      overflow:hidden;
      cursor:default;
      transition:
        transform 0.16s ease,
        box-shadow 0.16s ease,
        border-color 0.16s ease;
      min-height:260px;

      /* 6 card per baris dengan gap 16px (5 gap = 80) */
      flex: 0 0 calc((100% - 80px) / 6);
      max-width: calc((100% - 80px) / 6);

      /* bantu GPU */
      will-change: transform;
    }

    /* matikan glow radial berat, biar render lebih ringan */
    .item-card::before{
      content:"";
      position:absolute;
      inset:0;
      opacity:0;
      pointer-events:none;
      /* kalau mau glow tipis boleh pakai warna lembut, sekarang dimatikan */
      background:none;
      transition:opacity 0.2s ease;
    }

    .item-card.copied{
      border-color:var(--border-input);
    }

    .image-wrap{
      border-radius:10px;
      overflow:hidden;
      position:relative;
      background:var(--page-input);
      border:1px solid var(--border-input);
      height:180px;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .image-wrap::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(to top, rgba(15,23,42,0.55), transparent 40%);
      opacity:0.2;
    }

    .image-wrap img{
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      object-position:center;
      transition:transform 0.25s ease;
      will-change: transform;
    }

    .item-card:hover .image-wrap img{
      transform:scale(1.04);
    }

    .item-info{
      display:flex;
      flex-direction:column;
      gap:4px;
      margin-top:4px;
      flex-grow:1;
    }

    .item-title{
      font-size:1rem;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .item-code{
      font-family:"JetBrains Mono","SF Mono",Consolas,monospace;
      font-size:0.8rem;
      font-weight:500;
      color:#3c89e8;
      background:#111a2c;
      border-radius:4px;
      padding-inline: 7px;
      align-self:flex-start;
      border:1px solid #15325b;
      line-height: 20px;
    }

    .copy-btn{
      margin-top:8px;
      border:none;
      outline:none;
      padding:0px 15px;
      border-radius:6px;
      font-size:14px;
      letter-spacing:0.06em;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      background:var(--blue);
      color:white;
      border:1px solid transparent;
      transition: all .2s ease;
      height:32px;
    
    }

    .copy-btn span.icon{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      translate:0 0;
      transition: all .2s ease:
    }

    .copy-btn .copy-icon-svg{
      width:16px;
      height:16px;
      fill:#38bdf8;
      transition: all .2s ease:
    }

    .copy-btn:hover .copy-icon-svg{
      fill:#0ea5e9;
    }

    .item-card.copied .copy-icon-svg{
      fill:#022c22;
    }

    .copy-btn:hover{
      background:var(--blue-hover);
    }

    .copy-btn:active{
      background:var(--blue-active);
    }

    .copy-toast{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%) translateY(30px);
      padding:10px 16px;
      border-radius:6px;
      background:#141414;
      border:1px solid #424242;
      color:rgba(255,255,255,0.85);
      font-size:14px;
      letter-spacing:0.08em;
      display:flex;
      align-items:center;
      gap:8px;
      opacity:0;
      pointer-events:none;
      transition:opacity 0.18s ease, transform 0.18s ease;
      z-index:50;
    }

    .copy-toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(0);
    }

    /* 4 card per baris */
    @media (max-width: 1024px){
      .item-card{
        flex: 0 0 calc((100% - 48px) / 4);
        max-width: calc((100% - 48px) / 4);
      }
    }

    /* 3 card per baris */
    @media (max-width: 800px){
      .item-card{
        flex: 0 0 calc((100% - 32px) / 3);
        max-width: calc((100% - 32px) / 3);
      }
    }

    /* 2 card per baris */
    @media (max-width: 600px){
      .item-card{
        flex: 0 0 calc((100% - 16px) / 2);
        max-width: calc((100% - 16px) / 2);
      }
    }

    /* 1 card full di HP kecil */
    @media (max-width: 400px){
      .item-card{
        flex: 0 0 100%;
        max-width:100%;
      }
    }

/* ITEM COLLECTION - modern, responsive, scoped */
.item-page{max-width:none;width:calc(100% - 24px);margin:12px}
.item-toolbar{display:grid;grid-template-columns:minmax(0,400px) minmax(0,400px) minmax(0,400px) minmax(max-content,1fr);align-items:center;gap:10px;padding:12px;background:var(--page-bg2);border:1px solid var(--border-input);border-radius:12px;min-width:0;}
.item-toolbar-search,.item-filter{min-width:0;width:100%;}
.item-toolbar .shared-sync-search{width:100%;height:32px;max-width:none;}
.item-toolbar .shared-chip-dropdown{width:100%;min-width:0;}
.item-primary,.item-secondary,.item-icon-button{height:32px;border-radius:6px;padding:0 15px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;}
.item-primary{background:var(--blue);color:white;border:1px solid transparent;}
.item-primary:hover{background:var(--blue-hover);}
.item-secondary,.item-icon-button{background:var(--page-input);color:var(--page-text);border:1px solid var(--border-input);}
#itemCreate{justify-self:end;width:max-content;}
.item-meta{padding:14px 4px;color:var(--blur);font-size:12px;}
.item-page .card-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;justify-content:stretch;align-items:stretch;}
.item-page .item-card{flex:none;max-width:none;width:100%;min-width:0;min-height:0;border-radius:12px;padding:10px;will-change:auto;}
.item-page .image-wrap{height:auto;aspect-ratio:1/1;border-radius:9px;}
.item-page .item-info{min-width:0;margin-top:2px;}
.item-page .item-title{font-size:14px;}
.item-page .item-code{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.item-card-meta{color:var(--blur);font-size:11px;line-height:1.5;overflow-wrap:anywhere;}
.item-actions{display:flex;gap:6px;align-items:center;margin-top:auto;}
.item-actions .copy-btn{margin:0;flex:1;min-width:0;letter-spacing:0;font-size:12px;padding:0 7px;}
.item-icon-button{width:32px;flex:none;padding:0;font-size:18px;}
.item-icon-button.danger:hover{border-color:#dc4352;color:#dc4352;}
.item-form{display:flex;flex-direction:column;gap:18px;}
.item-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.item-form-field{display:flex;flex-direction:column;gap:7px;min-width:0;font-size:12px;font-weight:600;color:var(--page-text);}
.item-form-field input{width:100%;height:34px;border-radius:6px;background:var(--page-input);border:1px solid var(--border-input);color:var(--page-text);padding:0 10px;font:inherit;font-size:13px;}
.item-form-field .new-ui-input-wrap{width:100%;}

.item-page .shared-empty{grid-column:1/-1;min-height:160px;}
@media(max-width:1300px){.item-page .card-grid{grid-template-columns:repeat(5,minmax(0,1fr));}}
@media (max-width: 1050px) {
  .item-page .card-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}@media(max-width:700px){.item-toolbar{grid-template-columns:minmax(0,1fr);}.item-toolbar-search,.item-filter{grid-column:1;width:100%;}.item-toolbar .shared-chip-dropdown,.item-toolbar .shared-chip-dropdown-trigger{width:100%;}#itemCreate{grid-column:1;justify-self:end;}.item-page .card-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}.item-form-grid{grid-template-columns:1fr;}}

.item-toolbar{border-radius:12px;padding:10px 12px;gap:10px;}

.item-page .item-actions:has(> :only-child){grid-template-columns:minmax(0,1fr);}

  max-width: none;

  flex-direction: column;
  align-items: center;

}

<script>
(() => {
  "use strict";
  const DB_PATH = "item_collection/items";
  // Isi dua nilai ini menggunakan Cloudinary unsigned upload preset milik bro.
  // Tanpa konfigurasi ini, create melalui upload image akan tunjuk error yang jelas.
  const CLOUDINARY_CLOUD_NAME = "dqctvbenv";
  const CLOUDINARY_UPLOAD_PRESET = "game_logos";
  const LEGACY_ITEMS = [];
  const grid=document.getElementById('cardGrid');
  const search=document.getElementById('searchInput');
  const notify=(msg,type='info')=>window.NewUI?.showToast?.(msg,type) || console.log(msg);
  const clean=v=>String(v??'').trim();
  const lower=v=>clean(v).toLocaleLowerCase();
  const records=new Map();
  const ITEM_TAGS=['Bank Item','Game Item','Other Item'];
  let tagFilter,collectionFilter,searchUI,dbRef=null,loaded=false;
  const legacy=LEGACY_ITEMS.map((r,i)=>({
    id:'legacy-'+i,title:r.title,code:r.code,img:r.img,tag:r.tag,
    collection:r.title,legacy:true
  }));
  function allItems(){return [...legacy,...records.values()].sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));}
  function refreshFilters(){
    const items=allItems();
    const tags=[...new Set([...ITEM_TAGS,...items.flatMap(x=>clean(x.tag).split(',').map(s=>s.trim()).filter(Boolean))])].sort((a,b)=>a.localeCompare(b));
    const collections=[...new Set(items.map(x=>clean(x.collection||x.title)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    tagFilter?.setOptions(tags.map(v=>({value:v,label:v})));
    collectionFilter?.setOptions(collections.map(v=>({value:v,label:v})));
  }
  function filtered(){
    const q=lower(search.value),tags=tagFilter?.getValue()||[],cols=collectionFilter?.getValue()||[];
    return allItems().filter(x=>{
      const itemTags=clean(x.tag).split(',').map(s=>s.trim());
      return (!q || [x.title,x.tag,x.collection].some(s=>lower(s).includes(q)))
        && (!tags.length || tags.some(t=>itemTags.includes(t)))
        && (!cols.length || cols.includes(clean(x.collection||x.title)));
    });
  }
  function card(item){
    const el=document.createElement('article');el.className='item-card';
    const image=document.createElement('div');image.className='image-wrap';
    const img=document.createElement('img');img.src=item.img;img.alt=item.title;img.loading='lazy';image.append(img);
    const info=document.createElement('div');info.className='item-info';
    const title=document.createElement('div');title.className='item-title';title.textContent=item.title;
    info.append(title);
    const actions=document.createElement('div');actions.className='item-actions';
    const copy=document.createElement('button');copy.type='button';copy.className='copy-btn';copy.textContent='Copy Image';
    copy.addEventListener('click',()=>copyImage(item,copy));
    actions.append(copy);
    if(!item.legacy){
      const edit=document.createElement('button');edit.type='button';edit.className='item-action-button';edit.title='Edit item';edit.setAttribute('aria-label','Edit item');edit.textContent='Edit';edit.addEventListener('click',()=>openForm(item));
      const del=document.createElement('button');del.type='button';del.className='item-action-button danger';del.title='Delete item';del.setAttribute('aria-label','Delete item');del.textContent='Delete';del.addEventListener('click',()=>removeItem(item));
      actions.append(edit,del);
    }
    el.append(image,info,actions);return el;
  }
function render() {
  const items = filtered();

  grid.replaceChildren();

  if (!items.length) {

    if (typeof window.showEmptyState === 'function') {

      window.showEmptyState(
        grid,
        'No Data',
        'large',
        'center',
        true
      );

    } else {

      const empty = document.createElement('div');

      empty.className = 'item-empty';
      empty.textContent = 'No Data';

      grid.append(empty);
    }

    return;
  }

  const frag = document.createDocumentFragment();

  items.forEach(item => {
    frag.append(card(item));
  });

  grid.append(frag);
}
  async function copyImage(item,btn){
    if(!navigator.clipboard?.write || !window.ClipboardItem){notify('Browser tidak support copy image','error');return;}
    try{
      const res=await fetch(item.img,{mode:'cors'});if(!res.ok)throw Error('Image request failed');
      let blob=await res.blob();
      if(blob.type!=='image/png'){
        const bmp=await createImageBitmap(blob);const canvas=document.createElement('canvas');canvas.width=bmp.width;canvas.height=bmp.height;
        canvas.getContext('2d').drawImage(bmp,0,0);blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Conversion failed')),'image/png'));
        bmp.close?.();
      }
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      notify('Image copied','success');
    }catch(e){console.error(e);notify('Copy gagal. Image host mungkin block CORS.','error');}
  }
  function inputField(label,id,value='',required=false){
    const wrap=document.createElement('label');wrap.className='item-form-field';
    const text=document.createElement('span');text.textContent=label;
    const input=document.createElement('input');input.id=id;input.value=value;input.required=required;input.autocomplete='off';
    wrap.append(text,input);return wrap;
  }
  async function cloudinaryUpload(file){
    if(!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET)throw Error('Sila isi CLOUDINARY_CLOUD_NAME dan CLOUDINARY_UPLOAD_PRESET dalam item.html dahulu.');
    const data=new FormData();data.append('file',file);data.append('upload_preset',CLOUDINARY_UPLOAD_PRESET);
    const res=await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY_CLOUD_NAME)}/image/upload`,{method:'POST',body:data});
    const json=await res.json();if(!res.ok||!json.secure_url)throw Error(json.error?.message||'Cloudinary upload failed');
    return json.secure_url;
  }
  function openForm(item=null){
    if(!dbRef){notify('Firebase belum tersedia atau akses ditolak. Semak login dan rules.','error');return;}
    const form=document.createElement('form');form.className='item-form';form.noValidate=true;
    const row=document.createElement('div');row.className='item-form-grid';
    row.append(
      inputField('Item Name','itemName',item?.title||'',true),
      inputField('Collection / Platform','itemCollection',item?.collection||'',true)
    );
    const tagField=document.createElement('div');
    tagField.className='item-form-field item-form-full';
    const tagLabel=document.createElement('span');tagLabel.textContent='Tags';
    const tagHost=document.createElement('div');tagHost.id='itemFormTagChips';
    tagField.append(tagLabel,tagHost);
    row.append(tagField);
    const imageLabel=document.createElement('div');imageLabel.className='item-form-field item-form-full';
    const span=document.createElement('span');span.textContent='Item Image';
    const uploadHost=document.createElement('div');uploadHost.id='itemUploadHost';imageLabel.append(span,uploadHost);
    const footer=document.createElement('div');footer.className='item-form-actions';
    const cancel=document.createElement('button');cancel.type='button';cancel.className='item-secondary';cancel.textContent='Cancel';
    const save=document.createElement('button');save.type='submit';save.className='item-primary';save.textContent=item?'Save Changes':'Create Item';
    footer.append(cancel,save);form.append(row,imageLabel,footer);
    const modal=NewUI.modal.open({title:item?'Edit Item':'Create Item',content:form,width:660});
    cancel.addEventListener('click',()=>modal.close());
    row.querySelectorAll('input').forEach(el=>NewUI.input(el));
    const savedTags=clean(item?.tag).split(',').map(t=>t.trim()).filter(Boolean);
    const modalTagOptions=[...new Set([...ITEM_TAGS,...savedTags])].map(v=>({value:v,label:v}));
    const modalTags=NewUI.chips(tagHost,{
      placeholder:'Select Tags',
      options:modalTagOptions
    });
    if(savedTags.length)modalTags.setValue(savedTags);
    const uploader=NewUI.imageUpload(uploadHost,{maxSizeMB:5,initialUrl:item?.img||'',initialName:item?.title||'Existing image',onError:e=>notify(e.message,'error')});
    form.addEventListener('submit',async e=>{
      e.preventDefault();if(save.disabled)return;
      const title=clean(form.querySelector('#itemName').value),collection=clean(form.querySelector('#itemCollection').value),
        tag=(modalTags.getValue()||[]).join(', ');
     if (!title || !collection || !tag) {
  notify('Lengkapkan semua input dahulu.', 'warning');
  return;
}
      if(!uploader.getFile()&&!uploader.getUrl()){notify('Sila upload gambar.','warning');return;}
      NewUI.setButtonLoading(save,true,{text:item?'Saving...':'Creating...'});
      try{
        let img=uploader.getUrl();
        if(uploader.getFile())img=await cloudinaryUpload(uploader.getFile());
        // Legacy rules require 'code'; preserve it in Firebase only, without showing a Code field.
        const data={title,collection,code:item?.code||'5G88_Site',tag,img,updatedAt:firebase.database.ServerValue.TIMESTAMP};
        if(item)await dbRef.child(item.id).update(data);
        else await dbRef.push().set({...data,createdAt:firebase.database.ServerValue.TIMESTAMP});
        notify(item?'Item updated':'Item created','success');modal.close();
      }catch(err){console.error(err);notify(err.message||'Save failed','error');}
      finally{await NewUI.setButtonLoading(save,false,{minDuration:600});}
    });
  }
  async function removeItem(item){
    if(!dbRef)return;
    if(!confirm(`Delete "${item.title}"? This cannot be undone.`))return;
    try{await dbRef.child(item.id).remove();notify('Item deleted','success');}
    catch(e){console.error(e);notify('Delete failed: '+e.message,'error');}
  }
  function startRealtime(){
    try{
      if(typeof firebase==='undefined'||!firebase.apps?.length){loaded=true;render();notify('Firebase app belum initialized. Semak ../firebase.js','error');return;}
      const auth=firebase.auth();
      auth.onAuthStateChanged(user=>{
        if(dbRef){dbRef.off();dbRef=null;}
        records.clear();
        if(!user){loaded=true;refreshFilters();render();notify('Sila login untuk Create Item','warning');return;}
        dbRef=firebase.database().ref(DB_PATH);loaded=false;
        dbRef.on('value',snapshot=>{
          records.clear();
          snapshot.forEach(child=>{const v=child.val();if(v&&v.title&&v.img)records.set(child.key,{...v,id:child.key,legacy:false});});
          loaded=true;refreshFilters();render();
        },err=>{loaded=true;notify('Database: '+err.message,'error');render();});
      });
    }catch(err){loaded=true;console.error(err);notify('Firebase initialization error: '+err.message,'error');render();}
  }
  tagFilter=NewUI.chips('#itemTagChips',{placeholder:'All Tags',options:[],onChange:render});
  tagFilter.setValue([...ITEM_TAGS]);
  collectionFilter=NewUI.chips('#itemCollectionChips',{placeholder:'All Collections',options:[],onChange:render});
  searchUI=NewUI.syncSearch(search,{onSearch:async()=>{render();await new Promise(r=>setTimeout(r,450));}});
  search.addEventListener('input',render);
  document.getElementById('itemCreate').addEventListener('click',()=>openForm());
  refreshFilters();render();startRealtime();
  // Keep original parent-frame activity tracking.
  window.HISTORY_TAB_NAME='ITEM COLLECTION';
  const parentOrigin='https://5g88-main.vercel.app';
  document.addEventListener('click',e=>{
    const el=e.target.closest('button,a,[data-action]');if(!el||el.disabled)return;
    window.parent?.postMessage({type:'user-tab-action',tab:window.HISTORY_TAB_NAME,
      action:clean(el.dataset.action||el.title||el.getAttribute('aria-label')||el.textContent).slice(0,40),time:Date.now()},parentOrigin);
  },true);
})();
</script>
