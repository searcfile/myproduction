  html.fiveg88-hard-reload,
  html.fiveg88-hard-reload body {
    background: #ffffff !important;
  }

  html.fiveg88-hard-reload body {
    visibility: hidden !important;
  }

  html.fiveg88-hard-reload::after {
    content: "";
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 2147483647;
    pointer-events: auto;
  }
</style>

<script>
(function () {
  const KEY = "5g88.hardReloadIntent";

  // Detect Ctrl + Shift + R atau Ctrl + F5
  window.addEventListener("keydown", function (event) {
    const hardReload =
      (event.ctrlKey &&
       event.shiftKey &&
       event.key.toLowerCase() === "r") ||
      (event.ctrlKey && event.key === "F5");

    if (hardReload) {
      sessionStorage.setItem(KEY, String(Date.now()));
    }
  }, true);

  // Semak sama ada reload datang daripada shortcut tadi
  const saved = Number(sessionStorage.getItem(KEY));
  sessionStorage.removeItem(KEY);

  const navigation =
    performance.getEntriesByType("navigation")[0];

  const recentHardReload =
    navigation?.type === "reload" &&
    Number.isFinite(saved) &&
    saved > 0 &&
    Date.now() - saved < 10000;

  if (recentHardReload) {
    document.documentElement.classList.add(
      "fiveg88-hard-reload"
    );
  }
})();
</script>

    /* SEARCH */

      color:var(--page-text);

        border-color 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease,

      color:var(--blur);

    .search-input:hover{

    }
    .search-icon{
      position:absolute;
      left:12px;
      top:50%;
      transform:translateY(-50%);

      opacity:0.8;
      pointer-events:none;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .search-svg{
      width:16px;
      height:16px;
      fill:var(--blur);
      transition:fill 0.15s ease;
    }

    .search-input:focus ~ .search-icon .search-svg{
      fill:var(--accent-soft);
    }

     color:var(--blue-active);

    /* GRID */
    .card-grid{
      display:flex;

      gap:16px;
      justify-content:center;
      align-items:flex-start;
      width:100%;
    }

    .item-card{
      background:var(--page-bg2);
      border-radius:6px;
      border:1px solid var(--border-input);
      padding:12px 12px 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      position:relative;
      overflow:hidden;
      cursor:default;
      transition:
        transform 0.16s ease,
        box-shadow 0.16s ease,
        border-color 0.16s ease;
      min-height:260px;

      /* 6 card per baris dengan gap 16px (5 gap = 80) */
      flex: 0 0 calc((100% - 80px) / 6);
      max-width: calc((100% - 80px) / 6);

      /* bantu GPU */
      will-change: transform;
    }

    /* matikan glow radial berat, biar render lebih ringan */
    .item-card::before{
      content:"";
      position:absolute;
      inset:0;
      opacity:0;
      pointer-events:none;

  display: flex;
  align-items: center;
  justify-content: flex-start;
  margin-top: 6px;
}

#itemCreate[hidden] {
  display: none !important;
}
  </style>
</head>
<body>

  <main class="wrapper item-page">
    <div class="item-toolbar">
      <div class="item-toolbar-search"><input type="search" id="searchInput" placeholder="Search" aria-label="Search items"></div>
      <div id="itemTagChips" class="item-filter" aria-label="Filter tags"></div>
      <div id="itemCollectionChips" class="item-filter" aria-label="Filter collections"></div>
      <button
  id="itemCreate"
  class="btn-primary-new"
  type="button"
  hidden
>
  + Create Item
</button>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </main>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="../firebase.js"></script>
<script src="./new-ui.js"></script>
<script src="./shared-ui.js"></script>
<script src="./admin.js"></script>
<script>
(() => {
  "use strict";
  const DB_PATH = "item_collection/items";
  const CLOUDINARY_CLOUD_NAME = "dqctvbenv";
  const CLOUDINARY_UPLOAD_PRESET = "game_logos";
  const LEGACY_ITEMS = [];
  const grid=document.getElementById('cardGrid');
  const search=document.getElementById('searchInput');
  const notify=(msg,type='info')=>window.NewUI?.showToast?.(msg,type) || console.log(msg);
  const clean=v=>String(v??'').trim();
  const lower=v=>clean(v).toLocaleLowerCase();
  const records=new Map();
  const ITEM_TAGS=['Bank Item','Game Item','Other Item'];
let tagFilter, collectionFilter, searchUI, loaded = false;
let itemSites = [];
let itemProfile = null;

const ITEM_API =
  "https://fiveg88-admin-backend-v2.onrender.com/api/item-collection";

function itemCan(action) {
  if (itemProfile?.role === "superadmin") return true;
  if (itemProfile?.role !== "siteadmin") return false;

  const actions = itemProfile.permissions?.item_html;

  return Array.isArray(actions) &&
    actions.includes("show") &&
    actions.includes("view") &&
    actions.includes(action);
}

async function itemApi(path, options = {}) {
  const user = firebase.auth().currentUser;

  if (!user) throw Error("Login required");

  const token = await user.getIdToken();

  const response = await fetch(ITEM_API + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {}),
      Authorization: `Bearer ${token}`
    }
  });

  const result = await response.json();

  if (!response.ok || result.ok !== true) {
    throw Error(result.message || "API request failed");
  }

  return result;
}

async function reloadItems() {
  const result = await itemApi("/items");

  records.clear();

  for (const item of result.items || []) {
    if (item.id && item.title && item.img) {
      records.set(item.id, {
        ...item,
        legacy: false
      });
    }
  }

  loaded = true;
  refreshFilters();
  render();
}
  const legacy=LEGACY_ITEMS.map((r,i)=>({
    id:'legacy-'+i,title:r.title,code:r.code,img:r.img,tag:r.tag,
    collection:r.title,legacy:true
  }));
  function allItems(){return [...legacy,...records.values()].sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));}
  function refreshFilters(){
    const items=allItems();
    const tags=[...new Set([...ITEM_TAGS,...items.flatMap(x=>clean(x.tag).split(',').map(s=>s.trim()).filter(Boolean))])].sort((a,b)=>a.localeCompare(b));
    const collections=[...new Set(items.map(x=>clean(x.collection||x.title)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    tagFilter?.setOptions(tags.map(v=>({value:v,label:v})));
    // Kekalkan pilihan default jika belum ada pilihan
if (tagFilter && !(tagFilter.getValue() || []).length) {
  tagFilter.setValue([...ITEM_TAGS]);
}
    collectionFilter?.setOptions(collections.map(v=>({value:v,label:v})));
  }
  function filtered(){
    const q=lower(search.value),tags=tagFilter?.getValue()||[],cols=collectionFilter?.getValue()||[];
    return allItems().filter(x=>{
      const itemTags=clean(x.tag).split(',').map(s=>s.trim());
      return (!q || [x.title,x.tag,x.collection].some(s=>lower(s).includes(q)))
        && (!tags.length || tags.some(t=>itemTags.includes(t)))
        && (!cols.length || cols.includes(clean(x.collection||x.title)));
    });
  }
  function card(item){
    const el=document.createElement('article');el.className='item-card';
    const image=document.createElement('div');image.className='image-wrap';
    const img=document.createElement('img');img.src=item.img;img.alt=item.title;img.loading='lazy';image.append(img);
    const info=document.createElement('div');info.className='item-info';
    const title=document.createElement('div');title.className='item-title';title.textContent=item.title;
    info.append(title);
    const actions=document.createElement('div');actions.className='item-actions';
    const copy=document.createElement('button');copy.type='button';copy.className='copy-btn';copy.textContent='Copy Image';
    copy.addEventListener('click',()=>copyImage(item,copy));
    actions.append(copy);
      
if (!item.legacy) {
  if (itemCan("edit")) {
    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "btn-edit-new";
    edit.title = "Edit item";
    edit.textContent = "Edit";
    edit.addEventListener("click", () => openForm(item));
    actions.append(edit);
  }

  if (itemCan("delete")) {
    const del = document.createElement("button");
    del.type = "button";
    del.className = "btn-delete-new";
    del.title = "Delete item";
    del.textContent = "Delete";
    del.addEventListener("click", () => removeItem(item));
    actions.append(del);
  }
}
    
el.append(image, info, actions);
return el;
  }
function render() {
  const items = filtered();

  grid.replaceChildren();

  if (!items.length) {

    if (typeof window.showEmptyState === 'function') {

      window.showEmptyState(
        grid,
        'No Data',
        'large',
        'center',
        true
      );

    } else {

      const empty = document.createElement('div');

      empty.className = 'item-empty';
      empty.textContent = 'No Data';

      grid.append(empty);
    }

    return;
  }

  const frag = document.createDocumentFragment();

  items.forEach(item => {
    frag.append(card(item));
  });

  grid.append(frag);
}
  async function copyImage(item,btn){
    if(!navigator.clipboard?.write || !window.ClipboardItem){notify('Browser tidak support copy image','error');return;}
    try{
      const res=await fetch(item.img,{mode:'cors'});if(!res.ok)throw Error('Image request failed');
      let blob=await res.blob();
      if(blob.type!=='image/png'){
        const bmp=await createImageBitmap(blob);const canvas=document.createElement('canvas');canvas.width=bmp.width;canvas.height=bmp.height;
        canvas.getContext('2d').drawImage(bmp,0,0);blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Conversion failed')),'image/png'));
        bmp.close?.();
      }
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      notify('Image copied','success');
    }catch(e){console.error(e);notify('Copy gagal. Image host mungkin block CORS.','error');}
  }
  function inputField(label,id,value='',required=false){
    const wrap=document.createElement('label');wrap.className='item-form-field';
    const text=document.createElement('span');text.textContent=label;
    const input=document.createElement('input');input.id=id;input.value=value;input.required=required;input.autocomplete='off';
    wrap.append(text,input);return wrap;
  }
  async function cloudinaryUpload(file){
    if(!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET)throw Error('Sila isi CLOUDINARY_CLOUD_NAME dan CLOUDINARY_UPLOAD_PRESET dalam item.html dahulu.');
    const data=new FormData();data.append('file',file);data.append('upload_preset',CLOUDINARY_UPLOAD_PRESET);
    const res=await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY_CLOUD_NAME)}/image/upload`,{method:'POST',body:data});
    const json=await res.json();if(!res.ok||!json.secure_url)throw Error(json.error?.message||'Cloudinary upload failed');
    return json.secure_url;
  }
  function openForm(item=null){
if (!itemCan(item ? "edit" : "create")) {
  notify("Permission denied", "error");
  return;
}
    const form=document.createElement('form');form.className='item-form';form.noValidate=true;
    const row=document.createElement('div');row.className='item-form-grid';
    row.append(
      inputField('Item Name','itemName',item?.title||'',true),
      inputField('Collection / Platform','itemCollection',item?.collection||'',true)
    );
    const tagField=document.createElement('div');
    tagField.className='item-form-field item-form-full';
    const tagLabel=document.createElement('span');tagLabel.textContent='Tags';
    const tagHost=document.createElement('div');tagHost.id='itemFormTagChips';
    tagField.append(tagLabel,tagHost);
    row.append(tagField);
    // Global Active
const globalField = document.createElement('div');
globalField.className = 'item-form-field item-form-full';

globalField.innerHTML = `
  <span>Global Active</span>
  <label class="shared-active-switch">
    <input type="checkbox" id="itemGlobalActive"
      data-active-label="ON" data-inactive-label="OFF">
    <span class="shared-active-track">
      <span class="shared-active-text"></span>
      <span class="shared-active-knob"></span>
    </span>
  </label>
  <small>ON: Semua site. OFF: Ikut Site Visibility.</small>
`;

// Site Visibility
const siteField = document.createElement('div');
siteField.className = 'item-form-field item-form-full';

siteField.innerHTML = `
  <span>Site Visibility</span>
  <div id="itemSiteChips"></div>
  <small>Pilih site yang boleh melihat item ini.</small>
`;

row.append(globalField, siteField);
    const imageLabel=document.createElement('div');imageLabel.className='item-form-field item-form-full';
    const span=document.createElement('span');span.textContent='Item Image';
    const uploadHost=document.createElement('div');uploadHost.id='itemUploadHost';imageLabel.append(span,uploadHost);
    const footer=document.createElement('div');footer.className='item-form-actions';
    const cancel=document.createElement('button');cancel.type='button';cancel.className='btn-cancel-new';cancel.textContent='Cancel';
    const save=document.createElement('button');save.type='submit';save.className='btn-primary-new';save.textContent=item?'Save Changes':'Create Item';
    // Active / Inactive — bawah kiri modal
const statusFooter = document.createElement('div');
statusFooter.className = 'item-modal-status';

statusFooter.innerHTML = `
  <label class="shared-active-switch" title="Item Status">
    <input
      type="checkbox"
      id="itemActiveStatus"
      data-active-label="Active"
      data-inactive-label="Inactive"
    >
    <span class="shared-active-track">
      <span class="shared-active-text"></span>
      <span class="shared-active-knob"></span>
    </span>
  </label>
`;

// Cancel dan Save — bawah kanan
const footerButtons = document.createElement('div');
footerButtons.className = 'item-footer-buttons';
footerButtons.append(cancel, save);

footer.append(statusFooter, footerButtons);
form.append(row, imageLabel, footer);
    const modal=NewUI.modal.open({title:item?'Edit Item':'Create Item',content:form,width:720});
      // Status Active / Inactive
const statusInput = form.querySelector('#itemActiveStatus');

// Create = Active secara default
// Edit = ikut status item dalam database
statusInput.checked = item ? item.active !== false : true;

window.SharedActiveSwitch?.sync(statusInput);
    const globalInput = form.querySelector('#itemGlobalActive');

globalInput.checked = item
  ? item.visibleToAllSites === true
  : true;

window.SharedActiveSwitch?.sync(globalInput);
if (itemProfile?.role !== "superadmin") {
  globalInput.checked = false;
  globalInput.disabled = true;
  window.SharedActiveSwitch?.sync(globalInput);
}
const siteChips = NewUI.chips(
  form.querySelector('#itemSiteChips'),
  {
    placeholder: 'Select Sites',
    options: itemSites.map(site => ({
      value: site.id,
      label: site.name
    }))
  }
);

siteChips.setValue(
  Object.entries(item?.siteVisibility || {})
    .filter(([, enabled]) => enabled === true)
    .map(([id]) => id)
);
    cancel.addEventListener('click',()=>modal.close());
    row.querySelectorAll('input:not([type="checkbox"])')
   .forEach(el => NewUI.input(el));
    const savedTags=clean(item?.tag).split(',').map(t=>t.trim()).filter(Boolean);
    const modalTagOptions=[...new Set([...ITEM_TAGS,...savedTags])].map(v=>({value:v,label:v}));
    const modalTags=NewUI.chips(tagHost,{
      placeholder:'Select Tags',
      options:modalTagOptions
    });
    if(savedTags.length)modalTags.setValue(savedTags);
    const uploader=NewUI.imageUpload(uploadHost,{maxSizeMB:5,initialUrl:item?.img||'',initialName:item?.title||'Existing image',onError:e=>notify(e.message,'error')});
    form.addEventListener('submit',async e=>{
      e.preventDefault();if(save.disabled)return;
      const title=clean(form.querySelector('#itemName').value),collection=clean(form.querySelector('#itemCollection').value),
        tag=(modalTags.getValue()||[]).join(', ');
     if (!title || !collection || !tag) {
  notify('Lengkapkan semua input dahulu.', 'warning');
  return;
}
      if(!uploader.getFile()&&!uploader.getUrl()){notify('Sila upload gambar.','warning');return;}
      NewUI.setButtonLoading(save,true,{text:item?'Saving...':'Creating...'});
      try{
        let img=uploader.getUrl();
        if(uploader.getFile())img=await cloudinaryUpload(uploader.getFile());
        // Legacy rules require 'code'; preserve it in Firebase only, without showing a Code field.
const selectedSites = siteChips.getValue() || [];

const siteVisibility = Object.fromEntries(
  selectedSites.map(id => [id, true])
);

const data = {
  title,
  collection,
  code: item?.code || "5G88_Site",
  tag,
  img,
  active: statusInput.checked,
  visibleToAllSites: globalInput.checked,
  siteVisibility
};

if (item) {
  await itemApi(`/items/${encodeURIComponent(item.id)}`, {
    method: "PATCH",
    body: JSON.stringify(data)
  });
} else {
  await itemApi("/items", {
    method: "POST",
    body: JSON.stringify(data)
  });
}

await reloadItems();
        notify(item?'Item updated':'Item created','success');modal.close();
      }catch(err){console.error(err);notify(err.message||'Save failed','error');}
      finally{await NewUI.setButtonLoading(save,false,{minDuration:600});}
    });
  }
async function removeItem(item) {
  if (!itemCan("delete")) {
    notify("Permission denied", "error");
    return;
  }

  if (!confirm(`Delete "${item.title}"? This cannot be undone.`)) {
    return;
  }

  try {
    await itemApi(`/items/${encodeURIComponent(item.id)}`, {
      method: "DELETE"
    });

    await reloadItems();

    notify("Item deleted", "success");
  } catch (error) {
    console.error(error);
    notify(error.message || "Delete failed", "error");
  }
}
function startRealtime() {
  firebase.auth().onAuthStateChanged(async user => {
    records.clear();
    itemSites = [];
    itemProfile = null;
    loaded = false;

    const createButton = document.getElementById("itemCreate");
    createButton.hidden = true;

    if (!user) {
      loaded = true;
      refreshFilters();
      render();
      return;
    }

    try {
      const token = await user.getIdTokenResult(true);

      if (token.claims.secondVerified !== true) {
        throw Error("Second password verification required");
      }

      const snap = await firebase.database()
        .ref(`adminUsers/${user.uid}`)
        .once("value");

      const profile = snap.val();

      if (
        !profile ||
        profile.active !== true ||
        !["superadmin", "siteadmin"].includes(profile.role) ||
        profile.secondPasswordEnabled !== true ||
        profile.pinVersion !== token.claims.pinVersion
      ) {
        throw Error("Admin verification failed");
      }

      itemProfile = profile;

      if (!itemCan("view")) {
        throw Error("Item Collection view permission denied");
      }

      const sitesResult = await itemApi("/sites");
      itemSites = sitesResult.sites || [];

      createButton.hidden = !itemCan("create");

      await reloadItems();

    } catch (error) {
      console.error("Item initialization:", error);
      createButton.hidden = true;
      itemProfile = null;
      itemSites = [];
      loaded = true;
      records.clear();
      refreshFilters();
      render();
      notify(error.message || "Cannot load Item Collection", "error");
    }
  });
}
tagFilter = NewUI.chips('#itemTagChips', {
  placeholder: 'All Tags',
  options: ITEM_TAGS.map(tag => ({
    value: tag,
    label: tag
  })),
  onChange: render
});

// Default pilih semua Tags
tagFilter.setValue([...ITEM_TAGS]);

collectionFilter = NewUI.chips('#itemCollectionChips', {
  placeholder: 'All Collections',
  options: [],
  onChange: render
});
  searchUI=NewUI.syncSearch(search,{onSearch:async()=>{render();await new Promise(r=>setTimeout(r,450));}});
  search.addEventListener('input',render);
  document.getElementById('itemCreate').addEventListener('click',()=>openForm());
  refreshFilters();render();startRealtime();
  // Keep original parent-frame activity tracking.
  window.HISTORY_TAB_NAME='ITEM COLLECTION';
  const parentOrigin='https://5g88-main.vercel.app';
  document.addEventListener('click',e=>{
    const el=e.target.closest('button,a,[data-action]');if(!el||el.disabled)return;
    window.parent?.postMessage({type:'user-tab-action',tab:window.HISTORY_TAB_NAME,
      action:clean(el.dataset.action||el.title||el.getAttribute('aria-label')||el.textContent).slice(0,40),time:Date.now()},parentOrigin);
  },true);
})();
</script>
