<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="./logo.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sticky Notes</title>
  <link rel="stylesheet" href="./shared-ui.css">
  <link rel="stylesheet" href="./admin.css">
  <link rel="stylesheet" href="./new-ui.css">
<style>
:root{
  --bg:#ffffff;
  --panel:#ffffff;
  --panel2:#f6f8fb;
  --soft:#6b7280;
  --border:#d9d9d9;
  --blue:#1668dc;
  --blue-hover:#3c89e8;
  --blue-active:#1554ad;
  --danger:#dc2626;
  --shadow:0 10px 30px rgba(15,23,42,.10);
  --close-hover2:rgba(0,0,0,0.08);

    --page-bg: #000;
    --panel:#0b0b0b;
    --page-text: rgba(255,255,255,0.85);
    --page-input: #141414;
    --border-input:#424242;
    --page-bg2:#1f1f1f;
    --name:#1668dc;
    --blur:rgba(255,255,255,0.25);

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
    --xclose-hover:#ffffff;
    --xclose-hover-active:rgba(255,255,255,0.25);
    --bg-chip:rgba(255, 255, 255, 0.12);
    --chip-close:rgba(255,255,255,0.45);
    --chip-menu:#111a2c;
  }

  body.light-theme{
    --bg:#000000;
    --page-bg: #ffffff;
    --panel:#ffffff;
    --page-text: rgba(0,0,0,0.85);
    --page-input: #ffffff;
    --border-input:#d9d9d9;
    --page-bg2:#ffffff;
    --name:#1668dc;
    --blur:rgba(0,0,0,0.25);
    --muted:rgb(0 0 0 / 65%);

    --blue: #1668dc;
    --blue-hover: #3c89e8;
    --blue-active: #1554ad;
    --xclose-hover:#000000;
    --xclose-hover-active:rgba(0,0,0,0.25);
    --bg-chip:rgba(0, 0, 0, 0.12);
    --chip-close:rgba(0,0,0,0.45);
    --chip-menu:rgba(0, 0, 0, 0.25);
  }

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  background:var(--page-bg);
  color:var(--page-text);
  min-height:100vh;
  overflow:auto;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:var(--panel);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.brand-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--blue),#7aa7ff);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  box-shadow:0 8px 18px rgba(22,104,220,.28);
}

.brand h1{
  font-size:17px;
  line-height:1.1;
}

.brand p{
  margin-top:3px;
  font-size:12px;
  color:var(--soft);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.search{
  height:32px;
  border:1px solid var(--border);
  background:var(--page-input);
  color:var(--text);
  border-radius:6px;
  padding:4px 11px;
  outline:none;
  transition:.2s;
}

.search-wrap{
  width:33%;
  min-width:260px;
  max-width:620px;
  height:32px;
  display:flex;
  align-items:stretch;
}

.search-wrap .search{
  width:100%;
  min-width:0;
  height:32px;
  border:1px solid var(--border-input);
  border-radius:6px 0 0 6px;
  padding:4px 11px;
  font-size:14px;
  transition: all .3s ease;
  color:var(--page-text);
  padding-right:32px;
}

.search-icon-btn{
  width:32px;
  height:32px;
  flex:0 0 32px;
  border:1px solid var(--border-input);
  background:var(--page-input);
  color:var(--page-text);
  border-radius:0 6px 6px 0;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition: all .3s ease;
}

.search-icon-btn svg{
  width:14px;
  height:14px;
  fill:currentColor;
  transition: all .3s ease;
}
.search-wrap .search:not(:focus):hover + .search-icon-btn{
  border-left-color:var(--blue-hover);
}

.search-wrap .search:focus + .search-icon-btn,
.search-wrap .search:focus:hover + .search-icon-btn{
  border-left-color:var(--blue);
}
/* input hover hanya kalau BELUM focus */
.search-wrap .search:not(:focus):hover{
  border-color:var(--blue-hover);
}

/* input focus wajib paling bawah supaya hover tidak boleh override */
.search-wrap .search:focus,
.search-wrap .search:focus:hover{
  border-color:var(--blue);
}

/* button hover tetap jalan walaupun input sedang focus */
.search-icon-btn:hover{
  color:var(--blue-hover);
  border-color:var(--blue-hover);
}

/* button active */
.search-icon-btn:active{
  color:var(--blue-active);
  border-color:var(--blue-active);
}
  .filter-select{
  width:250px;
  height:32px;
  position:relative;
  flex:0 0 250px;
}

.filter-select-btn{
  width:100%;
  height:32px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 10px;
  cursor:pointer;
  transition:.2s;
}

.filter-select-btn:hover,
.filter-select.open .filter-select-btn{
  border-color:var(--blue-hover);
}

.filter-clear{
  color:var(--soft);
  font-size:14px;
  line-height:1;
  margin-left:auto;
}

.filter-clear:hover{
  color:var(--danger);
}

.filter-arrow{
  color:var(--soft);
  font-size:13px;
}

.filter-menu{
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  width:100%;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  display:none;
  z-index:20;
  box-shadow:var(--shadow);
}
.filter-combo{
  width:33%;
  min-width:260px;
  max-width:620px;
  min-height:32px;
  height:auto;
  position:relative;
  flex:unset;
}
.filter-combo-box{
  width:100%;
  min-height:32px;
  height:auto;
  border:1px solid var(--border-input);
  background:var(--page-input);
  border-radius:6px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:4px;
  cursor:text;
  transition:.3s;
  position:relative;
  padding-right:36px;
}
.filter-combo-box:hover{border-color:var(--blue-hover);
}
.filter-combo.open .filter-combo-box,
.filter-combo-box:focus-within{
  border-color:var(--blue);
}

.filter-combo-box input{
  flex:1;
  min-width:80px;
  height:24px;
  border:none;
  outline:none;
  background:transparent;
  color:var(--text);
  font-size:14px;
  padding:4px 11px;
}

input::placeholder{
  color:var(--blur);
}

.filter-chip{
  display:flex;
  align-items:center;
  gap:4px;
  max-width:none;
  height:auto;
  background:transparent;
  padding:4px;
  overflow:hidden;
    max-width:calc(100% - 36px);
  flex-wrap:wrap;
}

.filter-chip-item{
  padding:0 6px 0 8px;
  border-radius:4px;
  background:var(--bg-chip);
  color:var(--page-text);
  display:flex;
  align-items:center;
  gap:3px;
  font-size:14px;
  white-space:nowrap;
  line-height: 22px;
}

.filter-chip-item button{
  border:none;
  background:transparent;
  color:var(--page-text);
  cursor:pointer;
  font-size:14px;
  line-height:1;
}

.filter-chip-item button:hover{
  color:#fff;
}
.filter-chip-item button{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

.filter-chip-item button svg{
  width:10px;
  height:10px;
  fill:currentColor;
}
.filter-chip.hidden{
  display:none;
}

.filter-chip span{
  overflow:hidden;
  text-overflow:ellipsis;
}

.filter-chip button{
  border:none;
  background:transparent;
  color:var(--chip-close);
  cursor:pointer;
  font-size:14px;
  line-height:1;
}

.filter-chip button:hover{
  color:var(--blue-hover);
}
.filter-chip button:active{
  color:var(--blue-active);
}
.filter-combo-arrow{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--blur);
  pointer-events:none;
}

.filter-combo-arrow svg{
  width:12px;
  height:12px;
  fill:currentColor;
}
.filter-combo-clear{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  width:32px;
  height:32px;
  border:none;
  background:transparent;
  color:var(--blur);
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:0;
  transition:all .3s ease;
  z-index:2;
}

.filter-combo-clear svg{
  width:14px;
  height:14px;
  fill:currentColor;
}

.filter-combo.has-chip:hover .filter-combo-clear{
  display:flex;
}

.filter-combo.has-chip:hover .filter-combo-arrow{
  display:none;
}

.filter-combo-clear:hover{
  color:var(--blue-hover);
}

.filter-combo-clear:active{
  color:var(--blue-active);
}
.filter-combo-menu{
  position:absolute;
  top:calc(100% + 3px);
  left:0;
  width:100%;
  max-height:240px;
  overflow:auto;
  background:var(--panel);
  border:1px solid transparent;
  border-radius:8px;
  display:none;
  z-index:30;
  box-shadow: 0 6px 16px 0 rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
  padding:4px;
  transition: all .3s;
}

.filter-combo.open .filter-combo-menu{
  display:block;
}

.filter-combo-menu button{
  width:100%;
  border-radius: 4px;
  border:none;
  background:transparent;
  color:var(--page-text);
  padding:5px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  text-align:left;
  transition: all .3s;
  font-size:14px;
}
.filter-combo-menu button:hover{
  background:var(--close-hover2);
}
.filter-combo-menu button.active{
  background:var(--chip-menu);
}
.shared-sync-search {
    display: flex;
    align-items: stretch;
    width: 100%;
    min-width: 0;
    height: 32px;
    position: relative;
}
.btn-cancel{
  height:32px;
  border-radius:6px;
  border:1px solid var(--border-input) ;
  background:var(--page-input);
  color:var(--page-text);
  padding:0 15px;
  cursor:pointer;
  transition: all .3s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:14px;
}
.btn-cancel:hover{
  border:1px solid var(--blue-hover);
  color:var(--blue-hover);
  }
.btn-cancel:active{
  border:1px solid var(--blue-active);
  color:var(--blue-active);
}
.btn{
  height:32px;
  border-radius:6px;
  border:1px solid transparent;
  background:var(--panel);
  color:white;
  padding:0 15px;
  cursor:pointer;
  transition: all .3s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:14px;
}

.btn:hover{
  border-color:var(--blue-hover);
  color:var(--blue-hover);
}

.btn:active{
  border-color:var(--blue-active);
  color:var(--blue-active);
}

.btn.primary{
  background:var(--blue);
  border-color:transparent;
  color:white;
  transition: all .3s ease;
}

.btn.primary:hover{
  background:var(--blue-hover);
}
.btn.primary:active{
  background:var(--blue-active);
}
.main{
  flex:1;
  min-height:0;
  display:block;
}
.content{
  min-width:0;
  min-height:0;
  padding:12px;
  overflow:auto;
}
.content-toolbar{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}

.content-toolbar .search-wrap{
  width:33%;
  min-width:260px;
  max-width:620px;
  flex:unset;
}
.content-toolbar .filter-combo{
  width:33%;
  min-width:260px;
  max-width:620px;
  flex:unset;
}
.content-toolbar .btn{
  flex-shrink:0;
  margin-left:auto;
}
.notes-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:10px;
  align-items:start;
}

.note-card{
  border:1px solid rgba(0,0,0,.08);
  border-radius:12px;
  min-height:300px;
  max-height:300px;
  height:300px;
  padding:14px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

body.dark-theme .note-card{
  border-color:rgba(255,255,255,.08);
}

.note-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start;
  margin-bottom:10px;
}
.note-title{
  font-weight:600;
  font-size:14px;
  line-height:1.35;
  color:rgba(255,255,255,0.85);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.pin{
  border:none;
  background:transparent;
  color:#111827;
  border:none;
  cursor:pointer;
  flex-shrink:0;
}

.note-body{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
  line-height:1.55;
  color:rgba(255,255,255,.85);
  max-height:145px;
  flex:1;
  overflow:auto;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,.45);
}

.note-meta{
  padding-top:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  color:rgba(255,255,255,0.85);
}

.note-user{
  max-width:130px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:3px;
  color:rgba(255,255,255,0.85);
}

.note-user-icon{
  width:14px;
  height:14px;
  fill:currentColor;
  flex-shrink:0;
}
.note-actions{
  margin-top:10px;
  display:flex;
  gap:8px;
}

.note-actions button{
  flex:1;
  height:32px;
  border-radius:6px;
  cursor:pointer;
  transition: all .3s ease;
}

/* EDIT (biru) */
.btn-edit{
  border:1px solid #15325b;
  background:#111a2c;
  color:#3c89e8;
}

.btn-edit:hover{
  color:#86bcff;
}
.btn-edit:active{
  color:#1554ad;
}
/* DELETE (merah) */
.btn-delete{
  border:1px solid #5b1515;
  background:#2c1111;
  color:#ff4d4f;
}

.btn-delete:hover{
  color:#ff9b9c;
}
.btn-delete:active{
  color:#c83536;
}

.empty{
  height:100%;
  min-height:360px;
  border-radius:8px;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  color:var(--page-text);
  gap:10px;
}

.empty.show{
  display:flex;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:16px;
}

.modal.show{
  display:flex;
}

.dialog{
  width:min(560px,100%);
  background:var(--page-bg2);
  border-radius:8px;
  box-shadow: 0 6px 16px 0 rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
  overflow:hidden;
  animation:pop .20s ease;
}

@keyframes pop{
  from{transform:scale(.96);opacity:0}
  to{transform:scale(1);opacity:1}
}

.dialog-head{
  height:54px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.dialog-title{
  color:var(--page-text);
  font-size: 14px;
}

.close{
  border:none;
  background:transparent;
  color:var(--page-text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition: all .3s ease;
}

.close svg{
  width:14px;
  height:14px;
  fill:currentColor;
  transition: all .3s ease;
}

.close svg:hover{
  color:var(--blue-hover);
}
.close svg:active{
  color:var(--blue-active);
}
.dialog-body{
  padding:16px;
}

.field{
  margin-bottom:12px;
}

.label{
  display:block;
  font-size:12px;
  color:var(--page-text);
  margin-bottom:6px;
}

.input,
.textarea{
  width:100%;
  border:1px solid var(--border-input);
  background:var(--page-input);
  color:var(--page-text);
  border-radius:6px;
  outline:none;
  padding:4px 11px;
  font-size:14px;
  transition: all .3s;
}

.input{
  height:32px;
}

.textarea{
  min-height:150px;
  resize:vertical;
  line-height:1.5;
}
.input:hover,
.textarea:hover{
  border-color:var(--blue-hover);
}
.input:focus,
.textarea:focus{
  border-color:var(--blue);
}

.colors{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.color-dot{
  width:30px;
  height:30px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
}

.color-dot.active{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(22,104,220,.18);
}

.dialog-foot{
  padding:12px 16px;
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.confirm-text{
  font-size:14px;
  color:var(--text);
  line-height:1.5;
}

@media(max-width:760px){
  body{
    overflow:auto;
  }

  .app{
    height:auto;
    min-height:100vh;
  }

  .topbar{
    height:auto;
    min-height:64px;
    padding:12px;
    flex-direction:column;
    align-items:stretch;
    gap:10px;
  }

  .actions{
    width:100%;
  }
  .content{
    padding:12px;
  }

  .notes-grid{
    grid-template-columns:1fr;
  }
.content-toolbar{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  align-items:stretch;
}

.content-toolbar .search-wrap{
  width:100%;
  min-width:0;
  max-width:none;
  flex:1;
}

.content-toolbar .btn{
  width:100%;
  height:32px;
  padding:0 12px;
  white-space:nowrap;
}
  .content-toolbar .filter-combo{
  width:100%;
  min-width:0;
  max-width:none;
  flex:none;
}

.content-toolbar .search-wrap{
  width:100%;
  min-width:0;
  max-width:none;
  flex:none;
}
.filter-combo{
  width:100%;
  min-width:0;
  max-width:none;
  flex:1;
}
}
  .search-wrap{
  position:relative;
}
.search-clear-btn{
  position:absolute;
  right:32px;
  top:0;
  width:32px;
  height:32px;
  border:none;
  background:transparent;
  color:var(--blur);
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:2;
  transition: all .3s ease;
}

.search-clear-btn.show{
  display:flex;
}

.search-clear-btn:hover{
  color:var(--blue-hover);
}
.search-clear-btn:active{
  color:var(--blue-active);
}
.search-clear-btn svg{
  width:14px;
  height:14px;
  fill:currentColor;
}
.pin{
  display:flex;
  align-items:center;
  justify-content:center;
}

.pin-icon{
  width:16px;
  height:16px;
  fill:#eb2f96;
}
.pin.is-pinned .pin-icon{
  fill:#3c89e8;
}

.pin.is-unpinned .pin-icon{
  fill:rgba(255,255,255,0.85);
}
/* Chrome, Edge, Safari */
.note-body::-webkit-scrollbar{
  width:6px;
}

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="../firebase.js"></script>
<script src="./new-ui.js"></script>
  <script defer src="./shared-ui.js"></script>
<script type="module">
/* =========================
   STATE
========================= */
let currentUser = {
  name: "Guest",
  email: "guest",
  photo: ""
};

let notes = [];
let editingId = null;
let deleteId = null;
let activeFilters = ["all"];
let selectedColor = "#1668dc";
let notesRef = null;
let notesListener = null;

const COLORS = [
  "#006873",
  "#0b0b0b",
  "#6d00ff",
  "#1668dc",
  "#16dccb",
  "#16dc8b",
  "#f513d8",
  "#f51365",
  "#13f5ec",
  "#13aaf5",
  "#dce83c",
  "#e86d3c",
  "#e83c3c",
  "#3ce843"
];

const els = {
  userName: document.getElementById("userName"),
  userEmail: document.getElementById("userEmail"),
  pageSub: document.getElementById("pageSub"),
  searchInput: document.getElementById("searchInput"),
  createBtn: document.getElementById("createBtn"),
  floatingCreateBtn: document.getElementById("floatingCreateBtn"),

  notesGrid: document.getElementById("notesGrid"),
  emptyState: document.getElementById("emptyState"),

  noteModal: document.getElementById("noteModal"),
  modalTitle: document.getElementById("modalTitle"),
  closeModal: document.getElementById("closeModal"),
  cancelBtn: document.getElementById("cancelBtn"),
  saveBtn: document.getElementById("saveBtn"),
  noteTitle: document.getElementById("noteTitle"),
  noteBody: document.getElementById("noteBody"),
  colorList: document.getElementById("colorList"),

  confirmModal: document.getElementById("confirmModal"),
  confirmClose: document.getElementById("confirmClose"),
  confirmNo: document.getElementById("confirmNo"),
  confirmYes: document.getElementById("confirmYes"),

  countAll: document.getElementById("countAll"),
  countPinned: document.getElementById("countPinned"),
  countRecent: document.getElementById("countRecent"),
  countArchived: document.getElementById("countArchived")
};

/* =========================
   HELPERS
========================= */
function sanitizeEmail(email){
  return String(email || "guest")
    .toLowerCase()
    .trim()
    .replace(/\./g, "_")
    .replace(/[@#$\[\]\/\s]/g, "_");
}

function getUserNotesPath(){
  const key = sanitizeEmail(currentUser.email);
  return `stickyNotes/${key}`;
}
function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatTime(ms){
  const d = new Date(Number(ms || Date.now()));
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth() + 1).padStart(2,"0");
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,"0");
  const mi = String(d.getMinutes()).padStart(2,"0");
  const ss = String(d.getSeconds()).padStart(2,"0");

  return `${dd}/${mm}/${yy} ${hh}:${mi}:${ss}`;
}

/* =========================
   FIREBASE LOAD / SAVE
========================= */
function detachNotesListener(){
  if(notesRef && notesListener){
    notesRef.off("value", notesListener);
  }
  notesRef = null;
  notesListener = null;
}

function loadNotes(){
  detachNotesListener();

  notesRef = db.ref(getUserNotesPath());

  notesListener = notesRef.on("value", (snap) => {
    const data = snap.val() || {};

    notes = Object.keys(data).map(id => ({
      id,
      ...data[id]
    }));

    renderNotes();
  }, (err) => {
    console.error("Sticky notes Firebase error:", err);
    notes = [];
    renderNotes();
  });
}

function saveNoteToFirebase(note){
  if(!note || !note.id) return Promise.resolve();
  return db.ref(`${getUserNotesPath()}/${note.id}`).set(note);
}

function deleteNoteFromFirebase(id){
  if(!id) return Promise.resolve();
  return db.ref(`${getUserNotesPath()}/${id}`).remove();
}

/* =========================
   RENDER
========================= */
function renderUser(){
  const name = currentUser.name || "Guest";
  const email = currentUser.email || "guest";

  if(els.userName) els.userName.textContent = name;
  if(els.userEmail) els.userEmail.textContent = email;
  if(els.pageSub) els.pageSub.textContent = `Notes for ${name}`;
}

function renderCounts(){
  if(els.countAll) els.countAll.textContent = notes.length;
  if(els.countPinned) els.countPinned.textContent = notes.filter(n => n.pinned).length;

  const sevenDays = Date.now() - (7 * 24 * 60 * 60 * 1000);
  if(els.countRecent){
    els.countRecent.textContent = notes.filter(n => Number(n.updatedAt || 0) >= sevenDays).length;
  }
}

function getVisibleNotes(){
  const q = (els.searchInput?.value || "").trim().toLowerCase();

  let list = [...notes];
if(activeFilters.length === 0){
  return [];
}
const sevenDays = Date.now() - (7 * 24 * 60 * 60 * 1000);

if(activeFilters.includes("all") && activeFilters.includes("archived")){
  // All + Archived = tunjuk semua termasuk archived
  list = list;
}else if(activeFilters.includes("all")){
  // All sahaja = hide archived
  list = list.filter(n => !n.archived);
}else if(activeFilters.length){
  list = list.filter(n => {
    if(activeFilters.includes("pinned") && n.pinned && !n.archived) return true;
    if(activeFilters.includes("recent") && Number(n.updatedAt || 0) >= sevenDays && !n.archived) return true;
    if(activeFilters.includes("archived") && n.archived) return true;
    return false;
  });
}

  if(q){
    list = list.filter(n =>
      String(n.title || "").toLowerCase().includes(q) ||
      String(n.body || "").toLowerCase().includes(q) ||
      String(n.userName || "").toLowerCase().includes(q)
    );
  }

  list.sort((a,b) => {
    if(Boolean(a.pinned) !== Boolean(b.pinned)){
      return a.pinned ? -1 : 1;
    }
    return Number(b.updatedAt || 0) - Number(a.updatedAt || 0);
  });

  return list;
}

function renderNotes(){
  renderUser();
  renderCounts();


  if(!els.notesGrid) return;

  const list = getVisibleNotes();
  els.notesGrid.innerHTML = "";

  if(!list.length){
    els.emptyState.style.display = "block";
    const label = notes.length ? "No matching notes" : "No data";
    if (window.showEmptyState) window.showEmptyState(els.emptyState, label, "large", "center", true);
    else els.emptyState.textContent = label;
    return;
  }

  if (els.emptyState) els.emptyState.style.display = "none";

  list.forEach(note => {
    const card = document.createElement("div");
    card.className = "note-card";
    card.style.background = note.color || "#fff4b8";

    card.innerHTML = `
<div class="note-head">
  <div class="note-title">${escapeHtml(note.title || "Untitled")}</div>

  <div class="note-head-actions">
    <button class="pin ${note.pinned ? "is-pinned" : "is-unpinned"}" title="Pin note" data-action="pin" data-id="${note.id}">
      ${note.pinned ? `
        <svg class="pin-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 17h2v5l-2 2v-7zm2-11.5c0-2.319 1.219-4.35 3.047-5.5h-9.047c.068 1.911 2.429 2.097 2.429 5 0 3.771-3.429 3.291-3.429 10h12c0-1.358-.145-2.412-.369-3.276-2.678-.803-4.631-3.284-4.631-6.224zm6.5-4.5c-2.486 0-4.5 2.015-4.5 4.5s2.014 4.5 4.5 4.5c2.484 0 4.5-2.015 4.5-4.5s-2.016-4.5-4.5-4.5zm-.469 6.484l-1.688-1.637.695-.697.992.94 2.115-2.169.697.696-2.811 2.867z"/>
        </svg>
      ` : `
        <svg class="pin-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 17h2v5l-2 2v-7zm4.462-6.412c.246.625.437 1.39.506 2.412h-7.936c.297-4.36 2.757-4.163 2.757-7.65 0-1.605-.522-2.35-1.272-3.35h4.512c.518-.807 1.207-1.489 2.019-2h-9.048c0 3.656 1.789 2.979 1.789 5.351 0 1.073-.364 1.59-.915 2.373-1.782 2.532-1.874 4.148-1.874 7.276h12c0-1.27-.021-2.287-.159-3.222-.88-.232-1.688-.64-2.379-1.19zm8.538-5.088c0 2.485-2.018 4.5-4.5 4.5-2.484 0-4.5-2.015-4.5-4.5s2.016-4.5 4.5-4.5c2.482 0 4.5 2.015 4.5 4.5zm-2-.5h-5v1h5v-1z"/>
        </svg>
      `}
    </button>

    <button class="archive-btn ${note.archived ? "is-archived" : "is-unarchived"}" title="${note.archived ? "Unarchive note" : "Archive note"}" data-action="archive" data-id="${note.id}">
      ${note.archived ? `
        <svg class="archive-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M24 11.986v9.014h-24v-9.014l5.477-8.986h2.317l-5.46 9h4.666l2.25 3h5.5l2.25-3h4.669l-5.467-9h2.344l5.454 8.986zm-10-3.986h3l-5-5-5 5h3v5h4v-5zm-11.666 4"/>
        </svg>
      ` : `
        <svg class="archive-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 3h4v5h3l-5 5-5-5h3v-5zm8.546 0h-2.344l5.467 9h-4.669l-2.25 3h-5.5l-2.25-3h-4.666l5.46-9h-2.317l-5.477 8.986v9.014h24v-9.014l-5.454-8.986z"/>
        </svg>
      `}
    </button>
  </div>
</div>

      <div class="note-body">${escapeHtml(note.body || "")}</div>

      <div class="note-meta">
        <span class="note-user">
  <svg class="note-user-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8V22h19.2v-2.8c0-3.2-6.4-4.8-9.6-4.8z"/>
  </svg>
  ${escapeHtml(note.userName || "Guest")}
</span>
        <span>${formatTime(note.updatedAt)}</span>
      </div>

<div class="note-actions">
  <button class="btn-edit-new" data-action="edit" data-id="${note.id}">Edit</button>
  <button class="btn-delete-new" data-action="delete" data-id="${note.id}">Delete</button>
</div>
    `;

    els.notesGrid.appendChild(card);
  });
}

/* =========================
   MODAL
========================= */
function renderColors(){
  if(!els.colorList) return;

  els.colorList.innerHTML = "";

  COLORS.forEach(color => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "color-dot" + (color === selectedColor ? " active" : "");
    btn.style.background = color;
    btn.onclick = () => {
      selectedColor = color;
      renderColors();
    };
    els.colorList.appendChild(btn);
  });
}

let stickyNoteSharedModal = null;
let stickyConfirmSharedModal = null;
function openModal(note = null){
  editingId = note ? note.id : null;
  selectedColor = note?.color || COLORS[0];

  if(els.modalTitle) els.modalTitle.textContent = note ? "Edit Note" : "Create Note";
  if(els.noteTitle) els.noteTitle.value = note?.title || "";
  if(els.noteBody) els.noteBody.value = note?.body || "";

  renderColors();
  if (window.NewUI?.modal) {
    const body = els.noteModal.querySelector(".dialog-body");
    const footer = els.noteModal.querySelector(".dialog-foot");
    stickyNoteSharedModal = window.NewUI.modal.open({
      title: note ? "Edit Note" : "Create Note", width: "540px",
      content: body, footer,
      onClose(){
        els.noteModal.querySelector(".dialog").append(body, footer);
        stickyNoteSharedModal = null;
        editingId = null;
      }
    });
  } else els.noteModal?.classList.add("show");
  setTimeout(() => els.noteTitle?.focus(), 50);
}

function closeModal(){
  if(stickyNoteSharedModal) stickyNoteSharedModal.close();
  else els.noteModal?.classList.remove("show");
  editingId = null;
}

async function handleSave(){
  const title = (els.noteTitle?.value || "").trim();
  const body = (els.noteBody?.value || "").trim();

  if(!title && !body){
    els.noteTitle?.focus();
    window.NewUI?.showToast?.("Please enter a title or note", "warning");
    return;
  }

  const now = Date.now();

  let note;

  if(editingId){
    const old = notes.find(n => n.id === editingId);
    if(!old) return;

    note = {
      ...old,
      title: title || "Untitled",
      body,
      color: selectedColor,
      userName: currentUser.name || "Guest",
      userEmail: currentUser.email || "guest",
      updatedAt: now
    };
  }else{
    const id = "note_" + now + "_" + Math.random().toString(16).slice(2);

    note = {
      id,
      title: title || "Untitled",
      body,
      color: selectedColor,
      pinned: false,
      userName: currentUser.name || "Guest",
      userEmail: currentUser.email || "guest",
      createdAt: now,
      updatedAt: now
    };
  }

  window.NewUI?.setButtonLoading?.(els.saveBtn, true, {text:"Saving..."});
  try {
    await saveNoteToFirebase(note);
    const wasEditing = Boolean(editingId);
    closeModal();
    window.NewUI?.showToast?.(wasEditing ? "Note updated" : "Note saved", "success");
  } catch(err) {
    console.error("Save note failed:", err);
    window.NewUI?.showToast?.("Save failed. Please check Firebase rules.", "error");
  } finally {
    await window.NewUI?.setButtonLoading?.(els.saveBtn, false, {minDuration:850});
  }
}

/* =========================
   DELETE / PIN
========================= */
async function openConfirm(id, target) {
  if (!id) return;

  if (!window.NewUI?.confirm) {
    window.NewUI?.showToast?.(
      "Custom confirm is not available",
      "error"
    );
    return;
  }

  await window.NewUI.confirm({
    target: target,
    title: "Delete Note",
    message: "Are you sure you want to delete this note? This action cannot be undone.",
    confirmText: "Delete",
    cancelText: "Cancel",
    loadingText: "Deleting...",
    danger: true,

    onConfirm: async () => {
      await deleteNoteFromFirebase(id);

      window.NewUI?.showToast?.(
        "Note deleted successfully",
        "success"
      );
    }
  });
}
function closeConfirm(){
  if(stickyConfirmSharedModal) stickyConfirmSharedModal.close();
  else els.confirmModal?.classList.remove("show");
  deleteId = null;
}

function deleteNote(){
  if(!deleteId) return;

  deleteNoteFromFirebase(deleteId)
    .then(() => { closeConfirm(); window.NewUI?.showToast?.("Note deleted", "success"); })
    .catch(err => {
      console.error("Delete note failed:", err);
      window.NewUI?.showToast?.("Delete failed. Please check Firebase rules.", "error");
    });
}

function togglePin(id){
  const note = notes.find(n => n.id === id);
  if(!note) return;

  const updated = {
    ...note,
    pinned: !note.pinned,
    updatedAt: Date.now()
  };

  saveNoteToFirebase(updated).catch(err => {
    console.error("Pin failed:", err);
  });
}
function toggleArchive(id){
  const note = notes.find(n => n.id === id);
  if(!note) return;

  const updated = {
    ...note,
    archived: !note.archived,
    updatedAt: Date.now()
  };

  saveNoteToFirebase(updated).catch(err => {
    console.error("Archive failed:", err);
  });
}
/* =========================
   THEME / PARENT
========================= */
function requestParentData(){
  try{
    window.parent.postMessage({ type:"sticky-notes-ready" }, "*");
    window.parent.postMessage({ type:"request-login" }, "*");
    window.parent.postMessage({ type:"request-theme" }, "*");
  }catch{}
}

window.addEventListener("message", (e) => {
  const data = e.data || {};
  if(data.type === "close-sticky-dropdown"){
    filterCombo?.classList.remove("open");
  }
  if(data.type === "user-login" && data.user){
    const nextUser = {
      name: data.user.name || "Guest",
      email: data.user.email || "guest",
      photo: data.user.photo || ""
    };

    const oldEmail = String(currentUser.email || "").toLowerCase();
    const newEmail = String(nextUser.email || "").toLowerCase();

    currentUser = nextUser;

    if(oldEmail !== newEmail){
      loadNotes();
    }else{
      renderNotes();
    }
  }
});

/* =========================
   EVENTS
========================= */
els.createBtn?.addEventListener("click", () => openModal());
els.floatingCreateBtn?.addEventListener("click", () => openModal());

els.closeModal?.addEventListener("click", closeModal);
els.cancelBtn?.addEventListener("click", closeModal);
els.saveBtn?.addEventListener("click", handleSave);

els.searchInput?.addEventListener("input", renderNotes);
// Reuse the exact custom NewUI search with rotating sync icon.
window.NewUI?.init?.(document);
window.NewUI?.syncSearch?.(els.searchInput, {
  onSearch: async () => { renderNotes(); await new Promise(resolve => setTimeout(resolve, 550)); }
});
els.noteModal?.addEventListener("click", (e) => {
  if(e.target === els.noteModal) closeModal();
});


// Shared chip dropdown, not the page's previous hardcoded dropdown.
const FILTER_OPTIONS = [
  {value:"all",label:"All"}, {value:"pinned",label:"Pinned"},
  {value:"recent",label:"Recent"}, {value:"archived",label:"Archived"}
];
window.NewUI?.chips?.("#stickyFilter", {
  placeholder:"Filter notes", options:FILTER_OPTIONS, value:["all"],
  onChange(values){ activeFilters = values; renderNotes(); }
});
els.notesGrid?.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-action]");
  if(!btn) return;

  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const note = notes.find(n => n.id === id);

  if(action === "edit" && note) openModal(note);
  if (action === "delete") {
  openConfirm(id, btn);
}
  if(action === "pin") togglePin(id);
  if(action === "archive") toggleArchive(id);
});

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    closeModal();
    closeConfirm();
  }

  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "n"){
    e.preventDefault();
    openModal();
  }
});

/* =========================
   INIT
========================= */
(function init(){
  try{
    const localLogin = JSON.parse(localStorage.getItem("gmailLogin") || "{}");
    if(localLogin.email){
      currentUser = {
        name: localLogin.name || "Guest",
        email: localLogin.email || "guest",
        photo: localLogin.photo || ""
      };
    }
  }catch{}

  loadNotes();
  requestParentData();

  setTimeout(requestParentData, 500);
  setTimeout(requestParentData, 1200);
})();
  (function () {
  const THEME_KEY = "siteTheme";

  function applyChildTheme(theme) {
    document.body.classList.remove("light-theme", "dark-theme");
    document.body.classList.add(theme === "light" ? "light-theme" : "dark-theme");
  }

  applyChildTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");

  window.addEventListener("message", function (e) {
    const allowedOrigins = [
      "https://5g88-main.vercel.app"
    ];
    if (!allowedOrigins.includes(e.origin)) return;

    const data = e.data || {};
    if (data.type === "theme-change") {
      const theme = data.theme === "dark" ? "dark" : "light";
      localStorage.setItem(THEME_KEY, theme);
      applyChildTheme(theme);
    }
  });
})();
// ✅ Tukar ikut page
window.HISTORY_TAB_NAME = "STICKY NOTES";
// ✅ Hantar ke main page
function sendUserAction(actionName, extra = {}) {
  if (!actionName) return;
  window.parent.postMessage({
    type: "user-tab-action",
    tab: window.HISTORY_TAB_NAME,
    action: actionName,
    extra,
    time: Date.now()
  }, "https://5g88-main.vercel.app");
}
/* =========================
   AUTO TRACK CLICK - COUNT SEMUA CLICK
========================= */
document.addEventListener("click", function(e) {
  const el = e.target.closest("button, [onclick], a, .btn, [data-action]");
  if (!el) return;

  if (el.disabled || el.getAttribute("aria-disabled") === "true") return;

  let name =
    el.getAttribute("data-action") ||
    el.getAttribute("title") ||
    el.getAttribute("aria-label") ||
    el.innerText ||
    el.textContent ||
    el.id ||
    "";

  name = String(name)
    .replace(/\s+/g, " ")
    .trim();

  if (!name || name.length < 2) return;

  name = name.slice(0, 40);

  sendUserAction(name);
}, true);
/* =========================
   AUTO TRACK CTRL + C / COPY IMAGE
========================= */
document.addEventListener("keydown", function(e) {
  const key = String(e.key || "").toLowerCase();

  if ((e.ctrlKey || e.metaKey) && key === "c") {
    sendUserAction("COPY IMAGE", {
      method: "keyboard",
      shortcut: "Ctrl+C"
    });
  }
}, true);
/* =========================
   AUTO TRACK BROWSER COPY EVENT
========================= */
document.addEventListener("copy", function() {
  sendUserAction("COPY IMAGE", {
    method: "copy-event"
  });
}, true);
</script>
