<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="./logo.svg" type="image/svg+xml"><title>5G88 · Link Download</title><link rel="stylesheet" href="./shared-ui.css"><link rel="stylesheet" href="./admin.css"><link rel="stylesheet" href="./new-ui.css"><style>
:root{--ld-bg:#000;--ld-surface:#1f1f1f;--ld-input:#141414;--ld-border:#424242;--ld-text:rgba(255,255,255,.88);--ld-muted:rgba(255,255,255,.46);--ld-blue:#1668dc}body.light-theme,html[data-admin-theme=light]{--ld-bg:#fff;--ld-surface:#fff;--ld-input:#fff;--ld-border:#d9d9d9;--ld-text:rgba(0,0,0,.88);--ld-muted:rgba(0,0,0,.46)}*{box-sizing:border-box}html,body{margin:0;min-width:0}body{background:var(--ld-bg);color:var(--ld-text);font:14px Arial,sans-serif}.ld-page{width:100%;padding:12px;min-width:0}.ld-toolbar{display:grid;grid-template-columns:minmax(0,400px) minmax(0,400px) 1fr;gap:10px;align-items:center;padding:12px;border:1px solid var(--ld-border);background:var(--ld-surface);border-radius:12px;margin-bottom:12px;min-width:0}.ld-search,.ld-filter{min-width:0;width:100%}.ld-toolbar .shared-sync-search,.ld-toolbar .shared-chip-dropdown{width:100%;min-width:0}.ld-create{justify-self:end}.ld-button{font:inherit;border:1px solid var(--ld-border);border-radius:6px;height:32px;padding:0 15px;color:var(--ld-text);background:var(--ld-input);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px;max-width:100%}.ld-button:hover{border-color:#4086e9}.ld-primary{background:var(--ld-blue);border-color:var(--ld-blue);color:#fff}.ld-button:disabled{opacity:.55;cursor:not-allowed}.ld-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;min-width:0}.ld-card{background:var(--ld-surface);border:1px solid var(--ld-border);border-radius:12px;min-width:0;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}.ld-card:hover{border-color:#5a79a8}
  .ld-image{
  width:calc(100% - 24px);
  height:auto;
  aspect-ratio:16 / 9;
  margin:12px 12px 0;
  border:1px solid var(--ld-border);
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--ld-input);
  overflow:hidden;
}
.ld-image img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
}
  .ld-image-placeholder{color:var(--ld-muted);font-size:32px}.ld-card-body{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}.ld-card-title{font-weight:400;text-align:center;overflow-wrap:anywhere;font-size:15px}
  .ld-links {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    background: #141414;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #424242;
  }
}.ld-link{width:100%;min-width:0;min-height:33px;overflow-wrap:anywhere;white-space:normal;text-align:center}.ld-link[disabled]{background:var(--ld-input);color:var(--ld-muted);border-color:var(--ld-border)}.ld-actions{display:flex;gap:8px;padding-top:9px;border-top:1px solid var(--ld-border)}.ld-actions .ld-button{flex:1;min-width:0}.ld-danger:hover{color:#ff6565;border-color:#ff6565}.ld-empty{grid-column:1/-1;width:100%;min-height:160px;display:grid;place-items:center;border:1px solid var(--ld-border);background:var(--ld-surface);border-radius:12px;padding:0;color:var(--ld-muted)}.ld-modal-form{display:flex;flex-direction:column;gap:14px}.ld-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ld-field{display:flex;flex-direction:column;gap:7px;min-width:0}.ld-field label,.ld-label{font-size:12px;font-weight:600}.ld-input{height:34px;width:100%;min-width:0;border:1px solid var(--ld-border);border-radius:6px;background:var(--ld-input);color:var(--ld-text);padding:0 10px;font:inherit}.ld-input:focus{outline:0;border-color:#1668dc}.ld-section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--ld-border);padding-top:14px}.ld-rows{display:flex;flex-direction:column;gap:10px}.ld-row{border:1px solid var(--ld-border);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:10px}.ld-row-head{display:flex;justify-content:space-between;align-items:center}.ld-row-fields{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.ld-row-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.ld-radio{display:flex;gap:13px;align-items:center;flex-wrap:wrap;font-size:12px}.ld-radio label{display:flex;align-items:center;gap:4px;cursor:pointer}.ld-footer{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--ld-border);padding-top:14px}.ld-hint{color:var(--ld-muted);font-size:12px;line-height:1.5}.ld-url-image{display:flex;gap:8px;align-items:center}.ld-url-image>*:first-child{flex:1}.ld-upload{min-height:34px}.ld-modal-form .shared-image-upload{max-width:100%}.ld-modal-form .shared-modal-actions{display:none}@media(max-width:1150px){.ld-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:830px){.ld-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ld-toolbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ld-create{grid-column:1/-1}}@media(max-width:640px){.ld-toolbar{grid-template-columns:minmax(0,1fr)}.ld-create{grid-column:1;justify-self:end}.ld-grid{grid-template-columns:minmax(0,1fr)}.ld-form-grid,.ld-row-fields{grid-template-columns:minmax(0,1fr)}}

</style></head><body>
<main class="ld-page"><div class="ld-toolbar"><div class="ld-search"><input id="ldSearch" type="search" placeholder="Search"></div><div class="ld-filter"><div id="ldPlatforms"></div></div><button class="ld-button ld-primary ld-create" id="ldCreate" type="button">+ Create Card</button></div><div class="ld-grid" id="ldGrid"></div></main>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script><script src="../firebase.js"></script><script src="./new-ui.js"></script><script defer src="./shared-ui.js"></script><script>
/* 5G88 Link Download — page-only upgrade. Shared files are not modified. */
(() => {
'use strict';
const PATH='download_links/cards';
// Optional Cloudinary upload: fill BOTH values below from your existing account.
const CLOUDINARY_CLOUD_NAME='dqctvbenv';
const CLOUDINARY_UPLOAD_PRESET='game_logos';
const $=s=>document.querySelector(s);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
const toast=(msg,type='success')=>window.NewUI?.showToast?.(msg,type)||console.log(msg);
const safeUrl=(url)=>{try{const u=new URL(String(url||''));return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}};
const clean=s=>String(s??'').trim();
let records={},db=null,chip=null,modal=null,upload=null,editing=null,loading=true;
const grid=$('#ldGrid'),search=$('#ldSearch');
const isCard=x=>x&&typeof x==='object'&&typeof x.name==='string';
function showEmpty(text='No Data'){grid.replaceChildren();const host=el('div','ld-empty');grid.append(host);if(window.showEmptyState)window.showEmptyState(host,text,'large','center');else host.textContent=text;}
function refreshOptions(){const values=[...new Set(Object.values(records).filter(isCard).map(x=>clean(x.platform)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));const previous=chip?.getValue?.()||[];chip?.setOptions?.(values.map(x=>({value:x,label:x})));chip?.setValue?.(previous.filter(x=>values.includes(x)));}
function render(){if(loading){return;}const q=search.value.trim().toLowerCase(),selected=new Set(chip?.getValue?.()||[]);const entries=Object.entries(records).filter(([,v])=>isCard(v)).sort((a,b)=>(Number(a[1].order)||9999)-(Number(b[1].order)||9999)||a[1].name.localeCompare(b[1].name)).filter(([,v])=>(!selected.size||selected.has(v.platform))&&(!q||[v.name,v.platform,...(Array.isArray(v.links)?v.links.map(x=>x.label):[])].join(' ').toLowerCase().includes(q)));grid.replaceChildren();if(!entries.length){showEmpty('No Data');return;}for(const [id,card] of entries)grid.append(makeCard(id,card));}
function makeCard(id,card){const node=el('article','ld-card');const image=el('div','ld-image');const src=safeUrl(card.image);if(src){const img=el('img');img.src=src;img.alt=card.name;img.loading='lazy';image.append(img);}else image.append(el('span','ld-image-placeholder','▧'));node.append(image);const body=el('div','ld-card-body');const heading=el('div');heading.append(el('div','ld-card-title',card.name));body.append(heading);const links=el('div','ld-links');for(const link of Array.isArray(card.links)?card.links:[]){const btn=el('button','ld-button ld-link '+(link.enabled!==false&&safeUrl(link.url)?'ld-primary':''),link.label||'Download');btn.type='button';const url=safeUrl(link.url);if(link.enabled===false||!url){btn.disabled=true;btn.title='Not available';}else btn.addEventListener('click',async()=>{if(link.action==='open'){window.open(url,'_blank','noopener,noreferrer');return;}try{await navigator.clipboard.writeText(url);toast('Link copied');}catch{const input=el('textarea');input.value=url;document.body.append(input);input.select();try{if(!document.execCommand('copy'))throw Error();toast('Link copied');}catch{toast('Copy failed. Please copy manually.','error');}input.remove();}});links.append(btn);}if(!links.children.length)links.append(el('div','ld-hint','No download links'));body.append(links);const actions=el('div','ld-actions');const edit=el('button','btn-edit-new','Edit');edit.onclick=()=>openEditor(id);const del=el('button','btn-delete-new','Delete');del.onclick=()=>removeCard(id);actions.append(edit,del);body.append(actions);node.append(body);return node;}
function field(label,value='',placeholder='',type='text'){const host=el('div','ld-field');const lbl=el('label','',label),input=el('input','ld-input');input.type=type;input.value=value;input.placeholder=placeholder;host.append(lbl,input);return {host,input};}
function addRow(target,data={}){const row=el('div','ld-row');const head=el('div','ld-row-head');head.append(el('strong','','Link Row'));const del=el('button','ld-button ld-danger','Remove');del.type='button';del.onclick=()=>row.remove();head.append(del);const fields=el('div','ld-row-fields');const label=field('Button Label',data.label||'','e.g. IOS DOWNLOAD'),url=field('URL',data.url||'','https://...','url');fields.append(label.host,url.host);const foot=el('div','ld-row-foot');const radio=el('div','ld-radio');for(const [val,text] of [['copy','Copy Link'],['open','Open Link']]){const wrap=el('label');const inp=el('input');inp.type='radio';inp.name='ld-action-temp'; // replaced below with shared group
wrap.append(inp,document.createTextNode(text));radio.append(wrap);}const radios=radio.querySelectorAll('input');const group='ld-action-'+Math.random().toString(36).slice(2);radios.forEach((r,i)=>{r.name=group;r.value=i===0?'copy':'open';r.checked=(data.action||'copy')===r.value;});const enabledLabel=el('label');const enabled=el('input');enabled.type='checkbox';enabled.checked=data.enabled!==false;enabledLabel.append(enabled,document.createTextNode(' Available'));foot.append(radio,enabledLabel);row.append(head,fields,foot);row._get=()=>({label:clean(label.input.value),url:clean(url.input.value),action:radio.querySelector('input:checked')?.value||'copy',enabled:enabled.checked});target.append(row);}
async function uploadImage(file){if(!CLOUDINARY_CLOUD_NAME||!CLOUDINARY_UPLOAD_PRESET)throw Error('Cloudinary not configured. Use Image URL or set cloud name and unsigned upload preset in link-download.js.');const fd=new FormData();fd.append('file',file);fd.append('upload_preset',CLOUDINARY_UPLOAD_PRESET);const response=await fetch('https://api.cloudinary.com/v1_1/'+encodeURIComponent(CLOUDINARY_CLOUD_NAME)+'/image/upload',{method:'POST',body:fd});const result=await response.json();if(!response.ok||!safeUrl(result.secure_url))throw Error(result.error?.message||'Cloudinary upload failed');return result.secure_url;}
function openEditor(id=null){editing=id;const old=id?records[id]:null;const form=el('form','ld-modal-form');const top=el('div','ld-form-grid');const name=field('Card Name',old?.name||'','e.g. 918KISS'),platform=field('Platform / Collection',old?.platform||'','e.g. 918KISS');top.append(name.host,platform.host);form.append(top);const imageLabel=el('div','ld-label','Card Image');form.append(imageLabel);const imageHost=el('div');form.append(imageHost);const section=el('div','ld-section-heading');section.append(el('strong','','Download Links'));const add=el('button','ld-button','+ Add Row');add.type='button';section.append(add);form.append(section);const rows=el('div','ld-rows');form.append(rows);const existing=Array.isArray(old?.links)?old.links:[];(existing.length?existing:[{label:'KIOSK AGENT LINK',action:'copy',enabled:true}]).forEach(x=>addRow(rows,x));add.onclick=()=>addRow(rows,{label:'',action:'copy',enabled:true});form.append(el('div','ld-hint','Each card supports any number of links. Choose Copy Link or Open Link per row.'));const footer=el('div','ld-footer');const cancel=el('button','ld-button','Cancel');cancel.type='button';cancel.onclick=()=>modal?.close();const save=el('button','ld-button ld-primary',id?'Save Changes':'Create Card');save.type='submit';footer.append(cancel,save);form.append(footer);modal=NewUI.modal.open({title:id?'Edit Download Card':'Create Download Card',content:form,width:720});upload=NewUI.imageUpload(imageHost,{maxSizeMB:5,onError:e=>toast(e.message,'error')});if(old?.image)try{upload.setUrl(old.image);}catch{}form.addEventListener('submit',async e=>{e.preventDefault();const title=clean(name.input.value),group=clean(platform.input.value),links=[...rows.children].map(r=>r._get());if(!title||!group){toast('Card name and platform are required.','warning');return;}if(!links.length){toast('Add at least one link row.','warning');return;}for(const link of links){if(!link.label){toast('Each row needs a button label.','warning');return;}if(link.enabled&&!safeUrl(link.url)){toast('Active links require a valid http(s) URL.','warning');return;}}let image = old?.image || '';try{NewUI.setButtonLoading(save,true);save.disabled=true;if(upload.getFile())image=await uploadImage(upload.getFile());if(!db)throw Error('Firebase database is unavailable');const ref=id?db.ref(PATH+'/'+id):db.ref(PATH).push();const record={name:title,platform:group,image:image||'',order:Number(old?.order)||Date.now(),links,updatedAt:firebase.database.ServerValue.TIMESTAMP};if(!id)record.createdAt=firebase.database.ServerValue.TIMESTAMP;await ref.update(record);toast(id?'Card updated':'Card created');modal.close();}catch(err){console.error(err);toast(err.message||'Save failed','error');}finally{await NewUI.setButtonLoading(save,false);save.disabled=false;}});}
async function removeCard(id){const card=records[id];if(!card)return;const yes=window.confirm('Delete "'+card.name+'"? This cannot be undone.');if(!yes)return;try{await db.ref(PATH+'/'+id).remove();toast('Card deleted');}catch(err){toast(err.message||'Delete failed','error');}}
function setupTheme(){const apply=theme=>{document.body.classList.toggle('light-theme',theme==='light');document.body.classList.toggle('dark-theme',theme!=='light');};apply(localStorage.getItem('siteTheme')==='dark'?'dark':'light');window.addEventListener('message',e=>{if(!['https://5g88-main.vercel.app','https://searcfile.github.io'].includes(e.origin))return;if(e.data?.type==='theme-change'){const t=e.data.theme==='dark'?'dark':'light';localStorage.setItem('siteTheme',t);apply(t);}});}
function start(){
  setupTheme();
  showEmpty('No Data');window.HISTORY_TAB_NAME='LINK DOWNLOAD';document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;const name=(button.textContent||button.title||'').trim().slice(0,40);if(name)window.parent?.postMessage({type:'user-tab-action',tab:window.HISTORY_TAB_NAME,action:name,time:Date.now()},'https://5g88-main.vercel.app');},true);chip=NewUI.chips('#ldPlatforms',{placeholder:'All Platforms',options:[],onChange:render});NewUI.syncSearch(search, {
  onSearch: async () => {
    // Beri browser masa untuk memaparkan spinner
    await new Promise(resolve => setTimeout(resolve, 450));

    // Jalankan carian
    render();
  }
});search.addEventListener('input',render);$('#ldCreate').onclick=()=>openEditor();try{if(!window.firebase?.apps?.length)throw Error('Firebase app not initialized. Check ../firebase.js');db=firebase.database();db.ref(PATH).on('value',snap=>{records=snap.val()||{};loading=false;refreshOptions();render();},err=>{loading=false;showEmpty('Unable to load cards');toast(err.message,'error');});}catch(err){loading=false;showEmpty('Firebase unavailable');console.error(err);toast(err.message,'error');}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

</script></body></html>
