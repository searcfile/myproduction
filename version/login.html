<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <title>5G88 Admin Login</title>
  <style>
    :root{
      --page-bg:#141414;--card:#1f1f1f;--input:#141414;--border:#424242;
      --border-soft:#303030;--text:rgba(255,255,255,.88);--muted:rgba(255,255,255,.45);
      --blue:#1677ff;--blue-hover:#4096ff;--blue-active:#0958d9;--danger:#ff4d4f;
    }
    body.light-theme{
      --page-bg:#f0f2f5;--card:#fff;--input:#fff;--border:#d9d9d9;
      --border-soft:#e8e8e8;--text:rgba(0,0,0,.88);--muted:rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--page-bg);
      color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    .theme-btn{
      position:fixed;top:16px;right:16px;width:38px;height:38px;border-radius:50%;
      border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;
    }
    .login-box{
      width:100%;max-width:420px;border:1px solid var(--border-soft);border-radius:12px;
      overflow:hidden;background:var(--card);box-shadow:0 8px 24px rgba(0,0,0,.12);
    }
    .login-header{padding:32px 40px 28px;background:var(--blue);text-align:center;color:#fff}
    .login-icon{
      width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;
      border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15)
    }
    .login-icon svg{width:28px;height:28px}
    h1{font-size:24px;margin:0 0 4px}
    .login-sub{font-size:13px;color:rgba(255,255,255,.72);margin:0}
    .login-content{padding:32px 40px}
    .tabs{display:flex;gap:8px;margin-bottom:24px;padding:4px;background:var(--input);border:1px solid var(--border-soft);border-radius:9px}
    .tab{
      flex:1;height:36px;border:0;border-radius:6px;background:transparent;color:var(--muted);
      cursor:pointer;font-weight:600
    }
    .tab.active{background:var(--card);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.15)}
    .form{display:none}.form.active{display:block}
    .group{margin-bottom:20px}
    label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
    .field{position:relative}
    .input{
      width:100%;height:42px;border:1px solid var(--border);border-radius:8px;background:var(--input);
      color:var(--text);padding:7px 11px;outline:none;font-size:14px
    }
    .input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(22,119,255,.16)}
    .password-input{padding-right:44px}
    .eye{
      position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;
      color:var(--muted);cursor:pointer;padding:6px
    }
    .error{display:none;color:var(--danger);font-size:12px;margin-top:6px;line-height:1.35}
    .error.show{display:block}
    .btn{
      width:100%;height:44px;border:1px solid transparent;border-radius:8px;background:var(--blue);
      color:#fff;font-size:14px;font-weight:600;cursor:pointer
    }
    .btn:hover{background:var(--blue-hover)} .btn:active{background:var(--blue-active)}
    .btn:disabled{cursor:not-allowed;opacity:.55}
    .google-btn{
      background:var(--card);color:var(--text);border-color:var(--border);display:flex;
      align-items:center;justify-content:center;gap:10px
    }
    .google-btn:hover{background:var(--input);border-color:var(--blue);color:var(--blue)}
    .google-g{font-weight:800;font-size:18px;color:#4285f4}
    .status{
      display:none;margin-bottom:18px;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.45;
      border:1px solid var(--border-soft);background:var(--input)
    }
    .status.show{display:block}.status.error{color:var(--danger)}
    .foot{margin:20px 0 0;text-align:center;color:var(--muted);font-size:11px;line-height:1.5}
    .loading{
      position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.28);z-index:9999
    }
    .loading.show{display:grid}
    .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:480px){.login-content,.login-header{padding-left:28px;padding-right:28px}}
  </style>
</head>
<body>
  <button id="themeBtn" class="theme-btn" type="button" aria-label="Toggle theme">◐</button>

  <main class="login-box">
    <header class="login-header">
      <div class="login-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17 8V6a5 5 0 0 0-10 0v2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2Zm-8-2a3 3 0 0 1 6 0v2H9V6Zm4 10.73V19h-2v-2.27a2 2 0 1 1 2 0Z"/>
        </svg>
      </div>
      <h1>Log in</h1>
      <p class="login-sub">Welcome back! Please sign in to continue.</p>
    </header>

    <section class="login-content">
      <div id="statusBox" class="status" role="alert"></div>

      <div class="tabs" role="tablist">
        <button id="emailTab" class="tab active" type="button">Email / Password</button>
        <button id="googleTab" class="tab" type="button">Google</button>
      </div>

      <form id="emailForm" class="form active" autocomplete="on">
        <div class="group">
          <label for="email">Email</label>
          <input id="email" class="input" type="email" autocomplete="username" placeholder="name@example.com" required>
          <div id="emailError" class="error"></div>
        </div>

        <div class="group">
          <label for="password">Password</label>
          <div class="field">
            <input id="password" class="input password-input" type="password" autocomplete="current-password" placeholder="Password" required>
            <button id="eyeBtn" class="eye" type="button" aria-label="Show password">👁</button>
          </div>
          <div id="passwordError" class="error"></div>
        </div>

        <button id="emailLoginBtn" class="btn" type="submit">Log in</button>
      </form>

      <div id="googleForm" class="form">
        <button id="googleLoginBtn" class="btn google-btn" type="button">
          <span class="google-g">G</span>
          Continue with Google
        </button>
      </div>

      <p class="foot">
        Access is limited to authorized admin accounts.<br>
        Account creation and username provisioning will be connected to the backend service later.
      </p>
    </section>
  </main>

  <div id="loading" class="loading" aria-hidden="true"><div class="spinner"></div></div>

  <script type="module">
    import {
      auth,
      db,
      ref,
      get,
      update,
      serverTimestamp,
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserSessionPersistence,
      signInWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider
    } from "./firebase.js";

    const DASHBOARD_URL = "./dashboard.html";
    const THEME_KEY = "adminGlobalTheme";

    const $ = selector => document.querySelector(selector);
    const emailTab = $("#emailTab");
    const googleTab = $("#googleTab");
    const emailForm = $("#emailForm");
    const googleForm = $("#googleForm");
    const emailInput = $("#email");
    const passwordInput = $("#password");
    const emailError = $("#emailError");
    const passwordError = $("#passwordError");
    const statusBox = $("#statusBox");
    const loading = $("#loading");

    function setLoading(value) {
      loading.classList.toggle("show", Boolean(value));
      loading.setAttribute("aria-hidden", value ? "false" : "true");
      $("#emailLoginBtn").disabled = Boolean(value);
      $("#googleLoginBtn").disabled = Boolean(value);
    }

    function showStatus(message, type = "error") {
      statusBox.textContent = message;
      statusBox.className = `status show ${type}`;
    }

    function clearStatus() {
      statusBox.textContent = "";
      statusBox.className = "status";
      [emailError, passwordError].forEach(el => {
        el.textContent = "";
        el.classList.remove("show");
      });
    }

    function fieldError(element, message) {
      element.textContent = message;
      element.classList.add("show");
    }

    function switchTab(name) {
      const emailActive = name === "email";
      emailTab.classList.toggle("active", emailActive);
      googleTab.classList.toggle("active", !emailActive);
      emailForm.classList.toggle("active", emailActive);
      googleForm.classList.toggle("active", !emailActive);
      clearStatus();
    }

    emailTab.addEventListener("click", () => switchTab("email"));
    googleTab.addEventListener("click", () => switchTab("google"));

    $("#eyeBtn").addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      $("#eyeBtn").setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    function applyTheme(theme) {
      const light = theme === "light";
      document.body.classList.toggle("light-theme", light);
      localStorage.setItem(THEME_KEY, light ? "light" : "dark");
    }

    applyTheme(localStorage.getItem(THEME_KEY) || "dark");
    $("#themeBtn").addEventListener("click", () => {
      applyTheme(document.body.classList.contains("light-theme") ? "dark" : "light");
    });

    function friendlyAuthError(error) {
      const code = String(error?.code || "");
      if (code === "auth/invalid-credential") return "Email or password is incorrect.";
      if (code === "auth/user-disabled") return "This account has been disabled.";
      if (code === "auth/too-many-requests") return "Too many attempts. Please try again later.";
      if (code === "auth/popup-closed-by-user") return "Google sign-in was cancelled.";
      if (code === "auth/popup-blocked") return "The browser blocked the Google sign-in popup.";
      if (code === "auth/network-request-failed") return "Network error. Please check your connection.";
      return "Unable to sign in. Please try again.";
    }

    async function readAdminProfile(user) {
      const snap = await get(ref(db, `admins/${user.uid}`));
      return snap.exists() ? snap.val() : null;
    }

    async function authorizeAdmin(user) {
      if (!user) throw new Error("AUTH_REQUIRED");

      const profile = await readAdminProfile(user);

      // New structure is intentionally strict:
      // Firebase Auth proves identity; admins/{uid} grants admin-panel access.
      if (!profile) throw new Error("ADMIN_PROFILE_MISSING");
      if (profile.active === false || profile.disabled === true) {
        throw new Error("ADMIN_DISABLED");
      }

      await update(ref(db, `admins/${user.uid}`), {
        email: user.email || profile.email || "",
        displayName: user.displayName || profile.displayName || "",
        photoURL: user.photoURL || profile.photoURL || "",
        lastLoginAt: serverTimestamp()
      });

      localStorage.setItem("admin.uid", user.uid);
      localStorage.setItem("admin.email", user.email || "");
      localStorage.setItem("admin.displayName", user.displayName || profile.displayName || "");
      localStorage.setItem("admin.role", String(profile.role || ""));
      sessionStorage.setItem("admin.login.ready", "1");

      return profile;
    }

    async function completeLogin(user) {
      try {
        await authorizeAdmin(user);
        location.replace(DASHBOARD_URL);
      } catch (error) {
        console.error("Admin authorization failed:", error);

        await signOut(auth).catch(() => {});

        if (error?.message === "ADMIN_PROFILE_MISSING") {
          showStatus("Your Firebase account exists, but it has not been granted access to this admin panel.");
        } else if (error?.message === "ADMIN_DISABLED") {
          showStatus("This admin account is disabled.");
        } else {
          showStatus("Unable to verify admin access.");
        }

        setLoading(false);
      }
    }

    emailForm.addEventListener("submit", async event => {
      event.preventDefault();
      clearStatus();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email) {
        fieldError(emailError, "Please enter your email.");
        emailInput.focus();
        return;
      }

      if (!password) {
        fieldError(passwordError, "Please enter your password.");
        passwordInput.focus();
        return;
      }

      setLoading(true);

      try {
        await setPersistence(auth, browserSessionPersistence);
        const credential = await signInWithEmailAndPassword(auth, email, password);
        await completeLogin(credential.user);
      } catch (error) {
        console.error("Email login failed:", error);
        showStatus(friendlyAuthError(error));
        setLoading(false);
      }
    });

    $("#googleLoginBtn").addEventListener("click", async () => {
      clearStatus();
      setLoading(true);

      try {
        await setPersistence(auth, browserSessionPersistence);

        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });

        const credential = await signInWithPopup(auth, provider);
        await completeLogin(credential.user);
      } catch (error) {
        console.error("Google login failed:", error);
        showStatus(friendlyAuthError(error));
        setLoading(false);
      }
    });

    // If a valid Firebase session already exists, verify admin access before redirecting.
    let firstAuthCheck = true;
    onAuthStateChanged(auth, async user => {
      if (!firstAuthCheck) return;
      firstAuthCheck = false;

      if (!user) return;

      setLoading(true);
      await completeLogin(user);
    });
  </script>
</body>
</html>
