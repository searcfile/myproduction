<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <link
    rel="icon"
    type="image/svg+xml"
    href="./logo.svg"
  >

  <title>Back Office</title>

  <!-- =========================
       GLOBAL / REUSABLE UI
  ========================== -->
  <link
    rel="stylesheet"
    href="./new-ui.css"
  >

  <!-- =========================
       ADMIN SHELL
  ========================== -->
  <link
    rel="stylesheet"
    href="./admin.css"
  >
</head>

<body>

  <!-- ==========================================
       MOBILE SIDEBAR OVERLAY
  =========================================== -->
  <div
    id="sidebarOverlay"
    class="admin-sidebar-overlay"
  ></div>


  <!-- ==========================================
       TOP HEADER
  =========================================== -->
  <header
    id="adminHeader"
    class="admin-nav"
  >

    <div class="admin-nav-inner">


      <!-- ======================================
           LEFT SIDE
      ======================================= -->
      <div class="admin-nav-left">


        <!-- SITE SELECTOR -->
        <div
          id="siteSelectorWrap"
          class="admin-site-selector"
        >

          <button
            id="siteSelectorBtn"
            class="admin-site-selector-btn"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >

            <span
              id="selectedSiteText"
              class="admin-site-selector-text"
            >
              Select Site
            </span>

            <svg
              class="admin-site-selector-arrow"
              viewBox="64 64 896 896"
              aria-hidden="true"
            >
              <path
                d="M884 256h-75c-5.1 0-9.9 2.5-12.9 6.6L512 654.2 227.9 262.6c-3-4.1-7.8-6.6-12.9-6.6h-75c-6.5 0-10.3 7.4-6.5 12.7l352.6 486.1c12.8 17.6 39 17.6 51.7 0l352.6-486.1c3.9-5.3.1-12.7-6.4-12.7z"
              ></path>
            </svg>

          </button>


          <!-- nanti admin.js isi -->
          <div
            id="siteSelectorDropdown"
            class="admin-site-selector-dropdown"
          ></div>

        </div>


        <!-- ==================================
             TOP NAV LINKS
        =================================== -->
        <nav
          id="adminTopNav"
          class="admin-top-nav"
          aria-label="Admin navigation"
        >


          <button
            class="admin-nav-link"
            type="button"
            data-tab="dashboard"
            data-title="Dashboard"
            data-page="./dashboard.html"
          >
            Dashboard
          </button>


          <button
            class="admin-nav-link"
            type="button"
            data-tab="918kiss"
            data-title="918Kiss"
            data-page="./918kiss.html"
          >
            918Kiss
          </button>


          <button
            class="admin-nav-link"
            type="button"
            data-tab="mega888"
            data-title="Mega888"
            data-page="./mega888.html"
          >
            Mega888
          </button>


          <button
            class="admin-nav-link"
            type="button"
            data-tab="pussy888"
            data-title="Pussy888"
            data-page="./pussy888.html"
          >
            Pussy888
          </button>


          <button
            class="admin-nav-link"
            type="button"
            data-tab="livechat"
            data-title="LiveChat"
            data-page="./livechat.html"
          >
            LiveChat
          </button>


          <button
            class="admin-nav-link"
            type="button"
            data-tab="notice"
            data-title="Notice"
            data-page="./notice.html"
          >
            Notice
          </button>

        </nav>

      </div>


      <!-- ======================================
           RIGHT SIDE
      ======================================= -->
      <div class="admin-nav-right">


        <!-- DATE / TIME -->
        <div
          id="adminDateTime"
          class="admin-date-time"
        >
          --
        </div>


        <!-- USER -->
        <div class="admin-user-dropdown">

          <button
            id="adminUserBtn"
            class="admin-user-btn"
            type="button"
            aria-expanded="false"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8V22h19.2v-2.8c0-3.2-6.4-4.8-9.6-4.8z"
              ></path>
            </svg>

            <span id="adminUsername">
              Admin
            </span>

          </button>


          <!-- USER DROPDOWN -->
          <div
            id="adminUserMenu"
            class="admin-user-menu"
          >

            <div class="admin-user-menu-info">

              <div
                id="adminEmail"
                class="admin-user-email"
              >
                -
              </div>

            </div>


            <button
              id="changePasswordBtn"
              type="button"
              class="admin-user-menu-item"
            >
              Change Password
            </button>


            <button
              id="themeToggleBtn"
              type="button"
              class="admin-user-menu-item"
            >
              Light Mode
            </button>


            <button
              id="logoutBtn"
              type="button"
              class="admin-user-menu-item admin-user-menu-danger"
            >
              Logout
            </button>

          </div>

        </div>


        <!-- REFRESH -->
        <button
          id="adminRefreshBtn"
          class="admin-header-icon-btn"
          type="button"
          title="Refresh current tab"
          aria-label="Refresh current tab"
        >

          <svg
            viewBox="64 64 896 896"
            aria-hidden="true"
          >
            <path
              d="M909.1 209.3l-56.4 44.1C775.8 155.1 656.2 92 521.9 92 290 92 102.3 279.5 102 511.5 101.7 743.7 289.8 932 521.9 932c181.3 0 335.8-115 394.6-276.1l-71.7-25c-48.1 132-174.5 225-322.7 225-189.7 0-343.8-154.1-343.8-343.8S332.4 167.4 522.1 167.4c105.5 0 200.1 47.6 263.2 122.5l-52.5 41c-5.2 4.1-3.2 12.4 3.2 14l175.6 43c5 1.2 9.9-2.6 9.9-7.7l.8-180.9c-.1-6.6-7.8-10.3-13.2-6z"
            ></path>
          </svg>

        </button>


        <!-- SIDEBAR MENU -->
        <button
          id="adminMenuBtn"
          class="admin-header-icon-btn"
          type="button"
          title="Menu"
          aria-label="Open menu"
          aria-expanded="false"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"
            ></path>
          </svg>

        </button>

      </div>

    </div>

  </header>


  <!-- ==========================================
       SIDEBAR
  =========================================== -->
  <aside
    id="adminSidebar"
    class="admin-sidebar"
  >

    <div class="admin-sidebar-inner">


      <!-- SIDEBAR SEARCH -->
      <div class="admin-sidebar-search">

        <input
          id="sidebarSearchInput"
          type="search"
          placeholder="Search menu..."
          autocomplete="off"
        >

      </div>


      <!-- SIDEBAR LINKS -->
      <nav
        id="adminSidebarNav"
        class="admin-sidebar-nav"
      >


        <button
          class="admin-sidebar-link"
          type="button"
          data-tab="dashboard"
          data-title="Dashboard"
          data-page="./dashboard.html"
        >
          Dashboard
        </button>


        <button
          class="admin-sidebar-link"
          type="button"
          data-tab="918kiss"
          data-title="918Kiss"
          data-page="./918kiss.html"
        >
          918Kiss
        </button>


        <button
          class="admin-sidebar-link"
          type="button"
          data-tab="mega888"
          data-title="Mega888"
          data-page="./mega888.html"
        >
          Mega888
        </button>


        <button
          class="admin-sidebar-link"
          type="button"
          data-tab="pussy888"
          data-title="Pussy888"
          data-page="./pussy888.html"
        >
          Pussy888
        </button>


        <button
          class="admin-sidebar-link"
          type="button"
          data-tab="livechat"
          data-title="LiveChat"
          data-page="./livechat.html"
        >
          LiveChat
        </button>


        <button
          class="admin-sidebar-link"
          type="button"
          data-tab="notice"
          data-title="Notice"
          data-page="./notice.html"
        >
          Notice
        </button>

      </nav>

    </div>

  </aside>


  <!-- ==========================================
       OPEN TAB BAR

       admin.js nanti generate:

       Dashboard     ×
       918Kiss       ×
       Mega888       ×
  =========================================== -->
  <div
    id="adminTabBar"
    class="admin-tab-bar"
  >

    <div
      id="adminTabList"
      class="admin-tab-list"
    ></div>

  </div>


  <!-- ==========================================
       MAIN CONTENT

       PENTING:
       TIADA IFRAME LAGI.
  =========================================== -->
  <main
    id="adminMain"
    class="admin-main"
  >

    <!-- loading -->
    <div
      id="adminPageLoading"
      class="admin-page-loading hidden"
    >
      Loading...
    </div>


    <!-- empty state -->
    <div
      id="adminEmptyState"
      class="admin-empty-state"
    >

      <h3>Welcome</h3>

      <p>
        Select a menu to open a tab.
      </p>

    </div>


    <!--
      admin.js akan load kandungan page
      ke dalam container ini.
    -->
    <section
      id="adminTabContent"
      class="admin-tab-content"
    ></section>

  </main>


  <!-- ==========================================
       CHANGE PASSWORD MODAL
       kita simpan basic shell sahaja
  =========================================== -->
  <div
    id="changePasswordModal"
    class="admin-modal hidden"
  >

    <div class="admin-modal-dialog">

      <div class="admin-modal-header">

        <h3>
          Change Password
        </h3>

        <button
          id="changePasswordCloseBtn"
          type="button"
          class="admin-modal-close"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div class="admin-modal-body">

        <div class="form-group">

          <label for="currentPassword">
            Current Password
          </label>

          <input
            id="currentPassword"
            type="password"
            autocomplete="current-password"
          >

        </div>


        <div class="form-group">

          <label for="newPassword">
            New Password
          </label>

          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
          >

        </div>


        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
          >

        </div>

      </div>


      <div class="admin-modal-footer">

        <button
          id="changePasswordCancelBtn"
          type="button"
          class="btn"
        >
          Cancel
        </button>

        <button
          id="changePasswordSaveBtn"
          type="button"
          class="btn btn-primary"
        >
          Change Password
        </button>

      </div>

    </div>

  </div>


  <!-- ==========================================
       JAVASCRIPT

       firebase.js = Firebase only
       new-ui.js   = reusable components
       admin.js    = admin shell behaviour
  =========================================== -->

  <script
    type="module"
    src="./firebase.js"
  ></script>

  <script
    src="./new-ui.js"
  ></script>

  <script
    type="module"
    src="./admin.js"
  ></script>

</body>
</html>
<!-- Future Super Admin pages included: detail-login.html, tab-settings.html, user-history.html -->
